<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f7">
  <title>사무용 도구 · 클래스제이</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./hub.css?v=20260929-office-hub">
  <script src="./hub.js?v=20260929-office-hub" defer></script>
</head>
<body>
  <main class="office-hub">
    <a class="back-link" href="/classtools/">← 교사 포털</a>
    <header class="hub-header">
      <span class="hub-label">문서 작업을 한곳에서</span>
      <h1>사무용 도구</h1>
      <p>필요한 도구를 선택하세요.</p>
    </header>
    <nav class="tool-menu" aria-label="사무용 도구 메뉴">
      <a class="tool-card" href="./workbench.html#stamp">
        <span class="tool-icon" aria-hidden="true">印</span>
        <h2>도장 만들기</h2>
        <p>이름으로 도장을 만들거나<br>도장 사진의 배경을 지워요.</p>
        <span class="tool-action">도장 만들기 <span aria-hidden="true">→</span></span>
      </a>
      <a class="tool-card" href="./workbench.html#scan">
        <span class="tool-icon" aria-hidden="true">▣</span>
        <h2>문서 스캔</h2>
        <p>사진 속 문서를 반듯하게 펴고<br>밝기와 대비를 보정해요.</p>
        <span class="tool-action">문서 스캔 <span aria-hidden="true">→</span></span>
      </a>
      <a class="tool-card" href="../pdf-tools/">
        <span class="tool-icon pdf-icon" aria-hidden="true">PDF</span>
        <h2>PDF 편집</h2>
        <p>파일 합치기, 페이지 정리,<br>도장 찍기와 이미지 변환을 해요.</p>
        <span class="tool-action">PDF 편집 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
    <p class="privacy-note">선택한 사진과 문서는 서버에 전송되지 않고 이 기기에서 처리됩니다.</p>
  </main>
</body>
</html>
