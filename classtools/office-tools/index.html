<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>업무툴 · 클래스제이</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./style.css?v=20260926-stamp-gungseo">
</head>
<body>
  <a class="back-link" href="/classtools/" aria-label="교사 포털로 돌아가기">←</a>

  <main class="workspace">
    <div class="tool-tabs" role="tablist" aria-label="업무 도구 선택">
      <button id="stamp-tool-tab" type="button" role="tab" aria-selected="true" aria-controls="stamp" data-tool="stamp">도장 만들기</button>
      <button id="scan-tool-tab" type="button" role="tab" aria-selected="false" aria-controls="scan" data-tool="scan" tabindex="-1">문서 스캔</button>
    </div>

    <section class="tool-section" id="stamp" role="tabpanel" aria-labelledby="stamp-tool-tab">
      <div class="workbench stamp-workbench">
        <div class="controls">
          <div class="mode-switch" role="tablist" aria-label="도장 만들기 방식">
            <button type="button" id="stamp-text-tab" class="active" role="tab" aria-selected="true" aria-controls="stamp-text-controls">이름 입력</button>
            <button type="button" id="stamp-photo-tab" role="tab" aria-selected="false" aria-controls="stamp-photo-controls" tabindex="-1">도장 사진</button>
          </div>
          <div id="stamp-text-controls" role="tabpanel" aria-labelledby="stamp-text-tab">
            <label class="field">
              <span>이름·문구</span>
              <input id="stamp-name" type="text" maxlength="30" placeholder="이름 입력" autocomplete="off" aria-describedby="stamp-name-status">
              <small id="stamp-name-status" class="field-note" role="status">로그인 이름 확인 중…</small>
            </label>
            <div id="stamp-presets-wrap">
              <p class="preset-label">원하는 도장을 선택하세요</p>
              <div id="stamp-presets" class="stamp-presets" aria-label="내 이름으로 만든 도장 견본"></div>
            </div>
          </div>

          <div id="stamp-photo-controls" role="tabpanel" aria-labelledby="stamp-photo-tab" hidden>
            <button type="button" class="upload-zone" id="stamp-upload">
              <span class="upload-icon" aria-hidden="true">＋</span>
              <strong>도장 사진 선택</strong>
              <small>끌어놓거나 클릭 · JPG / PNG / WEBP</small>
            </button>
            <input id="stamp-file" type="file" accept="image/*" hidden>
            <div class="rotation-controls" role="group" aria-label="도장 사진 회전">
              <button type="button" class="button secondary" id="stamp-rotate-left" aria-label="도장 사진 반시계 방향으로 90도 회전" disabled><span class="rotation-icon" aria-hidden="true">↶</span>반시계 90°</button>
              <button type="button" class="button secondary" id="stamp-rotate-right" aria-label="도장 사진 시계 방향으로 90도 회전" disabled><span class="rotation-icon" aria-hidden="true">↷</span>시계 90°</button>
            </div>
            <label class="field range-field">
              <span>배경 제거 강도 <output id="stamp-threshold-value">70</output></span>
              <input id="stamp-threshold" type="range" min="20" max="140" value="70">
            </label>
            <p class="hint">흰 종이에 찍은 도장을 사용하세요. 강도를 올리면 밝은 배경이 더 많이 지워집니다.</p>
          </div>
        </div>
        <div class="preview-area">
          <div class="preview-header"><h3>미리보기</h3><span>800 × 800 · 투명 배경</span></div>
          <div class="checkerboard">
            <canvas id="stamp-canvas" width="800" height="800" aria-label="도장 이미지 미리보기"></canvas>
            <p id="stamp-placeholder" hidden>도장 사진을 선택해 주세요.</p>
          </div>
          <p class="preview-note" id="stamp-status" role="status"></p>
          <button type="button" class="button primary full" id="stamp-download">투명 PNG 저장</button>

        </div>
      </div>
    </section>

    <section class="tool-section" id="scan" role="tabpanel" aria-labelledby="scan-tool-tab" hidden>
      <div class="workbench scan-workbench">
        <div class="controls">
          <div class="input-choices">
            <button type="button" class="upload-zone" id="scan-upload"><span class="upload-icon" aria-hidden="true">＋</span><strong>사진 선택</strong><small>끌어놓거나 클릭</small></button>
            <button type="button" class="upload-zone" id="camera-open"><span class="upload-icon" aria-hidden="true">◎</span><strong>카메라 촬영</strong></button>
          </div>
          <input id="scan-file" type="file" accept="image/*" hidden>
          <div class="rotation-controls" role="group" aria-label="스캔 사진 회전">
            <button type="button" class="button secondary" id="scan-rotate-left" aria-label="스캔 사진 반시계 방향으로 90도 회전" disabled><span class="rotation-icon" aria-hidden="true">↶</span>반시계 90°</button>
            <button type="button" class="button secondary" id="scan-rotate-right" aria-label="스캔 사진 시계 방향으로 90도 회전" disabled><span class="rotation-icon" aria-hidden="true">↷</span>시계 90°</button>
          </div>
          <div class="camera-panel" id="camera-panel" hidden>
            <video id="camera-video" autoplay playsinline muted></video>
            <div class="camera-actions">
              <button type="button" class="button primary" id="camera-capture">사진 찍기</button>
              <button type="button" class="button secondary" id="camera-close">닫기</button>
            </div>
          </div>
          <div class="field">
            <span>보정 방식</span>
            <div class="segmented" id="scan-presets">
              <button type="button" class="active" data-preset="copy" aria-pressed="true">복사본</button>
              <button type="button" data-preset="bw" aria-pressed="false">흑백</button>
              <button type="button" data-preset="color" aria-pressed="false">컬러</button>
            </div>
          </div>
          <label class="field range-field"><span>밝기 <output id="scan-brightness-value">0</output></span><input id="scan-brightness" type="range" min="-60" max="60" value="0"></label>
          <label class="field range-field"><span>대비 <output id="scan-contrast-value">25</output></span><input id="scan-contrast" type="range" min="-50" max="100" value="25"></label>
          <label class="field range-field"><span>흑백 기준 <output id="scan-threshold-value">165</output></span><input id="scan-threshold" type="range" min="80" max="230" value="165"></label>
          <label class="checkbox-field"><input id="scan-crop" type="checkbox" checked><span>문서 모서리에 맞춰 펴기</span></label>
          <button type="button" class="button secondary full" id="scan-auto">모서리 자동 찾기</button>
          <p class="hint">원본의 파란 점을 드래그해 문서의 네 모서리에 맞추세요.</p>
          <button type="button" class="button primary full" id="scan-download" disabled>스캔 PNG 저장</button>
        </div>
        <div class="preview-area">
          <div class="scan-comparison">
            <div class="scan-preview">
              <div class="preview-header"><h3>원본</h3><span>모서리 지정</span></div>
              <div class="scan-source" id="scan-source"><canvas id="scan-source-canvas" aria-label="원본 사진과 이동 가능한 문서 모서리"></canvas><p id="scan-empty">사진을 선택하거나<br>카메라로 촬영하세요.</p></div>
            </div>
            <div class="scan-preview">
              <div class="preview-header"><h3>보정 결과</h3><span id="scan-size">PNG</span></div>
              <div class="scan-result"><canvas id="scan-result-canvas" aria-label="스캔 보정 결과"></canvas><p id="scan-result-empty">보정한 문서가<br>여기에 표시됩니다.</p></div>
            </div>
          </div>
          <p class="preview-note" id="scan-status" role="status">사진을 선택하면 보정 결과를 확인할 수 있습니다.</p>
        </div>
      </div>
    </section>
    <p class="privacy-note">선택한 사진은 서버에 전송되지 않고 이 기기에서 처리됩니다.</p>
  </main>
  <script src="./stamp.js?v=20260926-stamp-gungseo" defer></script>
  <script src="./tools.js?v=20260926-stamp-gungseo" defer></script>
</body>
</html>
