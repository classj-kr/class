        function isTodayBirthday(student) {
            const birthdayMmdd = student?.birthdayMmdd || "";
            if (!student?.birthdayVisible || birthdayMmdd.length !== 4) return false;
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return birthdayMmdd === (mm + dd);
        }

        let todayQuickAlerts = new Map();
        let activeRosterClass = null;

        function attendanceKey(grade, classNumber, studentNumber) {
            return [grade, classNumber, studentNumber].map(String).join(":");
        }

        function normalizeAttendanceType(value) {
            const type = String(value || "");
            if (type.includes("지각")) return "지각";
            if (type.includes("조퇴")) return "조퇴";
            if (type.includes("체험학습")) return "체험학습";
            return "결석";
        }

        function putTodayAlert(row, noticeType, reason, source, priority) {
            if (row.grade == null || row.classNumber == null || row.studentNumber == null) return;
            const key = attendanceKey(row.grade, row.classNumber, row.studentNumber);
            const current = todayQuickAlerts.get(key);
            if (current && current.priority >= priority) return;
            todayQuickAlerts.set(key, {
                noticeType: normalizeAttendanceType(noticeType),
                reason: String(reason || ""),
                source,
                priority
            });
        }

        async function fetchQuickAlertsForDashboard() {
            const todayStr = localDateKey();
            todayQuickAlerts.clear();

            try {
                const res = await fetch("/api/teacher/quick-absences");
                if (res.ok) {
                    const data = await res.json();
                    (data.alerts || []).forEach(a => {
                        if (a.expectedDate === todayStr || String(a.expectedDate).startsWith(todayStr)) {
                            putTodayAlert(a, a.noticeType, a.reason, "학부모 출결 알림", 1);
                        }
                    });
                }
            } catch (e) {}

            try {
                const res = await fetch("/api/teacher/absence-notes");
                if (res.ok) {
                    const data = await res.json();
                    (data.notes || []).forEach(n => {
                        if (n.status === "approved" && n.startDate <= todayStr && n.endDate >= todayStr) {
                            putTodayAlert(n, n.reasonType, n.reasonDetail, "승인된 결석계", 2);
                        }
                    });
                }
            } catch (e) {}

            try {
                const res = await fetch("/api/teacher/experiential-apps");
                if (res.ok) {
                    const data = await res.json();
                    (data.applications || []).forEach(a => {
                        if (a.status === "approved" && a.startDate <= todayStr && a.endDate >= todayStr) {
                            putTodayAlert(a, "체험학습", a.location || a.planDetail, "승인된 체험학습", 2);
                        }
                    });
                }
            } catch (e) {}
        }

        function renderChecklist() {
            checklistGrid.replaceChildren();
            if (rosterStudents.length === 0) {
                const notice = document.createElement("div");
                notice.className = "roster-empty-notice";
                notice.style.cssText = "grid-column: 1 / -1; color: var(--muted, #6b7280); font-size: 13px; padding: 8px 4px;";
                notice.textContent = rosterLoadMessage || "등록된 학생이 없습니다.";
                checklistGrid.append(notice);
                missingBadge.textContent = "미완료: " + missingStudents.size + "명";
                return;
            }
            rosterStudents.forEach((student) => {
                const num = String(student.number);
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "num-chip";
                const isMissing = missingStudents.has(num);
                if (isMissing) chip.classList.add("missing");
                chip.setAttribute("aria-pressed", String(isMissing));

                const alertInfo = activeRosterClass
                    ? todayQuickAlerts.get(attendanceKey(activeRosterClass.grade, activeRosterClass.classNumber, num))
                    : null;
                const name = document.createElement("span");
                name.className = "roster-student-copy";
                const numberLabel = document.createElement("span");
                numberLabel.className = "roster-student-number";
                numberLabel.textContent = num + "번";
                const studentName = document.createElement("span");
                studentName.className = "roster-student-name";
                studentName.textContent = student.name || "";
                name.append(numberLabel, studentName);
                chip.append(name);

                if (alertInfo) {
                    const tag = document.createElement("span");
                    tag.className = "attendance-tag";
                    tag.dataset.kind = alertInfo.noticeType;
                    tag.textContent = alertInfo.noticeType;
                    chip.append(tag);
                    chip.title = alertInfo.source + ": " + alertInfo.noticeType
                        + (alertInfo.reason ? " · " + alertInfo.reason : "");
                }
                if (isTodayBirthday(student)) {
                    const birthday = document.createElement("span");
                    birthday.className = "bday-tag";
                    birthday.textContent = "🎂";
                    chip.append(birthday);
                }
                chip.setAttribute("aria-label", num + "번 " + (student.name || "")
                    + (alertInfo ? ", " + alertInfo.source + " " + alertInfo.noticeType : "")
                    + (isMissing ? ", 미완료" : ", 완료"));

                chip.addEventListener("click", () => {
                    const nextMissing = !missingStudents.has(num);
                    if (nextMissing) missingStudents.add(num);
                    else missingStudents.delete(num);
                    localStorage.setItem("dashboardMissingStudents", JSON.stringify(Array.from(missingStudents)));
                    chip.classList.toggle("missing", nextMissing);
                    chip.setAttribute("aria-pressed", String(nextMissing));
                    chip.setAttribute("aria-label", num + "번 " + (student.name || "")
                        + (alertInfo ? ", " + alertInfo.source + " " + alertInfo.noticeType : "")
                        + (nextMissing ? ", 미완료" : ", 완료"));
                    missingBadge.textContent = "미완료: " + missingStudents.size + "명";
                });
                checklistGrid.append(chip);
            });
            missingBadge.textContent = "미완료: " + missingStudents.size + "명";
        }

        (async () => {
            await fetchQuickAlertsForDashboard();
            await fetchRosterAndRenderChecklist();
        })();

        // 5. Important schedules
        function localDateKey(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        scheduleDateInput.value = localDateKey();

        async function scheduleApi(path, options = {}) {
            const response = await fetch(path, {
                ...options,
                headers: { "Content-Type": "application/json", ...(options.headers || {}) }
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || "일정을 불러오지 못했습니다.");
            return payload;
        }

        function upcomingDateWindow() {
            const today = localDateKey();
            const end = new Date(today + "T00:00:00");
            end.setDate(end.getDate() + 30);
            return { today, end: localDateKey(end) };
        }

        function schoolEventMatchesGrade(event, grade) {
            return event.target_scope === "ALL" || (event.target_scope === "GRADE"
                && (event.target_grades || []).some(value => Number(value) === Number(grade)));
        }

        async function loadUpcomingSchoolSchedules(grade) {
            const window = upcomingDateWindow();
            const cursor = new Date(window.today.slice(0, 7) + "-01T00:00:00");
            const months = [];
            while (localDateKey(cursor) <= window.end) {
                months.push(localDateKey(cursor).slice(0, 7));
                cursor.setMonth(cursor.getMonth() + 1);
            }
            const years = [...new Set(months.map(month => Number(month.slice(0, 4))))];
            const academicYears = [...new Set(months.map(month =>
                Number(month.slice(0, 4)) - (Number(month.slice(5, 7)) < 3 ? 1 : 0)))];
            const sources = [
                ...months.map(month => ({ kind: "events", label: "학교 행사", path: "/api/teacher/general-events?month=" + month })),
                ...years.map(year => ({ kind: "holidays", label: "공휴일", path: "/api/teacher/public-holidays?year=" + year })),
                ...academicYears.map(year => ({ kind: "vacation", label: "방학·학사일정", path: "/api/teacher/vacation-settings?academicYear=" + year }))
            ];
            const results = await Promise.allSettled(sources.map(source => scheduleApi(source.path)));
            const items = [];
            const errors = [];
            results.forEach((result, index) => {
                const source = sources[index];
                if (result.status === "rejected") {
                    errors.push(source.label);
                    return;
                }
                const data = result.value;
                if (source.kind === "events") {
                    (data.events || []).filter(event => schoolEventMatchesGrade(event, grade)).forEach(event =>
                        items.push({
                            id: "school_event_" + event.id, date: event.event_date,
                            endDate: event.end_date || event.event_date, title: event.title,
                            details: [event.event_time, event.period, event.location].filter(Boolean).join(" · "),
                            scope: event.target_scope, type: "school_event", canDelete: false
                        }));
                } else if (source.kind === "holidays") {
                    (data.holidays || []).forEach(holiday => items.push({
                        id: "holiday_" + holiday.date + "_" + holiday.name, date: holiday.date,
                        title: holiday.name, type: "public_holiday", canDelete: false
                    }));
                } else if (data.settings) {
                    const settings = data.settings;
                    [
                        ["summer", "여름방학", settings.summer_start, settings.summer_end],
                        ["winter", settings.is_integrated ? "겨울/학년말방학" : "겨울방학", settings.winter_start, settings.winter_end],
                        ...(!settings.is_integrated ? [["spring", "학년말방학", settings.spring_start, settings.spring_end]] : [])
                    ].forEach(([kind, title, start, end]) => {
                        if (start && end) items.push({
                            id: "vacation_" + kind + "_" + start, date: start, endDate: end,
                            title, type: "vacation", canDelete: false
                        });
                    });
                    [[settings.entrance_ceremony_date, "입학식"], [settings.graduation_ceremony_date, "졸업식"]]
                        .forEach(([date, title]) => {
                            if (date) items.push({ id: "ceremony_" + date + title, date, title,
                                type: "annual_schedule", scope: "ALL", canDelete: false });
                        });
                }
            });
            return { items, errors: [...new Set(errors)] };
        }

        async function loadSchedules(classId = null) {
            const version = ++scheduleLoadVersion;
            schedules = [];
            schoolSchedules = [];
            schedulesLoading = true;
            scheduleLoadErrors = [];
            renderSchedules();
            const query = classId ? "?classId=" + encodeURIComponent(classId) : "";
            const grade = activeRosterClass?.grade;
            const results = await Promise.allSettled([
                scheduleApi("/api/class/schedules" + query),
                loadUpcomingSchoolSchedules(grade)
            ]);
            if (version !== scheduleLoadVersion) return;
            if (results[0].status === "fulfilled") {
                const data = results[0].value;
                activeScheduleClassId = data.classId;
                canEditSchedules = Boolean(data.canEdit);
                schedules = Array.isArray(data.schedules) ? data.schedules : [];
                scheduleEditor.hidden = !canEditSchedules;
                try {
                    await migrateLocalSchedules();
                } catch (migrationError) {
                    console.warn("기기 저장 일정을 아직 이전하지 못했습니다.", migrationError);
                }
            } else {
                canEditSchedules = false;
                scheduleEditor.hidden = true;
                scheduleLoadErrors.push("학급·학사일정");
            }
            if (version !== scheduleLoadVersion) return;
            if (results[1].status === "fulfilled") {
                schoolSchedules = results[1].value.items;
                scheduleLoadErrors.push(...results[1].value.errors);
            } else {
                scheduleLoadErrors.push("학교 일정·공휴일");
            }
            schedulesLoading = false;
            renderSchedules();
            renderCalendar();
        }

        async function migrateLocalSchedules() {
            if (!canEditSchedules || !activeScheduleClassId) return;
            const migrationKey = `dashboardSchedulesMigrated_${activeScheduleClassId}`;
            if (localStorage.getItem(migrationKey) === "1") return;
            let localSchedules = [];
            try {
                const saved = JSON.parse(localStorage.getItem("dashboardSchedules") || "[]");
                localSchedules = Array.isArray(saved) ? saved : [];
            } catch (_) {
                localSchedules = [];
            }
            for (const item of localSchedules) {
                if (!item?.date || !item?.title) continue;
                const data = await scheduleApi("/api/teacher/schedules", {
                    method: "POST",
                    body: JSON.stringify({ classId: activeScheduleClassId, date: item.date, title: item.title, details: item.details || "" })
                });
                schedules.push(data.schedule);
            }
            localStorage.removeItem("dashboardSchedules");
            localStorage.setItem(migrationKey, "1");
        }

        function renderSchedules() {
            scheduleList.replaceChildren();
            const today = localDateKey();
            const now = new Date(`${today}T00:00:00`);
            const weekEnd = new Date(now);
            weekEnd.setDate(now.getDate() + (7 - now.getDay()) % 7);
            const weekEndKey = localDateKey(weekEnd);
            const scheduleWindowEnd = new Date(now);
            scheduleWindowEnd.setDate(now.getDate() + 30);
            const scheduleWindowEndKey = localDateKey(scheduleWindowEnd);
            const seen = new Set();
            const upcoming = [...schedules, ...schoolSchedules]
                .filter(item => {
                    if (item.date > scheduleWindowEndKey || (item.endDate || item.date) < today) return false;
                    // Overlapping month queries return a multi-day school event more than once.
                    const key = item.canDelete === false
                        ? [item.date, item.endDate || item.date, item.title].join("|")
                        : [item.type, item.id].join("|");
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                })
                .sort((a, b) => (a.date < today ? today : a.date).localeCompare(b.date < today ? today : b.date)
                    || a.title.localeCompare(b.title));
            scheduleCountBadge.textContent = schedulesLoading ? "불러오는 중"
                : scheduleLoadErrors.length ? "확인된 " + upcoming.length + "개"
                : "예정 " + upcoming.length + "개";
            const status = document.getElementById("scheduleLoadStatus");
            status.replaceChildren();
            status.hidden = scheduleLoadErrors.length === 0;
            if (scheduleLoadErrors.length) {
                status.textContent = scheduleLoadErrors.join("·") + " 정보를 불러오지 못했습니다.";
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", () => loadSchedules(activeScheduleClassId));
                status.append(retry);
            }

            if (!upcoming.length) {
                const empty = document.createElement("div");
                empty.className = "schedule-empty";
                empty.textContent = schedulesLoading ? "학교 일정과 공휴일을 불러오는 중입니다."
                    : scheduleLoadErrors.length ? "일정을 모두 확인하지 못했습니다. 다시 불러와 주세요."
                    : "오늘부터 30일 이내에 예정된 주요일정이 없습니다.";
                scheduleList.append(empty);
                return;
            }

            upcoming.forEach((item) => {
                const div = document.createElement("div");
                div.className = "board-item";
                const displayDate = item.date < today ? today : item.date;
                if (displayDate === today) div.classList.add("schedule-today");
                else if (displayDate <= weekEndKey) div.classList.add("schedule-this-week");
                const date = new Date(`${item.date}T00:00:00`);
                const isThisWeek = item.date > today && item.date <= weekEndKey;
                const weekday = ["일", "월", "화", "수", "목", "금", "토"][date.getDay()];
                const label = item.date === today ? "오늘" : isThisWeek ? `${weekday}요일` : `${date.getMonth() + 1}/${date.getDate()}`;
                const dateSpan = document.createElement("span");
                dateSpan.className = "schedule-date";
                if (isThisWeek) dateSpan.classList.add("this-week");
                dateSpan.textContent = item.date < today ? "진행 중" : label;
                if (item.endDate && item.endDate !== item.date) {
                    const range = document.createElement("span");
                    range.className = "schedule-date-range";
                    range.textContent = Number(item.date.slice(5, 7)) + "/" + Number(item.date.slice(8, 10))
                        + "–" + Number(item.endDate.slice(5, 7)) + "/" + Number(item.endDate.slice(8, 10));
                    dateSpan.append(range);
                }
                const copy = document.createElement("span");
                copy.className = "schedule-copy";
                if (item.type === "public_holiday" || item.type === "vacation") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge " + (item.type === "public_holiday" ? "scope-holiday" : "scope-vacation");
                    badge.textContent = item.type === "public_holiday" ? "공휴일" : "방학";
                    copy.append(badge);
                } else if (item.scope === "ALL") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge scope-all";
                    badge.textContent = "전교";
                    copy.append(badge);
                } else if (item.scope === "GRADE") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge scope-grade";
                    badge.textContent = "학년";
                    copy.append(badge);
                }
                const titleSpan = document.createElement("span");
                titleSpan.textContent = item.title;
                copy.append(titleSpan);
                if (item.details) {
                    const detailSpan = document.createElement("span");
                    detailSpan.className = "schedule-detail";
                    detailSpan.textContent = item.details;
                    copy.append(detailSpan);
                }
                div.append(dateSpan, copy);
                if (canEditSchedules && item.type !== "birthday" && item.canDelete !== false) {
                    const actions = document.createElement("span");
                    actions.className = "schedule-actions";
                    const edit = document.createElement("button");
                    edit.className = "board-item-del board-item-edit";
                    edit.textContent = "✎";
                    edit.setAttribute("aria-label", `${item.title} 일정 수정`);
                    edit.addEventListener("click", () => {
                        editingScheduleId = item.id;
                        scheduleDateInput.value = item.date;
                        scheduleTitleInput.value = item.title;
                        scheduleDetailsInput.value = item.details || "";
                        addScheduleBtn.textContent = "✓";
                        addScheduleBtn.setAttribute("aria-label", "주요일정 수정 저장");
                        cancelScheduleEditBtn.hidden = false;
                        renderCalendar();
                        scheduleTitleInput.focus();
                        scheduleTitleInput.select();
                    });
                    const del = document.createElement("button");
                    del.className = "board-item-del";
                    del.innerHTML = "&times;";
                    del.setAttribute("aria-label", `${item.title} 일정 삭제`);
                    del.addEventListener("click", async () => {
                        try {
                            await scheduleApi(`/api/teacher/schedules/${encodeURIComponent(item.id)}`, { method: "DELETE" });
                            schedules = schedules.filter((schedule) => schedule.id !== item.id);
                            if (editingScheduleId === item.id) resetScheduleEditor();
                            renderSchedules();
                            await loadCalendarData();
                        } catch (error) {
                            alert(error.message);
                        }
                    });
                    actions.append(edit, del);
                    div.append(actions);
                }
                scheduleList.append(div);
            });
        }

        async function addSchedule() {
            const date = scheduleDateInput.value;
            const title = scheduleTitleInput.value.trim();
            const details = scheduleDetailsInput.value.trim();
            if (!canEditSchedules || !activeScheduleClassId || !date || !title) return;
            addScheduleBtn.disabled = true;
            try {
                const data = await scheduleApi(editingScheduleId
                    ? `/api/teacher/schedules/${encodeURIComponent(editingScheduleId)}`
                    : "/api/teacher/schedules", {
                    method: editingScheduleId ? "PATCH" : "POST",
                    body: JSON.stringify({ classId: activeScheduleClassId, date, title, details })
                });
                if (editingScheduleId) {
                    schedules = schedules.map((item) => item.id === editingScheduleId ? data.schedule : item);
                } else {
                    schedules.push(data.schedule);
                }
                resetScheduleEditor();
                renderSchedules();
                await loadCalendarData();
                scheduleTitleInput.focus();
            } catch (error) {
                alert(error.message);
            } finally {
                addScheduleBtn.disabled = false;
            }
        }

        function resetScheduleEditor() {
            editingScheduleId = null;
            scheduleTitleInput.value = "";
            scheduleDetailsInput.value = "";
            addScheduleBtn.textContent = "+";
            addScheduleBtn.setAttribute("aria-label", "주요일정 추가");
            cancelScheduleEditBtn.hidden = true;
        }

        addScheduleBtn.addEventListener("click", addSchedule);
        cancelScheduleEditBtn.addEventListener("click", () => {
            resetScheduleEditor();
            renderCalendar();
        });
        scheduleTitleInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") addSchedule();
            if (event.key === "Escape" && editingScheduleId) {
                resetScheduleEditor();
                renderCalendar();
            }
        });
        scheduleDetailsInput.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && editingScheduleId) {
                resetScheduleEditor();
                renderCalendar();
            }
        });

        renderSchedules();

        // 6. Mini Calendar
        let calendarCursor = new Date();
        calendarCursor.setDate(1);
        let calendarRequestVersion = 0;
        let calendarData = { schedules: [], events: [], holidays: [], vacation: null };

        async function loadCalendarData() {
            const version = ++calendarRequestVersion;
            const status = document.getElementById("calendarStatus");
            calendarData = { schedules: [], events: [], holidays: [], vacation: null };
            renderCalendar();
            if (!activeRosterClass) {
                status.hidden = false;
                status.textContent = "학급을 선택하면 학교 일정이 표시됩니다.";
                return;
            }
            status.hidden = false;
            status.textContent = "학교 일정 불러오는 중...";
            const year = calendarCursor.getFullYear();
            const month = localDateKey(calendarCursor).slice(0, 7);
            const academicYear = calendarCursor.getMonth() >= 2 ? year : year - 1;
            const grade = Number(activeRosterClass.grade);
            const classId = activeRosterClass.id;
            const results = await Promise.allSettled([
                scheduleApi("/api/class/schedules?" + new URLSearchParams({ classId, month })),
                scheduleApi("/api/teacher/general-events?month=" + month),
                scheduleApi("/api/teacher/public-holidays?year=" + year),
                scheduleApi("/api/teacher/vacation-settings?academicYear=" + academicYear)
            ]);
            if (version !== calendarRequestVersion) return;
            const values = results.map(result => result.status === "fulfilled" ? result.value : {});
            calendarData = {
                schedules: values[0].schedules || [],
                events: (values[1].events || []).filter(event => schoolEventMatchesGrade(event, grade)),
                holidays: values[2].holidays || [],
                vacation: values[3].settings || null
            };
            const failed = results.map((result, index) => result.status === "rejected"
                ? ["학사·학급 일정", "학교 행사", "공휴일", "방학"][index] : "").filter(Boolean);
            status.replaceChildren();
            status.hidden = failed.length === 0;
            if (failed.length) {
                status.textContent = failed.join("·") + " 정보를 불러오지 못했습니다.";
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", loadCalendarData);
                status.append(retry);
            }
            renderCalendar();
        }

        function calendarEntries(dateKey) {
            const entries = [];
            calendarData.holidays.filter(item => item.date === dateKey).forEach(item =>
                entries.push({ title: item.name, kind: "공휴일", holiday: true }));
            calendarData.schedules.filter(item => item.date === dateKey).forEach(item =>
                entries.push({ title: item.title, details: item.details,
                    kind: item.type === "annual_schedule" ? "학사" : item.type === "birthday" ? "생일" : "학급",
                    holiday: ["HOLIDAY", "DISCRETIONARY"].includes(item.category) }));
            calendarData.events.filter(item => item.event_date <= dateKey && (item.end_date || item.event_date) >= dateKey)
                .forEach(item => entries.push({ title: item.title, kind: "학교",
                    details: [item.event_time, item.period, item.location].filter(Boolean).join(" · ") }));
            const settings = calendarData.vacation;
            if (settings) {
                const periods = [
                    [settings.summer_start, settings.summer_end, "여름방학"],
                    [settings.winter_start, settings.winter_end, settings.is_integrated ? "겨울/학년말방학" : "겨울방학"],
                    ...(!settings.is_integrated ? [[settings.spring_start, settings.spring_end, "학년말방학"]] : [])
                ];
                periods.forEach(([start, end, title]) => {
                    if (start && end && start <= dateKey && end >= dateKey) entries.push({ title, kind: "방학" });
                });
                if (settings.entrance_ceremony_date === dateKey && !entries.some(item => item.title === "입학식"))
                    entries.push({ title: "입학식", kind: "학사" });
                if (settings.graduation_ceremony_date === dateKey && !entries.some(item => item.title === "졸업식"))
                    entries.push({ title: "졸업식", kind: "학사" });
            }
            return entries;
        }

        function renderCalendarAgenda() {
            const agenda = document.getElementById("calendarAgenda");
            const dateKey = scheduleDateInput.value;
            const entries = dateKey.startsWith(localDateKey(calendarCursor).slice(0, 7)) ? calendarEntries(dateKey) : [];
            agenda.replaceChildren();
            agenda.hidden = entries.length === 0;
            if (!entries.length) return;
            const heading = document.createElement("div");
            heading.className = "calendar-agenda-date";
            heading.textContent = Number(dateKey.slice(5, 7)) + "월 " + Number(dateKey.slice(8, 10)) + "일";
            agenda.append(heading);
            entries.forEach(entry => {
                const row = document.createElement("div");
                row.className = "calendar-agenda-item";
                const kind = document.createElement("span");
                kind.className = "calendar-agenda-kind";
                kind.textContent = entry.kind;
                row.append(kind, document.createTextNode(entry.title));
                if (entry.details) {
                    const detail = document.createElement("div");
                    detail.className = "calendar-agenda-meta";
                    detail.textContent = entry.details;
                    row.append(detail);
                }
                agenda.append(row);
            });
        }

        function renderCalendar() {
            const calendarMini = document.getElementById("calendarMini");
            const calMonthTitle = document.getElementById("calMonthTitle");
            const now = new Date();
            const year = calendarCursor.getFullYear();
            const month = calendarCursor.getMonth();

            calMonthTitle.textContent = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            calendarMini.replaceChildren();
            const daysHeader = ["일", "월", "화", "수", "목", "금", "토"];
            daysHeader.forEach((d, i) => {
                const h = document.createElement("div");
                h.className = "cal-head";
                if (i === 0) h.classList.add("sun");
                if (i === 6) h.classList.add("sat");
                h.textContent = d;
                calendarMini.append(h);
            });

            for (let i = 0; i < firstDay; i++) {
                calendarMini.append(document.createElement("div"));
            }

            for (let date = 1; date <= lastDate; date++) {
                const dayEl = document.createElement("div");
                dayEl.className = "cal-day";
                const dayOfWeek = (firstDay + date - 1) % 7;
                if (dayOfWeek === 0) dayEl.classList.add("sun");
                if (dayOfWeek === 6) dayEl.classList.add("sat");
                const dateKey = localDateKey(new Date(year, month, date));
                if (dateKey === localDateKey(now)) {
                    dayEl.classList.add("today");
                    dayEl.setAttribute("aria-current", "date");
                }
                const isSelected = dateKey === scheduleDateInput.value;
                if (isSelected) dayEl.classList.add("selected");
                dayEl.setAttribute("aria-pressed", String(isSelected));
                const entries = calendarEntries(dateKey);
                if (entries.some(entry => entry.holiday)) dayEl.classList.add("holiday");
                dayEl.textContent = date;
                if (entries.length) {
                    dayEl.classList.add("has-event", "has-label");
                    const label = document.createElement("span");
                    label.className = "cal-event-label";
                    label.textContent = entries[0].title + (entries.length > 1 ? " +" + (entries.length - 1) : "");
                    dayEl.append(label);
                    dayEl.title = entries.map(entry => entry.title).join(" · ");
                }
                dayEl.tabIndex = 0;
                dayEl.setAttribute("role", "button");
                dayEl.setAttribute("aria-label", `${year}년 ${month + 1}월 ${date}일 일정 선택`);
                const selectDate = () => {
                    scheduleDateInput.value = dateKey;
                    renderCalendar();
                    calendarMini.querySelector(".cal-day.selected")?.focus({ preventScroll: true });
                };
                if (entries.length) dayEl.setAttribute("aria-label", dayEl.getAttribute("aria-label") + ": " + dayEl.title);
                dayEl.addEventListener("click", selectDate);
                dayEl.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        selectDate();
                    }
                });
                calendarMini.append(dayEl);
            }
            renderCalendarAgenda();
        }
        document.getElementById("prevMonthBtn").addEventListener("click", () => {
            calendarCursor.setMonth(calendarCursor.getMonth() - 1);
            loadCalendarData();
        });
        document.getElementById("nextMonthBtn").addEventListener("click", () => {
            calendarCursor.setMonth(calendarCursor.getMonth() + 1);
            loadCalendarData();
        });
        document.getElementById("todayMonthBtn").addEventListener("click", () => {
            calendarCursor = new Date();
            calendarCursor.setDate(1);
            scheduleDateInput.value = localDateKey();
            loadCalendarData();
        });
        renderCalendar();

        // 7. NEIS Meals — use the school attached to the selected classroom.
        let mealRequestVersion = 0;

        function showMealMessage(message, retrySchool = null) {
            const notice = document.createElement("div");
            notice.style.cssText = "color: var(--text-muted); font-size: 0.88rem; padding: 12px 4px; text-align: center;";
            notice.textContent = message;
            mealList.replaceChildren(notice);
            if (retrySchool) {
                const retry = document.createElement("button");
                retry.type = "button";
                retry.className = "btn";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", () => loadMeals(retrySchool));
                mealList.append(retry);
            }
        }

        async function loadMeals(school) {
            const requestVersion = ++mealRequestVersion;
            if (!school) {
                showMealMessage("학급의 학교 정보를 불러오지 못했습니다.");
                return;
            }
            const officeCode = school.officeCode;
            const schoolCode = school.schoolCode;
            if (!officeCode || !schoolCode) {
                showMealMessage("연결된 학교의 급식 조회 코드가 없습니다. 학교 관리자에게 확인해 주세요.");
                return;
            }

            showMealMessage("급식 메뉴 불러오는 중...");
            try {
                const query = new URLSearchParams({
                    officeCode,
                    schoolCode,
                    date: localDateKey().replace(/-/g, "")
                });
                const mealRes = await fetch("/api/school/meal?" + query.toString());
                if (!mealRes.ok) throw new Error("Meal request failed");
                const mealData = await mealRes.json();
                if (!Array.isArray(mealData.meals)) throw new Error("Invalid meal response");
                if (requestVersion !== mealRequestVersion) return;

                const meal = mealData.meals.find(item => item.mealType === "중식" || item.mealType === "점심")
                    || mealData.meals[0];
                if (Array.isArray(meal?.dishes) && meal.dishes.length > 0) {
                    mealList.replaceChildren();
                    meal.dishes.forEach((dish) => {
                        const item = document.createElement("div");
                        item.className = "meal-dish-item";
                        const bullet = document.createElement("span");
                        bullet.style.color = "var(--accent-green)";
                        bullet.textContent = "•";
                        const text = document.createElement("span");
                        text.textContent = dish;
                        item.append(bullet, text);
                        mealList.append(item);
                    });
                } else {
                    showMealMessage("오늘 등록된 급식 정보가 없습니다.");
                }
            } catch (err) {
                if (requestVersion !== mealRequestVersion) return;
                showMealMessage("급식 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.", school);
            }
        }

        // 7-2. Realtime Weather, Humidity & Air Quality (PM10) Dynamic Geocoding Integration
        //
        // open-meteo's own /v1/search geocoder barely matches Korean-language
        // queries at all (confirmed: even "서울" and "강남구" return zero
        // results there, while the English "Seoul" works) -- it's an
        // English/romanized gazetteer, not a Korean address geocoder. Use
        // OSM Nominatim instead, which indexes Korean school names directly
        // (e.g. "계상초등학교" resolves to the exact real campus) and only
        // fetch the weather itself from open-meteo once we have real coords.
        async function geocode(query) {
            const cleaned = String(query || "").trim();
            if (cleaned.length < 2) return null;
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleaned)}&format=json&limit=1&accept-language=ko&countrycodes=kr`);
                const geoData = await geoRes.json();
                const first = geoData?.[0];
                if (first?.lat && first?.lon) return { lat: Number(first.lat), lon: Number(first.lon) };
            } catch (_) {}
            return null;
        }

        async function fetchRealtimeWeatherAndAirQuality(schoolName = "", locationName = "") {
            try {
                let lat = 37.65;
                let lon = 127.06;
                let geoFound = false;

                // The school's own name is the most precise query (an exact
                // campus, not just a city); fall back to the broader
                // location/district name if that specific lookup finds
                // nothing.
                const match = (await geocode(schoolName)) || (await geocode(locationName));
                if (match) {
                    ({ lat, lon } = match);
                    geoFound = true;
                }

                if (!geoFound && navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => fetchWeatherWithCoords(pos.coords.latitude, pos.coords.longitude, false),
                        () => fetchWeatherWithCoords(lat, lon, true),
                        { timeout: 3000 }
                    );
                    return;
                }

                fetchWeatherWithCoords(lat, lon, !geoFound);
            } catch (err) {
                console.error("날씨/미세먼지 API 호출 오류:", err);
            }
        }

        // isEstimated: true when neither the school's location nor the
        // browser's geolocation could be resolved, so these coordinates are
        // just a hardcoded fallback point -- the reading shown is not
        // actually the school's weather, and the UI must say so rather than
        // presenting a guess as fact.
        async function fetchWeatherWithCoords(lat, lon, isEstimated = false) {
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m`);
                const weatherData = await weatherRes.json();
                
                const airRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10`);
                const airData = await airRes.json();

                if (weatherData && weatherData.current_weather) {
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const code = weatherData.current_weather.weathercode;
                    const humidity = weatherData.hourly?.relativehumidity_2m?.[0] || 55;
                    
                    let cond = "☀️ 맑음";
                    if (code >= 1 && code <= 3) cond = "⛅ 구름조금";
                    else if (code >= 45 && code <= 48) cond = "🌫️ 안개";
                    else if (code >= 51 && code <= 67) cond = "🌧️ 비";
                    else if (code >= 71) cond = "❄️ 눈";

                    const weatherTempEl = document.getElementById("weatherTemp");
                    const weatherHumidityEl = document.getElementById("weatherHumidity");
                    const estimatedNote = isEstimated
                        ? ` <span style="font-size: 0.7rem; color: var(--muted, #9ca3af);" title="학교 위치를 확인하지 못해 정확하지 않을 수 있습니다.">(위치 추정)</span>`
                        : "";
                    if (weatherTempEl) weatherTempEl.innerHTML = `${temp}° <span style="font-size: 1.15rem; color: var(--accent-amber);">${cond}</span>${estimatedNote}`;
                    if (weatherHumidityEl) weatherHumidityEl.innerHTML = `💧 습도 <strong style="color: #7ce4ff; font-weight: 900;">${humidity}%</strong>`;
                }

                if (airData && airData.current && airData.current.pm10 !== undefined) {
                    const pm10 = Math.round(airData.current.pm10);
                    const dustBadge = document.getElementById("dustBadge");
                    if (dustBadge) {
                        let label = "좋음";
                        let bg = "#3a86ff";
                        let color = "#ffffff";

                        if (pm10 > 150) {
                            label = "매우나쁨"; bg = "#e63946"; color = "#ffffff";
                        } else if (pm10 > 80) {
                            label = "나쁨"; bg = "#ffb703"; color = "#000000"; // 주황/노랑
                        } else if (pm10 > 30) {
                            label = "보통"; bg = "#2ec4b6"; color = "#0b0f0c"; // 초록
                        }

                        dustBadge.style.background = bg;
                        dustBadge.style.color = color;
                        dustBadge.innerHTML = `미세먼지 <strong>${label}</strong> (${pm10}㎍/㎥)`;
                    }
                }
            } catch (err) {
                console.error("날씨/미세먼지 API 호출 오류:", err);
            }
        }

        // 8. Presenter Picker & Web Audio Feedback
        const multiPickerModalBtn = document.getElementById("multiPickerModalBtn");
        const multiPickerModal = document.getElementById("multiPickerModal");
        const closeMultiPickerModal = document.getElementById("closeMultiPickerModal");
        const shuffleBubblesBtn = document.getElementById("shuffleBubblesBtn");
        const resetBubblesBtn = document.getElementById("resetBubblesBtn");
        const bubblePickerGrid = document.getElementById("bubblePickerGrid");

        let bubbleList = [];

        function playTingSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1046.50, ctx.currentTime); // C6 맑은 띵 소리
                osc1.frequency.exponentialRampToValueAtTime(2093.00, ctx.currentTime + 0.15); // C7

                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1318.51, ctx.currentTime); // E6
                osc2.frequency.exponentialRampToValueAtTime(2637.02, ctx.currentTime + 0.15); // E7

                gain.gain.setValueAtTime(0.6, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(ctx.currentTime + 0.45);
                osc2.stop(ctx.currentTime + 0.45);
            } catch(err) {
                console.error("Audio error:", err);
            }
        }

        function renderBubblePicker(shouldShuffle = true) {
            if (!bubblePickerGrid) return;
            bubblePickerGrid.replaceChildren();

            let targetStudents = [...rosterStudents];
            if (targetStudents.length === 0) {
                for (let i = 1; i <= 20; i++) {
                    targetStudents.push({ number: String(i), name: `${i}번` });
                }
            }

            if (shouldShuffle) {
                for (let i = targetStudents.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [targetStudents[i], targetStudents[j]] = [targetStudents[j], targetStudents[i]];
                }
            }

            bubbleList = targetStudents;

            bubbleList.forEach((student) => {
                const avatar = getAvatarForStudent(student.number);
                const card = document.createElement("div");
                card.className = "bubble-card";
                card.title = "터치하여 학생을 추첨하세요!";
                card.innerHTML = `<span style="font-size: 2.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">❓</span>`;

                card.addEventListener("click", () => {
                    if (card.classList.contains("revealed")) return;
                    playTingSound();
                    card.classList.add("revealed");
                    card.innerHTML = `
                        <div class="bubble-avatar">${avatar.icon}</div>
                        <div class="bubble-name">${student.name}</div>
                    `;
                });

                bubblePickerGrid.append(card);
            });
        }

        multiPickerModalBtn.addEventListener("click", () => {
            multiPickerModal.hidden = false;
            renderBubblePicker(true);
        });

        closeMultiPickerModal.addEventListener("click", () => {
            multiPickerModal.hidden = true;
        });

        shuffleBubblesBtn.addEventListener("click", () => {
            renderBubblePicker(true);
        });

        resetBubblesBtn.addEventListener("click", () => {
            renderBubblePicker(false);
        });

        // 9. Focus Timer Modal
        const timerModalBtn = document.getElementById("timerModalBtn");
        const timerModal = document.getElementById("timerModal");
        const closeTimerModal = document.getElementById("closeTimerModal");
        const timerDisplay = document.getElementById("timerDisplay");
        const startTimerBtn = document.getElementById("startTimerBtn");
        const resetTimerBtn = document.getElementById("resetTimerBtn");

        let timerSeconds = 300;
        let timerInterval = null;
        let isTimerRunning = false;

        function updateTimerDisplay() {
            const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
            const s = String(timerSeconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        }

        window.setTimerSec = function(sec) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            startTimerBtn.textContent = "시작";
            timerSeconds = sec;
            updateTimerDisplay();
        };

        timerModalBtn.addEventListener("click", () => { timerModal.hidden = false; });
        closeTimerModal.addEventListener("click", () => { timerModal.hidden = true; });

        startTimerBtn.addEventListener("click", () => {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                startTimerBtn.textContent = "시작";
            } else {
                isTimerRunning = true;
                startTimerBtn.textContent = "일시정지";
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        startTimerBtn.textContent = "시작";
                        alert("⏰ 타이머 시간이 완료되었습니다!");
                    }
                }, 1000);
            }
        });

        resetTimerBtn.addEventListener("click", () => {
            clearInterval(timerInterval);
            isTimerRunning = false;
            startTimerBtn.textContent = "시작";
            timerSeconds = 300;
            updateTimerDisplay();
        });

        // 10. Drag & Drop Card Reordering
        const grid = document.getElementById("dashboardGrid");
        let draggedItem = null;

        const savedOrder = JSON.parse(localStorage.getItem("dashboardCardOrder") || '[]');
        if (savedOrder.length > 0) {
            savedOrder.forEach(id => {
                const el = document.getElementById(id);
                if (el) grid.appendChild(el);
            });
        }

        grid.addEventListener("dragstart", (e) => {
            const card = e.target.closest(".widget-card");
            if (card) {
                draggedItem = card;
                card.classList.add("dragging");
                e.dataTransfer.effectAllowed = "move";
            }
        });

        grid.addEventListener("dragend", (e) => {
            const card = e.target.closest(".widget-card");
            if (card) {
                card.classList.remove("dragging");
                draggedItem = null;
                // Save order
                const currentOrder = Array.from(grid.querySelectorAll(".widget-card")).map(c => c.id);
                localStorage.setItem("dashboardCardOrder", JSON.stringify(currentOrder));
            }
        });

        grid.addEventListener("dragover", (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
            if (draggedItem) {
                if (afterElement == null) {
                    grid.appendChild(draggedItem);
                } else {
                    grid.insertBefore(draggedItem, afterElement);
                }
            }
        });

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.widget-card:not(.dragging)')];
            let closest = null;
            let closestDistance = Number.POSITIVE_INFINITY;
            for (const child of draggableElements) {
                const box = child.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;
                const distance = Math.hypot(x - centerX, y - centerY);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closest = { element: child, centerX, centerY };
                }
            }
            if (!closest) return null;
            const isBeforeClosest = x < closest.centerX || (x === closest.centerX && y < closest.centerY);
            return isBeforeClosest ? closest.element : closest.element.nextElementSibling;
        }
    </script>
