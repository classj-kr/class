<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 학급 대시보드</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f0c;
            --card-bg: rgba(21, 28, 24, 0.88);
            --card-border: rgba(117, 214, 159, 0.18);
            --card-hover-border: rgba(117, 214, 159, 0.4);
            --accent-green: #75d69f;
            --accent-green-dark: #163826;
            --accent-amber: #f0bd64;
            --accent-blue: #64c2f0;
            --accent-danger: #ff8b82;
            --text-main: #f0f5f2;
            --text-muted: #9aa8a0;
            --text-sub: #6c7d73;
            --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            --weekday-panel-image: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-x: hidden;
        }

        /* Top Banner Header */
        header.dashboard-header {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 20px;
            align-items: center;
        }

        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px 22px;
            backdrop-filter: blur(16px);
            box-shadow: var(--glass-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            min-width: 300px;
        }

        .slogan-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            backdrop-filter: blur(16px);
            box-shadow: var(--glass-shadow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        .slogan-text {
            font-size: clamp(1.8rem, 3.5vw, 3rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .slogan-text[contenteditable="true"] {
            border-bottom: 2px dashed var(--accent-green);
            padding: 4px 8px;
        }

        .clock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 32px;
            backdrop-filter: blur(16px);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 280px;
        }

        .clock-time {
            font-family: 'Outfit', sans-serif;
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #ffffff;
            display: flex;
            align-items: baseline;
        }

        .clock-seconds {
            font-size: 1.8rem;
            color: var(--accent-green);
            margin-left: 4px;
            font-weight: 700;
        }

        .clock-date {
            margin-top: 6px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Main Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* Grid rows default to stretch, so a card with light content
               (e.g. no upcoming events) was forced to match its tallest
               sibling (the period timetable) and ended up as mostly empty
               card -- align to each card's own content height instead. */
            align-items: start;
            gap: 20px;
            flex: 1;
        }

        .widget-card {
            min-height: 320px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(16px);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .slogan-card,
        .clock-card,
        .widget-card {
            background-color: #101010;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.34)),
                var(--weekday-panel-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .widget-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .widget-card:hover {
            border-color: var(--card-hover-border);
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
        }

        .widget-header:active {
            cursor: grabbing;
        }

        .widget-title {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }

        .widget-icon {
            font-size: 1.3rem;
        }

        .widget-badge {
            background: rgba(117, 214, 159, 0.15);
            color: var(--accent-green);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(117, 214, 159, 0.3);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 44px;
            min-height: 58px;
        }

        .roster-student-copy {
            display: flex;
            align-items: baseline;
            justify-content: center;
            min-width: 0;
            gap: 4px;
            white-space: nowrap;
        }

        .roster-student-number {
            color: var(--text-sub);
            font-size: 0.68rem;
            font-weight: 700;
        }

        .roster-student-name {
            font-size: 0.84rem;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn:hover {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        #widget-timetable,
        #widget-boards {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        .widget-edit {
            align-self: flex-end;
            min-height: 30px;
            padding: 3px 6px;
            background: transparent;
            border: 0;
            border-radius: 5px;
            color: var(--text-muted);
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .widget-edit:hover { background: rgba(255, 255, 255, 0.07); color: var(--text-main); }
        .widget-edit:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }

        .checklist-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .checklist-controls select { min-width: 0; max-width: 100%; }
        .checklist-status { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

        /* 1. Timetable Widget */
        .today-events-banner[hidden],
        .today-events-banner:empty { display: none; }

        .today-events-banner {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .today-events-banner .today-event-line {
            font-size: 12px;
            color: var(--text-main, #eee);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .today-events-banner .today-event-meta {
            color: var(--text-muted, #999);
            font-size: 11px;
        }
        .timetable-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: none;
            overflow-y: visible;
        }

        .timetable-item {
            display: grid;
            grid-template-columns: 60px minmax(110px, 1.1fr) 1fr;
            gap: 8px;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .timetable-item.active {
            background: linear-gradient(135deg, rgba(240, 189, 100, 0.25) 0%, rgba(240, 189, 100, 0.05) 100%);
            border-color: var(--accent-amber);
            transform: scale(1.01);
            box-shadow: 0 4px 15px rgba(240, 189, 100, 0.15);
        }

        .period-col-left {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .period-label {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .period-time-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-sub);
            line-height: 1.1;
            margin-top: 1px;
        }

        .period-time-stack .wave {
            font-size: 0.65rem;
            opacity: 0.5;
            margin: -1px 0;
        }

        .period-col-center {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
            white-space: nowrap;
            min-width: 0;
        }

        .period-subject-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            min-width: 0;
        }

        .period-subject-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .period-col-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            min-width: 0;
        }

        .prep-active-badge {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff4d4d;
            box-shadow: 0 0 6px rgba(255, 77, 77, 0.8);
            flex-shrink: 0;
            display: inline-block;
            margin-right: 2px;
        }

        .period-subject {
            font-weight: 900;
            font-size: 1.25rem;
            color: #ffffff;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .period-subject-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: 0 0 30px;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            font-size: 23px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.65));
        }

        .period-place {
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .period-place.default { color: rgba(255, 255, 255, 0.55); }
        .period-place.highlight { color: #7ce4ff; font-weight: 800; }

        .prep-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 5px 8px;
            color: #b0c0ca;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            white-space: nowrap;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .prep-input.has-value {
            background: rgba(255, 77, 77, 0.10);
            border-color: rgba(255, 77, 77, 0.45);
            color: #7ce4ff;
            font-weight: 700;
        }

        .prep-input::placeholder {
            color: rgba(255, 255, 255, 0.22);
        }

        .prep-input:focus {
            border-color: var(--accent-green);
            background: rgba(0, 0, 0, 0.55);
            box-shadow: 0 0 0 2px rgba(117, 214, 159, 0.25);
        }

        .timetable-item.active .period-subject {
            color: var(--accent-amber);
        }

        /* 2. Student Checklist Widget */
        #widget-checklist {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        #widget-checklist .icon-btn {
            min-height: 38px;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
        }

        .num-chip {
            width: 100%;
            min-width: 0;
            min-height: 43px;
            padding: 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font: inherit;
            border-radius: 8px;
            background: rgba(117, 214, 159, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(117, 214, 159, 0.25);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease, border-color 0.15s ease;
            position: relative;
            text-align: center;
        }

        .num-chip.missing {
            background: rgba(255, 139, 130, 0.15);
            color: var(--accent-danger);
            border-color: rgba(255, 139, 130, 0.35);
        }

        .num-chip:hover,
        .num-chip:focus-visible {
            border-color: var(--accent-green);
            outline: 2px solid transparent;
            background: rgba(117, 214, 159, 0.21);
        }

        .attendance-tag {
            display: inline-block;
            max-width: 100%;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.63rem;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }

        .attendance-tag[data-kind="결석"] { background: #69312e; color: #ffd0cb; }
        .attendance-tag[data-kind="지각"] { background: #604522; color: #ffe3a1; }
        .attendance-tag[data-kind="조퇴"] { background: #263f65; color: #cde5ff; }
        .attendance-tag[data-kind="체험학습"] { background: #245247; color: #c7f5df; }

        .bday-tag {
            position: absolute;
            top: -5px;
            right: -3px;
            font-size: 0.8rem;
        }

        @media (max-width: 420px) {
            .checklist-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        /* 3. Important schedule */
        .card-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .board-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .board-item.schedule-today {
            border-color: var(--accent-green);
            background: rgba(76, 201, 140, 0.13);
        }

        .board-item.schedule-this-week:not(.schedule-today) {
            border-color: rgba(255, 193, 92, 0.45);
        }

        .schedule-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 28px 12px;
            line-height: 1.6;
        }

        .schedule-date {
            min-width: 54px;
            color: var(--accent-green);
            font-size: 0.8rem;
            font-weight: 900;
        }

        .schedule-date.this-week { color: var(--accent-amber); }

        .schedule-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .schedule-badge.scope-holiday { background: rgba(255, 139, 130, 0.15); color: var(--accent-danger); }
        .schedule-badge.scope-vacation { background: rgba(196, 181, 253, 0.15); color: #c4b5fd; }
        .schedule-date-range { display: block; margin-top: 3px; font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
        .schedule-badge.scope-all { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .schedule-badge.scope-grade { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        #widget-info {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        .calendar-header {
            gap: 10px;
        }

        .calendar-header .widget-title {
            font-size: 1.2rem;
            white-space: nowrap;
            gap: 6px;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 9px;
        }

        .calendar-nav .icon-btn {
            display: grid;
            place-items: center;
            min-width: 38px;
            min-height: 40px;
            padding: 0 9px;
            border: 0;
            border-radius: 0;
            font-size: 1.35rem;
            line-height: 1;
        }

        .calendar-nav .icon-btn + .icon-btn {
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        .calendar-nav #todayMonthBtn {
            font-size: 0.85rem;
        }

        .calendar-nav .icon-btn:focus-visible,
        .cal-day:focus-visible {
            outline: 2px solid var(--accent-green);
            outline-offset: -2px;
        }

        .cal-day {
            min-height: 40px;
            cursor: pointer;
            position: relative;
        }

        .cal-day.has-event::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 3px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-amber);
            transform: translateX(-50%);
        }

        .cal-day.selected {
            outline: 2px solid var(--accent-green);
            outline-offset: -2px;
        }

        .schedule-editor {
            display: grid;
            grid-template-columns: 132px minmax(200px, 1fr) 52px max-content;
            gap: 8px;
            margin-top: 10px;
        }

        .schedule-editor[hidden] {
            display: none;
        }

        .schedule-date-input {
            color-scheme: dark;
        }

        .schedule-details-input {
            grid-column: 1 / -1;
        }

        .schedule-copy {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .schedule-detail {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .board-item-del {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1.1rem;
            min-width: 44px;
            min-height: 44px;
            padding: 0 8px;
            transition: color 0.15s;
        }

        .board-item-del:hover {
            color: var(--accent-danger);
        }

        .board-item-edit:hover { color: var(--accent-green); }
        .schedule-actions { display: flex; align-items: center; gap: 2px; }

        .board-add-box {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .board-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            min-height: 44px;
        }

        .board-input:focus {
            border-color: var(--accent-green);
        }

        .add-btn {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 44px;
            min-height: 44px;
        }

        .add-btn:hover {
            background: var(--accent-green);
            color: #101512;
        }

        /* 4. Calendar & Weather & Meals */
        .calendar-mini {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .cal-head {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 24px;
            color: var(--text-muted);
            padding-bottom: 3px;
        }

        .cal-day {
            display: grid;
            place-items: center;
            padding: 3px 0 5px;
            border-radius: 7px;
            font-size: 1.35rem;
            line-height: 1;
            font-weight: 700;
        }

        .cal-day:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .cal-day.has-label { gap: 2px; padding: 3px 1px 4px; }
        .cal-day.has-label::after { display: none; }
        .cal-event-label {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.62rem;
            line-height: 1.2;
            color: var(--accent-amber);
        }
        .cal-day.holiday, .cal-day.holiday .cal-event-label { color: var(--accent-danger); }
        .cal-day.today .cal-event-label { color: #0b0f0c; }
        .calendar-status { color: var(--text-muted); font-size: 0.78rem; }
        .calendar-status button { margin-left: 6px; color: var(--accent-green); background: none; border: 0; cursor: pointer; text-decoration: underline; }
        .calendar-agenda { border-top: 1px solid var(--card-border); padding-top: 8px; font-size: 0.82rem; }
        .calendar-agenda-date { font-weight: 800; margin-bottom: 5px; }
        .calendar-agenda-item { padding: 3px 0; overflow-wrap: anywhere; }
        .calendar-agenda-kind { color: var(--accent-green); font-size: 0.7rem; margin-right: 6px; }
        .calendar-agenda-meta { color: var(--text-muted); font-size: 0.74rem; margin-top: 2px; }

        .cal-day.sun, .cal-head.sun { color: var(--accent-danger); }

            background: var(--accent-blue);
            color: #0b0f0c;
            font-weight: 800;
        }

            background: #0b0f0c;

        .dday-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            padding: 6px 10px;

            align-items: center;
            justify-content: space-between;

            font-weight: 800;

            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;

            align-items: center;
            gap: 8px;

        .timetable-item.active,
        .num-chip,
        .num-chip.missing,
        .board-item,
        .board-item.schedule-today,
        .weather-box,

        /* Toolbar Bottom */
        footer.toolbar {

            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 24px;

            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(16px);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);

            color: var(--accent-green);
        }

        .tool-btn.active {
            background: var(--accent-green);
            color: #0b0f0c;
        }

        /* Modal Overlay */
        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;

        .day-tabs {
            display: flex;

            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .day-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
            min-height: 44px;
        }

        .day-tab.active {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .edit-period-row {
            display: grid;
            grid-template-columns: 50px 1.1fr 0.9fr 1.2fr;
            gap: 6px;
            align-items: center;
        }

        .modal-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.9rem;
            min-height: 44px;
        }

        /* Timer */
        .timer-display {
            font-family: 'Outfit', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            color: var(--accent-green);
            background: rgba(117, 214, 159, 0.1);
            border-radius: 20px;
            padding: 10px;
        }

        /* Multi-Student Bubble Touch Picker (Class123 Style) */
        .bubble-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
            gap: 20px;
            padding: 24px 14px;
            overflow-y: auto;
            max-height: 60vh;
            justify-items: center;
            align-items: center;
        }

        .bubble-card {
            position: relative;
            width: 126px;
            height: 126px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4a5863 0%, #22292f 70%, #151a1e 100%);
            border: 3px solid #5a6a77;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 3px 6px rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .bubble-card:hover:not(.revealed) {
            transform: scale(1.1);
            border-color: #2ec4b6;
            box-shadow: 0 12px 25px rgba(46, 196, 182, 0.5), inset 0 4px 8px rgba(255,255,255,0.3);
        }

        .bubble-card.revealed {
            width: 134px;
            height: 142px;
            background: none;
            border: none;
            box-shadow: none;
            animation: pop-bounce 0.45s ease-out forwards;
            cursor: default;
        }

        @keyframes pop-bounce {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            65% { transform: scale(1.16) rotate(6deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .bubble-avatar {
            font-size: 4.4rem;
            line-height: 1;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,0.55));
        }

        .bubble-name {
            font-size: 1.18rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 3px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @media (max-width: 1280px) {
            header.dashboard-header {
                grid-template-columns: 1fr auto;
            }
            .weather-card {
                grid-column: 1 / -1;
                min-width: 0;
            }
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            header.dashboard-header {
                grid-template-columns: 1fr;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function updateClock() {

        function renderTimetable(dayName, now = new Date()) {
            const listEl = document.getElementById("timetableList");

            const periods = customTimetable[dayName] || defaultTimetable["월"];

            periods.forEach((item) => {
                const div = document.createElement("div");
                div.className = "timetable-item";
                
                const [sH, sM] = (item.s || "09:00").split(":").map(Number);
                const [eH, eM] = (item.e || "09:40").split(":").map(Number);
                const startMins = sH * 60 + sM;
                const endMins = eH * 60 + eM;

                if (currentMins >= startMins && currentMins <= endMins) {
                    div.classList.add("active");
                }

                let placeTag = '';
                if (item.place) {
                    const isNormalClassroom = (item.place === '교실' || item.place === '우리교실');
                    placeTag = `<span class="period-place ${isNormalClassroom ? 'default' : 'highlight'}">${item.place}</span>`;
                }
                const prepVal = savedPreps[item.p] || "";

                div.innerHTML = `
                    <div class="period-col-left">
                        <span class="period-label">${item.p}교시</span>
                        <div class="period-time-stack">
                            <span>${item.s || ""}</span>

                            <span>${item.e || ""}</span>

                                <span class="period-subject">${item.sub || "과목"}</span>
                                ${getSubjectIcon(item.sub)}

                            ${placeTag}

                    </div>
                    <div class="period-col-right">

                listEl.append(div);

                    }),

        async function loadDashboardSettingsFromDB() {
            try {
                const res = await fetch("/api/teacher/dashboard-settings", { credentials: "include" });
                const data = await res.json().catch(() => ({}));
                if (data.settings) {
                    const s = data.settings;
                    if (s.timetable && Object.keys(s.timetable).length > 0) {
                        customTimetable = s.timetable;
                    }
                    if (s.sloganText !== undefined && s.sloganText !== null && s.sloganText.trim() !== "" && s.sloganText !== "-") {
                        sloganText.textContent = s.sloganText;
                    } else {
                        sloganText.textContent = "-";

                    if (s.sloganAlign) {
                        sloganAlign = s.sloganAlign;
                    }

                    }

                        const grid = document.getElementById("dashboardGrid");
                        if (grid) {
                            s.cardOrder.forEach(id => {

                            });
                        }

                    sloganText.textContent = "-";

                    applySloganStyle();

        function escHtmlLocal(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 오늘 날짜 + 우리 학급(전교 포함) 대상 일반 행사를 배너로만 보여준다.
        // 기존 시간표 위젯의 과목/장소는 절대 건드리지 않는다.
        async function loadTodayEvents(grade) {
            const banner = document.getElementById("todayEventsBanner");
            if (!banner) return;
            try {
                const now = new Date();
                const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
                const todayStr = `${month}-${String(now.getDate()).padStart(2, "0")}`;
                const res = await fetch(`/api/teacher/general-events?month=${month}`);
                const data = await res.json();
                const events = (data.events || []).filter(ev => {
                    const inRange = ev.event_date <= todayStr && (ev.end_date || ev.event_date) >= todayStr;
                    const matchesGrade = ev.target_scope === "ALL" || (Array.isArray(ev.target_grades) && grade && ev.target_grades.includes(grade));
                    return inRange && matchesGrade;
                });

                banner.replaceChildren();
                if (events.length === 0) {
                    banner.hidden = true;
                    return;
                }
                events.forEach(ev => {
                    const line = document.createElement("div");
                    line.className = "today-event-line";
                    const metaParts = [ev.event_time, ev.period, ev.location].filter(Boolean).join(", ");
                    line.innerHTML = `<span>📌 ${escHtmlLocal(ev.title)}</span>${metaParts ? `<span class="today-event-meta">(${escHtmlLocal(metaParts)})</span>` : ""}`;
                    banner.appendChild(line);
                });
                banner.hidden = false;
            } catch (err) {
                banner.hidden = true;
            }
        }

        // 4. Student Roster Checklist & Birthday Check & Class Switcher
        async function fetchRosterAndRenderChecklist(classId = null) {
            try {
                const classSwitcherSelect = document.getElementById("classSwitcherSelect");
                
                // Fetch available classes for switcher
                const availableRes = await fetch("/api/teacher/available-classes");
                const availableData = await availableRes.json();
                
                if (availableData.classes && availableData.classes.length > 0 && classSwitcherSelect) {
                    classSwitcherSelect.hidden = false;
                    const prevVal = classSwitcherSelect.value;
                    classSwitcherSelect.replaceChildren();
                    // 이 계정 자신의 담임 학급이 아직 정해지지 않은 상태(관리자 등)에서
                    // <select>가 아무것도 선택 안 된 채로 남으면 브라우저가 그냥 목록의
                    // 첫 번째 학급(다른 담임의 반)을 자동으로 보여준다 -- 마치 그게 내
                    // 학급인 것처럼 보이므로, 명시적인 빈 선택지를 기본값으로 둔다.
                    const placeholderOpt = document.createElement("option");
                    placeholderOpt.value = "";
                    placeholderOpt.textContent = "학급을 선택하세요";
                    classSwitcherSelect.appendChild(placeholderOpt);
                    // 전담교사별 시간표에서 내가 배정된 반(내 수업)을 먼저, ★ 표시와 과목명을 붙여서 보여준다.
                    const sortedClasses = availableData.classes.slice().sort((a, b) => {
                        if (Boolean(b.isMyTeaching) !== Boolean(a.isMyTeaching)) return b.isMyTeaching ? 1 : -1;
                        if (a.grade !== b.grade) return a.grade - b.grade;
                        return a.classNumber - b.classNumber;
                    });
                    sortedClasses.forEach(c => {
                        const opt = document.createElement("option");
                        opt.value = c.id;
                        const subjects = Array.isArray(c.myTeachingSubjects) && c.myTeachingSubjects.length ? ` · ${c.myTeachingSubjects.join(",")}` : "";
                        opt.textContent = c.isMyTeaching
                            ? `★ ${c.grade}학년 ${c.classNumber}반 (내 수업${subjects})`
                            : `${c.grade}학년 ${c.classNumber}반 (${c.teacherName})`;
                        classSwitcherSelect.appendChild(opt);
                    });
                    if (classId) classSwitcherSelect.value = classId;
                    else if (prevVal) classSwitcherSelect.value = prevVal;
                    else classSwitcherSelect.value = "";
                }

                const fetchUrl = classId ? `/api/teacher/class?classId=${classId}` : "/api/teacher/class";
                const res = await fetch(fetchUrl);
                const data = await res.json();
                if (!res.ok) {
                    console.error("/api/teacher/class failed:", res.status, data?.error, data?.message);
                }
                if (data?.classroom) {
                    fetchRealtimeWeatherAndAirQuality(data.classroom.schoolName, data.classroom.locationName);
                    rosterStudents = data.classroom.students || [];
                    activeRosterClass = data.classroom;
                    loadMeals(data.classroom);
                    activeScheduleClassId = data.classroom.id;
                    canEditSchedules = !data.classroom.isReadOnly;
                    if (data.classroom.id && classSwitcherSelect) {
                        classSwitcherSelect.value = data.classroom.id;
                    }
                    rosterLoadMessage = rosterStudents.length ? "" : "등록된 학생이 없습니다.";
                    loadTodayEvents(data.classroom.grade);
                } else {
                    rosterStudents = [];
                    activeRosterClass = null;
                    loadMeals(null);
                    rosterLoadMessage = data?.message || "담임 학급 정보를 불러오지 못했습니다. 학교 관리자에게 학급 배정을 확인해 주세요.";
                    fetchRealtimeWeatherAndAirQuality();
                }
            } catch (err) {
                console.error("/api/teacher/class request threw:", err);
                rosterStudents = [];
                activeRosterClass = null;
                loadMeals(null);
                rosterLoadMessage = "담임 학급 정보를 불러오지 못했습니다. 학교 관리자에게 학급 배정을 확인해 주세요.";
                fetchRealtimeWeatherAndAirQuality();
            }
            renderChecklist();
            await loadSchedules(activeScheduleClassId);
            await loadCalendarData();
