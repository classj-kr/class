                resultArea.value = shownItems.map(it => resultLabel(it) + '\n' + it.text).join('\n\n');
            }

            function fitBox(box) {
                box.style.height = 'auto';
                box.style.height = box.scrollHeight + 'px';
            }

            function renderResult(items, at) {
                shownItems = items;
                shownAt = at || Date.now();
                const boxes = [];
                resultList.replaceChildren(...items.map((it) => {
                    const row = document.createElement('div');
                    row.style.cssText = 'border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--paper);';

                    const head = document.createElement('div');
                    head.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px;';

                    const no = document.createElement('strong');
                    no.textContent = resultLabel(it);
                    no.style.cssText = 'color:var(--brand); font-size:0.9rem;';

                    const one = document.createElement('button');
                    one.type = 'button';
                    one.className = 'btn btn-outline';
                    one.style.cssText = 'padding:2px 10px; font-size:0.8rem;';
                    one.textContent = '복사';
                    one.addEventListener('click', async () => {
                        await navigator.clipboard.writeText(it.text);
                        one.textContent = '복사됨';
                        setTimeout(() => { one.textContent = '복사'; }, 1200);
                    });

                    head.append(no, one);

                    // 문장은 그 자리에서 고친다. 고친 글이 복사와 저장에 그대로 쓰인다.
                    const body = document.createElement('textarea');
                    body.value = it.text;
                    body.rows = 1;
                    body.style.cssText = 'width:100%; border:0; padding:0; margin:0; background:transparent;'
                        + ' color:inherit; font:inherit; line-height:1.7; resize:none; overflow:hidden; outline:none;';
                    body.addEventListener('input', () => {
                        it.text = body.value;
                        fitBox(body);
                        syncResultText();
                        saveResult(shownItems, shownAt);
                    });
                    boxes.push(body);

                    row.append(head, body);
                    return row;
                }));
                syncResultText();
                resultSection.style.display = 'block';
                boxes.forEach(fitBox);
            }

            generateBtn.addEventListener('click', async () => {
                if (!await refreshAiStatus()) {
                    $('ai-settings-link').focus();
                    return;
                }
                const byTraits = areaSelect.value === 'behavior';
                const picked = byTraits
                    ? traitStudents().map(student => ({ ...student, trait: traitOf(student.key) }))
                        .filter(student => student.trait.words.length > 0)
                    : [];
                // 수행평가 계획으로 쓸 때는 학생마다 고른 단계가 재료다. 번호(index)는 명단 차례다.
                const byPlan = !byTraits && assessActive();
                const planPicks = byPlan
                    ? traitStudents().map((student, index) => ({ ...student, index, levels: levelOf(student.key) }))
                    : [];
                const topics = (byTraits || byPlan) ? [] : topicsInput.value.split('\n').map(t => t.trim()).filter(Boolean);
                if (byTraits && picked.length === 0) {
                    alert('학생마다 낱말을 골라 주세요.');
                    return;
                }
                if (byPlan && !planPicks.some(student => pickedLevels(student).length > 0)) {
                    alert('학생마다 수행평가 단계를 골라 주세요.');
                    return;
                }
                if (!byTraits && !byPlan && topics.length === 0) {
                    alert('활동을 한 줄 이상 적어 주세요.');
                    topicsInput.focus();
                    return;
                }
                // 명단이 있으면 그 인원 그대로 만든다. 40에서 자르면 뒤쪽 학생들이
                // 말없이 빠진다.
                const count = roster.length > 0
                    ? roster.length
                    : Math.max(1, Math.min(40, Number(countInput.value) || 0));
                const area = currentArea();
                const sub = area.sub ? subInput.value.trim() : '';
                if (area.sub && !sub) {
                    alert(area.sub + '을(를) 적어 주세요.');
                    subInput.focus();
                    return;
                }
                if (savedResult() && !confirm('이 학기·과목에 만들어 둔 문장이 있습니다. 새로 만들면 그 문장은 사라집니다. 계속할까요?')) return;
                generatedFor = { area: area.label, semester: area.semester ? semesterSelect.value : '', subKey: area.sub || '', sub };

                generateBtn.disabled = true;
                setBusy(true);
                genStatus.className = 'status';
                genStatus.textContent = '';
                const perStudent = Array.from({ length: count }, () => []);

                const missed = [];
                try {
                    // 활동을 한 번에 다 보내면 답이 길어져 잘린다. 활동마다 따로 받아
                    // 학생별로 모은다. 그래야 한 칸에 여러 활동이 이어져 들어간다.
                    if (byTraits) {
                        // 학생마다 낱말이 다르니 여덟 명씩 묶어 한 번에 보내고 번호로 받는다.
                        const groups = [];
                        for (let i = 0; i < picked.length; i += 8) groups.push(picked.slice(i, i + 8));
                        const indexOf = new Map(traitStudents().map((student, i) => [student.key, i]));
                        for (let g = 0; g < groups.length; g += 1) {
                            setProgress(g, groups.length);
                            try {
                                const text = await window.ClassroomAI.generate(buildTraitPrompt(area, groups[g]), () => {});
                                const sentences = parseNumbered(text, groups[g].length);
                                if (sentences.length === 0) throw new Error('문장을 읽어 내지 못했습니다.');
                                groups[g].forEach((student, i) => {
                                    const at = indexOf.get(student.key);
                                    if (at != null && sentences[i]) perStudent[at].push(sentences[i]);
                                });
                            } catch (error) {
                                console.error(error);
                                missed.push({ topic: (g + 1) + '번째 묶음', why: error.message });
                            }
                        }
                    } else if (byPlan) {
                        // 수행평가마다, 같은 단계를 고른 학생끼리 묶어 한 번에 받는다. 수행평가 차례대로 돌므로
                        // 한 학생의 글에도 수행평가가 계획 순서대로 이어진다.
                        const jobs = [];
                        assessPlan.forEach(item => {
                            item.criteria.forEach(criterion => {
                                const group = planPicks.filter(student => student.levels[itemKey(item)] === criterion.label);
                                if (group.length === 0) return;
                                if (!criterion.text) { missed.push({ topic: item.element + ' · ' + criterion.label, why: '그 단계의 평가결과 문장이 비어 있습니다. 수행평가 계획에서 적어 주세요.' }); return; }
                                jobs.push({ item, criterion, group });
                            });
                        });
                        for (let j = 0; j < jobs.length; j += 1) {
                            setProgress(j, jobs.length);
                            const job = jobs[j];
                            try {
                                const text = await window.ClassroomAI.generate(buildLevelPrompt(area, sub, job.item, job.criterion, job.group.length), () => {});
                                const sentences = parseNumbered(text, job.group.length);
                                if (sentences.length === 0) throw new Error('문장을 읽어 내지 못했습니다.');
                                const order = shuffled(job.group.length);
                                job.group.forEach((student, i) => perStudent[student.index].push(sentences[order[i] % sentences.length]));
                            } catch (error) {
                                console.error(error);
                                missed.push({ topic: job.item.element + ' · ' + job.criterion.label, why: error.message });
                            }
                        }
                    } else for (let t = 0; t < topics.length; t += 1) {
                        setProgress(t, topics.length);
                        try {
                            const text = await window.ClassroomAI.generate(buildPrompt(area, sub, topics[t], count), () => {});
                            const sentences = parseNumbered(text, count);
                            if (sentences.length === 0) {
                                throw new Error('문장을 읽어 내지 못했습니다.');
                            }
                            const order = shuffled(count);
                            for (let i = 0; i < count; i += 1) {
                                // 모자라면 있는 것을 돌려 쓴다. 빈 칸으로 두는 것보다 낫다.
                                perStudent[i].push(sentences[order[i] % sentences.length]);
                            }
                        } catch (error) {
                            console.error(error);
                            missed.push({ topic: topics[t], why: error.message });
                        }
                    }

                    if (perStudent.every(list => list.length === 0)) {
                        throw new Error(missed.length > 0 ? missed[0].why : '문장을 하나도 받지 못했습니다.');
                    }

                    const items = perStudent.map((list, i) => {
                        const student = roster[i];
                        return { number: student ? student.number : String(i + 1), name: student ? student.name : '', text: list.join(' ') };
                    }).filter(item => item.text);
                    renderResult(items);
                    saveResult(items);
                    resultNote.textContent = new Date().toLocaleString('ko-KR') + '에 만든 문장입니다.';
                    if (missed.length > 0) {
                        genStatus.className = 'status error';
                        genStatus.textContent = missed.map(item => '「' + item.topic + '」').join(', ')
                            + '은(는) 받지 못해 빠졌습니다. 나머지는 아래에 있습니다. '
                            + missed[0].why;
                    } else {
                        genStatus.className = 'status';
                        genStatus.textContent = items.length + '명분을 만들었습니다.';
                    }
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (e) {
                    console.error(e);
                    genStatus.className = 'status error';
                    genStatus.textContent = '오류가 발생했습니다: ' + e.message;
                } finally {
                    generateBtn.disabled = false;
                    setBusy(false);
                }
            });

            // 「전체 복사」 글 맨 위에 어느 칸·학기·과목의 글인지 적어 둔다. 크롬 확장이 나이스 화면의
            // 교과(목)·학기와 대조해, 국어 글이 수학 칸에 들어가는 실수를 막는다. 만들 때 고른 값을 쓴다
            // (만든 뒤 과목을 바꿔 두었더라도 글은 만들 때 과목의 것이다).
            function metaLines() {
                const g = generatedFor;
                if (!g) return '';
                const out = ['칸: ' + g.area];
                if (g.semester) out.push('학기: ' + g.semester);
                if (g.sub) out.push((g.subKey === '영역' ? '영역' : '과목') + ': ' + g.sub);
                return out.join('\n') + '\n\n';
            }

            copyBtn.addEventListener('click', async () => {
                await navigator.clipboard.writeText(metaLines() + resultArea.value);
                copyBtn.textContent = '복사됨';
                setTimeout(() => { copyBtn.textContent = '전체 복사'; }, 1500);
            });
        })();
    </script>
</body>
</html>
