<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생활기록부</title>
    <style>
        :root {
            --ink: #18211d;
            --muted: #647069;
            --paper: #fffdf8;
            --canvas: #f3efe7;
            --line: #d8d2c6;
            --brand: #246b55;
            --brand-dark: #18503f;
            --shadow: 0 18px 50px rgba(41, 50, 45, 0.10);
            --danger: #b43c36;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--canvas);
            font-family: Pretendard, "Noto Sans KR", sans-serif;
        }

        button, input, select, textarea { font: inherit; }

        .account-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        
        .account-actions a {
            color: var(--brand-dark);
            font-weight: 700;
            text-decoration: none;
        }

        main {
            width: min(100% - 48px, 900px);
            margin: 0 auto;
            padding: 4px 0 60px;
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px 22px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
        }

        /* 접히는 칸. 키를 넣어 두면 닫아 두어 화면을 비워 준다. */
        details.card:not([open]) {
            padding: 10px 18px;
            margin-bottom: 12px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(41, 50, 45, 0.05);
        }
        details.card:not([open]) > summary {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0;
        }
        details.card > summary {
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 700;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        details.card > summary::-webkit-details-marker { display: none; }
        details.card > summary::after {
            content: '▾';
            margin-left: auto;
            color: var(--muted);
            font-size: 1rem;
            transition: transform 0.2s;
        }
        details.card[open] > summary::after { transform: rotate(180deg); }
        details.card[open] > summary { margin-bottom: 16px; }
        details.card > summary .sub {
            font-size: 0.88rem;
            font-weight: 400;
            color: var(--muted);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 12px 14px;
            margin-bottom: 12px;
        }
        .controls-row .form-group {
            margin-bottom: 0;
        }
        #scope-group {
            flex: 1 1 180px;
        }
        #area-group {
            flex: 1.5 1 200px;
        }
        #semester-group {
            flex: 0 0 100px;
        }
        #sub-group {
            flex: 1 1 130px;
            min-width: 120px;
        }
        #length-group {
            flex: 1 1 150px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.92rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--brand);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .roster-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        #roster-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
            background: var(--canvas);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
        }
        #roster-status:empty {
            display: none;
        }
        #roster-status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--brand);
            flex-shrink: 0;
        }
        #roster-status.error::before {
            background: var(--danger);
        }

        #manual-count-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        #manual-count-group label {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }
        #manual-count-group input {
            width: 5.5em;
            padding: 6px 10px;
        }

        @media (max-width: 560px) {
            .card-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .card-footer .btn {
                width: 100%;
            }
            .roster-meta {
                justify-content: space-between;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--brand-dark); }
        .btn:disabled { background: var(--muted); cursor: not-allowed; }
        /* 만드는 동안은 잿빛으로 죽이지 않는다. 일하고 있다는 것이 보여야 한다. */
        .btn.busy:disabled { background: var(--brand-dark); cursor: progress; }
        
        .btn-outline {
            background: transparent;
            color: var(--brand);
            border: 1px solid var(--brand);
        }
        .btn-outline:hover {
            background: rgba(36, 107, 85, 0.05);
        }

        .keyword-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .chip-btn {
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
            color: var(--ink);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip-btn:hover {
            border-color: var(--brand);
            background: var(--canvas);
        }
        .chip-btn.on {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        /* 학생별·낱말별을 오가는 두 갈래 단추 */
        .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .seg-btn {
            padding: 7px 16px;
            border: 0;
            background: #fff;
            color: var(--muted);
            font-weight: 700;
            cursor: pointer;
        }
        .seg-btn.on { background: var(--brand); color: #fff; }

        /* 수행평가 계획의 단계 고르기: 줄은 학생, 칸은 수행평가 */
        .level-wrap { overflow-x: auto; margin-top: 10px; }
        .level-table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        .level-table th, .level-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        .level-table th { font-weight: 600; color: var(--muted); font-size: 0.85rem; min-width: 9em; }
        .level-table th:first-child, .level-table td:first-child { white-space: nowrap; min-width: 0; vertical-align: middle; }
        .level-table th .all { display: block; margin-top: 4px; font-weight: 400; }
        .level-table select { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-height: 34px; font-size: 0.9rem; }
        .level-table select.empty { color: var(--muted); }
        .level-hint { font-size: 0.9rem; color: var(--muted); margin: 0 0 4px; }
        .level-hint a { color: var(--brand); font-weight: 700; }

        /* 학생 한 줄, 낱말 한 줄 */
        .pick-row {
            border-top: 1px solid var(--line);
            padding: 10px 2px;
        }
        .pick-row:first-child { border-top: 0; }
        .pick-head {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: none;
            border: 0;
            padding: 0;
            width: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
        }
        .pick-head b { min-width: 6.5em; }
        .pick-head .picked { color: var(--muted); font-size: 0.9rem; flex: 1; }
        .pick-head .count { color: var(--brand); font-weight: 700; font-size: 0.9rem; }
        .pick-body { padding: 10px 0 4px; }
        .cat { margin-bottom: 10px; }
        .cat > span {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        #result-area {
            min-height: 200px;
            line-height: 1.6;
            resize: vertical;
        }

        .status {
            margin-top: 6px;
            font-size: 0.86rem;
            color: var(--muted);
        }
        /* 계획서에서 가져오기 */
        .plan-import { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
        .plan-import .status { margin-top: 0; }
        #import-plan-dialog { border: 1px solid var(--line, #d9d4c7); border-radius: 12px; padding: 20px 22px; width: min(640px, 92vw); max-height: 86vh; }
        #import-plan-dialog::backdrop { background: rgba(20, 24, 28, 0.45); }
        #import-plan-dialog h2 { margin: 0 0 6px; font-size: 1.1rem; }
        #import-plan-meta { margin: 0 0 12px; font-size: 0.9rem; color: var(--muted); }
        #import-plan-list { display: grid; gap: 6px; max-height: 48vh; overflow: auto; margin: 0 0 14px; padding: 0; list-style: none; }
        #import-plan-list label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line, #e3ded2); border-radius: 8px; cursor: pointer; }
        #import-plan-list input { margin-top: 3px; }
        #import-plan-list small { display: block; color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
        .plan-import-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

        /* 만드는 동안 단추 안에서 도는 고리. 글보다 이것이 기다리는 마음에 낫다. */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 만든 개수만큼 차오르는 줄 */
        .progress {
            height: 4px;
            border-radius: 999px;
            background: var(--line);
            overflow: hidden;
            margin-top: 12px;
        }
        .progress > i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--brand);
            transition: width 0.4s ease;
        }
        
        .error { color: var(--danger); }
    </style>
</head>
<body>
    <header class="account-bar">
        <div class="account-actions">
            <a href="/classtools/">← 교사 도구 홈으로</a>
        </div>
        <a href="/classtools/neis-fill/" class="btn btn-outline" style="padding: 6px 16px; text-decoration: none;">안내</a>
    </header>

    <main>
        <section class="card" id="key-card">
            <h2 style="font-size:1rem; margin:0 0 8px;">AI 연결</h2>
            <p id="key-status" class="status" role="status">AI 설정 확인 중…</p>
            <a id="ai-settings-link" href="/classtools/profile#ai-settings" style="color:var(--brand);">내 정보에서 AI 설정 관리</a>
        </section>

        <!-- 생성 양식 -->
        <section class="card">
            <!-- 고른 대상에 따라 아래의 기록할 칸과 과목이 정해진다. -->
            <div class="controls-row">
                <div class="form-group" id="scope-group" style="display: none;">
                    <label for="scope-select">대상</label>
                    <select id="scope-select" class="form-control"></select>
                </div>

                <div class="form-group" id="area-group">
                    <label for="area-select">기록할 칸</label>
                    <select id="area-select" class="form-control">
                        <option value="subject">과목별 학기말 종합의견</option>
                        <option value="activity">창의적 체험활동 특기사항</option>
                        <option value="behavior">행동특성 및 종합의견</option>
                    </select>
                </div>

                <!-- 과목별 종합의견은 학기마다 따로 쓴다. 학년말에 쓰는 창체·행발에는 없다. -->
                <div class="form-group" id="semester-group" style="display: none;">
                    <label for="semester-select">학기</label>
                    <select id="semester-select" class="form-control">
                        <option value="1학기">1학기</option>
                        <option value="2학기">2학기</option>
                    </select>
                </div>

                <!-- 교과면 과목을, 창체면 영역을 하나 더 묻는다. -->
                <div class="form-group" id="sub-group" style="display: none;">
                    <label for="sub-input" id="sub-label">과목</label>
                    <select id="sub-input" class="form-control"></select>
                </div>

                <!-- 몇 자로 쓸지는 학년이 맞춰야 한다. -->
                <div class="form-group" id="length-group" style="display: none;">
                    <label for="char-target">한 학생 분량</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="number" id="char-target" class="form-control" min="20" max="2000" step="10" style="width: 7em;">
                        <span class="muted" style="color: var(--muted); font-size: 0.9rem; white-space: nowrap;">자 안팎</span>
                    </div>
                    <div class="status" id="length-status"></div>
                </div>
            </div>

            <!-- 「수행평가 계획」 메뉴에 이 학년·학기·과목의 계획이 있으면, 학생마다 단계를 고르고
                 그 단계의 평가결과 문장으로 쓴다. 계획이 없으면 아래 활동 목록으로 쓴다. -->
            <div id="assess-group" style="display: none;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <div class="seg" role="tablist">
                        <button type="button" class="seg-btn on" id="mode-plan-btn" role="tab">수행평가 계획으로</button>
                        <button type="button" class="seg-btn" id="mode-list-btn" role="tab">활동 목록으로</button>
                    </div>
                </div>
                <div id="assess-panel"></div>
                <div class="status" id="assess-status"></div>
            </div>

            <div class="form-group" id="topics-group">
                <label for="topics-input" id="topics-label">활동·특성 (한 줄에 하나씩)</label>
                <textarea id="topics-input" class="form-control" rows="3" style="resize: vertical; min-height: 72px;"></textarea>
                <div class="status" id="plan-status"></div>
                <!-- 수행평가 계획서를 올리면 제미나이가 읽어 활동 주제를 뽑아 준다. 선생님이 고른 것만 위 칸에 들어간다. -->
                <div class="plan-import" id="plan-import">
                    <button type="button" id="import-plan-btn" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.9rem;">📄 계획서에서 가져오기</button>
                    <input type="file" id="import-plan-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.hwpx,.docx,.txt" hidden>
                    <span class="status" id="import-plan-status">수행평가 계획서(PDF·사진·hwpx·docx)를 올리면 활동 주제를 대신 적어 줍니다.</span>
                </div>
            </div>
            <dialog id="import-plan-dialog" aria-labelledby="import-plan-title">
                <h2 id="import-plan-title">계획서에서 찾은 활동 주제</h2>
                <p id="import-plan-meta"></p>
                <ul id="import-plan-list"></ul>
                <div class="plan-import-actions">
                    <button type="button" id="import-plan-cancel" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.9rem;">취소</button>
                    <button type="button" id="import-plan-replace" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.9rem;">목록 바꾸기</button>
                    <button type="button" id="import-plan-append" class="btn" style="padding: 6px 16px; font-size: 0.9rem;">현재 목록에 덧붙이기</button>
                </div>
            </dialog>

            <!-- 행동특성은 학생마다 다른 글이라 학생마다 따로 받는다.
                 같은 자료를 학생 쪽에서도, 낱말 쪽에서도 고를 수 있게 둔다. -->
            <div id="traits-group" style="display: none;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <div class="seg" role="tablist">
                        <button type="button" class="seg-btn on" id="by-student-btn" role="tab">학생별</button>
                        <button type="button" class="seg-btn" id="by-word-btn" role="tab">낱말별</button>
                    </div>
                </div>
                <div id="traits-panel"></div>
                <div class="status" id="traits-status"></div>
            </div>

            <!-- 우리 반 정보 및 생성 실행 단추 -->
            <div class="card-footer">
                <div class="roster-meta">
                    <span id="roster-status" class="status"></span>
                    <div class="form-group" id="manual-count-group" style="display: none;">
                        <label for="count-input">인원수</label>
                        <input type="number" id="count-input" class="form-control" min="1" max="40" value="30">
                    </div>
                </div>
                <button type="button" id="generate-btn" class="btn" style="gap: 8px;">✨ 초안 만들기</button>
            </div>
            <div class="progress" id="gen-progress" hidden><i id="gen-bar"></i></div>
            <div id="gen-status" class="status" style="text-align: right; margin-top: 8px;"></div>
        </section>

        <!-- 결과 -->
        <section class="card" id="result-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;">
                <h2 style="margin: 0;">결과 (초안)</h2>
                <div style="display: flex; gap: 8px;">
                    <button type="button" id="copy-btn" class="btn btn-outline" style="padding: 6px 16px; font-size: 0.9rem;">전체 복사</button>
                    <button type="button" id="clear-result-btn" class="btn btn-outline" style="padding: 6px 16px; font-size: 0.9rem;" title="이 학기·과목의 문장을 이 브라우저에서 지웁니다">지우기</button>
                </div>
            </div>
            <p class="hint" style="margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.7;">
                「전체 복사」한 글은 크롬 확장 <a href="/classtools/neis-fill/" style="color: var(--brand); font-weight: 700;">NEIS 붙여넣기</a>에 붙여넣으면 NEIS 화면에 한 번에 들어갑니다.
            </p>
            <p id="result-note" class="hint" style="margin: 0 0 10px; color: var(--muted); font-size: 0.85rem;"></p>
            <div id="result-list"></div>
            <textarea id="result-area" class="form-control" style="display: none;"></textarea>
        </section>
    </main>

    <script src="/classtools/ai-client.js?v=20261006-server-key"></script>
    <script src="/assets/site-storage.js?v=20261006-1"></script>
    <script src="record-traits.js?v=1"></script>
    <script>
        (async () => {
            'use strict';

            const $ = (id) => document.getElementById(id);
            const keyStatus = $('key-status');
            const areaSelect = $('area-select');

            // 쓸 수 있는 대상(담임 학급·전담 학급·동아리). applyArea 가 첫 그리기에서
            // 바로 읽으므로 화면 요소 옆에 미리 둔다.
            let scopes = [];
            let currentScope = null;
            const areaGroup = $('area-group');
            const semesterGroup = $('semester-group');
            const semesterSelect = $('semester-select');
            const subGroup = $('sub-group');
            const subLabel = $('sub-label');
            const subInput = $('sub-input');
            const topicsLabel = $('topics-label');
            const topicsInput = $('topics-input');
            const planStatus = $('plan-status');
            const charTarget = $('char-target');
            const lengthGroup = $('length-group');
            const lengthStatus = $('length-status');
            const countInput = $('count-input');
            const scopeGroup = $('scope-group');
            const scopeSelect = $('scope-select');
            const rosterStatus = $('roster-status');
            const manualCountGroup = $('manual-count-group');
            const generateBtn = $('generate-btn');
            const genProgress = $('gen-progress');
            const genBar = $('gen-bar');

            // 기다리는 동안은 글 대신 움직이는 것을 보여 준다.
            function setBusy(busy) {
                generateBtn.replaceChildren();
                generateBtn.classList.toggle('busy', busy);
                if (busy) {
                    const ring = document.createElement('span');
                    ring.className = 'spinner';
                    generateBtn.append(ring, document.createTextNode('만드는 중'));
                    genProgress.hidden = false;
                    genBar.style.width = '0%';
                } else {
                    generateBtn.textContent = '✨ 초안 만들기';
                    genProgress.hidden = true;
                }
            }

            function setProgress(done, total) {
                genBar.style.width = Math.round((done / Math.max(total, 1)) * 100) + '%';
            }
            const genStatus = $('gen-status');
            const resultSection = $('result-section');
            const resultList = $('result-list');
            const resultArea = $('result-area');
            const resultNote = $('result-note');
            const clearResultBtn = $('clear-result-btn');
            let generatedFor = null;   // 마지막으로 만든 글의 칸·학기·과목. 「전체 복사」 표시줄에 쓴다.
            const copyBtn = $('copy-btn');

            // 기록할 칸마다 담는 것이 다르다. 교과는 무엇을 알게 되었는지를,
            // 창체는 활동에서 보인 모습을, 행발은 성품과 태도를 적는 칸이다.
            const AREAS = {
                behavior: {
                    label: '행동특성 및 종합의견',
                    item: '활동',
                    topics: '관찰한 특성·활동 (한 줄에 하나씩)',
                    example: '모둠 활동\n아침 독서\n쉬는 시간 모습',
                    rule: '학생의 행동 특성과 학교생활 모습을 담는 칸입니다. 성품과 태도가 드러나게 씁니다.'
                },
                subject: {
                    label: '과목별 학기말 종합의견',
                    semester: true,
                    item: '수행평가',
                    sub: '과목',
                    // 나이스 학기말종합의견 화면의 교과(목) 순서와 같게 둔다(3~6학년). 1·2학년의 바른 생활·슬기로운 생활·즐거운 생활은
                    // 한 칸에 한 번에 쓰고, 생활기록부에도 세 이름을 이은 한 교과명으로 찍히므로 그 이름 그대로 맨 뒤에 둔다.
                    subList: ['국어', '사회', '도덕', '수학', '과학', '실과', '체육', '음악', '미술', '영어', '바른 생활, 슬기로운 생활, 즐거운 생활'],
                    topics: '이번 학기에 실시한 수행평가 (한 줄에 하나씩)',
                    example: '분수의 덧셈과 뺄셈 계산하기\n직사각형과 삼각형의 넓이 구하기\n실생활 문제를 식으로 나타내고 해결하기',
                    rule: '교과 학습에서 무엇을 이해하고 무엇을 할 수 있게 되었는지를 담는 칸입니다. 성품보다 학습 내용과 수행이 드러나게 씁니다.'
                },
                activity: {
                    label: '창의적 체험활동 특기사항',
                    item: '활동',
                    sub: '영역',
                    subList: ['자율·자치활동', '동아리활동', '진로활동', '봉사활동'],
                    // 괄호에 실제로 한 일을 적으면 그만큼만 문장에 쓴다. 이름만 적으면 이름까지만 쓴다.
                    topics: '참여한 활동 (한 줄에 하나씩, 실제로 한 일은 괄호에)',
                    example: '독도교육(영상 시청, 다짐 카드 쓰기)\n야외 안전 교육\n학급 자치회 활동',
                    rule: '활동에 참여한 모습과 그 과정에서 보인 태도를 담는 칸입니다.'
                }
            };

            function currentArea() {
                return AREAS[areaSelect.value] || AREAS.subject;
            }

            // 학기·과목마다 적어 둔 것이 다르다. 한 과목 쓰다 다른 과목으로 옮겼다고
            // 앞서 적은 수행평가가 날아가면 학기 내내 다시 적어야 한다.
            let topicsKey = '';

            function topicsStoreKey() {
                const area = currentArea();
                const semester = area.semester ? semesterSelect.value : '';
                const sub = area.sub ? subInput.value.trim() : '';
                return 'record_topics:' + areaSelect.value + ':' + semester + ':' + sub;
            }

            function saveTopics() {
                if (topicsKey) store.set(topicsKey, topicsInput.value);
            }

            // 수행평가·활동 이름은 학년이 함께 쓰는 것이다. 6학년 국어 2학기 수행평가는
            // 6학년 선생님이 다 같은 것을 쓰므로 한 사람이 적으면 나머지가 가져다 쓰고,
            // 잘못 적혔으면 옆 반 선생님이 고친다. 그래서 브라우저가 아니라 서버에 둔다.
            // 학년을 모르면(명단을 못 불러오면) 예전처럼 이 브라우저에만 남긴다.
            let planSaveTimer = null;
            let planLoadToken = 0;

            // 행동특성은 목록을 함께 쓰지 않고 분량만 함께 쓴다.
            const DEFAULT_CHARS = { behavior: 300 };

            function planQuery() {
                const area = currentArea();
                if (!currentScope || !currentScope.grade) return null;
                const byTraits = areaSelect.value === 'behavior';
                return {
                    year: new Date().getFullYear(),
                    grade: currentScope.grade,
                    area: areaSelect.value,
                    semester: (!byTraits && area.semester) ? semesterSelect.value : '',
                    subject: (!byTraits && area.sub) ? subInput.value.trim() : ''
                };
            }

            function targetChars() {
                const n = Number(charTarget.value);
                return (n >= 20 && n <= 2000) ? Math.round(n) : DEFAULT_CHARS.behavior;
            }

            async function loadPlan() {
                const key = planQuery();
                if (!key) return false;
                const token = ++planLoadToken;
                try {
                    const res = await fetch('/api/teacher/record-plan?' + new URLSearchParams(key));
                    if (!res.ok) return false;
                    const body = await res.json();
                    if (token !== planLoadToken) return true;   // 그새 다른 과목으로 옮겼다
                    if (areaSelect.value === 'behavior') {
                        charTarget.value = body.charTarget || DEFAULT_CHARS.behavior;
                        lengthStatus.textContent = body.charTarget
                            ? '학년이 함께 쓰는 분량입니다.'
                            : '아직 정하지 않았습니다. 적어 두면 같은 학년 선생님도 씁니다.';
                        return false;   // 목록은 행발에 없다
                    }
                    topicsInput.value = body.items || '';
                    planStatus.textContent = body.updatedAt
                        ? (body.updatedByName ? body.updatedByName + ' 선생님이 ' : '')
                            + new Date(body.updatedAt).toLocaleDateString('ko-KR') + '에 적은 것입니다. 고치면 학년이 함께 씁니다.'
                        : '학년이 함께 쓰는 목록입니다. 적어 두면 같은 학년 선생님도 씁니다.';
                    return true;
                } catch (_) {
                    return false;
                }
            }

            function savePlan() {
                const key = planQuery();
                if (!key) return;
                clearTimeout(planSaveTimer);
                planSaveTimer = setTimeout(async () => {
                    try {
                        const res = await fetch('/api/teacher/record-plan', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(Object.assign(
                                areaSelect.value === 'behavior'
                                    ? { items: '', charTarget: targetChars() }
                                    : { items: topicsInput.value },
                                key))
                        });
                        if (res.ok) {
                            const where = areaSelect.value === 'behavior' ? lengthStatus : planStatus;
                            where.textContent = '학년이 함께 쓰도록 저장했습니다.';
                        }
                    } catch (_) { /* 못 보내면 이 브라우저 것만 남는다 */ }
                }, 800);
            }

            async function swapTopics() {
                planStatus.textContent = '';
                // 학년을 모르면 서버 것이 없다. 그래도 분량 칸은 기본값으로 채워 둔다.
                charTarget.value = DEFAULT_CHARS.behavior;
                lengthStatus.textContent = '';
                if (await loadPlan()) return;
                swapTopicsLocal();
            }

            function swapTopicsLocal() {
                saveTopics();
                topicsKey = topicsStoreKey();
                topicsInput.value = store.get(topicsKey) || '';
            }

            // ── 만든 문장 남기기 ──────────────────────────────────────────
            // 만든 문장은 학기·과목·반마다 따로 내 계정의 서버 저장 공간에 남긴다. 페이지를 나갔다 와도,
            // 다른 컴퓨터에서 열어도 그대로 있고, 학기·과목·반을 바꾸면 그쪽에 만들어 둔 것으로 바뀐다.
            function resultStoreKey() {
                const area = currentArea();
                const semester = area.semester ? semesterSelect.value : '';
                const sub = area.sub ? subInput.value.trim() : '';
                return 'record_result:' + currentClassId + ':' + areaSelect.value + ':' + semester + ':' + sub;
            }

            function saveResult(items, at) {
                store.set(resultStoreKey(), JSON.stringify({ at: at || Date.now(), meta: generatedFor, items }));
            }

            function savedResult() {
                try {
                    const saved = JSON.parse(store.get(resultStoreKey()) || 'null');
                    return (saved && Array.isArray(saved.items) && saved.items.length) ? saved : null;
                } catch (_) { return null; }
            }

            function swapResult() {
                const saved = savedResult();
                if (saved) {
                    generatedFor = saved.meta || null;
                    renderResult(saved.items, saved.at);
                    resultNote.textContent = new Date(saved.at).toLocaleString('ko-KR') + '에 만든 문장입니다.';
                } else {
                    generatedFor = null;
                    shownItems = [];
                    resultList.replaceChildren();
                    resultArea.value = '';
                    resultNote.textContent = '';
                    resultSection.style.display = 'none';
                }
            }

            function clearResult() {
                store.remove(resultStoreKey());
                swapResult();
            }

            function applyArea() {
                // 고른 대상이 쓸 수 있는 칸만 남긴다. 전담이면 교과 하나, 동아리면 창체 하나다.
                const allowed = scopeAreas(currentScope);
                Array.from(areaSelect.options).forEach(opt => { opt.hidden = !allowed.includes(opt.value); });
                if (!allowed.includes(areaSelect.value)) areaSelect.value = allowed[0];
                areaGroup.style.display = allowed.length > 1 ? '' : 'none';

                const area = currentArea();
                // 분량을 학년이 맞춰야 하는 것은 행동특성뿐이다. 교과·창체는 예전 그대로 둔다.
                lengthGroup.style.display = allowed.includes('behavior') && areaSelect.value === 'behavior' ? '' : 'none';
                topicsLabel.textContent = area.topics;
                topicsInput.placeholder = area.example;
                semesterGroup.style.display = area.semester ? '' : 'none';
                const subList = scopeSubList(currentScope, area);
                if (area.sub && subList.length) {
                    // 고를 것이 하나뿐이면(전담 한 과목, 동아리) 칸을 보여 주지 않는다.
                    subGroup.style.display = subList.length > 1 ? '' : 'none';
                    subLabel.textContent = area.sub;
                    // 칸을 다시 채우면 고른 것이 풀린다. 쓰던 것이 목록에 있으면 되살린다.
                    const chosen = subInput.value;
                    subInput.replaceChildren(...subList.map(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        return opt;
                    }));
                    if (subList.includes(chosen)) subInput.value = chosen;
                } else {
                    subGroup.style.display = 'none';
                    subInput.replaceChildren();
                }
            }
            areaSelect.addEventListener('change', () => { applyArea(); swapTopics(); swapResult(); renderTraits(); loadAssessment(); });
            semesterSelect.addEventListener('change', () => { swapTopics(); swapResult(); loadAssessment(); });
            subInput.addEventListener('change', () => { swapTopics(); swapResult(); loadAssessment(); });
            clearResultBtn.addEventListener('click', () => {
                if (confirm('이 학기·과목의 문장을 이 브라우저에서 지웁니다. 나이스에 이미 넣은 글은 그대로입니다. 지울까요?')) clearResult();
            });
            topicsInput.addEventListener('input', () => { saveTopics(); savePlan(); });

            // ── 계획서에서 가져오기 ──────────────────────────────────────
            // 파일은 서버로 보내고, 서버가 선생님 키로 제미나이에 물어 활동 주제 목록을 받아 온다.
            // 받은 목록은 선생님이 고르고 고친 뒤에야 위 칸에 들어간다.
            const importBtn = $('import-plan-btn');
            const importFile = $('import-plan-file');
            const importStatus = $('import-plan-status');
            const importDialog = $('import-plan-dialog');
            const importList = $('import-plan-list');
            const importMeta = $('import-plan-meta');
            const IMPORT_DEFAULT_HINT = importStatus.textContent;
            const MAX_IMPORT_BYTES = 20 * 1024 * 1024;

            function importConditions() {
                const area = currentArea();
                return {
                    area: areaSelect.value,
                    subject: area.sub ? subInput.value.trim() : '',
                    semester: area.semester ? semesterSelect.value : '',
                    grade: currentScope && currentScope.grade ? String(currentScope.grade) : ''
                };
            }

            importBtn.addEventListener('click', async () => {
                try {
                    await window.ClassroomAI.init();
                } catch (error) {
                    importStatus.textContent = error.message;
                    return;
                }
                if (!window.ClassroomAI.hasKey()) {
                    importStatus.textContent = '내 정보의 AI 설정에서 API 키를 먼저 등록해 주세요.';
                    return;
                }
                importFile.value = '';
                importFile.click();
            });

            importFile.addEventListener('change', async () => {
                const file = importFile.files && importFile.files[0];
                if (!file) return;
                if (file.size > MAX_IMPORT_BYTES) { importStatus.textContent = '20MB가 넘는 파일은 올릴 수 없습니다.'; return; }
                importBtn.disabled = true;
                importStatus.textContent = file.name + ' 읽는 중… 제미나이가 활동 주제를 뽑습니다.';
                try {
                    const res = await fetch('/api/teacher-ai/extract-topics?' + new URLSearchParams(importConditions()), {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name) },
                        body: file
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data.message || '파일을 읽지 못했습니다 (' + res.status + ').');
                    if (!Array.isArray(data.topics) || data.topics.length === 0) throw new Error(data.note || '문서에서 활동 주제를 찾지 못했습니다. 조건(과목·학기)을 확인하거나 다른 파일을 올려 보세요.');
                    renderImportList(data);
                    importDialog.showModal();
                    importStatus.textContent = IMPORT_DEFAULT_HINT;
                } catch (error) {
                    importStatus.textContent = error.message;
                } finally {
                    importBtn.disabled = false;
                }
            });

            function renderImportList(data) {
                const where = [data.subject, data.semester].filter(Boolean).join(' · ');
                importMeta.textContent = (where ? where + ' — ' : '') + data.topics.length + '개를 찾았습니다. 넣을 것만 고르세요.' + (data.note ? ' ' + data.note : '');
                importList.replaceChildren(...data.topics.map((topic, index) => {
                    const label = document.createElement('label');
                    const box = document.createElement('input');
                    box.type = 'checkbox'; box.checked = true; box.value = String(index);
                    const text = document.createElement('span');
                    text.textContent = topic.title;
                    if (topic.detail) { const small = document.createElement('small'); small.textContent = topic.detail; text.appendChild(small); }
                    label.append(box, text);
                    return label;
                }));
                importList.dataset.topics = JSON.stringify(data.topics.map(topic => topic.title));
            }

            function applyImported(mode) {
                const titles = JSON.parse(importList.dataset.topics || '[]');
                const picked = [...importList.querySelectorAll('input:checked')].map(box => titles[Number(box.value)]).filter(Boolean);
                if (picked.length === 0) { importDialog.close(); return; }
                const existing = topicsInput.value.split('\n').map(line => line.trim()).filter(Boolean);
                const merged = mode === 'replace' ? picked : existing.concat(picked.filter(title => !existing.includes(title)));
                topicsInput.value = merged.join('\n');
                topicsInput.dispatchEvent(new Event('input', { bubbles: true }));   // 저장·학년 공유 계획에 반영
                importDialog.close();
                importStatus.textContent = picked.length + '개를 ' + (mode === 'replace' ? '목록에 넣었습니다.' : '덧붙였습니다.') + ' 필요하면 위 칸에서 고치세요.';
                topicsInput.focus();
            }
            $('import-plan-append').addEventListener('click', () => applyImported('append'));
            $('import-plan-replace').addEventListener('click', () => applyImported('replace'));
            $('import-plan-cancel').addEventListener('click', () => importDialog.close());
            charTarget.addEventListener('input', savePlan);
            applyArea();

            // ── API 키 ─────────────────────────────────────────────────────
            // 활동 주제·만든 문장·특성은 계정별 서버 저장 공간에 둔다. 학생 이름이 섞인 글이라
            // 공용 컴퓨터의 브라우저에 남기지 않는다(2026-10-06). 로그인이 없으면 이 탭 안에서만 기억한다.
            const siteStore = await SiteStorage.open('record-ai');
            try {
                // 예전에 브라우저에 두던 것을 한 번 옮기고 지운다.
                siteStore.adopt(Object.keys(localStorage).filter((key) => key.startsWith('record_'))
                    .map((key) => ({ localKey: key, item: key, parse: (raw) => raw })));
            } catch (_) {}
            const store = {
                get(key) { const value = siteStore.get(key); return value === undefined ? null : String(value); },
                set(key, value) { siteStore.set(key, String(value)); },
                remove(key) { siteStore.remove(key); }
            };

            // 학기 기본값: 8월~1월은 2학기, 그 밖은 1학기. 「전체 복사」 글의 「학기:」 표시가 나이스 화면의 학기와
            // 맞아야 확장이 넣으므로, 늘 1학기로 시작하면 2학기에 만든 글이 번번이 막힌다.
            const month = new Date().getMonth() + 1;
            semesterSelect.value = (month >= 8 || month <= 1) ? '2학기' : '1학기';

            // store 를 갖춘 뒤라야 적어 둔 것을 되살릴 수 있다.
            swapTopics();

            async function refreshAiStatus() {
                try {
                    await window.ClassroomAI.init();
                    const hasKey = window.ClassroomAI.hasKey();
                    keyStatus.textContent = hasKey ? '내 정보에 등록된 Gemini API 키를 사용합니다.'
                        : '내 정보의 AI 설정에서 API 키를 등록해 주세요.';
                    return hasKey;
                } catch (error) { keyStatus.textContent = error.message; return false; }
            }
            refreshAiStatus();
            window.addEventListener('focus', refreshAiStatus);
            window.addEventListener('storage', refreshAiStatus);

            // ── 명단 ───────────────────────────────────────────────────────
            // 이름은 이 브라우저 안에만 머문다. 구글로는 인원수만 나가고, 받아 온
            // 문장을 여기서 번호대로 이름에 붙인다.
            let roster = [];
            let currentClassId = '';   // 지금 보는 반. 만든 문장을 반마다 따로 남기는 데 쓴다(담임 학급 하나면 빈 값).

            // 명단은 굳이 늘어놓지 않는다. 몇 명인지만 알려 주고,
            // 이름은 아래 결과에서 문장과 함께 보인다.
            function renderRoster() {
                manualCountGroup.style.display = roster.length > 0 ? 'none' : '';
            }

            // 쓸 수 있는 대상. 나이스가 그렇듯 한 학생을 담임과 전담·동아리 교사가
            // 나누어 쓰므로, 여기서도 "누구에게" 가 아니라 "어느 자격으로" 를 고른다.
            //   담임 학급  → 세 칸 모두, 과목은 전 과목
            //   전담 학급  → 과목별 학기말 종합의견만, 과목은 맡은 것으로 고정
            //   동아리     → 창의적 체험활동 특기사항만, 영역은 동아리활동으로 고정
            function scopeAreas(scope) {
                if (!scope) return ['subject', 'activity', 'behavior'];
                if (scope.kind === 'club') return ['activity'];
                if (scope.kind === 'teaching') return ['subject'];
                return ['subject', 'activity', 'behavior'];
            }

            function scopeSubList(scope, area) {
                if (scope && scope.kind === 'club' && area.sub) return ['동아리활동'];
                if (scope && scope.kind === 'teaching' && area.sub) return scope.subjects.slice();
                return area.subList ? area.subList.slice() : [];
            }

            async function loadRoster(scope) {
                currentScope = scope || null;
                currentClassId = scope ? scope.key : '';
                rosterStatus.className = 'status';
                rosterStatus.textContent = '명단을 불러오는 중…';
                try {
                    const url = (scope && scope.kind === 'club')
                        ? '/api/teacher/groups/' + encodeURIComponent(scope.groupId) + '/students'
                        : '/api/teacher/class' + (scope && scope.classId ? '?classId=' + encodeURIComponent(scope.classId) : '');
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('명단을 불러오지 못했습니다.');
                    const body = await res.json();
                    const list = (scope && scope.kind === 'club') ? (body.students || []) : ((body.classroom || {}).students || []);
                    roster = list.map(student => ({
                        number: String(student.number || ''),
                        name: String(student.name || '')
                    })).filter(student => student.name);
                    if (roster.length === 0) {
                        rosterStatus.className = 'status error';
                        rosterStatus.textContent = '등록된 학생이 없습니다. 인원수를 직접 적어 주세요.';
                    } else {
                        rosterStatus.className = 'status';
                        rosterStatus.textContent = (scope ? scope.label + ' ' : '') + roster.length + '명';
                    }
                } catch (e) {
                    roster = [];
                    rosterStatus.className = 'status error';
                    rosterStatus.textContent = '명단을 불러오지 못했습니다. 인원수를 직접 적어 주세요.';
                }
                renderRoster();
                applyArea();    // 대상이 바뀌면 쓸 수 있는 칸과 과목도 바뀐다
                swapTopics();   // 학년이 정해져야 학년 공통 목록을 불러온다
                loadTraits();   // 낱말은 반마다 따로 남는다
                renderTraits();
                swapResult();   // 대상이 정해진 뒤에 거기에 만들어 둔 문장을 되살린다
                loadAssessment();   // 학년·학기·과목이 정해져야 수행평가 계획을 찾는다
            }

            function buildScopes(classes, groups) {
                const out = [];
                classes.forEach(item => {
                    const label = item.grade + '학년 ' + item.classNumber + '반';
                    const subjects = (item.myTeachingSubjects || []).filter(Boolean);
                    if (item.isMyTeaching && subjects.length) {
                        // 전담으로 들어가는 반. 맡은 과목만 쓸 수 있다.
                        out.push({
                            kind: 'teaching', key: 'c' + item.id, classId: item.id, grade: item.grade,
                            label: label + ' · ' + subjects.join('·'), subjects
                        });
                    } else {
                        out.push({ kind: 'homeroom', key: 'c' + item.id, classId: item.id, grade: item.grade, label: label, subjects: [] });
                    }
                });
                groups.forEach(g => {
                    if (g.group_type === 'homeroom') return;   // 담임 학급은 위에서 이미 넣었다
                    if (g.group_type !== 'club') return;        // 생기부에 쓰는 것은 동아리뿐이다
                    out.push({
                        kind: 'club', key: 'g' + g.id, groupId: g.id,
                        label: g.group_name, subjects: []
                    });
                });
                return out;
            }

            async function loadScopes() {
                let classes = [];
                let groups = [];
                try {
                    const res = await fetch('/api/teacher/available-classes');
                    if (res.ok) classes = (await res.json()).classes || [];
                } catch (_) { /* 담임 학급 하나로 본다 */ }
                try {
                    const res = await fetch('/api/teacher/groups');
                    if (res.ok) groups = (await res.json()).groups || [];
                } catch (_) { /* 동아리가 없으면 없는 대로 */ }

                scopes = buildScopes(classes, groups);
                if (scopes.length > 1) {
                    scopeGroup.style.display = '';
                    scopeSelect.replaceChildren(...scopes.map((scope, i) => {
                        const opt = document.createElement('option');
                        opt.value = String(i);
                        opt.textContent = scope.label;
                        return opt;
                    }));
                    scopeSelect.addEventListener('change', () => loadRoster(scopes[Number(scopeSelect.value)]));
                }
                await loadRoster(scopes[0] || null);
            }
            loadScopes();

            // ── 학생마다 낱말 고르기 ───────────────────────────────────────
            // 행동특성·창체·교과 모두 학생마다 다른 글이다. 갈래별 특성(책임감·배려심…)을
            // 학생마다 고르면, 그 특성의 키워드를 AI 에게 말 주머니로 넘겨 학생마다 다른
            // 말로 쓰게 한다. 말 주머니는 record-traits.js 에 있다.
            const BANK = window.ClassjTraitBank;

            const traitsGroup = $('traits-group');
            const traitsPanel = $('traits-panel');
            const traitsStatus = $('traits-status');
            const topicsGroup = $('topics-group');
            const byStudentBtn = $('by-student-btn');
            const byWordBtn = $('by-word-btn');

            let traits = {};          // 학생 열쇠 → { words: [], note: '' }
            let traitView = 'student';
            let openRow = null;       // 지금 펼쳐 둔 줄

            function traitsStoreKey() {
                return 'record_traits:' + currentClassId;
            }

            function studentKey(student, index) {
                return String(student ? student.number : index + 1);
            }

            function traitOf(key) {
                if (!traits[key]) traits[key] = { words: [], note: '' };
                return traits[key];
            }

            // 지금 칸에서 보여 줄 갈래. [갈래 이름, [특성 이름…]] 꼴로 돌려준다.
            function traitGroups() {
                const groups = BANK.groupsFor(areaSelect.value)
                    .map(group => [group.name, group.traits.map(trait => trait.name)]);
                const more = extraWords();
                return more.length ? groups.concat([['더 넣은 낱말', more]]) : groups;
            }

            function extraWords() {
                const known = new Set(BANK.GROUPS.flatMap(g => g.traits.map(t => t.name)));
                const more = [];
                Object.values(traits).forEach(t => (t.words || []).forEach(w => {
                    if (!known.has(w) && !more.includes(w)) more.push(w);
                }));
                return more;
            }

            function saveTraits() {
                store.set(traitsStoreKey(), JSON.stringify(traits));
            }

            function loadTraits() {
                try { traits = JSON.parse(store.get(traitsStoreKey()) || '{}') || {}; } catch (_) { traits = {}; }
                openRow = null;
            }

            function traitStudents() {
                if (roster.length > 0) return roster.map((s, i) => ({ key: studentKey(s, i), label: s.number + '번 ' + s.name }));
                const count = Math.max(1, Math.min(40, Number(countInput.value) || 0));
                return Array.from({ length: count }, (_, i) => ({ key: String(i + 1), label: (i + 1) + '번' }));
            }

            function chip(text, on, onClick) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'chip-btn' + (on ? ' on' : '');
                b.textContent = text;
                b.addEventListener('click', onClick);
                return b;
            }

            function pickRow(id, title, picked, body) {
                const row = document.createElement('div');
                row.className = 'pick-row';
                const head = document.createElement('button');
                head.type = 'button';
                head.className = 'pick-head';
                const name = document.createElement('b');
                name.textContent = title;
                const shown = document.createElement('span');
                shown.className = 'picked';
                shown.textContent = picked.length ? picked.join(', ') : '';
                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = picked.length ? picked.length + '개' : '';
                head.append(name, shown, count);
                head.addEventListener('click', () => {
                    openRow = (openRow === id) ? null : id;
                    renderTraits();
                });
                row.append(head);
                if (openRow === id) {
                    const wrap = document.createElement('div');
                    wrap.className = 'pick-body';
                    wrap.append(...body());
                    row.append(wrap);
                }
                return row;
            }

            function wordChips(words, isOn, onPick) {
                const chips = document.createElement('div');
                chips.className = 'keyword-chips';
                chips.style.marginBottom = '0';
                words.forEach(word => chips.append(chip(word, isOn(word), () => onPick(word))));
                return chips;
            }

            // 학생 쪽에서 고르기: 한 학생을 열고 낱말을 누른다.
            function renderByStudent() {
                return traitStudents().map(student => {
                    const t = traitOf(student.key);
                    return pickRow('s:' + student.key, student.label, t.words, () => {
                        const parts = [];
                        traitGroups().forEach(pair => {
                            const title = pair[0];
                            const words = pair[1];
                            if (!words.length) return;
                            const box = document.createElement('div');
                            box.className = 'cat';
                            const label = document.createElement('span');
                            label.textContent = title;
                            box.append(label, wordChips(words,
                                word => t.words.includes(word),
                                word => toggleWord(student.key, word)));
                            parts.push(box);
                        });

                        // 고른 특성마다 그 말 주머니를 보여 준다. 굳이 고르지 않으면
                        // AI 가 주머니 안에서 학생마다 다른 말을 골라 쓴다.
                        t.words.forEach(word => {
                            const words = BANK.wordsOf(word);
                            if (!words.length) return;
                            const box = document.createElement('div');
                            box.className = 'cat';
                            const label = document.createElement('span');
                            label.textContent = word + ' — 꼭 넣을 말이 있으면 고르세요';
                            box.append(label, wordChips(words,
                                w => (t.picks || []).includes(w),
                                w => togglePick(student.key, w)));
                            parts.push(box);
                        });

                        const add = document.createElement('input');
                        add.type = 'text';
                        add.className = 'form-control';
                        add.placeholder = '낱말 더 넣기 (엔터)';
                        add.style.marginBottom = '10px';
                        add.addEventListener('keydown', (e) => {
                            if (e.key !== 'Enter') return;
                            e.preventDefault();
                            const word = add.value.trim();
                            if (word) toggleWord(student.key, word);
                        });
                        parts.push(add);

                        const note = document.createElement('input');
                        note.type = 'text';
                        note.className = 'form-control';
                        note.placeholder = '이 학생만의 한 줄 (예: 학급 문고를 일 년 내내 정리함)';
                        note.value = t.note || '';
                        note.addEventListener('input', () => { t.note = note.value; saveTraits(); });
                        parts.push(note);
                        return parts;
                    });
                });
            }

            // 낱말 쪽에서 고르기: 낱말 하나를 열고 해당하는 학생을 누른다.
            function renderByWord() {
                const students = traitStudents();
                const rows = [];
                traitGroups().forEach(pair => {
                    const title = pair[0];
                    const words = pair[1];
                    if (!words.length) return;
                    const head = document.createElement('div');
                    head.className = 'cat';
                    head.style.margin = '14px 0 2px';
                    const label = document.createElement('span');
                    label.textContent = title;
                    head.append(label);
                    rows.push(head);
                    words.forEach(word => {
                        const picked = students.filter(s => traitOf(s.key).words.includes(word)).map(s => s.label);
                        rows.push(pickRow('w:' + word, word, picked, () => [
                            wordChips(students.map(s => s.label),
                                label2 => {
                                    const found = students.find(s => s.label === label2);
                                    return !!found && traitOf(found.key).words.includes(word);
                                },
                                label2 => {
                                    const found = students.find(s => s.label === label2);
                                    if (found) toggleWord(found.key, word);
                                })
                        ]));
                    });
                });
                return rows;
            }

            // 키워드는 '꼭 넣을 말'로 따로 둔다. 안 고르면 AI 가 주머니에서 알아서 쓴다.
            function togglePick(key, word) {
                const t = traitOf(key);
                if (!t.picks) t.picks = [];
                const at = t.picks.indexOf(word);
                if (at >= 0) t.picks.splice(at, 1);
                else t.picks.push(word);
                saveTraits();
                renderTraits();
            }

            function toggleWord(key, word) {
                const t = traitOf(key);
                const at = t.words.indexOf(word);
                if (at >= 0) {
                    t.words.splice(at, 1);
                    const gone = BANK.wordsOf(word);
                    if (t.picks) t.picks = t.picks.filter(pick => !gone.includes(pick));
                } else {
                    t.words.push(word);
                }
                saveTraits();
                renderTraits();
            }

            function renderTraits() {
                // 낱말 판은 행동특성에서만 쓴다. 교과·창체는 실제로 한 수행평가·활동
                // 이름을 적는 것이 맞고, 그 이름이 문장에 들어가야 한다.
                const on = areaSelect.value === 'behavior';
                traitsGroup.style.display = on ? '' : 'none';
                topicsGroup.style.display = on ? 'none' : '';
                if (!on) return;
                byStudentBtn.classList.toggle('on', traitView === 'student');
                byWordBtn.classList.toggle('on', traitView === 'word');
                traitsPanel.replaceChildren(...(traitView === 'student' ? renderByStudent() : renderByWord()));
                const students = traitStudents();
                const done = students.filter(s => traitOf(s.key).words.length > 0).length;
                traitsStatus.className = done === students.length ? 'status' : 'status error';
                traitsStatus.textContent = students.length + '명 가운데 ' + done + '명 골랐습니다'
                    + (done === students.length ? '.' : '. 낱말이 없는 학생은 문장을 만들지 않습니다.');
            }

            byStudentBtn.addEventListener('click', () => { traitView = 'student'; openRow = null; renderTraits(); });
            byWordBtn.addEventListener('click', () => { traitView = 'word'; openRow = null; renderTraits(); });

            // ── 수행평가 계획으로 쓰기 ─────────────────────────────────────
            // 「수행평가 계획」 메뉴에서 학년이 세운 계획(영역·성취기준·평가요소·단계별 평가결과)을 읽어 온다.
            // 학생마다 수행평가별 단계를 고르면, 그 단계의 평가결과 문장을 학생마다 표현만 조금씩 달리해 쓴다.
            // 단계는 반·학기·과목마다 내 계정의 서버 저장 공간에 남는다.
            const assessGroup = $('assess-group');
            const assessPanel = $('assess-panel');
            const assessStatus = $('assess-status');
            const modePlanBtn = $('mode-plan-btn');
            const modeListBtn = $('mode-list-btn');
            let assessPlan = null;      // 지금 학년·학기·과목의 계획 항목들(평가요소와 평가결과 문장이 있는 것만)
            let assessMode = true;      // 계획이 있을 때 계획으로 쓸지, 활동 목록으로 쓸지
            let levels = {};            // 학생 열쇠 → { 수행평가 열쇠: 단계 이름 }
            let assessLoadToken = 0;

            function assessAvailable() { return areaSelect.value === 'subject' && Array.isArray(assessPlan) && assessPlan.length > 0; }
            function assessActive() { return assessAvailable() && assessMode; }
            function itemKey(item) { return item.element; }
            function levelsStoreKey() { return 'record_levels:' + currentClassId + ':' + semesterSelect.value + ':' + subInput.value.trim(); }
            function loadLevels() { try { levels = JSON.parse(store.get(levelsStoreKey()) || '{}') || {}; } catch (_) { levels = {}; } }
            function saveLevels() { store.set(levelsStoreKey(), JSON.stringify(levels)); }
            function levelOf(key) { if (!levels[key]) levels[key] = {}; return levels[key]; }

            async function loadAssessment() {
                const token = ++assessLoadToken;
                assessPlan = null;
                renderAssess();
                const subject = subInput.value.trim();
                const semester = parseInt(semesterSelect.value, 10);
                if (areaSelect.value !== 'subject' || !currentScope || !currentScope.grade || !subject || !semester) return;
                // 1·2학년의 '바른 생활, 슬기로운 생활, 즐거운 생활'은 계획이 교과마다 따로 있어 셋을 이어 붙인다.
                const names = subject.split(',').map(name => name.trim()).filter(Boolean);
                let items = [];
                try {
                    const lists = await Promise.all(names.map(async (name) => {
                        const query = new URLSearchParams({ year: new Date().getFullYear(), grade: currentScope.grade, semester, subject: name });
                        const res = await fetch('/api/teacher/assessment-plans?' + query);
                        if (!res.ok) return [];
                        return ((await res.json()).items || []);
                    }));
                    items = lists.flat();
                } catch (_) { items = []; }
                if (token !== assessLoadToken) return;   // 그새 다른 과목으로 옮겼다
                assessPlan = items.filter(item => item.element && Array.isArray(item.criteria) && item.criteria.some(c => c.text));
                loadLevels();
                renderAssess();
            }

            function renderAssess() {
                const available = assessAvailable();
                assessGroup.style.display = available ? '' : 'none';
                if (areaSelect.value !== 'behavior') topicsGroup.style.display = (available && assessMode) ? 'none' : '';
                if (!available || !assessMode) {
                    assessPanel.replaceChildren();
                    assessStatus.textContent = '';
                    if (available) { modePlanBtn.classList.remove('on'); modeListBtn.classList.add('on'); }
                    return;
                }
                modePlanBtn.classList.add('on');
                modeListBtn.classList.remove('on');

                const students = traitStudents();
                const hint = document.createElement('p');
                hint.className = 'level-hint';
                hint.append('「수행평가 계획」의 ' + assessPlan.length + '개 평가입니다. 학생마다 단계를 고르면 그 단계의 평가결과 문장으로 씁니다. ');
                const link = document.createElement('a');
                link.href = '/classtools/assessment-plan/plan.html';
                link.textContent = '계획 고치기';
                hint.append(link);

                const table = document.createElement('table');
                table.className = 'level-table';
                const head = document.createElement('tr');
                head.append(Object.assign(document.createElement('th'), { textContent: '학생' }));
                assessPlan.forEach(item => {
                    const th = document.createElement('th');
                    th.append(item.element);
                    // 한 단계로 다 맞춰 두고 몇 명만 바꾸는 것이 보통이라, 칸마다 '모두' 를 둔다.
                    const all = document.createElement('select');
                    all.className = 'all';
                    all.setAttribute('aria-label', item.element + ' 모두 같은 단계로');
                    all.append(new Option('모두 →', ''));
                    item.criteria.forEach(c => all.append(new Option(c.label, c.label)));
                    all.addEventListener('change', () => {
                        if (!all.value) return;
                        students.forEach(s => { levelOf(s.key)[itemKey(item)] = all.value; });
                        saveLevels();
                        renderAssess();
                    });
                    th.append(all);
                    head.append(th);
                });
                const thead = document.createElement('thead');
                thead.append(head);
                const tbody = document.createElement('tbody');
                students.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.append(Object.assign(document.createElement('td'), { textContent: s.label }));
                    assessPlan.forEach(item => {
                        const td = document.createElement('td');
                        const select = document.createElement('select');
                        select.setAttribute('aria-label', s.label + ' ' + item.element);
                        select.append(new Option('—', ''));
                        item.criteria.forEach(c => select.append(new Option(c.label, c.label)));
                        const chosen = levelOf(s.key)[itemKey(item)] || '';
                        select.value = item.criteria.some(c => c.label === chosen) ? chosen : '';
                        select.classList.toggle('empty', !select.value);
                        select.addEventListener('change', () => {
                            levelOf(s.key)[itemKey(item)] = select.value;
                            select.classList.toggle('empty', !select.value);
                            saveLevels();
                            updateAssessStatus(students);
                        });
                        td.append(select);
                        tr.append(td);
                    });
                    tbody.append(tr);
                });
                table.append(thead, tbody);
                const wrap = document.createElement('div');
                wrap.className = 'level-wrap';
                wrap.append(table);
                assessPanel.replaceChildren(hint, wrap);
                updateAssessStatus(students);
            }

            function pickedLevels(student) {
                return assessPlan.filter(item => levelOf(student.key)[itemKey(item)]);
            }

            function updateAssessStatus(students) {
                const done = students.filter(s => pickedLevels(s).length > 0).length;
                assessStatus.className = done === students.length ? 'status' : 'status error';
                assessStatus.textContent = students.length + '명 가운데 ' + done + '명 단계를 골랐습니다'
                    + (done === students.length ? '.' : '. 단계가 없는 학생은 문장을 만들지 않습니다.');
            }

            modePlanBtn.addEventListener('click', () => { assessMode = true; renderAssess(); });
            modeListBtn.addEventListener('click', () => { assessMode = false; renderAssess(); });

            // 모델 선택과 호출은 공통 ai-client.js에서 관리한다.
            // ── 문장 만들기 ────────────────────────────────────────────────
            // 선생님은 '독도교육'처럼 활동 이름만 적는다. 그 한 낱말에서 서른 몇 개의
            // 서로 다른 문장이 나와야 하므로, 무엇을 달리 봐야 하는지를 짚어 준다.
            // 안 짚으면 '성실히 참여함'을 말만 바꿔 서른 번 늘어놓는다.
            const VARY = {
                behavior: '참여하는 태도, 친구와 지내는 모습, 맡은 일을 해내는 모습, 스스로 챙기는 모습, 활동 뒤에 달라진 점',
                subject: '이해한 내용, 할 수 있게 된 것, 문제를 푸는 방법, 배운 것을 생활에서 쓰는 모습, 스스로 확인하고 고치는 모습',
                activity: '참여하는 태도, 귀 기울이거나 의견을 내는 모습, 친구와 함께한 모습, 알게 된 점이나 느낀 점, 생각이나 마음가짐의 변화'
            };

            // 실제로 하지 않은 일을 지어내지 않게 하는 규칙. 학생마다 다르게 쓰라고만 하면 AI 는
            // 편지 쓰기·신문 만들기·플래시몹·청소 도구 건네기처럼 없던 세부 활동과 장면을 지어내
            // 차이를 만든다. 그런 글은 실제로 한 일이 아니라서 읽는 사람에게 금방 드러난다.
            // 교과는 수행평가가 다루는 개념과 방법까지는 풀어 써도 되므로 따로 둔다.
            const FACT_RULE = {
                subject:
                      '- 실제로 하지 않은 일을 지어내면 안 됩니다. 수행평가가 다루는 개념과 방법은 풀어 써도\n'
                    + '  되지만, 선생님이 적지 않은 활동(놀이, 발표회, 만들기, 조사, 실험 같은 것), 만든 물건,\n'
                    + '  행사, 장소, 사람, 숫자, 특정 장면은 덧붙이지 마세요.\n',
                activity:
                      '- 실제로 하지 않은 일을 지어내면 안 됩니다. 선생님이 적지 않은 세부 활동(편지 쓰기,\n'
                    + '  신문 만들기, 조사 발표, 공연, 캠페인 같은 것), 만든 물건, 맡은 역할, 행사, 장소, 사람,\n'
                    + '  숫자, 특정 장면을 덧붙이지 마세요. 없던 일이 적히면 읽는 사람에게 금방 드러납니다.\n'
                    + '- 문장에 드러나는 활동 내용은 선생님이 적은 만큼만 씁니다. 이름만 적었으면 그 이름까지만,\n'
                    + '  괄호에 덧붙인 것이 있으면 그것까지만 씁니다.\n'
            };

            // 학교생활기록부에 쓸 수 없는 것들. AI 는 시키지 않으면 '교내 대회에서 상을 받음'
            // 같은 말을 곧잘 지어 넣는다. 어느 칸에나 같이 걸리는 것만 여기에 둔다.
            const BANNED_RULE =
                  '- 다음은 생활기록부에 적을 수 없습니다. 한 군데도 넣지 마세요.\n'
                + '  · 상을 받은 일. 교내상도 교외상도 다 안 됩니다. 대회 이름, 등수, 입상,\n'
                + '    수상, 우수상, 최우수, 표창이라는 말 자체를 쓰지 마세요\n'
                + '  · 봉사활동 실적과 시간, 봉사 인증, 봉사상\n'
                + '  · 정규 교육과정 밖의 활동. 방과후학교 수강, 돌봄교실, 방학 특강, 자율동아리.\n'
                + '    과목 이름이나 수강했다는 말도 안 됩니다\n'
                + '  · 청소년단체 활동. 학교 안에서 하든 밖에서 하든 안 됩니다.\n'
                + '    스카우트, 걸스카우트, 아람단, 해양소년단, 적십자(RCY), 오케스트라,\n'
                + '    합창단, 밴드부 같은 단체 이름을 한 군데도 쓰지 마세요\n'
                + '  · 학교 밖에서 한 일(학원, 과외, 개인 봉사, 해외 경험, 가족 여행, 영재원)\n'
                + '  · 학교폭력 관련 조치 사항\n'
                + '  · 자격증, 어학 시험 점수, 검정고시, 논문, 책 펴냄\n'
                + '  · 부모나 친척의 직업·지위·재산, 집안 형편\n'
                + '  · 특정 대학·학과 이름, 특정 기관이나 상표 이름\n'
                + '  · 학생의 병명이나 장애, 심리 검사 결과\n';

            // 행동특성 및 종합의견에만 걸리는 것. 다른 칸에 적을 내용을 여기로 끌어오면 안 된다.
            // 임원 경력은 자율활동에, 동아리 이야기는 동아리활동 특기사항에 쓴다.
            const BEHAVIOR_BANNED_RULE =
                  '- 이 칸에는 다음도 적을 수 없습니다.\n'
                + '  · 임원 경력과 직책 이름(회장, 부회장, 반장, 부반장, 학생회, 대의원 등).\n'
                + '    이끄는 모습은 직책을 빼고 행동으로만 씁니다\n'
                + '  · 동아리 이야기. 동아리 이름도, 동아리에서 한 일도 쓰지 마세요\n';

            // 행발은 학생마다 고른 낱말이 다르므로 한 묶음을 한 번에 보내고 번호로 받는다.
            // 한 명씩 따로 부르면 서로 본 적이 없어 오히려 다 비슷해진다.
            function buildTraitPrompt(area, group) {
                const chars = targetChars();
                const lines = group.map((student, i) => {
                    const t = student.trait;
                    const picks = (t.picks || []);
                    const words = t.words.join(', ');
                    const note = (t.note || '').trim();
                    return (i + 1) + '. ' + words
                        + (picks.length ? ' / 꼭 넣을 말: ' + picks.join(', ') : '')
                        + (note ? ' / 있었던 일: ' + note : '');
                }).join('\n');

                // 고른 특성마다 말 주머니를 함께 보낸다. 같은 특성을 고른 학생끼리
                // 글이 닮지 않게, AI 가 학생마다 다른 말을 골라 쓰게 하려는 것이다.
                const used = [];
                group.forEach(student => student.trait.words.forEach(word => {
                    if (!used.includes(word)) used.push(word);
                }));
                const bank = used.map(word => {
                    const words = BANK.wordsOf(word);
                    return words.length ? '- ' + word + ': ' + words.join(', ') : '';
                }).filter(Boolean).join('\n');
                return '초등학교 생활기록부 \'' + area.label + '\' 칸에 넣을 문장을 만듭니다.\n\n'
                    + '학생마다 선생님이 고른 낱말입니다. 낱말은 그 학생에게서 본 모습입니다.\n\n'
                    + lines + '\n\n'
                    + (bank ? '낱말마다 쓸 수 있는 말입니다. 학생마다 다른 말을 골라 쓰세요.\n' + bank + '\n\n' : '')
                    + '각 번호마다 그 학생의 문장을 하나씩, 모두 ' + group.length + '개 만들어 주세요.\n\n'
                    + '지켜야 할 것\n'
                    + '- ' + area.rule + '\n'
                    + '- 고른 낱말이 모두 드러나게 하되 낱말을 그대로 나열하지 말고, 그 낱말이 학교생활\n'
                    + '  어디에서 어떻게 보였을지 헤아려 풀어 씁니다.\n'
                    + '- 같은 낱말을 고른 학생이 여럿이면 위 말 주머니에서 서로 다른 말을 골라 씁니다.\n'
                    + '- \'꼭 넣을 말\'이 적혀 있으면 그 말은 반드시 살려 씁니다.\n'
                    + '- \'있었던 일\'이 적혀 있으면 그 일을 문장 안에 살려 씁니다.\n'
                    + '- 한 학생 글은 ' + chars + '자 안팎으로 합니다. 길면 여러 문장으로 나누어 쓰되\n'
                    + '  문장마다 다른 모습을 담고, 같은 말을 돌려 쓰며 길이만 채우지 마세요.\n'
                    + '- 고른 낱말이 하나뿐인 학생도 같은 분량으로 씁니다. 낱말이 적다고 짧게 쓰지 마세요.\n'
                    + '  그 낱말 하나가 수업 시간, 쉬는 시간, 모둠 활동, 당번 일처럼 서로 다른 자리에서\n'
                    + '  어떻게 보였을지 헤아려 여러 장면으로 풀어 씁니다.\n'
                    + '- 장면은 \'수업 시간에\', \'모둠 활동에서\'처럼 어느 교실에나 있는 자리까지만 씁니다.\n'
                    + '  특정 물건, 사건, 행사, 맡은 역할(불 끄기, 우유 당번 같은 것)을 지어내지 마세요.\n'
                    + '  실제로 하지 않은 일이 적히면 읽는 사람에게 금방 드러납니다. \'있었던 일\'에 적힌 것만\n'
                    + '  구체적으로 씁니다.\n'
                    + '- \'~함.\' \'~임.\' 처럼 ㅁ 받침으로 끝나는\n'
                    + '  명사형으로 맺습니다. \'~하였다.\' \'~했습니다.\' 로 끝내면 안 됩니다.\n'
                    + '- 번호끼리 겹치면 안 됩니다. 같은 낱말을 고른 학생이라도 문장 첫머리와 보는 곳을\n'
                    + '  서로 달리하세요.\n'
                    + BANNED_RULE
                    + BEHAVIOR_BANNED_RULE
                    + '- 잘한 점을 좋게 적습니다. 단점이나 부족한 점은 쓰지 않습니다.\n'
                    + '- 지나친 칭찬이나 과장은 쓰지 않습니다. 상장 문구처럼 들리면 안 됩니다.\n'
                    + '- 모자람을 깔고 하는 칭찬을 쓰지 마세요. 읽는 사람이 \'그럼 평소엔 못했다는\n'
                    + '  말인가\' 하고 되물을 문장은 안 됩니다. \'쉬는 시간에도 연습함\',\n'
                    + '  \'부끄러움을 무릅쓰고 발표함\', \'느리지만 끝까지 함\' 같은 말이 그렇습니다.\n'
                    + '- 솜씨를 재는 말(잘함, 뛰어남, 훌륭함, 탁월함, 우수함, 소질이 있음)을 쓰지 마세요.\n'
                    + '  무엇을 어떻게 하더라는 모습으로 씁니다. \'리코더를 잘 붊\' 이 아니라\n'
                    + '  \'친구 소리에 맞추어 손가락을 짚음\' 처럼 씁니다.\n'

                    + '- 학생 이름이나 번호는 문장 안에 넣지 않습니다.\n\n'
                    + '\'1. \' 처럼 번호를 붙여 한 줄에 하나씩만 적고, 다른 말은 덧붙이지 마세요.';
            }

            // 그 칸의 말 주머니. 교과·창체는 학생마다 고르지 않으므로 주머니만 통째로 준다.
            // 스물네 문장이 서로 닮는 것을 막는 데는 이것이 가장 잘 듣는다.
            // 낱말만 보낸다. '1인 1역 수행', '봉사 활동' 같은 묶음 이름을 함께 보내면 AI 가 그걸
            // 실제로 한 활동으로 여겨 '불 끄기 역할을 맡아' 같은 없던 일을 지어 붙인다.
            function areaWordPool(areaKey) {
                const lines = BANK.groupsFor(areaKey).flatMap(group =>
                    group.traits.map(trait => '- ' + trait.words.join(', ')));
                return lines.join('\n');
            }

            function buildPrompt(area, sub, topic, count) {
                const where = sub ? sub + ' ' + area.label : area.label;
                const semester = area.semester ? semesterSelect.value + ' ' : '';
                const vary = VARY[areaSelect.value] || VARY.behavior;
                const item = area.item || '활동';
                const pool = areaWordPool(areaSelect.value);
                const factRule = areaSelect.value === 'subject' ? FACT_RULE.subject : FACT_RULE.activity;
                // 받침이 있으면 '과', 없으면 '와': 활동과, 수행평가와
                const withWa = (w) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c <= 11171 && c % 28 !== 0 ? '과' : '와'); };
                return '초등학교 생활기록부 \'' + semester + where + '\' 칸에 넣을 문장을 만듭니다.\n\n'
                    + '[' + item + '] ' + topic + '\n\n'
                    + '위 ' + item + '에 대해 학생 ' + count + '명에게 각각 적어 줄 문장을 ' + count + '개 만들어 주세요.\n'
                    + '선생님이 적은 것만 실제로 있었던 일입니다. ' + item + ' 이름과, 괄호 안에 덧붙인 내용이\n'
                    + '있으면 그것까지가 전부입니다.\n\n'
                    + '지켜야 할 것\n'
                    + '- ' + area.rule + '\n'
                    + factRule
                    + '- 한 사람에 한 문장. 모든 문장을 \'~함.\' \'~임.\' \'~드러남.\' 처럼 ㅁ 받침으로\n'
                    + '  끝나는 명사형으로 맺습니다. \'~하였다.\' \'~했습니다.\' 로 끝내면 안 됩니다.\n'
                    + '- ' + count + '개가 서로 겹치면 안 됩니다. 한 일을 바꾸어 다르게 하지 말고, 같은 ' + item + '에\n'
                    + '  참여한 모습을 달리해서 다르게 씁니다. 달리 볼 곳: ' + vary + '.\n'
                    + (pool ? '- 아래 말 주머니에서 이 ' + withWa(item) + ' 어울리는 말만 학생마다 다르게 골라 씁니다. 한 말을\n'
                              + '  여러 학생에게 되풀이하지 마세요. 주머니의 말 때문에 이 ' + withWa(item) + ' 상관없는 일(급훈, 재활용,\n'
                              + '  봉사 같은 것)을 끌어오면 안 됩니다.\n' + pool + '\n' : '')
                    + BANNED_RULE
                    + '- 학생마다 잘한 점을 찾아 좋게 적습니다. 단점이나 부족한 점은 쓰지 않습니다.\n'
                    + '  다만 실제로 있었던 일로 볼 수 있는 범위에서만 씁니다.\n'
                    + '- 지나친 칭찬이나 과장은 쓰지 않습니다. 상장 문구처럼 들리면 안 됩니다.\n'
                    + '- 모자람을 깔고 하는 칭찬을 쓰지 마세요. 읽는 사람이 \'그럼 평소엔 못했다는\n'
                    + '  말인가\' 하고 되물을 문장은 안 됩니다. \'쉬는 시간에도 연습함\',\n'
                    + '  \'부끄러움을 무릅쓰고 발표함\', \'느리지만 끝까지 함\' 같은 말이 그렇습니다.\n'
                    + '- 솜씨를 재는 말(잘함, 뛰어남, 훌륭함, 탁월함, 우수함, 소질이 있음)을 쓰지 마세요.\n'
                    + '  무엇을 어떻게 하더라는 모습으로 씁니다. \'리코더를 잘 붊\' 이 아니라\n'
                    + '  \'친구 소리에 맞추어 손가락을 짚음\' 처럼 씁니다.\n'
                    + '- 한 문장은 40자 안팎으로 합니다.\n'
                    + '- 학생 이름이나 번호는 문장 안에 넣지 않습니다.\n\n'
                    + '\'1. \' 처럼 번호를 붙여 한 줄에 하나씩만 적고, 다른 말은 덧붙이지 마세요.';
            }

            // 수행평가 계획의 평가결과 문장 하나를, 같은 단계를 받은 학생 수만큼 표현만 조금씩 달리해 받는다.
            // 선생님이 바란 것: 학생마다 살짝만 다르게, 누구를 특별하게 쓰지 않게. 뜻은 평가결과 그대로.
            function buildLevelPrompt(area, sub, item, criterion, count) {
                const where = semesterSelect.value + ' ' + sub + ' ' + area.label;
                const standards = (item.standards || []).map(s => s.text).filter(Boolean);
                return '초등학교 생활기록부 \'' + where + '\' 칸에 넣을 문장을 만듭니다.\n\n'
                    + '[수행평가] ' + item.element + '\n'
                    + (standards.length ? '[성취기준] ' + standards.join(' / ') + '\n' : '')
                    + '[평가결과] ' + criterion.text + '\n\n'
                    + '위 평가결과는 이 수행평가에서 학생 ' + count + '명이 똑같이 보인 모습입니다.\n'
                    + '이 ' + count + '명에게 각각 적어 줄 문장을 ' + count + '개 만들어 주세요.\n\n'
                    + '지켜야 할 것\n'
                    + '- 평가결과 문장의 뜻을 그대로 옮깁니다. 더 잘하는 것처럼도, 못하는 것처럼도 쓰지 마세요.\n'
                    + '  \'도움을 받아\' 처럼 평가결과에 있는 조건은 빠뜨리지 않습니다.\n'
                    + '- 무슨 수행평가였는지(' + item.element + ')가 드러나게 씁니다.\n'
                    + '- 평가결과와 성취기준에 없는 활동, 장면, 물건, 숫자, 사람을 덧붙이지 마세요.\n'
                    + '- ' + count + '개 문장은 뜻이 같아야 합니다. 낱말의 차례나 표현만 조금씩 달리하고,\n'
                    + '  어느 학생을 특별하게 쓰거나 크게 다르게 쓰지 마세요.\n'
                    + '- 한 사람에 한 문장. \'~함.\' \'~임.\' 처럼 ㅁ 받침으로 끝나는 명사형으로 맺습니다.\n'
                    + '  \'~할 수 있다.\' \'~하였다.\' \'~했습니다.\' 로 끝내면 안 됩니다.\n'
                    + '- 단계 이름(' + criterion.label + ')과 점수·등급·학생 이름·번호는 쓰지 않습니다.\n'
                    + '- 한 문장은 40자 안팎으로 합니다.\n'
                    + BANNED_RULE
                    + '\n\'1. \' 처럼 번호를 붙여 한 줄에 하나씩만 적고, 다른 말은 덧붙이지 마세요.';
            }

            // 번호 매긴 목록을 줄별로 끊어 낸다. 앞뒤에 인사말이 붙어 와도 걸러진다.
            function parseNumbered(text, count) {
                return text.split('\n')
                    .map(line => line.trim())
                    .filter(Boolean)
                    .map(line => line.replace(/^\**\s*\d+\s*[.)]\s*/, '').replace(/^[-*·]\s*/, '').trim())
                    .filter(line => line.length > 4 && !/^[[(]/.test(line))
                    .slice(0, count);
            }

            // 같은 번호의 학생이 늘 첫 번째 말투를 받지 않도록 활동마다 순서를 섞는다.
            function shuffled(n) {
                const order = Array.from({ length: n }, (_, i) => i);
                for (let i = n - 1; i > 0; i -= 1) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const tmp = order[i];
                    order[i] = order[j];
                    order[j] = tmp;
                }
                return order;
            }

            // items: [{ number, name, text }]. 명단 없이 만든 것은 name 이 빈 값이다.
            // 화면에 떠 있는 문장들. 고치면 이 배열이 함께 바뀌고 그대로 저장된다.
            let shownItems = [];
            let shownAt = null;

            function resultLabel(it) {
                return (it.number + '번 ' + (it.name || '')).trim();
            }

            function syncResultText() {
