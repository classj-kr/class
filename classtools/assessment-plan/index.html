<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>수행평가 계획</title>
    <style>
        :root {
            --ink: #18211d;
            --muted: #647069;
            --paper: #fffdf8;
            --canvas: #f3efe7;
            --line: #d8d2c6;
            --brand: #246b55;
            --brand-dark: #18503f;
            --brand-soft: #e4f0ea;
            --shadow: 0 18px 50px rgba(41, 50, 45, 0.10);
            --danger: #b43c36;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
        button, input, select { font: inherit; }
        a { color: var(--brand); }
        .account-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; }
        .account-bar a.home { text-decoration: none; font-weight: 600; }
        main { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
        .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
        .controls label { display: grid; gap: 4px; font-size: 0.9rem; color: var(--muted); font-weight: 600; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); min-height: 44px; }
        .form-control:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
        .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 14px 0 0; color: var(--muted); font-size: 0.92rem; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--brand); font-weight: 700; cursor: pointer; }
        .icon-btn:hover { background: var(--brand-soft); }
        .domain { margin-top: 22px; }
        .domain-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin: 0 0 8px; }
        .domain-head h2 { margin: 0; font-size: 1.08rem; }
        .domain-head .count { color: var(--muted); font-size: 0.9rem; }
        .domain-head button { background: none; border: none; color: var(--brand); cursor: pointer; padding: 0; font-size: 0.92rem; text-decoration: underline; }
        .domain-notes { background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; font-size: 0.93rem; white-space: pre-line; }
        .standard { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: start; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
        .code { display: inline-block; font-family: "JetBrains Mono", "D2Coding", monospace; font-size: 0.86rem; background: var(--brand-soft); color: var(--brand-dark); border-radius: 6px; padding: 2px 8px; white-space: nowrap; margin-top: 3px; }
        .standard .text { margin: 0; }
        .standard .topic { display: inline-block; font-size: 0.82rem; color: var(--muted); margin-bottom: 2px; }
        .standard .actions { display: flex; gap: 6px; }
        .standard .actions button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.86rem; min-height: 36px; }
        .standard .actions button:hover { background: var(--brand-soft); }
        .standard details { grid-column: 2 / -1; font-size: 0.93rem; }
        .standard details summary { cursor: pointer; color: var(--brand); }
        .standard details p { margin: 6px 0 0; white-space: pre-line; }
        .standard details h4 { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); }
        .empty { color: var(--muted); padding: 30px 0; text-align: center; }
        .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity 0.2s; pointer-events: none; font-size: 0.92rem; }
        .toast.show { opacity: 1; }
        dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; width: min(560px, 92vw); }
        dialog::backdrop { background: rgba(20, 24, 28, 0.45); }
        dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
        dialog p { margin: 0 0 10px; font-size: 0.95rem; }
        mark { background: #fff1a8; color: inherit; padding: 0 1px; }
        @media (max-width: 640px) {
            .standard { grid-template-columns: 1fr; }
            .standard .actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <header class="account-bar">
        <a class="home" href="/classtools/">← 교사 도구 홈으로</a>
        <button type="button" class="icon-btn" id="source-btn" aria-label="자료 출처">i</button>
    </header>
    <main>
        <section class="card">
            <div class="controls">
                <label>학년
                    <select id="band-select" class="form-control"></select>
                </label>
                <label>과목
                    <select id="subject-select" class="form-control"></select>
                </label>
                <label>영역
                    <select id="domain-select" class="form-control"></select>
                </label>
                <label>찾기
                    <input id="search-input" class="form-control" type="search" placeholder="코드나 낱말 (예: 4수01, 분수)">
                </label>
            </div>
            <div class="summary" id="summary"></div>
        </section>
        <section id="list" aria-live="polite"></section>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <dialog id="source-dialog" aria-labelledby="source-title">
        <h2 id="source-title">성취기준 자료 출처</h2>
        <p id="source-text"></p>
        <p>성취기준·해설·적용 시 고려 사항은 고시 원문을 그대로 옮긴 것입니다. 고등학교는 아직 넣지 않았습니다.</p>
        <button type="button" class="form-control" id="source-close" style="width:auto;">닫기</button>
    </dialog>
    <script>
        (() => {
            'use strict';
            const $ = (id) => document.getElementById(id);
            const bandSelect = $('band-select'), subjectSelect = $('subject-select'), domainSelect = $('domain-select'), searchInput = $('search-input');
            const list = $('list'), summary = $('summary'), toast = $('toast');
            let index = null;
            const subjectCache = new Map();
            let toastTimer;

            function notice(message) {
                toast.textContent = message; toast.classList.add('show');
                clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            async function loadIndex() {
                const res = await fetch('data/index.json?v=20261006-1', { cache: 'no-cache' });
                index = await res.json();
                $('source-text').textContent = index.source;
                // 학년군 목록: 자료가 있는 것만, 초등부터.
                const bandIds = [...new Set(index.subjects.flatMap((s) => Object.keys(s.bands)))];
                const order = ['e12', 'e34', 'e56', 'm'];
                bandSelect.replaceChildren(...order.filter((id) => bandIds.includes(id)).map((id) => {
                    const opt = document.createElement('option'); opt.value = id; opt.textContent = index.bands[Object.keys(index.bands).find((k) => index.bands[k].id === id)].label; return opt;
                }));
                const remembered = new URLSearchParams(location.search);
                if (remembered.get('band') && bandIds.includes(remembered.get('band'))) bandSelect.value = remembered.get('band');
                else bandSelect.value = bandIds.includes('e34') ? 'e34' : bandSelect.options[0].value;
                fillSubjects(remembered.get('subject'));
            }

            function fillSubjects(preferred) {
                const band = bandSelect.value;
                const subjects = index.subjects.filter((s) => s.bands[band]);
                subjectSelect.replaceChildren(...subjects.map((s) => { const opt = document.createElement('option'); opt.value = s.id; opt.textContent = s.name; return opt; }));
                if (preferred && subjects.some((s) => s.id === preferred)) subjectSelect.value = preferred;
                fillDomains();
            }

            function fillDomains() {
                const subject = index.subjects.find((s) => s.id === subjectSelect.value);
                const domains = subject ? subject.bands[bandSelect.value].domains : [];
                const all = document.createElement('option'); all.value = ''; all.textContent = '전체 영역';
                domainSelect.replaceChildren(all, ...domains.map((d, i) => { const opt = document.createElement('option'); opt.value = String(i); opt.textContent = (d.subjectName && subject.name !== d.subjectName ? d.subjectName + ' · ' : '') + d.name + ' (' + d.count + ')'; return opt; }));
                render();
            }

            async function subjectData(id) {
                if (!subjectCache.has(id)) {
                    subjectCache.set(id, fetch('data/' + id + '.json?v=20261006-1', { cache: 'no-cache' }).then((res) => res.json()));
                }
                return subjectCache.get(id);
            }

            function highlight(text, query) {
                if (!query) return document.createTextNode(text);
                const fragment = document.createDocumentFragment();
                const lower = text.toLowerCase(), needle = query.toLowerCase();
                let from = 0, at;
                while ((at = lower.indexOf(needle, from)) >= 0) {
                    fragment.appendChild(document.createTextNode(text.slice(from, at)));
                    const mark = document.createElement('mark'); mark.textContent = text.slice(at, at + query.length); fragment.appendChild(mark);
                    from = at + query.length;
                }
                fragment.appendChild(document.createTextNode(text.slice(from)));
                return fragment;
            }

            function standardCard(standard, query) {
                const card = document.createElement('article'); card.className = 'standard';
                const code = document.createElement('span'); code.className = 'code'; code.textContent = standard.code;
                const body = document.createElement('div');
                if (standard.topic) { const topic = document.createElement('span'); topic.className = 'topic'; topic.textContent = standard.topic; body.appendChild(topic); }
                const text = document.createElement('p'); text.className = 'text'; text.appendChild(highlight(standard.text, query)); body.appendChild(text);
                const actions = document.createElement('div'); actions.className = 'actions';
                const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = '복사';
                copy.addEventListener('click', async () => {
                    try { await navigator.clipboard.writeText('[' + standard.code + '] ' + standard.text); notice('복사했습니다.'); }
                    catch (_) { notice('복사하지 못했습니다. 글을 직접 긁어 주세요.'); }
                });
                actions.appendChild(copy);
                card.append(code, body, actions);
                if (standard.commentary || standard.notes) {
                    const details = document.createElement('details');
                    const sum = document.createElement('summary'); sum.textContent = '해설·적용 시 고려 사항'; details.appendChild(sum);
                    if (standard.commentary) { const h = document.createElement('h4'); h.textContent = '성취기준 해설'; const p = document.createElement('p'); p.textContent = standard.commentary; details.append(h, p); }
                    if (standard.notes) { const h = document.createElement('h4'); h.textContent = '적용 시 고려 사항'; const p = document.createElement('p'); p.textContent = standard.notes; details.append(h, p); }
                    card.appendChild(details);
                }
                return card;
            }

            async function render() {
                const subjectMeta = index.subjects.find((s) => s.id === subjectSelect.value);
                if (!subjectMeta) { list.replaceChildren(); return; }
                const data = await subjectData(subjectMeta.id);
                const band = data.bands[bandSelect.value];
                const query = searchInput.value.trim();
                const chosen = domainSelect.value === '' ? band.domains : [band.domains[Number(domainSelect.value)]].filter(Boolean);
                const sections = [];
                let shown = 0, total = 0;
                chosen.forEach((domain) => {
                    total += domain.standards.length;
                    const matched = domain.standards.filter((s) => !query || s.code.toLowerCase().includes(query.toLowerCase()) || s.text.includes(query) || (s.topic || '').includes(query));
                    if (matched.length === 0) return;
                    shown += matched.length;
                    const section = document.createElement('section'); section.className = 'domain';
                    const head = document.createElement('div'); head.className = 'domain-head';
                    const h2 = document.createElement('h2'); h2.textContent = (domain.subjectName && data.name !== domain.subjectName ? domain.subjectName + ' · ' : '') + domain.name;
                    const count = document.createElement('span'); count.className = 'count'; count.textContent = matched.length + '개';
                    head.append(h2, count);
                    if (domain.notes.length) {
                        const toggle = document.createElement('button'); toggle.type = 'button'; toggle.textContent = '영역 적용 시 고려 사항';
                        const notes = document.createElement('div'); notes.className = 'domain-notes'; notes.hidden = true; notes.textContent = domain.notes.join('\n');
                        toggle.addEventListener('click', () => { notes.hidden = !notes.hidden; });
                        head.appendChild(toggle); section.append(head, notes);
                    } else section.appendChild(head);
                    matched.forEach((s) => section.appendChild(standardCard(s, query)));
                    sections.push(section);
                });
                if (sections.length === 0) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '맞는 성취기준이 없습니다.'; sections.push(empty); }
                list.replaceChildren(...sections);
                summary.textContent = band.label + ' ' + data.name + ' — 성취기준 ' + total + '개' + (query ? ', 찾은 것 ' + shown + '개' : '');
                const params = new URLSearchParams({ band: bandSelect.value, subject: subjectSelect.value });
                history.replaceState(null, '', location.pathname + '?' + params);
            }

            bandSelect.addEventListener('change', () => fillSubjects());
            subjectSelect.addEventListener('change', fillDomains);
            domainSelect.addEventListener('change', render);
            let searchTimer;
            searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 120); });
            $('source-btn').addEventListener('click', () => $('source-dialog').showModal());
            $('source-close').addEventListener('click', () => $('source-dialog').close());
            loadIndex().catch((error) => { list.textContent = '성취기준 자료를 불러오지 못했습니다. ' + error.message; });
        })();
    </script>
</body>
</html>
