<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f45">
    <title>교사 전용 메인 포털 · Teacher Dashboard</title>
    <link rel="stylesheet" href="../assets/device-game.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #5b6770;
            --paper: #fffdf7;
            --canvas: #f3eee3;
            --line: #dcd5c7;
            --brand: #173f45;
            --brand-light: #2ec4b6;
            --brand-dark: #0e292d;
            --accent: #e79437;
            --coral: #ef476f;
            --shadow: 0 20px 60px rgba(23, 32, 51, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background: var(--canvas);
            font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(255, 253, 247, 0.12), rgba(255, 253, 247, 0.30)),
                url("../assets/images/teacher-main-bg.webp") center center / cover no-repeat;
            pointer-events: none;
        }

        main {
            width: min(100% - 32px, 1040px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        .account-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .account-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .account-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-link {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 7px 14px;
            color: var(--brand-dark);
            background: var(--paper);
            font-size: 0.85rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-link:hover {
            background: #ede6d8;
            transform: translateY(-1px);
        }

        .btn-signout {
            border: 1px solid #e2b4b4;
            color: #b43c36;
            background: #fff5f5;
        }

        .btn-signout:hover {
            background: #ffe3e3;
        }

        /* Profile Banner */
        .profile-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(23, 32, 51, 0.14);
            border-radius: 26px;
            padding: clamp(28px, 5vw, 42px);
            background: linear-gradient(135deg, #173f45 0%, #0d272b 100%);
            color: white;
            box-shadow: var(--shadow);
        }

        .profile-card::before {
            content: "";
            position: absolute;
            right: -60px;
            top: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46, 196, 182, 0.22), transparent 70%);
            pointer-events: none;
        }

        .teacher-title {
            margin: 0 0 20px;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.04em;
        }

        .teacher-title span {
            color: #ffd166;
        }

        .meta-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.1);
            color: #f1f7f6;
            font-size: 0.92rem;
            font-weight: 800;
            backdrop-filter: blur(8px);
        }

        .chip-highlight {
            border-color: rgba(255, 209, 102, 0.4);
            background: rgba(255, 209, 102, 0.15);
            color: #ffe8b3;
        }

        /* Tools Grid */
        .section-title {
            margin: 48px 0 20px;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 20px;
        }

        .teaching-tools-grid {
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        }

        .tool-card {
            display: flex;
            align-items: center;
            min-height: 96px;
            padding: 24px 28px;
            border: 1px solid rgba(23, 32, 51, 0.14);
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 12px 35px rgba(23, 32, 51, 0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--brand-light);
            box-shadow: 0 22px 50px rgba(23, 32, 51, 0.14);
        }

        .tool-name {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--ink);
        }

        .status-bar {
            margin-top: 36px;
            padding: 16px 20px;
            border-radius: 14px;
            background: rgba(23, 32, 51, 0.04);
            border: 1px dashed var(--line);
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px 0 50px;
            }
            .account-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="account-bar">
            <div class="account-info">
                <span>🏫 교사 관리 포털</span>
                <span id="user-email-badge" style="color: var(--muted); font-weight: 500;">(확인 중…)</span>
            </div>
            <div class="account-actions">
                <a class="btn-link" href="../">🏠 메인 화면으로</a>
                <button class="btn-link btn-signout" id="sign-out-btn" type="button">로그아웃</button>
            </div>
        </div>

        <!-- 교사 정보 대시보드 배너 -->
        <section class="profile-card">
            <h1 class="teacher-title" id="teacher-greeting">
                <span id="class-disp">학급 정보</span> · <span id="teacher-disp">교사명</span>
            </h1>
            <div class="meta-chips">
                <div class="chip">📅 <span id="chip-year">2026학년도</span></div>
            </div>
        </section>

        <!-- 내 학급 · 동아리 · 전담 그룹 관리 섹션 (개별 대시보드 바로가기) -->
        <h2 class="section-title">🏫 내 학급 · 그룹 (개별 대시보드 바로가기)</h2>
        <div class="groups-grid" id="main-groups-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 36px;">
            <!-- Dynamically rendered group cards -->
        </div>

        <!-- 교사 핵심 기능 버튼 영역 -->
        <h2 class="section-title">행정 및 기타 관리</h2>
        <div class="tools-grid">
            <!-- 학급 대시보드는 위 '내 학급·그룹' 카드에서 그룹별로 연다. 여기 따로 두면
                 같은 화면으로 가는 입구가 둘이 된다. -->

            <!-- 2. 연간 학사일정 & 교육과정 (School Admin) -->
            <a class="tool-card" href="/schooladmin/" style="border-color: #8b5cf6; background: linear-gradient(135deg, rgba(88, 28, 135, 0.5), rgba(46, 16, 101, 0.7));">
                <h3 class="tool-name" style="color: #c4b5fd;">📅 연간 학사일정 · 교육과정</h3>
            </a>

            <!-- 2b. 출결 현황판 (전교 실시간 출결) -->
            <a class="tool-card" href="attendance-dashboard.html" style="border-color: #f0b8b5; background: linear-gradient(135deg, rgba(127, 29, 29, 0.35), rgba(69, 10, 10, 0.55));">
                <h3 class="tool-name" style="color: #fca5a5;">📋 출결 현황판</h3>
            </a>

            <!-- 2c. 월중 행사 등록 (전교사 공동 입력) -->
            <a class="tool-card" href="school-events.html" style="border-color: #fbbf24; background: linear-gradient(135deg, rgba(120, 84, 6, 0.35), rgba(69, 46, 3, 0.55));">
                <h3 class="tool-name" style="color: #fcd34d;">📌 월중 행사 등록</h3>
            </a>

            <!-- 3. 전교생 명단 관리 (School Roster) -->
            <a class="tool-card" href="school-roster" style="border-color: #75d69f; background: linear-gradient(135deg, rgba(27, 77, 50, 0.4), rgba(17, 38, 27, 0.6));">
                <h3 class="tool-name" style="color: #75d69f;">🏫 전교생 명단 관리</h3>
            </a>

            <!-- 4. 가정통신문 & 출결 결재함 -->
            <a class="tool-card" href="/teacher/" style="border-color: #75d69f; background: linear-gradient(135deg, rgba(27, 77, 50, 0.6), rgba(17, 38, 27, 0.8));">
                <h3 class="tool-name" style="color: #75d69f;">📬 가정통신문 & 출결 결재함</h3>
            </a>

            <!-- 4b. 알림장 -->
            <a class="tool-card" href="/classboard/" style="border-color: #4da6ff; background: linear-gradient(135deg, rgba(23, 58, 95, 0.5), rgba(12, 30, 50, 0.7));">
                <h3 class="tool-name" style="color: #7cc0ff;">📢 알림장</h3>
            </a>

            <!-- 5. 생기부 문장 조수 -->
            <a class="tool-card" href="record-ai" style="border-color: #fca5a5; background: linear-gradient(135deg, rgba(127, 29, 29, 0.4), rgba(69, 10, 10, 0.6));">
                <h3 class="tool-name" style="color: #fca5a5;">📝 생기부 문장 조수</h3>
            </a>

            <!-- 6. 개인정보 요청 관리 -->
            <a class="tool-card" href="privacy.html">
                <h3 class="tool-name">개인정보 요청 관리</h3>
            </a>
        </div>

        <h2 class="section-title">수업 도구</h2>
        <div class="tools-grid teaching-tools-grid">
            <a class="tool-card" href="/vote/?mode=teacher" style="border-color: #f59e0b; background: linear-gradient(135deg, rgba(120, 53, 15, 0.5), rgba(69, 26, 3, 0.7));">
                <h3 class="tool-name" style="color: #fcd34d;">🗳️ 투표 만들기</h3>
            </a>
            <a class="tool-card" href="/learning/literacy-numeracy/graph-studio/">
                <h3 class="tool-name">그래프 그리기</h3>
            </a>
        </div>

        <div class="status-bar">
            <span id="status-info"></span>
            <span id="student-count-info"></span>
        </div>
    </main>

    <!-- 새 학급·그룹 개설 드롭다운 모달 -->
    <div id="create-group-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(6px);">
        <div style="background:var(--paper, #1a221e); border:1px solid rgba(117,214,159,0.4); border-radius:24px; width:min(92%, 480px); padding:32px; box-shadow:0 20px 50px rgba(0,0,0,0.6); color:#fff;">
            <h3 style="margin:0 0 8px; font-size:1.4rem; font-weight:900; color:#75d69f;">학급 · 그룹 가져오기</h3>
            <p style="margin:0 0 24px; font-size:0.9rem; color:var(--text-muted, #a0aec0);">전교생 명단에 있는 학급과 항목만 가져올 수 있습니다.</p>
            
            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.88rem; font-weight:800; margin-bottom:6px; color:#75d69f;">1. 어디에서 가져올까요</label>
                <!-- 유형은 전교생 명단에 실제로 있는 열에서 만든다. -->
                <select id="modal-group-type" style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:#111512; color:#fff; font-size:1rem; font-weight:700; outline:none;"></select>
            </div>

            <div style="margin-bottom:24px;">
                <label style="display:block; font-size:0.88rem; font-weight:800; margin-bottom:6px; color:#75d69f;">2. 무엇을 가져올까요</label>
                <select id="modal-group-name-select" style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:#111512; color:#fff; font-size:1rem; font-weight:700; outline:none;">
                    <!-- Populated dynamically via JS -->
                </select>
                <p id="modal-group-notice" style="display:none; margin:10px 0 0; font-size:0.85rem; line-height:1.5; color:#ffd166;"></p>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button type="button" onclick="closeCreateGroupModal()" style="padding:10px 20px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:transparent; color:#ccc; font-weight:700; cursor:pointer;">취소</button>
                <button type="button" id="btn-modal-submit-group" style="padding:10px 24px; border-radius:12px; border:none; background:#75d69f; color:#0b0f0c; font-weight:900; cursor:pointer;">가져오기</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            const classDisp = document.getElementById('class-disp');
            const teacherDisp = document.getElementById('teacher-disp');
            const chipYear = document.getElementById('chip-year');
            const chipClass = document.getElementById('chip-class');
            const chipTeacher = document.getElementById('chip-teacher');
            const userEmailBadge = document.getElementById('user-email-badge');
            const statusInfo = document.getElementById('status-info');
            const studentCountInfo = document.getElementById('student-count-info');
            const signOutBtn = document.getElementById('sign-out-btn');

            async function api(path, options = {}) {
                const response = await fetch(path, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.message || '요청을 처리할 수 없습니다.');
                return payload;
            }

            // 전교생 명단과 그룹 개설이 서로 다른 해를 보면, 명단에 학생이 있는데도
            // 고를 학급이 없는 것처럼 보인다. 교사 프로필의 학년도를 함께 쓴다.
            let portalYear = new Date().getFullYear();

            function applyProfileData(data) {
                const year = data.academicYear || portalYear;
                portalYear = year;
                const grade = data.grade || '';
                const classNum = data.classNumber || '';
                const teacher = data.name || data.teacherName || '선생님';

                const classStr = grade && classNum ? `${grade}학년 ${classNum}반` : '학급 미설정';

                // 머리말 칩은 화면에서 빠질 수 있는 장식이다. chip-class/chip-teacher는
                // 실제로 없어진 상태였고, 그대로 값을 넣다가 예외가 나서 이 함수 뒤의
                // loadTeacherGroups()까지 통째로 건너뛰었다. 그래서 '새 그룹 개설' 칸이
                // 아예 그려지지 않았다.
                const setText = (el, value) => { if (el) el.textContent = value; };

                setText(classDisp, classStr);
                setText(teacherDisp, teacher);

                setText(chipYear, `${year}학년도`);
                setText(chipClass, classStr);
                setText(chipTeacher, `${teacher} 선생님`);
            }

            const activeGroupSelect = document.getElementById('active-group-select');
            const btnCreateGroup = document.getElementById('btn-create-group');

            async function loadTeacherGroups() {
                const mainGrid = document.getElementById('main-groups-grid');
                try {
                    const res = await api(`/api/teacher/groups?year=${portalYear}`).catch(() => ({ groups: [] }));
                    const groups = res.groups || [];
                    
                    const groupTypeIcons = {
                        homeroom: '🏫',
                        subject: '📖',
                        club: '🎯',
                        afterschool: '⚽',
                        care: '🧸',
                        shuttle: '🚌',
                        other: '📌'
                    };

                    // 학급 그룹은 '6-4' 라는 이름으로 저장된다. 화면에서는 읽는 대로 적는다.
                    const groupLabel = (g) => (g.group_type === 'homeroom' && g.grade && g.class_number)
                        ? `${g.grade}학년 ${g.class_number}반`
                        : g.group_name;

                    const typeLabels = {
                        homeroom: '담임 학급',
                        subject: '전담 교과',
                        club: '동아리',
                        afterschool: '방과후부',
                        care: '돌봄반',
                        shuttle: '통학버스',
                        other: '기타'
                    };

                    if (activeGroupSelect) {
                        activeGroupSelect.innerHTML = `<option value="homeroom" style="color:#000;">🏫 담임 학급</option>`;
                        groups.forEach(g => {
                            const icon = groupTypeIcons[g.group_type] || '📌';
                            const opt = document.createElement('option');
                            opt.value = g.id;
                            opt.style.color = '#000';
                            opt.textContent = `${icon} ${groupLabel(g)} (${g.student_count || 0}명)`;
                            activeGroupSelect.appendChild(opt);
                        });

                        const savedActiveId = sessionStorage.getItem('active_group_id');
                        if (savedActiveId && Array.from(activeGroupSelect.options).some(o => o.value === savedActiveId)) {
                            activeGroupSelect.value = savedActiveId;
                        }
                    }

                    if (mainGrid) {
                        mainGrid.innerHTML = groups.map(g => {
                            const icon = groupTypeIcons[g.group_type] || '📌';
                            const label = typeLabels[g.group_type] || g.group_type;
                            return `
                                <div class="tool-card" onclick="openGroupDashboard(${g.id})" style="cursor:pointer; border:1px solid rgba(117,214,159,0.3); background:linear-gradient(135deg, rgba(21,28,24,0.9), rgba(11,15,12,0.95)); padding:20px; border-radius:18px; display:flex; flex-direction:column; justify-content:space-between; min-height:120px; transition:transform 0.15s ease;">
                                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                                        <span class="chip" style="font-size:0.75rem; padding:2px 8px; background:rgba(117,214,159,0.15); color:#75d69f;">${icon} ${label}</span>
                                    </div>
                                    <h3 class="tool-name" style="margin:0 0 6px; font-size:1.15rem; color:var(--text-main, #eef4f0);">${groupLabel(g)}</h3>
                                    <div style="font-size:0.85rem; color:var(--text-muted, #a0aec0); font-weight:700;">학생 ${g.student_count || 0}명</div>
                                </div>
                            `;
                        }).join('') + `
                            <div class="tool-card" onclick="handleCreateGroupClick()" style="cursor:pointer; border:2px dashed rgba(117,214,159,0.4); background:rgba(117,214,159,0.05); padding:20px; border-radius:18px; display:flex; align-items:center; justify-content:center; gap:8px; color:#75d69f; font-weight:800; font-size:1.05rem; min-height:120px;">
                                <span style="font-size:24px;">+</span> 명단에서 가져오기
                            </div>
                        `;
                    }
                } catch (_) {}
            }

            window.openGroupDashboard = function(groupId) {
                sessionStorage.setItem('active_group_id', groupId);
                location.href = `/classtools/dashboard.html?groupId=${groupId}`;
            };

            let availableData = { homerooms: [], columns: [] };

            let availableError = '';

            window.handleCreateGroupClick = async function() {
                availableError = '';
                try {
                    availableData = await api(`/api/teacher/available-groups?year=${portalYear}`);
                } catch (err) {
                    // 여기서 삼키면 화면에는 '고를 것이 없음'으로만 보인다. 까닭을 남긴다.
                    availableData = { homerooms: [], columns: [] };
                    availableError = err.message || '후보 목록을 불러오지 못했습니다.';
                }
                populateTypeOptions();
                populateModalDropdown();
                const modal = document.getElementById('create-group-modal');
                if (modal) modal.style.display = 'flex';
            };

            window.closeCreateGroupModal = function() {
                const modal = document.getElementById('create-group-modal');
                if (modal) modal.style.display = 'none';
            };

            // 학교마다 명단의 열이 다르다. 동아리가 없는 학교도 있고, 방과후 대신
            // 다른 이름을 쓰는 학교도 있다. 그래서 유형은 미리 적어 두지 않고
            // 그 학교 명단에 실제로 있는 열에서 만든다.
            const COLUMN_TYPE_MAP = [
                [/동아리|클럽/, 'club'],
                [/방과\s*후|늘봄/, 'afterschool'],
                [/돌봄/, 'care'],
                [/버스|통학|차량/, 'shuttle'],
                [/전담|교과/, 'subject']
            ];

            function groupTypeForColumn(name) {
                const hit = COLUMN_TYPE_MAP.find(([pattern]) => pattern.test(name));
                return hit ? hit[1] : 'other';
            }

            function populateTypeOptions() {
                const typeSelect = document.getElementById('modal-group-type');
                if (!typeSelect) return;
                const previous = typeSelect.value;
                typeSelect.replaceChildren();

                const homeroom = document.createElement('option');
                homeroom.value = 'homeroom';
                homeroom.textContent = '🏫 담임 학급';
                typeSelect.appendChild(homeroom);

                (availableData.columns || []).forEach((col, index) => {
                    const opt = document.createElement('option');
                    opt.value = `col:${index}`;
                    opt.textContent = col.name;
                    typeSelect.appendChild(opt);
                });

                if ([...typeSelect.options].some((opt) => opt.value === previous)) typeSelect.value = previous;
            }

            function selectedColumn() {
                const typeSelect = document.getElementById('modal-group-type');
                const match = /^col:(\d+)$/.exec(typeSelect ? typeSelect.value : '');
                if (!match) return null;
                return (availableData.columns || [])[Number(match[1])] || null;
            }

            function populateModalDropdown() {
                const typeSelect = document.getElementById('modal-group-type');
                const nameSelect = document.getElementById('modal-group-name-select');
                const customInput = document.getElementById('modal-group-custom-input');
                if (!typeSelect || !nameSelect) return;

                const type = typeSelect.value;
                nameSelect.innerHTML = '';
                if (customInput) customInput.style.display = 'none';

                if (type === 'homeroom') {
                    (availableData.homerooms || []).forEach(h => {
                        const opt = document.createElement('option');
                        opt.value = h.name;
                        opt.textContent = h.label;
                        nameSelect.appendChild(opt);
                    });
                } else {
                    // 고른 열에 적힌 항목이 그대로 후보다.
                    const column = selectedColumn();
                    (column?.options || []).forEach(o => {
                        const opt = document.createElement('option');
                        opt.value = o;
                        opt.textContent = o;
                        nameSelect.appendChild(opt);
                    });
                }

                // 고를 것이 직접 입력뿐이면 왜 그런지 알려 준다.
                const notice = document.getElementById('modal-group-notice');
                if (!notice) return;
                let message = '';
                const column = selectedColumn();
                if (availableError) {
                    message = availableError;
                } else if (type === 'homeroom' && !(availableData.homerooms || []).length) {
                    message = `${portalYear}년도 전교생 명단에 학생이 없어 고를 학급이 없습니다. 학교 관리자가 전교생 명단을 먼저 채워야 합니다.`;
                } else if (column && !(column.options || []).length) {
                    message = `'${column.name}' 열에 적힌 항목이 없습니다. 학교 관리자가 전교생 명단에서 이 열의 항목을 채우면 여기에 나옵니다.`;
                } else if (type === 'homeroom' || column) {
                    message = '';
                } else if (!(availableData.columns || []).length) {
                    message = `${portalYear}년도 전교생 명단에 만들어 둔 열이 없습니다. 학교 관리자가 열을 만들면 그 이름이 위 목록에 나옵니다.`;
                }
                notice.textContent = message;
                notice.style.display = message ? 'block' : 'none';
            }

            document.getElementById('modal-group-type')?.addEventListener('change', populateModalDropdown);
            document.getElementById('btn-modal-submit-group')?.addEventListener('click', async () => {
                const typeSelect = document.getElementById('modal-group-type');
                const nameSelect = document.getElementById('modal-group-name-select');

                const groupName = nameSelect ? nameSelect.value : '';
                if (!groupName) {
                    alert('명단에서 가져올 학급이나 항목을 골라 주세요.');
                    return;
                }

                const type = typeSelect ? typeSelect.value : 'other';
                const column = selectedColumn();
                // 서버가 받는 갈래 이름은 정해져 있다. 열 이름을 그 가운데 하나로 옮긴다.
                const groupType = type === 'homeroom' ? 'homeroom' : (column ? groupTypeForColumn(column.name) : 'other');
                // 담임 학급이면 이름이 '6-4' 모양이다. 학년·반을 함께 보내야 그 반
                // 학생이 붙는다. 학년도도 보내야 목록에 뜨는 해와 어긋나지 않는다.
                const homeroomMatch = type === 'homeroom' ? /^(\d+)-(\d+)$/.exec(groupName) : null;

                try {
                    const res = await api('/api/teacher/groups', {
                        method: 'POST',
                        body: JSON.stringify({
                            groupName,
                            groupType,
                            grade: homeroomMatch ? Number(homeroomMatch[1]) : null,
                            classNumber: homeroomMatch ? Number(homeroomMatch[2]) : null,
                            year: portalYear
                        })
                    });
                    alert(`'${groupName}' 을(를) 내 목록에 넣었습니다.`);
                    closeCreateGroupModal();
                    sessionStorage.setItem('active_group_id', res.groupId);
                    location.href = `/classtools/dashboard.html?groupId=${res.groupId}`;
                } catch (err) {
                    alert(err.message || '그룹 개설에 실패했습니다.');
                }
            });

            if (activeGroupSelect) {
                activeGroupSelect.addEventListener('change', (e) => {
                    sessionStorage.setItem('active_group_id', e.target.value);
                });
            }

            if (btnCreateGroup) {
                btnCreateGroup.addEventListener('click', handleCreateGroupClick);
            }

            async function init() {
                try {
                    const session = await api('/api/auth/me').catch(() => ({ signedIn: false }));
                    if (!session.signedIn || !(session.user?.role === 'teacher' || session.isTeacher)) {
                        location.replace('/');
                        return;
                    }
                    userEmailBadge.textContent = `(${session.user.email})`;

                    // 관리자 설정 교사 프로필 조회
                    const teacherProfile = await api('/api/teacher/profile').catch(() => null);

                    if (teacherProfile && teacherProfile.profile) {
                        applyProfileData(teacherProfile.profile);
                    } else {
                        // 학급 정보 API 조회 시도
                        const classData = await api('/api/teacher/class').catch(() => null);
                        if (classData && classData.classroom) {
                            applyProfileData(classData.classroom);
                            studentCountInfo.textContent = `학생 수: ${classData.classroom.students?.length || 0}명`;
                        } else {
                            applyProfileData({});
                        }
                    }

                    // 동아리/방과후/전담 그룹 불러오기
                    await loadTeacherGroups();

                    // 학급 학생 수 추가 업데이트
                    const classRes = await api('/api/teacher/class').catch(() => null);
                    if (classRes && classRes.classroom) {
                        studentCountInfo.textContent = `등록된 학생 수: ${classRes.classroom.students?.length || 0}명`;
                    }
                } catch (error) {
                    statusInfo.textContent = `⚠️ 정보 로드 중 오류: ${error.message}`;
                }
            }

            signOutBtn.addEventListener('click', async () => {
                await api('/api/auth/logout', { method: 'POST', body: '{}' }).catch(() => {});
                location.replace('../index.html');
            });


            init();
        })();
    </script>
</body>
</html>
