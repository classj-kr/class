<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>문해·수리 학습 보고서</title>
  <link rel="stylesheet" href="learning-reports.css?v=20261001-1">
  <script src="/assets/learning-records.js?v=20261001-1" defer></script>
  <script src="learning-reports.js?v=20261001-1" defer></script>
</head>
<body>
  <main class="report-shell">
    <header class="page-heading"><div><a href="/classtools/" class="home">← 교사 도구</a><p class="eyebrow">LEARNING REPORT</p><h1>문해·수리 학습 보고서</h1><p class="lead">학생이 무엇을 했고, 어디에서 다시 생각했는지 살펴보세요.</p></div><span class="server-note">학생 계정에 저장된 기록</span></header>
    <section class="filters" aria-label="조회 조건">
      <label class="class-filter">학급<select id="classSelect"><option>학급을 불러오는 중</option></select></label>
      <label>시작일<input id="fromDate" type="date"></label><span class="date-dash">–</span><label>종료일<input id="toDate" type="date"></label>
      <div class="quick"><button id="today" type="button">오늘</button><button id="week" type="button">최근 7일</button></div><button id="load" class="primary" type="button">조회</button>
    </section>
    <p id="status" role="status" class="status">학급 정보를 확인하고 있어요.</p>
    <section id="summary" class="summary" aria-label="기간 요약"></section>
    <nav class="view-tabs" aria-label="보고서 보기"><button id="studentTab" aria-pressed="true" type="button">학생별 보고서</button><button id="areaTab" aria-pressed="false" type="button">영역별 보고서</button></nav>
    <section class="workspace">
      <aside><div class="aside-heading"><h2 id="listTitle">학생</h2><span id="listCount"></span></div><label class="area-filter" id="areaFilter" hidden>활동<select id="activitySelect"><option value="">전체 활동</option></select></label><div id="studentList" class="student-list"></div></aside>
      <section class="report-content" aria-label="학습 내역"><div id="reportHeading" class="report-heading"></div><div id="records"></div></section>
    </section>
    <p class="footnote">‘처음 맞힘’과 ‘다시 풀이’는 선택한 기간에 제출한 응답을 기준으로 표시합니다. 열어 본 부분·스스로 점검은 정답률에 포함하지 않습니다. 활동의 진행·완료 표시는 현재 상태이며, 날짜는 한국 시간 기준입니다.</p>
  </main>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><header><h2 id="detailTitle">학습 응답</h2><button id="closeDetail" type="button">닫기</button></header><div id="detailBody"></div></dialog>
</body>
</html>
