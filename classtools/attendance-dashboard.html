<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ec">
    <title>출결 현황판</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18211d;
            --muted: #647069;
            --paper: #fffdf8;
            --canvas: #f3efe7;
            --line: #d8d2c6;
            --brand: #246b55;
            --brand-dark: #18503f;
            --brand-soft: #dfeee8;
            --danger: #b43c36;
            --danger-soft: #fff0ee;
            --info: #2b6cb0;
            --info-soft: #e9f2fc;
            --shadow: 0 18px 50px rgba(41, 50, 45, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 34rem), var(--canvas);
            font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }
        button, input, select { font: inherit; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .back-btn:hover { background: var(--canvas); }
        .top-school { font-size: 12px; color: var(--muted); }

        .main { padding: 16px 24px; max-width: 1100px; margin: 0 auto; }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .date-picker-wrap { display: flex; align-items: center; gap: 6px; }
        .icon-btn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
            font-size: 16px;
        }
        .icon-btn:hover { background: var(--canvas); }
        .date-input {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);
            min-height: 40px;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 40px; padding: 0 16px;
            border: none; border-radius: 10px;
            font-weight: 700; font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            background: var(--brand); color: #fff;
        }
        .btn:hover { background: var(--brand-dark); }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px;
        }
        .summary-card.warning { background: var(--danger-soft); border-color: #f0b8b5; }
        .summary-card.info { background: var(--info-soft); border-color: #b9d6ef; }
        button.summary-card { font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; }
        button.summary-card:hover:not(:disabled), button.summary-card:focus-visible { border-color: var(--brand); }
        button.summary-card:disabled { cursor: default; }

        /* 숫자를 누르면 그 학생들이 나온다 */
        .num-btn {
            font: inherit; color: inherit;
            background: none; border: none;
            padding: 2px 6px; margin: -2px -6px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: underline dotted;
            text-underline-offset: 4px;
        }
        .num-btn:hover, .num-btn:focus-visible { background: var(--brand-soft); text-decoration-style: solid; }

        .list-dialog {
            width: min(460px, calc(100vw - 32px));
            max-height: min(80vh, 680px);
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--paper);
            color: var(--ink);
            box-shadow: var(--shadow);
        }
        .list-dialog[open] { display: flex; flex-direction: column; }
        .list-dialog::backdrop { background: rgba(24, 33, 29, 0.35); }
        .dialog-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }
        .dialog-head h2 { margin: 0; font-size: 18px; }
        .name-list { list-style: none; margin: 0; padding: 4px 0; overflow: auto; font-variant-numeric: tabular-nums; }
        .name-list li {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--canvas);
        }
        .name-list li:last-child { border-bottom: none; }
        .name-list .who { word-break: keep-all; }
        .name-list .src { color: var(--muted); font-size: 14px; white-space: nowrap; margin-left: auto; }
        .card-title { font-size: 15px; color: var(--muted); font-weight: 700; }
        .card-value { font-size: 32px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--paper);
        }
        table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
        th {
            background: var(--canvas);
            color: var(--ink);
            font-weight: 700;
            font-size: 14px;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        td { padding: 12px 16px; border-bottom: 1px solid var(--line); }
        th:not(:first-child), td:not(:first-child) { text-align: right; }
        td:first-child { white-space: nowrap; }
        tfoot td { font-weight: 800; background: var(--canvas); }
        .status-warning { color: var(--danger); font-weight: 800; }
        .status-info { color: var(--info); font-weight: 800; }
        .status-normal { color: var(--muted); }

        .status-msg { font-size: 14px; color: var(--muted); min-height: 20px; }
        .status-msg.error { color: var(--danger); }
        @media (max-width: 600px) {
            .main { padding: 12px; }
            .card { padding: 16px; }
            .summary-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <a href="/classtools/" class="back-btn" title="뒤로">←</a>
    </div>
</div>

<div class="main">
    <div class="card">
        <div class="controls-row">
            <div class="date-picker-wrap">
                <button class="icon-btn" id="prevDateBtn" title="이전 날짜">←</button>
                <input type="date" id="dashboardDate" class="date-input">
                <button class="icon-btn" id="nextDateBtn" title="다음 날짜">→</button>
            </div>
            <button class="btn" id="refreshBtn">🔄 새로고침</button>
            <span class="status-msg" id="statusMsg"></span>
        </div>

        <div class="summary-cards">
            <button type="button" class="summary-card" data-class="all" data-list="total" disabled>
                <div class="card-title">총 현원</div>
                <div class="card-value" id="totalStudentsCount">0</div>
            </button>
            <button type="button" class="summary-card" data-class="all" data-list="absent" disabled>
                <div class="card-title">결석</div>
                <div class="card-value" id="totalAbsenceCount">0</div>
            </button>
            <button type="button" class="summary-card" data-class="all" data-list="tardy" disabled>
                <div class="card-title">지각</div>
                <div class="card-value" id="totalTardyCount">0</div>
            </button>
            <button type="button" class="summary-card" data-class="all" data-list="early" disabled>
                <div class="card-title">조퇴</div>
                <div class="card-value" id="totalEarlyCount">0</div>
            </button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>학년-반</th>
                        <th>재적</th>
                        <th>출석</th>
                        <th>결석</th>
                        <th>지각</th>
                        <th>조퇴</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody"></tbody>
                <tfoot id="dashboardTableFoot"></tfoot>
            </table>
        </div>
    </div>
</div>

<dialog class="list-dialog" id="listDialog" aria-labelledby="listTitle">
    <div class="dialog-head">
        <h2 id="listTitle"></h2>
        <button type="button" class="icon-btn" id="listClose" aria-label="닫기">✕</button>
    </div>
    <ol class="name-list" id="listBody"></ol>
</dialog>

<script>
(() => {
    "use strict";

    let currentDate = new Date();

    async function api(path, opts = {}) {
        const res = await fetch(path, {
            ...opts,
            headers: { "Content-Type": "application/json", ...(opts.headers || {}) }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const err = new Error(data.message || "서버 오류가 발생했습니다.");
            err.status = res.status;
            throw err;
        }
        return data;
    }

    function formatDate(date) {
        const d = new Date(date);
        let month = "" + (d.getMonth() + 1);
        let day = "" + d.getDate();
        const year = d.getFullYear();
        if (month.length < 2) month = "0" + month;
        if (day.length < 2) day = "0" + day;
        return [year, month, day].join("-");
    }

    function setStatus(msg, isError) {
        const el = document.getElementById("statusMsg");
        el.textContent = msg || "";
        el.className = "status-msg" + (isError ? " error" : "");
    }

    function esc(str) {
        return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 서버는 학생 한 명 한 줄로 준다. 셈은 여기서 학생 단위로 한다. 한 학생에게 출결 알림과
    // 결석계가 함께 있어도 결석 한 명이다(예전에는 둘로 셌다).
    const KIND_LIST = { "결석": "absent", "지각": "tardy", "조퇴": "early" };
    const LIST_LABEL = { total: "재적", present: "출석", absent: "결석", tardy: "지각", early: "조퇴" };
    let board = { classes: [], byKey: new Map() };

    function buildBoard(students, events) {
        const byKey = new Map();
        const classOf = (grade, classNumber) => {
            const key = `${grade}-${classNumber}`;
            if (!byKey.has(key)) {
                byKey.set(key, { key, grade, classNumber, total: [], absent: new Map(), tardy: new Map(), early: new Map() });
            }
            return byKey.get(key);
        };
        const rosterName = new Map();
        for (const s of students) {
            classOf(s.grade, s.classNumber).total.push(s);
            rosterName.set(`${s.grade}-${s.classNumber}-${s.number}`, s.name);
        }
        for (const e of events) {
            const list = KIND_LIST[e.kind];
            if (!list) continue;
            const bucket = classOf(e.grade, e.classNumber)[list];
            const who = `${e.grade}-${e.classNumber}-${e.number}`;
            const entry = bucket.get(who) || {
                grade: e.grade, classNumber: e.classNumber, number: e.number,
                name: rosterName.get(who) || e.name, sources: []
            };
            if (!entry.sources.includes(e.source)) entry.sources.push(e.source);
            bucket.set(who, entry);
        }
        const classes = Array.from(byKey.values()).sort((a, b) => a.grade - b.grade || a.classNumber - b.classNumber);
        for (const c of classes) {
            c.present = c.total.filter((s) => !c.absent.has(`${s.grade}-${s.classNumber}-${s.number}`));
            for (const list of ["absent", "tardy", "early"]) c[list] = Array.from(c[list].values());
        }
        return { classes, byKey };
    }

    function listOf(classKey, list) {
        const scope = classKey === "all" ? board.classes : [board.byKey.get(classKey)].filter(Boolean);
        return scope.flatMap((c) => c[list]);
    }

    function numCell(classKey, list, count, tone) {
        const cls = count > 0 ? tone : "status-normal";
        const inner = count > 0 ? `<button type="button" class="num-btn" data-class="${classKey}" data-list="${list}">${count}</button>` : count;
        return `<td class="${cls || ""}">${inner}</td>`;
    }

    function renderDashboard(students, events) {
        board = buildBoard(students, events);
        const tbody = document.getElementById("dashboardTableBody");
        tbody.innerHTML = board.classes.map((c) => `
            <tr>
                <td>${c.grade}학년 ${c.classNumber}반</td>
                ${numCell(c.key, "total", c.total.length, "")}
                ${numCell(c.key, "present", c.present.length, "")}
                ${numCell(c.key, "absent", c.absent.length, "status-warning")}
                ${numCell(c.key, "tardy", c.tardy.length, "status-info")}
                ${numCell(c.key, "early", c.early.length, "status-info")}
            </tr>
        `).join("");

        const sum = (list) => listOf("all", list).length;
        const sumAbsence = sum("absent"), sumTardy = sum("tardy"), sumEarly = sum("early");
        document.getElementById("dashboardTableFoot").innerHTML = `
            <tr>
                <td>총계</td>
                ${numCell("all", "total", sum("total"), "")}
                ${numCell("all", "present", sum("present"), "")}
                ${numCell("all", "absent", sumAbsence, "status-warning")}
                ${numCell("all", "tardy", sumTardy, "status-info")}
                ${numCell("all", "early", sumEarly, "status-info")}
            </tr>
        `;

        const cards = [["totalStudentsCount", sum("total"), null], ["totalAbsenceCount", sumAbsence, "warning"],
            ["totalTardyCount", sumTardy, "info"], ["totalEarlyCount", sumEarly, "info"]];
        for (const [id, count, tone] of cards) {
            const el = document.getElementById(id);
            el.textContent = count;
            const card = el.closest(".summary-card");
            card.disabled = count === 0;
            if (tone) card.classList.toggle(tone, count > 0);
        }
    }

    // ─── 명단 창 ───
    const listDialog = document.getElementById("listDialog");

    function openList(classKey, list) {
        const rows = listOf(classKey, list);
        const c = board.byKey.get(classKey);
        const scopeLabel = classKey === "all"
            ? (list === "total" ? "총 현원" : `전교 ${LIST_LABEL[list]}`)
            : `${c.grade}학년 ${c.classNumber}반 ${LIST_LABEL[list]}`;
        document.getElementById("listTitle").textContent = `${scopeLabel} ${rows.length}명`;
        document.getElementById("listBody").innerHTML = rows.map((s) => `
            <li>
                <span class="who">${s.grade}학년 ${s.classNumber}반 ${esc(s.number)}번 ${esc(s.name)}</span>
                ${s.sources ? `<span class="src">${esc(s.sources.join(" · "))}</span>` : ""}
            </li>
        `).join("");
        listDialog.showModal();
        document.getElementById("listBody").scrollTop = 0;
    }

    document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-list]");
        if (target && !target.disabled) openList(target.dataset.class, target.dataset.list);
    });
    document.getElementById("listClose").addEventListener("click", () => listDialog.close());
    // 창 바깥 어두운 곳을 누르면 닫는다.
    listDialog.addEventListener("click", (event) => { if (event.target === listDialog) listDialog.close(); });
    // 사이트 공용 뒤로가기는 명단 창부터 닫는다.
    window.addEventListener("sitebackrequest", (event) => {
        if (listDialog.open) { event.preventDefault(); listDialog.close(); }
    });

    async function loadDashboard() {
        setStatus("불러오는 중…");
        try {
            const dateStr = document.getElementById("dashboardDate").value;
            const res = await api(`/api/school-admin/dashboard?date=${dateStr}`);
            renderDashboard(res.students || [], res.events || []);
            setStatus("");
        } catch (error) {
            setStatus(error.message || "불러오지 못했습니다.", true);
            if (error.status === 401 || error.status === 403) {
                setTimeout(() => { location.href = "/classtools/"; }, 2000);
            }
        }
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        document.getElementById("dashboardDate").value = formatDate(currentDate);
        loadDashboard();
    }

    document.getElementById("dashboardDate").value = formatDate(currentDate);
    document.getElementById("prevDateBtn").addEventListener("click", () => changeDate(-1));
    document.getElementById("nextDateBtn").addEventListener("click", () => changeDate(1));
    document.getElementById("dashboardDate").addEventListener("change", (e) => {
        currentDate = new Date(e.target.value);
        loadDashboard();
    });
    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);

    loadDashboard();
})();
</script>
</body>
</html>
