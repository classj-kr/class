<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ec">
    <title>출결 현황판</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18211d;
            --muted: #647069;
            --paper: #fffdf8;
            --canvas: #f3efe7;
            --line: #d8d2c6;
            --brand: #246b55;
            --brand-dark: #18503f;
            --brand-soft: #dfeee8;
            --danger: #b43c36;
            --danger-soft: #fff0ee;
            --info: #2b6cb0;
            --info-soft: #e9f2fc;
            --shadow: 0 18px 50px rgba(41, 50, 45, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 34rem), var(--canvas);
            font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
            font-size: 14px;
        }
        button, input, select { font: inherit; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .back-btn:hover { background: var(--canvas); }
        .top-school { font-size: 12px; color: var(--muted); }

        .main { padding: 16px 24px; max-width: 1100px; margin: 0 auto; }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .date-picker-wrap { display: flex; align-items: center; gap: 6px; }
        .icon-btn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
            font-size: 16px;
        }
        .icon-btn:hover { background: var(--canvas); }
        .date-input {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink);
            min-height: 40px;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 40px; padding: 0 16px;
            border: none; border-radius: 10px;
            font-weight: 800; font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            background: var(--brand); color: #fff;
        }
        .btn:hover { background: var(--brand-dark); }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .summary-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px;
        }
        .summary-card.warning { background: var(--danger-soft); border-color: #f0b8b5; }
        .summary-card.info { background: var(--info-soft); border-color: #b9d6ef; }
        .card-title { font-size: 12px; color: var(--muted); font-weight: 700; }
        .card-value { font-size: 26px; font-weight: 800; margin-top: 4px; }

        .table-wrap {
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--paper);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: var(--canvas);
            color: var(--muted);
            font-weight: 700;
            font-size: 11px;
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
        tfoot td { font-weight: 800; background: var(--canvas); }
        .status-warning { color: var(--danger); font-weight: 800; }
        .status-info { color: var(--info); font-weight: 800; }
        .status-normal { color: var(--muted); }

        .status-msg { font-size: 13px; color: var(--muted); min-height: 20px; }
        .status-msg.error { color: var(--danger); }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <a href="/classtools/" class="back-btn" title="뒤로">←</a>
    </div>
</div>

<div class="main">
    <div class="card">
        <div class="controls-row">
            <div class="date-picker-wrap">
                <button class="icon-btn" id="prevDateBtn" title="이전 날짜">←</button>
                <input type="date" id="dashboardDate" class="date-input">
                <button class="icon-btn" id="nextDateBtn" title="다음 날짜">→</button>
            </div>
            <button class="btn" id="refreshBtn">🔄 새로고침</button>
            <span class="status-msg" id="statusMsg"></span>
        </div>

        <div class="summary-cards">
            <div class="summary-card">
                <div class="card-title">총 현원</div>
                <div class="card-value" id="totalStudentsCount">0</div>
            </div>
            <div class="summary-card warning">
                <div class="card-title">결석</div>
                <div class="card-value" id="totalAbsenceCount">0</div>
            </div>
            <div class="summary-card info">
                <div class="card-title">지각</div>
                <div class="card-value" id="totalTardyCount">0</div>
            </div>
            <div class="summary-card info">
                <div class="card-title">조퇴</div>
                <div class="card-value" id="totalEarlyCount">0</div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>학년-반</th>
                        <th>재적</th>
                        <th>출석</th>
                        <th>결석</th>
                        <th>지각</th>
                        <th>조퇴</th>
                    </tr>
                </thead>
                <tbody id="dashboardTableBody"></tbody>
                <tfoot id="dashboardTableFoot"></tfoot>
            </table>
        </div>
    </div>
</div>

<script>
(() => {
    "use strict";

    let currentDate = new Date();

    async function api(path, opts = {}) {
        const res = await fetch(path, {
            ...opts,
            headers: { "Content-Type": "application/json", ...(opts.headers || {}) }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const err = new Error(data.message || "서버 오류가 발생했습니다.");
            err.status = res.status;
            throw err;
        }
        return data;
    }

    function formatDate(date) {
        const d = new Date(date);
        let month = "" + (d.getMonth() + 1);
        let day = "" + d.getDate();
        const year = d.getFullYear();
        if (month.length < 2) month = "0" + month;
        if (day.length < 2) day = "0" + day;
        return [year, month, day].join("-");
    }

    function setStatus(msg, isError) {
        const el = document.getElementById("statusMsg");
        el.textContent = msg || "";
        el.className = "status-msg" + (isError ? " error" : "");
    }

    function renderDashboard(roster, notices, formalNotes, experientialApps) {
        const tbody = document.getElementById("dashboardTableBody");
        tbody.innerHTML = "";
        let sumTotal = 0, sumPresent = 0, sumAbsence = 0, sumTardy = 0, sumEarly = 0;
        const classMap = new Map();

        roster.forEach(r => {
            const key = `${r.grade}-${r.class_number}`;
            classMap.set(key, {
                grade: r.grade,
                classNum: r.class_number,
                total: parseInt(r.total_students, 10),
                absence: 0, tardy: 0, early: 0
            });
        });

        notices.forEach(n => {
            const key = `${n.grade}-${n.class_number}`;
            if (!classMap.has(key)) {
                classMap.set(key, { grade: n.grade, classNum: n.class_number, total: 0, absence: 0, tardy: 0, early: 0 });
            }
            const c = classMap.get(key);
            if (n.notice_type === "결석") c.absence += parseInt(n.count, 10);
            else if (n.notice_type === "지각") c.tardy += parseInt(n.count, 10);
            else if (n.notice_type === "조퇴") c.early += parseInt(n.count, 10);
        });

        formalNotes.forEach(fn => {
            const key = `${fn.grade}-${fn.class_number}`;
            if (!classMap.has(key)) {
                classMap.set(key, { grade: fn.grade, classNum: fn.class_number, total: 0, absence: 0, tardy: 0, early: 0 });
            }
            classMap.get(key).absence += parseInt(fn.count, 10);
        });

        (experientialApps || []).forEach(ea => {
            const key = `${ea.grade}-${ea.class_number}`;
            if (!classMap.has(key)) {
                classMap.set(key, { grade: ea.grade, classNum: ea.class_number, total: 0, absence: 0, tardy: 0, early: 0 });
            }
            classMap.get(key).absence += parseInt(ea.count, 10);
        });

        const sortedClasses = Array.from(classMap.values()).sort((a, b) => {
            if (a.grade !== b.grade) return a.grade - b.grade;
            return a.classNum - b.classNum;
        });

        sortedClasses.forEach(c => {
            const present = Math.max(0, c.total - c.absence);
            sumTotal += c.total;
            sumPresent += present;
            sumAbsence += c.absence;
            sumTardy += c.tardy;
            sumEarly += c.early;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${c.grade}학년 ${c.classNum}반</td>
                <td>${c.total}</td>
                <td>${present}</td>
                <td class="${c.absence > 0 ? "status-warning" : "status-normal"}">${c.absence}</td>
                <td class="${c.tardy > 0 ? "status-info" : "status-normal"}">${c.tardy}</td>
                <td class="${c.early > 0 ? "status-info" : "status-normal"}">${c.early}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById("dashboardTableFoot").innerHTML = `
            <tr>
                <td>총계</td>
                <td>${sumTotal}</td>
                <td>${sumPresent}</td>
                <td class="${sumAbsence > 0 ? "status-warning" : ""}">${sumAbsence}</td>
                <td class="${sumTardy > 0 ? "status-info" : ""}">${sumTardy}</td>
                <td class="${sumEarly > 0 ? "status-info" : ""}">${sumEarly}</td>
            </tr>
        `;

        document.getElementById("totalStudentsCount").textContent = sumTotal;
        document.getElementById("totalAbsenceCount").textContent = sumAbsence;
        document.getElementById("totalTardyCount").textContent = sumTardy;
        document.getElementById("totalEarlyCount").textContent = sumEarly;
    }

    async function loadDashboard() {
        setStatus("불러오는 중…");
        try {
            const dateStr = document.getElementById("dashboardDate").value;
            const res = await api(`/api/school-admin/dashboard?date=${dateStr}`);
            renderDashboard(res.roster, res.notices, res.formalNotes, res.experientialApps);
            setStatus("");
        } catch (error) {
            setStatus(error.message || "불러오지 못했습니다.", true);
            if (error.status === 401 || error.status === 403) {
                setTimeout(() => { location.href = "/classtools/"; }, 2000);
            }
        }
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        document.getElementById("dashboardDate").value = formatDate(currentDate);
        loadDashboard();
    }

    document.getElementById("dashboardDate").value = formatDate(currentDate);
    document.getElementById("prevDateBtn").addEventListener("click", () => changeDate(-1));
    document.getElementById("nextDateBtn").addEventListener("click", () => changeDate(1));
    document.getElementById("dashboardDate").addEventListener("change", (e) => {
        currentDate = new Date(e.target.value);
        loadDashboard();
    });
    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);

    loadDashboard();
})();
</script>
</body>
</html>
