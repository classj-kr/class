<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알림장</title>
    <link rel="manifest" href="/classboard/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
</head>
<body>
    <!-- 게시판 탭을 제목 줄에 함께 둔다. 제목만으로 한 줄을 쓰지 않도록. -->
    <header class="header">
        <a href="/" class="back-link" aria-label="메인으로">←</a>
        <span class="header-title">
            <span class="material-symbols-outlined">campaign</span>
            알림장
        </span>
        <nav id="boardPickerSection" class="board-picker hidden"></nav>
        <div class="user-info" id="userInfo">
            <!-- 사용자 정보 표시 -->
        </div>
    </header>

    <main class="container">
        <!-- 과목별 보기 -->
        <section id="filterSection" class="board-filters hidden"></section>

        <!-- 교사용 새 글 작성 영역 -->
        <section id="composerSection" class="post-composer hidden">
            <textarea id="postContent" class="post-input" placeholder="새로운 공지사항이나 글을 작성해보세요... (http:// 링크 자동 변환)"></textarea>
            <div class="post-actions">
                <span id="composerTarget" class="composer-target"></span>
                <button id="postSubmitBtn" class="btn">게시하기</button>
            </div>
        </section>

        <!-- 피드 영역 -->
        <section id="feedSection" class="feed">
            <div class="loader">로딩 중...</div>
        </section>
    </main>

    <!-- 템플릿: 게시물 카드 -->
    <template id="postTemplate">
        <article class="post-card">
            <header class="post-header">
                <div class="post-author-info">
                    <div class="avatar" data-type="post-avatar"></div>
                    <div>
                        <div class="author-name">
                            <span data-type="post-author-name"></span>
                            <span class="author-role" data-type="post-author-role"></span>
                        </div>
                        <div class="post-date" data-type="post-date"></div>
                    </div>
                </div>
                <div class="post-options">
                    <button class="btn-danger hidden" data-type="delete-post" title="게시물 삭제">
                        <span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
                    </button>
                </div>
            </header>
            <div class="post-content" data-type="post-content"></div>
            
            <section class="comments-section">
                <div class="comments-list" data-type="comments-list"></div>
                <div class="comment-input-area">
                    <textarea class="comment-input" data-type="comment-input" rows="1" placeholder="댓글을 입력하세요..."></textarea>
                    <button class="comment-btn" data-type="comment-submit" title="댓글 작성">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </div>
            </section>
        </article>
    </template>

    <!-- 템플릿: 댓글 -->
    <template id="commentTemplate">
        <div class="comment">
            <div class="avatar" data-type="comment-avatar"></div>
            <div class="comment-body">
                <div class="comment-header">
                    <div class="comment-author">
                        <span data-type="comment-author-name"></span>
                        <span class="author-role" style="font-size: 0.75rem;" data-type="comment-author-role"></span>
                    </div>
                    <button class="btn-danger hidden" data-type="delete-comment" title="댓글 삭제" style="padding: 2px 4px;">
                        <span class="material-symbols-outlined" style="font-size: 16px;">close</span>
                    </button>
                </div>
                <div class="comment-content" data-type="comment-content"></div>
            </div>
        </div>
    </template>

    <script src="notice-card.js?v=3"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
