<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 전용 업무 공간 - 가정통신문 및 출결 결재</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --surface: #f1f4f6;
            --line: #dde3e8;
            --ink: #1c2329;
            --muted: #5c6873;
            --green: #17804a;
            /* 옅은 바탕(회색·연초록) 위 초록 글씨. #17804a 는 거기서 4.5:1 이 안 된다. */
            --green-strong: #11683c;
            --green-soft: #e6f4ec;
            --amber: #a35a00;
            --amber-soft: #fff4e0;
            --danger: #d0342c;
            --danger-soft: #fdecea;
            --shadow: 0 1px 3px rgba(16,24,40,.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 20px;
            background: var(--bg);
            color: var(--ink);
            accent-color: var(--green);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            max-width: 1050px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            flex: none;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
        }

        .back-btn:hover { color: var(--green); border-color: var(--green); }

        .tab-btn {
            padding: 12px 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--muted);
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }

        .panel-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
        }

        textarea { min-height: 110px; resize: vertical; }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(23,128,74,.18);
        }

        .btn-action {
            padding: 12px 24px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-action:hover { background: var(--green-strong); }

        .btn-secondary {
            padding: 8px 14px;
            background: var(--surface);
            color: var(--green-strong);
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 12px;
            background: var(--panel);
        }

        .badge {
            font-size: 11px;
            padding: 4px 9px;
            border-radius: 6px;
            font-weight: 700;
        }

        .badge.pending { background: var(--amber-soft); color: var(--amber); }
        .badge.approved { background: var(--green-soft); color: var(--green-strong); }

        .hidden { display: none !important; }

        /* 주소록 3단. 좁은 화면에서는 가운데 명단이 손가락만큼 좁아져 이름이 잘렸다. */
        .ab-grid {
            display: grid;
            grid-template-columns: 220px 1fr 240px;
            gap: 1px;
            background: var(--line);
            height: 540px;
            overflow: hidden;
        }

        .ab-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        @media (max-width: 860px) {
            .ab-grid {
                grid-template-columns: 1fr;
                height: auto;
                max-height: 72vh;
                overflow-y: auto;
            }
            .ab-grid > div { max-height: 40vh; }
        }
    </style>
</head>
<body>
    <main>
        <!-- 제목 줄을 따로 두지 않는다. 탭 이름이 곧 이 페이지가 무엇인지 말한다. -->
        <div class="nav-tabs">
            <a class="back-btn" href="/classtools/" aria-label="교사 도구로 돌아가기">←</a>
            <button class="tab-btn active" onclick="switchSection('send', this)">📢 가정통신문 작성/발송</button>
            <button class="tab-btn" onclick="switchSection('quick', this)">🤒 실시간 출결 예고 접수함</button>
            <button class="tab-btn" onclick="switchSection('approval', this)">📝 결석계 & 체험학습 전자 결재함</button>
            <button class="tab-btn" onclick="switchSection('replies', this)">📊 가정통신문 회신 수합 현황</button>
        </div>

        <!-- 1. 가정통신문 작성/발송 -->
        <section id="sec-send">
            <div class="panel-card">
                <!-- 회신 받는 방법. 넷 중 하나를 고르는 게 아니다 -- 확인만 받을 수도,
                     동의를 받으면서 문항까지 함께 물을 수도 있다(체험학습 동의 + 알레르기
                     조사처럼). 그래서 '회신 한 가지'와 '문항 얹기'를 따로 둔다. -->
                <div style="border-bottom: 2px solid var(--line); margin-bottom: 20px; padding-bottom: 14px;">
                    <label style="margin-bottom:8px;">이 통신문에서 받을 것</label>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                        <button type="button" class="tab-type active" data-reply="none" onclick="switchNoticeCategory('none', this)" style="padding:10px 18px; border-radius:8px; border:1px solid var(--green); background:var(--green-soft); color:var(--green-strong); font-weight:800; font-size:14px; cursor:pointer;">
                            📣 회신 없음
                        </button>
                        <button type="button" class="tab-type" data-reply="confirm" onclick="switchNoticeCategory('confirm', this)" style="padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:800; font-size:14px; cursor:pointer;">
                            👀 확인 회신
                        </button>
                        <button type="button" class="tab-type" data-reply="agree" onclick="switchNoticeCategory('agree', this)" style="padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:800; font-size:14px; cursor:pointer;">
                            ✍️ 동의 / 미동의
                        </button>
                    </div>
                    <label style="display:inline-flex; align-items:center; gap:8px; margin:0; cursor:pointer; color:var(--ink); font-weight:700; font-size:14px;">
                        <input type="checkbox" id="nWantSurvey" onchange="toggleSurveyBuilder(this.checked)" style="width:18px; height:18px;">
                        📝 물어볼 문항도 넣기 <span style="color:var(--muted); font-weight:600; font-size:12px;">(설문·신청·투표)</span>
                    </label>
                </div>

                <h2 style="font-size:18px; margin:0 0 16px; color:var(--green);">📢 알리미 신규 작성 및 학부모 발송</h2>
                <form id="noticeSendForm" onsubmit="handleNoticeSend(event)">
                    <div class="form-group">
                        <label>발송 제목</label>
                        <input type="text" id="nTitle" placeholder="예: 2026학년도 2학기 현장체험학습 안내 및 동의서" required>
                    </div>

                    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 16px;">
                        <div style="flex:2; min-width: 280px;">
                            <label>수신 대상 선택</label>
                            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                                <button type="button" class="btn-secondary" style="min-height:44px; font-weight:800; font-size:14px; background:var(--green-soft); border-color:var(--green);" onclick="openAddressBookModal()">
                                    📖 주소록에서 대상 선택...
                                </button>
                                <label style="display:inline-flex; align-items:center; gap:6px; margin:0; cursor:pointer; font-size:13px; color:var(--ink); font-weight:700;">
                                    <input type="checkbox" id="nDeduplicateGuardians" checked style="width:18px; height:18px;">
                                    다계정(다자녀) 1건만 보내기
                                </label>
                            </div>
                            <div id="selectedTargetChips" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">
                                <span class="badge pending" style="background:var(--green-soft); color:var(--green-strong); padding:6px 12px; font-size:13px;">🌐 전교생 학부모 전체 (기본)</span>
                            </div>
                        </div>
                    </div>

                    <div id="textBox" class="form-group">
                        <label>가정통신문 본문 내용</label>
                        <textarea id="nTextBody" placeholder="학부모님께 전달할 알림 내용을 상세히 입력하세요."></textarea>
                    </div>

                    <!-- 설문 문항 편집기 (설문·신청·투표 탭에서만) -->
                    <div id="surveyBuilder" class="form-group hidden">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <label style="margin:0;">설문 문항</label>
                            <button type="button" class="btn-secondary" onclick="addSurveyQuestion()">➕ 문항 추가</button>
                        </div>
                        <div id="surveyQuestionList"></div>
                    </div>

                    <button type="submit" class="btn-action">🚀 학부모 모바일 알림장으로 가정통신문 전송</button>
                </form>
            </div>
        </section>

        <!-- e-알리미 3단 주소록 모달 -->
        <div id="addressBookModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(16,24,40,0.45); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
            <div style="background:var(--panel); border:1px solid var(--line); border-radius:18px; width:min(94%, 900px); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 12px 32px rgba(16,24,40,0.18); color:var(--ink); overflow:hidden;">
                <!-- Modal Header -->
                <div style="padding:16px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--surface);">
                    <h3 style="margin:0; font-size:18px; color:var(--green); display:flex; align-items:center; gap:8px;">
                        📖 주소록 <span style="font-size:13px; color:var(--muted); font-weight:normal;">(전체 회원: <strong id="abTotalCount" style="color:var(--ink);">0</strong>명)</span>
                    </h3>
                    <button type="button" onclick="closeAddressBookModal()" style="background:none; border:none; color:var(--ink); font-size:24px; cursor:pointer;">✕</button>
                </div>

                <!-- Modal 3-Pane Body -->
                <div class="ab-grid">
                    <!-- Pane 1: 회원그룹 트리 -->
                    <div style="background:var(--surface); padding:14px; overflow-y:auto;">
                        <h4 style="margin:0 0 10px; font-size:13px; color:var(--green-strong);">📁 회원 그룹</h4>
                        <div id="abGroupTreeList" style="display:flex; flex-direction:column; gap:6px; font-size:13px;">
                            <!-- Tree loaded by JS -->
                        </div>
                    </div>

                    <!-- Pane 2: 회원 목록 & 검색 -->
                    <div style="background:var(--panel); padding:14px; display:flex; flex-direction:column; overflow:hidden;">
                        <div class="ab-toolbar">
                            <input type="text" id="abSearchInput" placeholder="이름 / 학부모 검색..." style="height:38px; font-size:13px; flex:1;" oninput="filterAddressBookStudents()">
                            <select id="abSortSelect" onchange="filterAddressBookStudents()" style="height:38px; font-size:13px; width:auto;">
                                <option value="roster">번호순</option>
                                <option value="name">이름순</option>
                            </select>
                            <button type="button" class="btn-secondary" id="abSelectAllBtn" style="height:38px; padding:0 12px; white-space:nowrap;" onclick="selectAllCurrentList()">전체선택</button>
                        </div>
                        <div id="abStudentList" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:4px;">
                            <!-- Students loaded by JS -->
                        </div>
                    </div>

                    <!-- Pane 3: 선택된 수신 대상 바구니 -->
                    <div style="background:var(--surface); padding:14px; display:flex; flex-direction:column; overflow:hidden;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:8px;">
                            <span style="font-size:13px; font-weight:bold; color:var(--green-strong);">
                                👤 총 <strong id="abSelectedCount" style="color:var(--ink);">0</strong>건 선택
                            </span>
                            <button type="button" style="background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline;" onclick="clearAllSelectedTargets()">전체취소</button>
                        </div>
                        <div id="abSelectedBasket" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
                            <!-- Selected items loaded by JS -->
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div style="padding:14px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:12px; background:var(--surface);">
                    <button type="button" class="btn-secondary" onclick="closeAddressBookModal()">취소</button>
                    <button type="button" class="btn-action" style="padding:10px 24px;" onclick="confirmAddressBookSelection()">확인 (선택 완료)</button>
                </div>
            </div>
        </div>

        <!-- 2. 출결 사전 예고 -->
        <section id="sec-quick" class="hidden">
            <div class="panel-card">
                <h2 style="font-size:18px; margin:0 0 16px; color:var(--green);">🤒 학부모 당일 출결 예고 접수 목록</h2>
                <div id="quickList">
                    <div class="item-row">
                        <div>
                            <strong>3학년 2반 5번 김철수</strong> <span class="badge pending">지각 예고</span>
                            <p style="margin:6px 0 0; color:var(--muted); font-size:14px;">
                                "아이가 감기 기운으로 병원 들렀다가 2교시(10:00)에 등교시킵니다."
                            </p>
                        </div>
                        <span style="font-size:12px; color:var(--muted);">오늘 08:20 접수</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 결석계 & 체험학습 결재함 -->
        <section id="sec-approval" class="hidden">
            <div class="panel-card">
                <h2 style="font-size:18px; margin:0 0 16px; color:var(--green);">📝 결석계 및 교외체험학습 전자 결재함</h2>
                <!-- 내 서명. 승인할 때 결재란에 이 그림이 찍힌다. -->
                <div id="signatureCard" style="border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; background:var(--surface);">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                        <div>
                            <strong style="font-size:15px;">✍️ 내 결재 서명</strong>
                            <span id="approverRoleLabel" style="margin-left:8px; color:var(--muted); font-size:13px;"></span>
                        </div>
                        <button class="btn-secondary" type="button" onclick="toggleSignatureEditor()">서명 등록·바꾸기</button>
                    </div>
                    <div id="signatureCurrent" style="margin-top:10px; display:none;">
                        <img id="signatureCurrentImg" alt="등록된 서명" style="max-height:60px; background:#fff; border-radius:6px; padding:4px;">
                    </div>
                    <p id="signatureMissing" style="margin:10px 0 0; color:var(--amber); font-size:13px; display:none;">아직 서명이 없습니다. 승인하려면 먼저 등록해 주세요.</p>
                    <div id="signatureEditor" style="display:none; margin-top:12px;">
                        <!-- 서명은 결재란 한 칸에 들어간다. 종이 결재란과 같은 가로세로
                             비율(5:2)로 두어야 그려 본 대로 찍힌다. -->
                        <canvas id="teacherSignatureCanvas" width="600" height="240"
                                style="width:min(100%, 300px); height:120px; background:#fff; border-radius:8px; border:1px dashed #c9c9c9; touch-action:none; display:block;"></canvas>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <button class="btn-action" type="button" style="padding:8px 16px; font-size:14px;" onclick="saveTeacherSignature()">이 서명으로 등록</button>
                            <button class="btn-secondary" type="button" onclick="clearTeacherSignature()">지우기</button>
                        </div>
                        <p id="signatureStatus" style="font-size:13px; margin:8px 0 0; min-height:18px;"></p>
                    </div>
                </div>
                <div id="approvalList">
                    <!-- 실제 목록은 loadApprovals() 가 채운다. 가짜 견본 행을 두면 불러오기 전에
                         없는 학생이 보인다. -->
                    <div class="item-row" style="justify-content:center; color:var(--muted);">불러오는 중…</div>
                </div>
            </div>
        </section>

        <!-- 4. 가정통신문 회신 수합 현황 -->
        <section id="sec-replies" class="hidden">
            <div class="panel-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h2 style="font-size:18px; margin:0; color:var(--green);">📊 가정통신문 회신 수합 현황</h2>
                    <button class="btn-secondary" onclick="loadNoticeReplies()">🔄 새로고침</button>
                </div>
                <div id="noticeReplyList">불러오는 중…</div>
                <div id="noticeReplyDetail" style="margin-top:18px;"></div>
            </div>
        </section>
    </main>

    <script>
        function switchSection(secId, btn) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('sec-' + secId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (secId === 'quick') loadQuickAbsences();
            if (secId === 'approval') loadApprovals();
            if (secId === 'replies') loadNoticeReplies();
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        const REPLY_TYPE_LABELS = { none: '회신 없음', confirm: '확인 회신', agree: '동의서', survey: '설문' };
        const REPLY_CHOICE_LABELS = { confirmed: '확인함', agree: '동의', disagree: '미동의', submitted: '제출함' };

        // 설문 문항별 집계. 막대는 응답자 대비 비율.
        function renderSurveyStats(survey) {
            if (!Array.isArray(survey) || survey.length === 0) return '';
            const blocks = survey.map((q, qi) => {
                if (q.type === 'text') {
                    const answers = (q.textAnswers || []).map(a => `
                        <li style="margin-bottom:6px;">
                            <strong style="color:var(--ink);">${escapeHtml(a.studentName)}</strong>
                            <span style="color:var(--muted);"> — ${escapeHtml(a.text)}</span>
                        </li>`).join('');
                    return `
                        <div style="margin-bottom:18px;">
                            <p style="margin:0 0 8px; font-weight:700;">${qi + 1}. ${escapeHtml(q.text)}
                                <span style="color:var(--muted); font-weight:600; font-size:13px;">(서술형 · ${q.answeredCount}명 응답)</span></p>
                            <ul style="margin:0; padding-left:18px; font-size:14px;">${answers || '<li style="color:var(--muted);">응답 없음</li>'}</ul>
                        </div>`;
                }

                const total = q.answeredCount || 0;
                const bars = (q.options || []).map(o => {
                    const pct = total > 0 ? Math.round((o.count / total) * 100) : 0;
                    return `
                        <div style="margin-bottom:6px;">
                            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:2px;">
                                <span>${escapeHtml(o.label)}</span>
                                <span style="color:var(--muted);">${o.count}명 (${pct}%)</span>
                            </div>
                            <div style="height:8px; background:var(--line); border-radius:4px; overflow:hidden;">
                                <div style="height:100%; width:${pct}%; background:var(--green);"></div>
                            </div>
                        </div>`;
                }).join('');

                return `
                    <div style="margin-bottom:18px;">
                        <p style="margin:0 0 8px; font-weight:700;">${qi + 1}. ${escapeHtml(q.text)}
                            <span style="color:var(--muted); font-weight:600; font-size:13px;">(${q.type === 'multiple' ? '복수 선택' : '단일 선택'} · ${total}명 응답)</span></p>
                        ${bars}
                    </div>`;
            }).join('');

            return `<div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);">
                <h4 style="margin:0 0 12px; color:var(--green-strong); font-size:15px;">📈 문항별 집계</h4>
                ${blocks}
            </div>`;
        }

        async function loadNoticeReplies() {
            const listEl = document.getElementById('noticeReplyList');
            const detailEl = document.getElementById('noticeReplyDetail');
            if (!listEl) return;
            detailEl.innerHTML = '';
            try {
                const res = await fetch('/api/teacher/notices');
                if (!res.ok) throw new Error('목록을 불러오지 못했습니다.');
                const data = await res.json();
                const notices = data.notices || [];

                if (notices.length === 0) {
                    listEl.innerHTML = '<div class="item-row" style="justify-content:center; color:var(--muted);">발송한 가정통신문이 없습니다.</div>';
                    return;
                }

                listEl.innerHTML = notices.map(n => {
                    const tally = n.replyType === 'agree'
                        ? `동의 <strong style="color:var(--green);">${n.agreeCount}</strong> · 미동의 <strong style="color:var(--danger);">${n.disagreeCount}</strong>`
                        : n.replyType === 'confirm'
                            ? `확인 <strong style="color:var(--green);">${n.confirmedCount}</strong>명`
                            : '<span style="color:var(--muted);">회신을 받지 않는 통신문</span>';
                    return `
                        <div class="item-row">
                            <div>
                                <span class="badge ${n.replyType === 'none' ? 'pending' : 'approved'}">${escapeHtml(REPLY_TYPE_LABELS[n.replyType] || n.replyType)}</span>
                                <strong style="margin-left:8px; font-size:16px;">${escapeHtml(n.title)}</strong>
                                <p style="margin:6px 0 0; color:var(--muted); font-size:13px;">
                                    ${escapeHtml(new Date(n.createdAt).toLocaleDateString())} · ${escapeHtml(n.senderName)} · ${tally}
                                </p>
                            </div>
                            ${n.replyType === 'none' ? '' : `<button class="btn-secondary" onclick="openReplyDetail('${escapeHtml(n.id)}')">👥 명단별 현황 보기</button>`}
                        </div>`;
                }).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="item-row" style="justify-content:center; color:var(--danger);">${escapeHtml(err.message)}</div>`;
            }
        }

        async function openReplyDetail(noticeId) {
            const detailEl = document.getElementById('noticeReplyDetail');
            detailEl.innerHTML = '<div class="item-row" style="justify-content:center; color:var(--muted);">불러오는 중…</div>';
            try {
                const res = await fetch(`/api/teacher/notices/${encodeURIComponent(noticeId)}/replies`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '현황을 불러오지 못했습니다.');

                const pending = data.roster.filter(r => !r.choice);
                const rows = data.roster.map(r => `
                    <tr>
                        <td style="padding:6px 8px;">${r.grade}-${r.classNumber} ${escapeHtml(r.studentNumber)}번</td>
                        <td style="padding:6px 8px; font-weight:700;">${escapeHtml(r.studentName)}</td>
                        <td style="padding:6px 8px; color:${!r.choice || r.choice === 'disagree' ? 'var(--danger)' : 'var(--green-strong)'}; font-weight:700;">
                            ${r.choice ? escapeHtml(REPLY_CHOICE_LABELS[r.choice] || r.choice) : '미회신'}
                        </td>
                        <td style="padding:6px 8px; color:var(--muted); font-size:12px;">
                            ${r.repliedAt ? escapeHtml(new Date(r.repliedAt).toLocaleString()) : ''}
                        </td>
                    </tr>`).join('');

                detailEl.innerHTML = `
                    <div style="border:1px solid var(--line); border-radius:12px; padding:16px; background:var(--surface);">
                        <h3 style="margin:0 0 6px; color:var(--green-strong); font-size:16px;">${escapeHtml(data.notice.title)}</h3>
                        <p style="margin:0 0 12px; color:var(--muted); font-size:13px;">
                            회신 <strong style="color:var(--ink);">${data.repliedCount}</strong> / 대상 <strong style="color:var(--ink);">${data.total}</strong>명
                            ${pending.length > 0 ? ` · 미회신 <strong style="color:var(--danger);">${pending.length}</strong>명` : ' · <span style="color:var(--green-strong);">전원 회신 완료</span>'}
                        </p>
                        <div style="max-height:360px; overflow-y:auto;">
                            <table style="width:100%; border-collapse:collapse; font-size:14px;">
                                <thead><tr style="text-align:left; color:var(--green-strong); border-bottom:1px solid var(--line);">
                                    <th style="padding:6px 8px;">학반/번호</th><th style="padding:6px 8px;">이름</th>
                                    <th style="padding:6px 8px;">회신</th><th style="padding:6px 8px;">시각</th>
                                </tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                        ${renderSurveyStats(data.survey)}
                    </div>`;
            } catch (err) {
                detailEl.innerHTML = `<div class="item-row" style="justify-content:center; color:var(--danger);">${escapeHtml(err.message)}</div>`;
            }
        }

        function openPrintForm(type, docId) {
            window.open(`/notice/print-templates.html?type=${type}&id=${docId}`, '_blank', 'width=900,height=1000');
        }

        // What this notice asks of guardians: 'none' | 'confirm' | 'agree'.
        let noticeReplyType = 'none';
        let rawAddressBook = { classes: [], columns: [], groups: [], students: [] };
        // 명단 열의 값들을 한 줄로 펴 둔다. 나무의 체크상자가 이름 대신 이 번호를
        // 쓰게 해서, 항목 이름에 따옴표가 들어가도 깨지지 않게 한다.
        let abOptions = [];
        let selectedTargets = [];

        // 회신 방법은 셋 중 하나. 없음 / 확인만 / 동의·미동의.
        function switchNoticeCategory(cat, btn) {
            noticeReplyType = cat;
            document.querySelectorAll('.tab-type').forEach(b => {
                b.style.background = 'var(--surface)';
                b.style.color = 'var(--muted)';
                b.style.borderColor = 'var(--line)';
            });
            btn.style.background = 'var(--green-soft)';
            btn.style.color = 'var(--green-strong)';
            btn.style.borderColor = 'var(--green)';
        }

        // 문항은 회신 방법과 따로 논다. 확인만 받으면서 물어볼 수도, 동의를 받으면서
        // 물어볼 수도, 문항만 받을 수도 있다.
        function toggleSurveyBuilder(wanted) {
            document.getElementById('surveyBuilder').classList.toggle('hidden', !wanted);
            if (wanted && document.querySelectorAll('#surveyQuestionList .survey-item').length === 0) {
                addSurveyQuestion();
            }
        }

        // --- 설문 문항 편집기 ---
        let surveyQuestionSeq = 0;

        function addSurveyQuestion() {
            const list = document.getElementById('surveyQuestionList');
            const id = ++surveyQuestionSeq;
            const box = document.createElement('div');
            box.className = 'survey-item';
            box.dataset.qid = String(id);
            box.style.cssText = 'border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--surface);';
            box.innerHTML = `
                <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                    <span style="color:var(--green-strong); font-weight:800;">문항</span>
                    <input type="text" class="sq-text" placeholder="예: 급식 만족도는 어떠신가요?" style="flex:1;">
                    <select class="sq-type" onchange="onSurveyTypeChange(this)" style="width:130px;">
                        <option value="single">객관식(하나)</option>
                        <option value="multiple">객관식(복수)</option>
                        <option value="text">서술형</option>
                    </select>
                    <label style="display:inline-flex; align-items:center; gap:4px; margin:0; font-size:13px; color:var(--ink); white-space:nowrap;">
                        <input type="checkbox" class="sq-required" checked style="width:16px; height:16px;"> 필수
                    </label>
                    <button type="button" class="btn-secondary" onclick="this.closest('.survey-item').remove()">🗑️</button>
                </div>
                <div class="sq-options">
                    <textarea class="sq-option-text" rows="3" placeholder="보기를 줄바꿈으로 구분해 입력하세요&#10;매우 만족&#10;보통&#10;불만족"></textarea>
                </div>`;
            list.appendChild(box);
        }

        function onSurveyTypeChange(select) {
            const box = select.closest('.survey-item');
            box.querySelector('.sq-options').classList.toggle('hidden', select.value === 'text');
        }

        function collectSurveyQuestions() {
            return Array.from(document.querySelectorAll('#surveyQuestionList .survey-item')).map(box => {
                const type = box.querySelector('.sq-type').value;
                const question = {
                    text: box.querySelector('.sq-text').value.trim(),
                    type,
                    required: box.querySelector('.sq-required').checked
                };
                if (type !== 'text') {
                    question.options = box.querySelector('.sq-option-text').value
                        .split('\n').map(s => s.trim()).filter(Boolean);
                }
                return question;
            }).filter(q => q.text);
        }

        async function openAddressBookModal() {
            document.getElementById('addressBookModal').style.display = 'flex';
            if (rawAddressBook.students.length === 0) {
                try {
                    const res = await fetch('/api/teacher/addressbook');
                    if (res.ok) {
                        rawAddressBook = await res.json();
                        abOptions = (rawAddressBook.columns || []).flatMap(col =>
                            col.options.map(o => ({ column: col.name, name: o.name })));
                    }
                } catch(e) { console.error('Addressbook fetch failed:', e); }
            }
            renderAddressBookTree();
            filterAddressBookStudents();
            renderSelectedBasket();
        }

        function closeAddressBookModal() {
            document.getElementById('addressBookModal').style.display = 'none';
        }

        // 나무의 한 가지에 드는 학생들. 체크 한 번으로 그 무리를 통째로 담기 위해
        // 필요하다. 예전에는 가지를 눌러도 가운데 명단이 걸러질 뿐이라, 담으려면
        // 가운데서 전체선택을 또 눌러야 했다.
        function studentsOfNode(key) {
            const all = rawAddressBook.students || [];
            if (key === 'ALL') return all;
            if (key.startsWith('GRADE_')) {
                const g = Number(key.split('_')[1]);
                return all.filter(s => s.grade === g);
            }
            if (key.startsWith('CLASS_')) {
                const [, g, c] = key.split('_');
                return all.filter(s => s.grade === Number(g) && s.class_number === Number(c));
            }
            // 명단 열의 값 하나(동아리 > 오케스트라). 열 전체(OPTCOL_)를 고르면
            // 그 열에 값이 적힌 학생 전부.
            if (key.startsWith('OPT_')) {
                const opt = abOptions[Number(key.slice('OPT_'.length))];
                return opt ? all.filter(s => hasOption(s, opt.name)) : [];
            }
            if (key.startsWith('OPTCOL_')) {
                const column = (rawAddressBook.columns || [])[Number(key.slice('OPTCOL_'.length))];
                if (!column) return [];
                return all.filter(s => column.options.some(o => hasOption(s, o.name)));
            }
            return [];
        }

        // 명단 열의 값이 이 학생에게 적혀 있는지. 학교마다 명단을 두 모양으로 쓴다.
        //   1) 열 하나에 값 적기:  {"동아리": "오케스트라"}  -> 값이 항목 이름
        //   2) 항목마다 열 하나:   {"오케스트라": "O"}       -> 열 이름이 항목 이름
        // 칸이 여러 개인 열은 열 이름 뒤에 표가 붙지만(방과후①), 값은 그대로다.
        function hasOption(student, optionName) {
            const fields = student.custom_fields || {};
            if (Object.prototype.hasOwnProperty.call(fields, optionName)) return true;
            return Object.values(fields).some(v => String(v) === optionName);
        }

        // 다 담겼는지, 일부만인지, 하나도 아닌지.
        function nodeState(key) {
            const members = studentsOfNode(key);
            if (members.length === 0) return 'none';
            const picked = members.filter(s => isPicked(s.student_id)).length;
            if (picked === 0) return 'none';
            return picked === members.length ? 'all' : 'some';
        }

        function isPicked(studentId) {
            return selectedTargets.some(t => t.id === studentId);
        }

        function pickStudent(s) {
            if (isPicked(s.student_id)) return;
            selectedTargets.push({
                type: 'student', id: s.student_id,
                label: `${s.grade}학년 ${s.class_number}반 ${s.student_number}번 ${s.name}`
            });
        }

        function toggleNode(key, checked) {
            const members = studentsOfNode(key);
            if (checked) {
                members.forEach(pickStudent);
            } else {
                const drop = new Set(members.map(s => s.student_id));
                selectedTargets = selectedTargets.filter(t => !drop.has(t.id));
            }
            renderAddressBookTree();
            renderSelectedBasket();
            filterAddressBookStudents();
        }

        function treeRow(key, label, indent, color) {
            const state = nodeState(key);
            const active = activeFilterType === key;
            return `
                <div style="display:flex; align-items:center; gap:7px; padding:3px 6px 3px ${indent}px; border-radius:6px; ${active ? 'background:var(--green-soft);' : ''}">
                    <input type="checkbox" ${state === 'all' ? 'checked' : ''}
                           data-indeterminate="${state === 'some'}"
                           onchange="toggleNode('${key}', this.checked)"
                           style="width:15px; height:15px; flex:none; margin:0; cursor:pointer;">
                    <span onclick="selectGroupFilter('${key}')" style="cursor:pointer; color:${color}; font-size:13px;">${label}</span>
                </div>`;
        }

        function renderAddressBookTree() {
            const treeEl = document.getElementById('abGroupTreeList');
            if (!treeEl) return;
            const totalCount = (rawAddressBook.students || []).length;
            document.getElementById('abTotalCount').textContent = totalCount;

            let html = treeRow('ALL', `🌐 전교생 (${totalCount}명)`, 6, 'var(--ink)');
            html += `<div style="font-weight:bold; color:var(--green-strong); margin:8px 0 4px; font-size:12px;">🏫 학년 / 반</div>`;

            const gradeMap = {};
            (rawAddressBook.classes || []).forEach(c => {
                if (!gradeMap[c.grade]) gradeMap[c.grade] = [];
                gradeMap[c.grade].push(c);
            });

            Object.keys(gradeMap).sort((a, b) => Number(a) - Number(b)).forEach(g => {
                const classes = gradeMap[g];
                const gradeCount = classes.reduce((sum, cl) => sum + (cl.student_count || 0), 0);
                html += treeRow(`GRADE_${g}`, `📁 ${g}학년 (${gradeCount}명)`, 6, '#0b6e8e');
                classes.forEach(cl => {
                    html += treeRow(`CLASS_${cl.grade}_${cl.class_number}`,
                        `└ ${cl.class_number}반 (${cl.student_count}명)`, 20, 'var(--ink)');
                });
            });

            // 추가 그룹은 학교 관리자가 전교생 명단에 만든 열에서 온다.
            const columns = rawAddressBook.columns || [];
            if (columns.length > 0) {
                html += `<div style="font-weight:bold; color:var(--green-strong); margin:10px 0 4px; font-size:12px;">📌 추가 그룹 (명단 열)</div>`;
                columns.forEach((col, ci) => {
                    const total = col.options.reduce((sum, o) => sum + (o.studentCount || 0), 0);
                    html += treeRow(`OPTCOL_${ci}`, `📁 ${col.name} (${total}명)`, 6, 'var(--amber)');
                    col.options.forEach(o => {
                        const idx = abOptions.findIndex(x => x.column === col.name && x.name === o.name);
                        html += treeRow(`OPT_${idx}`,
                            `└ ${o.name} (${o.studentCount || 0}명)`, 20, 'var(--ink)');
                    });
                });
            }

            treeEl.innerHTML = html;
            // 반만 담긴 가지는 '－' 로 보여 준다. HTML 속성으로는 못 하는 상태다.
            treeEl.querySelectorAll('input[data-indeterminate="true"]').forEach(box => {
                box.indeterminate = true;
            });
        }

        let activeFilterType = 'ALL';

        function selectGroupFilter(filterKey) {
            activeFilterType = filterKey;
            filterAddressBookStudents();
        }

        // 지금 고른 가지 + 검색어에 걸리는 사람들. 명단 그리기와 전체선택이 같은
        // 것을 봐야 눌렀을 때 보이는 대로 담긴다.
        function currentFilteredStudents() {
            const searchEl = document.getElementById('abSearchInput');
            const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
            let filtered = studentsOfNode(activeFilterType);
            if (search) {
                filtered = filtered.filter(s =>
                    s.name.toLowerCase().includes(search) ||
                    String(s.student_number).includes(search) ||
                    (s.guardian1_email && s.guardian1_email.toLowerCase().includes(search))
                );
            }
            const dir = (document.getElementById('abSortSelect') || {}).value || 'roster';
            return [...filtered].sort((a, b) => dir === 'name'
                ? a.name.localeCompare(b.name, 'ko')
                : (a.grade - b.grade) || (a.class_number - b.class_number)
                  || (Number(a.student_number) - Number(b.student_number)));
        }

        function filterAddressBookStudents() {
            const listEl = document.getElementById('abStudentList');
            if (!listEl) return;
            const filtered = currentFilteredStudents();

            const allBtn = document.getElementById('abSelectAllBtn');
            if (allBtn) {
                const allPicked = filtered.length > 0 && filtered.every(s => isPicked(s.student_id));
                allBtn.textContent = allPicked ? '전체해제' : '전체선택';
            }

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted);">해당 조건의 학생/보호자가 없습니다.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(s => {
                const isSelected = isPicked(s.student_id);
                return `
                    <label style="display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; cursor:pointer; margin:0;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleStudentTarget('${s.student_id}', '${s.grade}학년 ${s.class_number}반 ${s.student_number}번 ${s.name}', this.checked)" style="width:16px; height:16px;">
                            <div>
                                <strong style="font-size:13px; color:var(--ink);">${s.grade}-${s.class_number}-${s.student_number} ${s.name}</strong>
                                <div style="font-size:11px; color:var(--muted);">보호자: ${s.guardian1_email || '미등록'}</div>
                            </div>
                        </div>
                        <span class="badge pending" style="font-size:11px; padding:2px 6px;">학부모</span>
                    </label>
                `;
            }).join('');
        }

        // 그룹으로 통째로 담았어도 한 명씩 뺄 수 있다. 그게 이 주소록의 요점이다.
        // 한 명을 빼면 그 그룹 체크는 '일부만 담김'으로 내려간다.
        function toggleStudentTarget(studentId, label, isChecked) {
            if (isChecked) {
                if (!isPicked(studentId)) {
                    selectedTargets.push({ type: 'student', id: studentId, label });
                }
            } else {
                selectedTargets = selectedTargets.filter(t => t.id !== studentId);
            }
            afterSelectionChanged();
        }

        function afterSelectionChanged() {
            renderAddressBookTree();
            renderSelectedBasket();
            filterAddressBookStudents();
        }

        // 지금 가운데에 보이는 사람들만. 예전에는 이 단추가 걸러 보기를 무시하고
        // 전교생을 담았다 -- 1학년만 보면서 눌렀는데 전교생이 담기는 식.
        function selectAllCurrentList() {
            const shown = currentFilteredStudents();
            const allPicked = shown.length > 0 && shown.every(s => isPicked(s.student_id));
            if (allPicked) {
                const drop = new Set(shown.map(s => s.student_id));
                selectedTargets = selectedTargets.filter(t => !drop.has(t.id));
            } else {
                shown.forEach(pickStudent);
            }
            afterSelectionChanged();
        }

        function clearAllSelectedTargets() {
            selectedTargets = [];
            afterSelectionChanged();
        }

        function renderSelectedBasket() {
            const basketEl = document.getElementById('abSelectedBasket');
            const countEl = document.getElementById('abSelectedCount');
            if (countEl) countEl.textContent = selectedTargets.length;
            if (!basketEl) return;

            if (selectedTargets.length === 0) {
                basketEl.innerHTML = '<div style="padding:20px; text-align:center; color:var(--muted); font-size:12px;">선택된 수신 대상이 없습니다.</div>';
                return;
            }

            basketEl.innerHTML = selectedTargets.map((t, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--panel); border-radius:6px; font-size:12px;">
                    <span style="color:var(--green); font-weight:bold;">${t.label}</span>
                    <button type="button" onclick="removeSelectedTarget(${idx})" style="background:none; border:none; color:var(--danger); font-weight:bold; cursor:pointer;">✕</button>
                </div>
            `).join('');
        }

        function removeSelectedTarget(index) {
            selectedTargets.splice(index, 1);
            afterSelectionChanged();
        }

        function confirmAddressBookSelection() {
            closeAddressBookModal();
            const chipsEl = document.getElementById('selectedTargetChips');
            if (!chipsEl) return;

            if (selectedTargets.length === 0) {
                chipsEl.innerHTML = '<span class="badge pending" style="background:var(--green-soft); color:var(--green-strong); padding:6px 12px; font-size:13px;">🌐 전교생 학부모 전체 (기본)</span>';
                return;
            }

            chipsEl.innerHTML = selectedTargets.map(t => `
                <span class="badge pending" style="background:var(--green-soft); color:var(--green-strong); padding:6px 12px; font-size:13px; display:inline-flex; align-items:center; gap:6px;">
                    ${t.label}
                </span>
            `).join('');
        }

        async function handleNoticeSend(e) {
            e.preventDefault();
            const title = document.getElementById('nTitle').value.trim();
            const contentType = 'text';
            const deduplicateGuardians = document.getElementById('nDeduplicateGuardians')?.checked || false;
            const contentBody = document.getElementById('nTextBody').value.trim();

            // 고른 사람은 명단 id 로 보낸다. 예전에는 번호만 이어 붙여 보냈는데,
            // 학년·반이 함께 가지 않아 서버가 받는 사람을 한 명도 못 찾았다.
            const studentIds = selectedTargets.map(t => t.id);

            const wantSurvey = document.getElementById('nWantSurvey').checked;
            const questions = wantSurvey ? collectSurveyQuestions() : [];
            if (wantSurvey) {
                if (questions.length === 0) {
                    alert('문항을 하나 이상 입력해 주세요.');
                    return;
                }
                const thin = questions.find(q => q.type !== 'text' && (q.options || []).length < 2);
                if (thin) {
                    alert(`"${thin.text}" 문항에는 보기를 두 개 이상 넣어 주세요.`);
                    return;
                }
            }

            try {
                const res = await fetch('/api/teacher/notices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title, contentType, contentBody,
                        targetType: studentIds.length > 0 ? 'students' : 'all',
                        studentIds,
                        deduplicateGuardians,
                        replyType: noticeReplyType,
                        questions
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '가정통신문 발송 실패');
                alert(data.recipientCount
                    ? `${data.recipientCount}명에게 보냈습니다.`
                    : '전교생 학부모에게 보냈습니다.');
                e.target.reset();
                document.getElementById('surveyQuestionList').innerHTML = '';
                selectedTargets = [];
                confirmAddressBookSelection();
            } catch (err) {
                alert(err.message || '가정통신문 발송 오류');
            }
        }

        async function loadQuickAbsences() {
            const listEl = document.getElementById('quickList');
            if (!listEl) return;
            try {
                const res = await fetch('/api/teacher/quick-absences');
                if (!res.ok) return;
                const data = await res.json();
                const alerts = data.alerts || [];

                if (alerts.length === 0) {
                    listEl.innerHTML = '<div class="item-row" style="justify-content:center; color:var(--muted);">접수된 당일 출결 예고 알림이 없습니다.</div>';
                    return;
                }

                listEl.innerHTML = alerts.map(a => `
                    <div class="item-row">
                        <div>
                            <strong>${a.grade}학년 ${a.classNumber}반 ${a.studentNumber}번 ${a.studentName}</strong>
                            <span class="badge pending" style="margin-left:6px;">${a.noticeType} 예고 (${a.expectedDate})</span>
                            <p style="margin:6px 0 0; color:var(--muted); font-size:14px;">"${a.reason}"</p>
                        </div>
                        <span style="font-size:12px; color:var(--muted);">${new Date(a.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} 접수</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load quick absences:', err);
            }
        }

        // ── 전자결재함 ──
        // 내 차례인 문서만 온다. 담임은 자기 반, 교무부장·교감·교장은 학교 전체.
        const APPROVAL_TYPE_LABELS = { absence: '📝 결석계', exp_app: '✈️ 체험학습 신청서', exp_report: '📄 체험학습 보고서' };
        const PRINT_TYPE = { absence: 'absence', exp_app: 'exp_app', exp_report: 'exp_report' };
        let approverHasSignature = false;

        function chainHtml(steps) {
            if (!Array.isArray(steps) || steps.length === 0) return '';
            return `<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;">${
                steps.map(st => {
                    const color = st.status === 'approved' ? 'var(--green)' : st.status === 'rejected' ? 'var(--danger)' : 'var(--muted)';
                    const mark = st.status === 'approved' ? '✓' : st.status === 'rejected' ? '✕' : '·';
                    const who = st.approverName ? ` ${escapeHtml(st.approverName)}` : '';
                    return `<span style="font-size:12px; color:${color}; border:1px solid ${color}; border-radius:999px; padding:2px 8px;">${mark} ${escapeHtml(st.roleLabel)}${who}</span>`;
                }).join('<span style="color:var(--muted);">→</span>')
            }</div>`;
        }

        async function loadApprovals() {
            const listEl = document.getElementById('approvalList');
            if (!listEl) return;
            try {
                const res = await fetch('/api/teacher/approvals');
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '결재함을 불러오지 못했습니다.');

                approverHasSignature = Boolean(data.hasSignature);
                const roleEl = document.getElementById('approverRoleLabel');
                if (roleEl) roleEl.textContent = data.roleLabel ? `(${data.roleLabel} 결재)` : '(결재 권한 없음)';
                document.getElementById('signatureMissing').style.display = approverHasSignature ? 'none' : '';

                const items = data.items || [];
                if (items.length === 0) {
                    listEl.innerHTML = '<div class="item-row" style="justify-content:center; color:var(--muted);">내 차례인 결재 문서가 없습니다.</div>';
                    return;
                }

                listEl.innerHTML = items.map(it => `
                    <div class="item-row" style="flex-direction:column; align-items:stretch; gap:8px;">
                        <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
                            <div>
                                <span class="badge pending">결재 대기</span>
                                <strong style="margin-left:8px; font-size:16px;">${it.grade}학년 ${it.classNumber}반 ${escapeHtml(it.studentNumber)}번 ${escapeHtml(it.studentName)}</strong>
                                <span style="margin-left:6px; color:var(--muted);">${APPROVAL_TYPE_LABELS[it.docType] || it.docType}</span>
                                <p style="margin:6px 0 0; color:var(--muted); font-size:13px;">
                                    ${escapeHtml(it.startDate)} ~ ${escapeHtml(it.endDate)} (${it.totalDays}일) · ${escapeHtml(it.detail)}
                                    · 보호자 ${escapeHtml(it.parentName)} ${it.parentSignature ? '<img src="' + it.parentSignature + '" alt="보호자 서명" style="height:22px; vertical-align:middle; background:#fff; border-radius:4px; margin-left:4px;">' : ''}
                                    ${it.attachment ? ` · <a href="${it.attachment}" target="_blank" rel="noopener" style="color:var(--green);">첨부 보기</a>` : ''}
                                </p>
                                ${chainHtml(it.approvals)}
                            </div>
                            <div style="display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap;">
                                <button class="btn-secondary" onclick="openPrintForm('${PRINT_TYPE[it.docType]}', '${it.docId}')">🖨️ 서식 인쇄</button>
                                <button class="btn-action" style="padding:8px 16px; font-size:14px;" onclick="decideDoc('${it.docType}', '${it.docId}', 'approve', this)">승인</button>
                                <button class="btn-secondary" style="color:var(--danger); border-color:var(--danger);" onclick="decideDoc('${it.docType}', '${it.docId}', 'reject', this)">반려</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="item-row" style="justify-content:center; color:var(--danger);">${escapeHtml(err.message)}</div>`;
            }
        }

        async function decideDoc(docType, docId, decision, btn) {
            if (decision === 'approve' && !approverHasSignature) {
                alert('먼저 위에서 내 서명을 등록해 주세요. 승인하면 그 서명이 결재란에 찍힙니다.');
                toggleSignatureEditor(true);
                return;
            }
            let comment = '';
            if (decision === 'reject') {
                comment = prompt('반려 사유를 적어 주세요. 학부모에게 그대로 보입니다.') || '';
                if (!comment.trim()) return;
            } else if (!confirm('승인하시겠습니까? 등록된 서명이 결재란에 찍힙니다.')) {
                return;
            }
            btn.disabled = true;
            try {
                const res = await fetch(`/api/teacher/approvals/${docType}/${docId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decision, comment })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '처리 실패');
                loadApprovals();
            } catch (err) {
                alert(err.message || '처리 실패');
                btn.disabled = false;
            }
        }

        // ── 내 서명 등록 ──
        let teacherSigCtx = null;

        function canvasHasInk(cv) {
            const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
            for (let i = 3; i < d.length; i += 4) if (d[i] !== 0) return true;
            return false;
        }

        // 그린 자국만 남기고 잘라낸다. 여백째로 저장하면 결재란에 넣을 때 그 여백까지
        // 칸을 차지해 정작 이름은 개미만 해진다.
        function trimmedSignature(cv) {
            const c = cv.getContext('2d');
            const d = c.getImageData(0, 0, cv.width, cv.height).data;
            let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
            for (let y = 0; y < cv.height; y += 1) {
                for (let x = 0; x < cv.width; x += 1) {
                    if (d[(y * cv.width + x) * 4 + 3] === 0) continue;
                    if (x < x0) x0 = x;
                    if (x > x1) x1 = x;
                    if (y < y0) y0 = y;
                    if (y > y1) y1 = y;
                }
            }
            if (x1 < 0) return null;
            const pad = 10;
            x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
            x1 = Math.min(cv.width - 1, x1 + pad); y1 = Math.min(cv.height - 1, y1 + pad);
            const out = document.createElement('canvas');
            out.width = x1 - x0 + 1;
            out.height = y1 - y0 + 1;
            out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
            return out.toDataURL('image/png');
        }

        function setupTeacherSignatureCanvas() {
            const cv = document.getElementById('teacherSignatureCanvas');
            if (!cv || teacherSigCtx) return;
            const c = cv.getContext('2d');
            c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#000';
            let drawing = false;
            // 화면에 보이는 크기와 캔버스 픽셀 크기가 다르다. 좌표를 그 비율로 옮기지
            // 않으면 그린 자리와 그려지는 자리가 어긋난다.
            const pos = (e) => {
                const r = cv.getBoundingClientRect();
                const p = e.touches ? e.touches[0] : e;
                return {
                    x: (p.clientX - r.left) * (cv.width / (r.width || cv.width)),
                    y: (p.clientY - r.top) * (cv.height / (r.height || cv.height))
                };
            };
            cv.addEventListener('mousedown', e => { drawing = true; const p = pos(e); c.beginPath(); c.moveTo(p.x, p.y); });
            cv.addEventListener('mousemove', e => { if (!drawing) return; const p = pos(e); c.lineTo(p.x, p.y); c.stroke(); });
            cv.addEventListener('mouseup', () => { drawing = false; });
            cv.addEventListener('mouseleave', () => { drawing = false; });
            cv.addEventListener('touchstart', e => { drawing = true; const p = pos(e); c.beginPath(); c.moveTo(p.x, p.y); }, { passive: true });
            cv.addEventListener('touchmove', e => { if (!drawing) return; const p = pos(e); c.lineTo(p.x, p.y); c.stroke(); e.preventDefault(); }, { passive: false });
            cv.addEventListener('touchend', () => { drawing = false; });
            teacherSigCtx = c;
        }

        function toggleSignatureEditor(forceOpen) {
            const ed = document.getElementById('signatureEditor');
            const open = forceOpen === true ? true : ed.style.display === 'none';
            ed.style.display = open ? '' : 'none';
            if (open) setupTeacherSignatureCanvas();
        }

        function clearTeacherSignature() {
            const cv = document.getElementById('teacherSignatureCanvas');
            if (cv && teacherSigCtx) teacherSigCtx.clearRect(0, 0, cv.width, cv.height);
        }

        async function loadTeacherSignature() {
            try {
                const res = await fetch('/api/me/signature');
                if (!res.ok) return;
                const data = await res.json();
                const box = document.getElementById('signatureCurrent');
                const img = document.getElementById('signatureCurrentImg');
                approverHasSignature = Boolean(data.signature);
                box.style.display = data.signature ? '' : 'none';
                if (data.signature) img.src = data.signature;
                document.getElementById('signatureMissing').style.display = data.signature ? 'none' : '';
            } catch (e) { console.error('signature load failed', e); }
        }

        async function saveTeacherSignature() {
            const cv = document.getElementById('teacherSignatureCanvas');
            const status = document.getElementById('signatureStatus');
            if (!cv || !canvasHasInk(cv)) { status.style.color = 'var(--danger)'; status.textContent = '먼저 서명을 그려 주세요.'; return; }
            const signature = trimmedSignature(cv);
            if (!signature) { status.style.color = 'var(--danger)'; status.textContent = '먼저 서명을 그려 주세요.'; return; }
            try {
                const res = await fetch('/api/me/signature', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ signature })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '등록 실패');
                status.style.color = 'var(--green-strong)'; status.textContent = '서명을 등록했습니다.';
                clearTeacherSignature();
                await loadTeacherSignature();
            } catch (e) { status.style.color = 'var(--danger)'; status.textContent = e.message || '등록하지 못했습니다.'; }
        }

        loadTeacherSignature();

        loadQuickAbsences();
        loadApprovals();
    </script>
</body>
</html>
