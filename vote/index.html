<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#312e81">
  <title>우리 학교 투표</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="back">← 메인</a>
    <strong>우리 학교 투표</strong>
    <a id="teacherHome" href="/classtools/" class="back hidden">교직원 메뉴</a>
  </header>
  <main class="shell">
    <section id="loading" class="panel center"><div class="loader"></div><p>투표 화면을 준비하고 있어요.</p></section>

    <section id="joinView" class="panel narrow hidden">
      <p class="eyebrow">STUDENT VOTE</p><h1>투표방 입장</h1>
      <p class="muted">선생님이 알려 준 4자리 투표 방번호를 입력하세요.</p>
      <form id="joinForm" class="join-form">
        <input id="joinCode" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="0000" aria-label="투표 방번호">
        <button class="primary" type="submit">투표방 열기</button>
      </form>
      <p id="joinStatus" class="status" role="status"></p>
    </section>

    <section id="teacherView" class="hidden">
      <div class="hero">
        <div><p class="eyebrow">TEACHER</p><h1>투표 만들기</h1><p class="muted">선출 항목과 후보자를 입력하면 학생용 방번호가 만들어집니다.</p></div>
      </div>
      <form id="createForm" class="panel create-form">
        <label>투표 제목<input id="voteTitle" maxlength="80" placeholder="예: 2026학년도 전교 학생회 선거" required></label>
        <div class="section-head"><h2>선출 항목</h2><button id="addPosition" class="secondary small" type="button">+ 항목 추가</button></div>
        <div id="positionList" class="position-list"></div>
        <button id="createButton" class="primary wide" type="submit">방 만들기</button>
        <p id="createStatus" class="status" role="status"></p>
      </form>
      <section class="rooms-section"><div class="section-head"><h2>내 투표방</h2><button id="refreshRooms" class="secondary small" type="button">새로고침</button></div><div id="roomList" class="room-list"></div></section>
    </section>

    <section id="ballotView" class="hidden">
      <div class="ballot-heading"><p class="eyebrow">ROOM <span id="roomCodeLabel"></span></p><h1 id="ballotTitle"></h1><p id="ballotGuide" class="muted"></p></div>
      <form id="ballotForm"><div id="ballotPositions" class="ballot-positions"></div><button id="submitBallot" class="primary wide" type="submit">선택한 후보에게 투표하기</button></form>
      <p id="ballotStatus" class="status" role="status"></p>
    </section>
  </main>
  <template id="positionTemplate">
    <article class="position-editor">
      <div class="position-title-row"><label>선출 항목<input class="position-title" maxlength="40" required></label><button class="remove-position danger" type="button">삭제</button></div>
      <div class="candidate-inputs"></div>
      <button class="add-candidate secondary small" type="button">+ 후보자 추가</button>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
