<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>방번호 입력</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <a class="back" href="/">← 메인</a>
    <section class="card" aria-labelledby="pageTitle">
      <h1 id="pageTitle">방번호 입력</h1>
      <form id="roomForm">
        <label class="sr-only" for="roomCode">방번호</label>
        <input id="roomCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="0000" autofocus>
        <button type="submit">입장</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
