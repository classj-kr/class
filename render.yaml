services:
  - type: web
    name: joyclass
    runtime: node
    plan: free
    buildCommand: npm --prefix game-hub-server install
    startCommand: npm --prefix game-hub-server start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TEACHER_EMAILS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TEACHER_PIN
        sync: false
  - type: web
    name: joyclass-assets
    runtime: static
    buildCommand: node scripts/build-render-assets.mjs
    staticPublishPath: .render-assets
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - scripts/build-render-assets.mjs
        - assets/**/*.avif
        - assets/**/*.gif
        - assets/**/*.ico
        - assets/**/*.jpeg
        - assets/**/*.jpg
        - assets/**/*.m4a
        - assets/**/*.mp3
        - assets/**/*.mp4
        - assets/**/*.ogg
        - assets/**/*.png
        - assets/**/*.svg
        - assets/**/*.wav
        - assets/**/*.webm
        - assets/**/*.webp
        - assets/**/*.woff
        - assets/**/*.woff2
        - classtools/assets/avatars/**
        - learning/**/*.avif
        - learning/**/*.bin
        - learning/**/*.geojson
        - learning/**/*.gif
        - learning/**/*.glb
        - learning/**/*.gltf
        - learning/**/*.ico
        - learning/**/*.jpeg
        - learning/**/*.jpg
        - learning/**/*.m4a
        - learning/**/*.mp3
        - learning/**/*.mp4
        - learning/**/*.ogg
        - learning/**/*.otf
        - learning/**/*.png
        - learning/**/*.svg
        - learning/**/*.ttf
        - learning/**/*.wav
        - learning/**/*.webm
        - learning/**/*.webp
        - learning/**/*.woff
        - learning/**/*.woff2
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Cache-Control
        value: public, max-age=86400
