<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>학생 계정 복구 - 담임 교사</title>
    <link rel="stylesheet" href="/assets/legal.css">
    <style>
        .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.search{width:min(420px,100%);min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:white;color:var(--ink);font:inherit}.student-list{display:grid;gap:10px}.student-row{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(180px,1fr) minmax(130px,.7fr) auto;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.student-name strong,.student-name span{display:block}.student-name span,.account{color:var(--muted);font-size:.86rem}.state{display:inline-flex;width:max-content;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--green);font-size:.8rem;font-weight:900}.state.unlinked{background:#eeeae0;color:#716857}.reset{min-height:44px;border:1px solid #a83d3d;border-radius:10px;padding:9px 12px;background:white;color:#9c2f2f;font-weight:900;cursor:pointer}.reset:hover,.reset:focus-visible{background:#fff0f0}.reset:disabled{opacity:.55;cursor:wait}.danger-note{background:#fff0e8}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:780px){.student-row{grid-template-columns:1fr auto}.account{grid-column:1/-1}.reset{grid-column:1/-1;width:100%}.toolbar{align-items:stretch;flex-direction:column}}
    </style>
</head>
<body><header class="site-head"><div class="site-head-inner"><a class="brand" href="/classtools/">담임 도구</a><nav><a class="nav-link" href="/classtools/privacy.html">개인정보 요청</a></nav></div></header>
<main><header class="lead"><p class="eyebrow">담임교사 전용</p><h1>학생 계정 연결 관리</h1><p class="summary">잘못 연결된 Google 계정을 해제합니다. 학생과 사실을 확인한 뒤 실행하세요.</p></header>
<div class="notice danger-note"><strong>실행 결과</strong><br>해당 학생의 로그인 세션이 종료되고 연결된 Google 계정, 선택 생일, 공개 설정 정보가 해제됩니다.</div>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="학교, 학급, 번호, 이름, 이메일 검색" aria-label="학생 검색"><span id="count" class="small"></span></div>
<p id="status" class="notice" role="status">교사 권한을 확인하고 있습니다.</p><div id="list" class="student-list"></div></main>
<script>
const searchInput=document.querySelector('#search'),count=document.querySelector('#count'),statusEl=document.querySelector('#status'),list=document.querySelector('#list');let students=[];
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function render(){const term=searchInput.value.trim().toLowerCase();const filtered=students.filter(student=>`${student.schoolName} ${student.grade} ${student.classNumber} ${student.number} ${student.name} ${student.email||''}`.toLowerCase().includes(term));count.textContent=`${filtered.length}명`;if(!filtered.length){list.innerHTML='<div class="empty">조건에 맞는 학생이 없습니다.</div>';return}list.innerHTML=filtered.map(student=>`<article class="student-row"><div class="student-name"><strong>${esc(student.number)}번 ${esc(student.name)}</strong><span>${student.grade}학년 ${student.classNumber}반</span></div><div class="account">${student.email?esc(student.email):'연결된 이메일 없음'}</div><span class="state ${student.linked?'':'unlinked'}">${student.linked?'계정 연결됨':'미연결'}</span><button class="reset" type="button" data-student-id="${student.id}" data-student-label="${esc(student.number)}번 ${esc(student.name)}">${student.linked?'Google 계정 연결 해제':'미연결 상태'}</button></article>`).join('')}
list.addEventListener('click',async event=>{const button=event.target.closest('button[data-student-id]');if(!button)return;const label=button.dataset.studentLabel;const message=`${label} 학생의 Google 계정 연결을 해제하시겠습니까?\n\n현재 세션이 종료되고 계정 연결 정보가 초기화됩니다.`;if(!confirm(message))return;button.disabled=true;statusEl.textContent=`${label} 학생의 연결을 해제하는 중…`;try{await api(`/api/teacher/students/${button.dataset.studentId}/reset-access`,{method:'POST',body:'{}'});statusEl.textContent=`${label} 학생의 Google 계정 연결을 해제했습니다.`;await load()}catch(error){statusEl.textContent=error.message;button.disabled=false}});
searchInput.addEventListener('input',render);async function load(){const me=await api('/api/auth/me');if(!me.signedIn||!(me.user?.role==='teacher'||me.isTeacher)){location.replace('/classtools/');return}students=(await api('/api/teacher/student-accounts')).students;statusEl.textContent='학생에게 확인한 뒤 필요한 계정만 연결을 해제하세요.';render()}load().catch(error=>{statusEl.textContent=error.message});
</script></body></html>
