<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급</title>
    <script>if (new URLSearchParams(location.search).get("view") === "student") document.documentElement.classList.add("student-view");</script>
    <link rel="stylesheet" href="/assets/fonts/google/inter.css?v=20261120">
    <link rel="stylesheet" href="/assets/fonts/google/outfit.css?v=20261120">
    <style>
        :root {
            --bg-dark: #0b0f0c;
            --card-bg: #060606;
            --card-border: rgba(117, 214, 159, 0.18);
            --card-hover-border: rgba(117, 214, 159, 0.4);
            --accent-green: #75d69f;
            --accent-green-dark: #163826;
            --accent-amber: #f0bd64;
            --accent-blue: #64c2f0;
            --accent-danger: #ff8b82;
            --text-main: #f0f5f2;
            --text-muted: #9aa8a0;
            --text-sub: #6c7d73;
            --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            --weekday-panel-image: none;
            --weekday-box-image: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-x: hidden;
        }

        /* 요일 그림은 화면 전체 바탕이다. 화면에 붙여 두어 길게 내려도 끝까지 깔리고, 그 위에 검은 카드가 놓인다. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-color: #050505;
            background-image: var(--weekday-panel-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Clock, current weather, and today's forecast. */
        header.dashboard-header { display: grid; grid-template-columns: 218px 205px minmax(0, 1fr); gap: 12px; align-items: stretch; }
        .clock-card, .weather-card, .forecast-card { min-width: 0; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 9px; }
        .clock-card { display: flex; }
        .clock-face { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 0; padding: 8px 12px; border-radius: 10px; }
        .weather-card { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .weather-card .weather-temp { padding: 4px 10px; border-radius: 8px; line-height: 1.25; }
        .weather-card .air-list { margin-top: 0; padding: 5px 10px; border-radius: 8px; }
        .weather-condition { font-size: 0.95rem; color: var(--accent-amber); font-weight: 700; }
        /* 습도·미세먼지·초미세먼지: 이름은 회색, 숫자는 흰색, 등급만 환경부 색(좋음 파랑·보통 초록·나쁨 노랑·매우나쁨 빨강). */
        .air-list { display: grid; gap: 3px; margin-top: 2px; }
        .air-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 0.8rem; line-height: 1.35; white-space: nowrap; }
        .air-row dt { color: #d6e0da; }
        .air-row dd { display: flex; align-items: baseline; gap: 5px; color: var(--text-main); }
        .air-value { font-weight: 800; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
        .air-unit { color: #b9c6bf; font-size: 0.68rem; margin-left: -3px; }
        .air-grade { font-weight: 800; }
        .air-grade[data-grade="good"] { color: #7cc4ff; }
        .air-grade[data-grade="normal"] { color: #75d69f; }
        .air-grade[data-grade="bad"] { color: #f0bd64; }
        .air-grade[data-grade="worst"] { color: #ff8b82; }
        .air-empty { color: var(--text-sub); }
        .forecast-card { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .hourly-forecast { display: grid; grid-template-columns: repeat(var(--forecast-columns, 1), minmax(0, 1fr)); gap: 3px; min-width: 0; }
        .forecast-hour { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 5px 1px; min-width: 0; border-radius: 7px; }
        .forecast-hour.is-current { border-color: rgba(117,214,159,0.55); box-shadow: inset 0 0 0 99px rgba(117,214,159,0.12); }
        .forecast-time { color: #e3ebe6; font-size: 0.78rem; font-weight: 600; }
        .forecast-icon { font-size: 1.25rem; line-height: 1.2; }
        .forecast-temperature { font-size: 1.05rem; font-weight: 800; }
        /* 강수확률: 30% 미만은 숫자만, 30% 이상은 우산 ☔(눈이면 ❄️)를 붙여 하늘색으로, 60% 이상은 숫자에 파란 바탕을 깐다.
           물방울은 습도처럼 보여서 쓰지 않는다. */
        .forecast-rain { color: #c4d1c9; font-size: 0.74rem; white-space: nowrap; padding: 1px 5px; border-radius: 6px; }
        .forecast-rain.rain-some { color: #7ce4ff; font-weight: 700; }
        .forecast-rain.rain-high { color: #04141c; font-weight: 800; padding: 0; }
        /* 파란 바탕은 숫자에만 깐다. 아이콘까지 덮으면 하늘색 ❄️가 바탕에 묻힌다. */
        .forecast-rain.rain-high .rain-value { background: #4fc3f7; padding: 1px 4px; border-radius: 6px; }
        .forecast-rain .rain-icon { margin-right: 1px; }
        .forecast-hour.next-day { margin-left: 5px; }
        /* 나무결 위 작은 글씨가 무늬에 묻히지 않게 그림자를 깐다. */
        .forecast-time, .forecast-temperature, .forecast-rain:not(.rain-high), .air-row { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); }
        .forecast-message { grid-column: 1 / -1; padding: 18px 0; font-size: 0.85rem; color: var(--text-muted); }
        #forecastRetry { align-self: flex-start; color: var(--accent-green); border: 0; background: none; font: inherit; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

        .clock-time {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            color: #ffffff;
            display: flex;
            align-items: baseline;
        }

        .clock-seconds {
            font-size: 1.25rem;
            color: var(--accent-green);
            margin-left: 4px;
            font-weight: 700;
        }

        /* 영어 노출용이라 약어 없이 요일/월 이름을 전부 쓰고, 나무 배경 위에서도 읽히게 밝게 둔다. */
        .clock-date {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .clock-weekday {
            font-size: 1.1rem;
            color: var(--accent-green);
        }

        .clock-month-day {
            font-size: 1rem;
            color: #ffffff;
        }

        /* Main Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            /* Grid rows default to stretch, so a card with light content
               (e.g. no upcoming events) was forced to match its tallest
               sibling (the period timetable) and ended up as mostly empty
               card -- align to each card's own content height instead. */
            align-items: start;
            gap: 20px;
            flex: 1;
        }

        .widget-card {
            min-height: 320px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .widget-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .widget-card:hover {
            border-color: var(--card-hover-border);
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
        }

        .widget-header:active {
            cursor: grabbing;
        }

        .widget-title {
            font-size: 1.25rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }

        .widget-icon {
            font-size: 1.3rem;
        }

        .widget-badge {
            background: rgba(117, 214, 159, 0.15);
            color: var(--accent-green);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(117, 214, 159, 0.3);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 44px;
            min-height: 58px;
        }

        .roster-student-copy {
            display: flex;
            align-items: baseline;
            justify-content: center;
            min-width: 0;
            gap: 4px;
            white-space: nowrap;
        }

        .roster-student-number {
            color: #b3bfb8;
            font-size: 0.68rem;
            font-weight: 700;
        }

        .roster-student-name {
            font-size: 0.84rem;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-btn:hover {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        #widget-timetable,
        #widget-boards {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        .widget-edit {
            align-self: flex-end;
            min-height: 30px;
            padding: 3px 6px;
            background: transparent;
            border: 0;
            border-radius: 5px;
            color: var(--text-muted);
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .widget-edit:hover { background: rgba(255, 255, 255, 0.07); color: var(--text-main); }
        .widget-edit:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }

        .checklist-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .checklist-controls select { min-width: 0; max-width: 100%; }

        /* 1. Timetable Widget */
        .today-events-banner[hidden],
        .today-events-banner:empty { display: none; }

        .today-events-banner {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .today-events-banner .today-event-line {
            font-size: 12px;
            color: var(--text-main, #eee);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .today-events-banner .today-event-meta {
            color: var(--text-muted, #999);
            font-size: 11px;
        }
        .timetable-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: none;
            overflow-y: visible;
        }

        .timetable-item {
            display: grid;
            grid-template-columns: 60px minmax(110px, 1.1fr) minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .timetable-item.active {
            background: linear-gradient(135deg, rgba(240, 189, 100, 0.25) 0%, rgba(240, 189, 100, 0.05) 100%);
            border-color: var(--accent-amber);
            box-shadow: 0 4px 15px rgba(240, 189, 100, 0.15);
        }

        .period-col-left {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .period-label {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .period-time-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #b3bfb8;
            line-height: 1.1;
            margin-top: 1px;
        }

        .period-time-stack .wave {
            font-size: 0.65rem;
            opacity: 0.5;
            margin: -1px 0;
        }

        .period-col-center {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
            white-space: nowrap;
            min-width: 0;
        }

        .period-subject-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            min-width: 0;
        }

        .period-subject-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .period-col-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            min-width: 0;
        }

        .prep-active-badge {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff4d4d;
            box-shadow: 0 0 6px rgba(255, 77, 77, 0.8);
            flex-shrink: 0;
            display: inline-block;
            margin-right: 2px;
        }

        .period-subject {
            font-weight: 900;
            font-size: 1.25rem;
            color: #ffffff;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .period-subject-icon {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex: 0 0 30px;
            font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
            font-size: 23px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.65));
        }

        .period-place {
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .period-place.default { color: rgba(255, 255, 255, 0.55); }
        .period-place.highlight { color: #7ce4ff; font-weight: 800; }

        .prep-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 5px 8px;
            color: #b0c0ca;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            white-space: nowrap;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .prep-input.has-value {
            background: rgba(255, 77, 77, 0.10);
            border-color: rgba(255, 77, 77, 0.45);
            color: #7ce4ff;
            font-weight: 700;
        }

        .prep-input::placeholder {
            color: rgba(255, 255, 255, 0.22);
        }

        .prep-input:focus {
            border-color: var(--accent-green);
            background: rgba(0, 0, 0, 0.55);
            box-shadow: 0 0 0 2px rgba(117, 214, 159, 0.25);
        }

        .timetable-item.active .period-subject {
            color: var(--accent-amber);
        }

        /* 2. Student Checklist Widget */
        #widget-checklist {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        #widget-checklist .icon-btn {
            min-height: 38px;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 5px;
        }

        .num-chip {
            width: 100%;
            min-width: 0;
            min-height: 43px;
            padding: 4px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font: inherit;
            border-radius: 8px;
            background: rgba(117, 214, 159, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(117, 214, 159, 0.25);
            position: relative;
            text-align: center;
        }

        .attendance-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
        }

        #attendanceStatus, #attendanceConnectionStatus { color: #ffe3a1; font-size: 0.75rem; }
        #attendanceSound { padding: 4px 8px; margin-left: auto; }
        #attendanceArrival { padding: 8px; border-radius: 8px; background: #244b3a; color: #d4ffe4; font-size: 0.85rem; }
        #attendanceRetry { color: inherit; background: transparent; border: 0; text-decoration: underline; cursor: pointer; }

        .attendance-tag {
            display: inline-block;
            max-width: 100%;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.63rem;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }

        .attendance-tag[data-kind="결석"] { background: #69312e; color: #ffd0cb; }
        .attendance-tag[data-kind="지각"] { background: #604522; color: #ffe3a1; }
        .attendance-tag[data-kind="조퇴"] { background: #263f65; color: #cde5ff; }
        .attendance-tag[data-kind="체험학습"] { background: #245247; color: #c7f5df; }

        .bday-tag {
            position: absolute;
            top: -5px;
            right: -3px;
            font-size: 0.8rem;
        }

        @media (max-width: 420px) {
            .checklist-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        /* 3. Important schedule */
        .card-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .board-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .board-item.schedule-today {
            border-color: var(--accent-green);
            background: rgba(76, 201, 140, 0.13);
        }

        .board-item.schedule-this-week:not(.schedule-today) {
            border-color: rgba(255, 193, 92, 0.45);
        }

        .schedule-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 28px 12px;
            line-height: 1.6;
        }

        .schedule-date {
            min-width: 54px;
            color: var(--accent-green);
            font-size: 0.8rem;
            font-weight: 900;
        }

        .schedule-date.this-week { color: var(--accent-amber); }

        .schedule-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            vertical-align: middle;
        }
        .schedule-badge.scope-holiday { background: rgba(255, 139, 130, 0.15); color: var(--accent-danger); }
        .schedule-badge.scope-vacation { background: rgba(196, 181, 253, 0.15); color: #c4b5fd; }
        .schedule-date-range { display: block; margin-top: 3px; font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
        .schedule-badge.scope-all { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .schedule-badge.scope-grade { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        #widget-info {
            min-height: 0;
            padding: 16px;
            gap: 12px;
        }

        .calendar-header {
            gap: 8px;
        }

        /* 화살표는 달 이름 양옆에 둔다(달을 넘기는 단추로 읽히게). 9월이든 12월이든 화살표 자리는 그대로다. */
        .calendar-month {
            display: flex;
            align-items: center;
            flex: 0 1 auto;
            min-width: 0;
            gap: 4px;
        }

        .calendar-header .widget-title {
            flex: 0 1 auto;
            width: 6.2em;
            min-width: 0;
            justify-content: center;
            font-size: 1.2rem;
            white-space: nowrap;
            gap: 6px;
        }

        .calendar-header .icon-btn {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            min-height: 40px;
            line-height: 1;
        }

        .calendar-month .icon-btn {
            min-width: 34px;
            padding: 0 6px;
            font-size: 1.35rem;
        }

        .calendar-header #todayMonthBtn {
            min-width: 44px;
            padding: 0 8px;
            font-size: 0.85rem;
        }

        .calendar-header .icon-btn:focus-visible,
        .cal-day:focus-visible {
            outline: 2px solid var(--accent-green);
            outline-offset: -2px;
        }

        .cal-day {
            min-height: 40px;
            cursor: pointer;
            position: relative;
        }

        .cal-day.selected {
            outline: 2px solid var(--accent-green);
            outline-offset: -2px;
        }

        .schedule-editor {
            display: grid;
            grid-template-columns: 132px minmax(0, 1fr) 52px max-content;
            gap: 8px;
            margin-top: 10px;
        }

        .schedule-editor[hidden] {
            display: none;
        }

        /* 휴대폰처럼 좁은 카드에서는 날짜 칸을 한 줄 위로 올려 일정 칸이 넉넉하게 남게 한다. */
        @media (max-width: 520px) {
            .schedule-editor { grid-template-columns: minmax(0, 1fr) 52px max-content; }
            .schedule-date-input { grid-column: 1 / -1; }
        }

        .schedule-date-input {
            color-scheme: dark;
        }

        .schedule-details-input {

        .schedule-copy {

        .board-item-del {

            min-height: 44px;

            color: var(--accent-danger);
        }

        .board-item-edit:hover { color: var(--accent-green); }
        .schedule-actions { display: flex; align-items: center; gap: 2px; }

        .board-add-box {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .board-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            min-height: 44px;
        }

        .board-input:focus {
            border-color: var(--accent-green);
        }

        .add-btn {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 44px;
            min-height: 44px;
        }

        .add-btn:hover {
            background: var(--accent-green);
            color: #101512;
        }

        /* 4. Calendar & Weather & Meals */
        .calendar-mini {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .cal-head {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 24px;
            color: var(--text-muted);
            padding-bottom: 3px;
        }

        .cal-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            height: 44px;
            padding: 3px 1px;
            border-radius: 7px;
            font-size: 1.35rem;
            line-height: 1;
            font-weight: 700;
        }

        .cal-day-number { line-height: 25px; flex: none; }

        .cal-day:hover {
            box-shadow: inset 0 0 0 99px rgba(255, 255, 255, 0.08);
        }

        .cal-event-label {
            display: block;
            width: 100%;
            height: 12px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.62rem;
            line-height: 1.2;
            color: var(--accent-amber);
        }
        .cal-day.holiday, .cal-day.holiday .cal-event-label { color: var(--accent-danger); }
        .cal-day.other-month { opacity: 0.3; font-weight: 600; cursor: pointer; }
        .cal-day.today .cal-event-label { color: #0b0f0c; }
        .calendar-status { color: var(--text-muted); font-size: 0.78rem; }
        .calendar-status button { margin-left: 6px; color: var(--accent-green); background: none; border: 0; cursor: pointer; text-decoration: underline; }
        .calendar-agenda { border-top: 1px solid var(--card-border); padding-top: 8px; font-size: 0.82rem; }
        .calendar-agenda-date { font-weight: 800; margin-bottom: 5px; }
        .calendar-agenda-item { padding: 3px 0; overflow-wrap: anywhere; }
        .calendar-agenda-kind { color: var(--accent-green); font-size: 0.7rem; margin-right: 6px; }
        .calendar-agenda-meta { color: var(--text-muted); font-size: 0.74rem; margin-left: 6px; }

        .cal-day.sun, .cal-head.sun { color: var(--accent-danger); }
        .cal-day.sat, .cal-head.sat { color: var(--accent-blue); }

        .cal-day.holiday { color: var(--accent-danger); }

        .cal-day.today {
            background: var(--accent-blue);
            color: #0b0f0c;
            font-weight: 800;
        }

        @media (max-width: 380px) {
            .calendar-header .widget-title { font-size: 1.05rem; }
            .calendar-month .icon-btn { min-width: 34px; padding: 0 7px; }
        }

        .dday-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .weather-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(100, 194, 240, 0.1);
            border: 1px solid rgba(100, 194, 240, 0.25);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .weather-temp {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
        }

        /* 2열로 붙여 세로 길이를 줄인다(한 화면에 스크롤 없이). */
        .meal-list { gap: 6px !important; font-size: 1.05rem !important; font-weight: 700; color: #ffffff !important; letter-spacing: -0.01em;
            display: grid;
            /* merged */
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 3px;
            font-size: 0.9rem;
            line-height: 1.3;
            color: #e2ece6;
            overflow-wrap: anywhere;
        }

        .meal-list > :not(.meal-dish-item) { grid-column: 1 / -1; }
        .meal-list { border-top: 1px solid var(--card-border); padding-top: 12px; transition: opacity 0.15s; }
        .meal-list[aria-busy="true"] { opacity: 0.45; }

        .meal-dish-item { border: 1px solid rgba(255, 255, 255, 0.08); padding: 7px 10px !important; border-radius: 8px !important; gap: 8px !important;
            padding: 3px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meal-dish-item > span:first-child {
            flex: none;
            width: 1.5rem;
            height: 1.5rem;
            font-size: 1.25rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .meal-dish-item > span:first-child svg {
            width: 1.55rem;
            height: 1.55rem;
            display: block;
            margin: auto;
        }
        .meal-dish-item > span:last-child { min-width: 0; }

        /* 글씨 상자는 검은 카드에 뚫린 창처럼 바탕 나무결을 그대로 보여 준다(바탕과 같은 그림을 화면에 붙여 깐다). */
        .timetable-item,
        .timetable-item.active,
        .num-chip,
        .board-item,
        .board-item.schedule-today,
        .weather-box,
        .meal-dish-item { padding: 7px 10px !important; border-radius: 8px !important; gap: 8px !important; }
        /* 머리 줄(시계·날씨·예보)과 달력 날짜, 아래 도구 단추도 글씨 상자라 같은 창으로 뚫는다.
           요일 그림은 오른쪽 아래로 갈수록 거의 검어서 그 자리 상자(달력·급식)는 무늬가 묻혔다. 상자는 어둑한
           가장자리를 걷어 내 나무결이 어디서나 같은 진하기로 보이는 상자용 그림(<요일>-box.webp)을 비춘다. */
        .timetable-item,
        .timetable-item.active,
        .num-chip,
        .board-item,
        .board-item.schedule-today,
        .weather-box,
        .meal-dish-item,
        .clock-face,
        .weather-card .weather-temp,
        .weather-card .air-list,
        .forecast-hour,
        .cal-day,
        .toolbar .tool-btn { border: 1px solid rgba(255, 255, 255, 0.08);
            background-color: #1b1b1b;
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), var(--weekday-box-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* 예보 칸과 지금 날씨 칸은 하늘처럼 낮은 하늘색, 밤은 밤하늘색으로 채운다(나무결 대신 하늘).
           하늘색 칸에서는 하늘색 강수 글씨와 60% 파란 바탕이 묻히므로 글씨는 희게, 60%는 흰 바탕에 파란 숫자로(낮 칸이 어두워지지 않게). */
        .forecast-hour.is-day, .weather-card .weather-temp.is-day { background: linear-gradient(180deg, #4b9fe0, #2f7fc4); }
        .forecast-hour.is-night, .weather-card .weather-temp.is-night { background: linear-gradient(180deg, #131d3a, #0a1022); }
        .forecast-hour.is-day .forecast-rain { color: #eef6ff; }
        .forecast-hour.is-day .forecast-rain.rain-some { color: #ffffff; }
        .forecast-hour.is-day .forecast-rain.rain-high .rain-value { background: #ffffff; color: #1565c0; }
        .weather-card .weather-temp.is-day .weather-condition { color: #fff4c2; }
        /* 지금 교시는 호박색 테두리로 띄운다(위 공통 테두리가 덮지 않게 뒤에 둔다). 키우는 효과는 나무결 창을 어긋나게 해서 쓰지 않는다. */
        .timetable-item.active { border-color: var(--accent-amber); }

        /* 학생 보기: 보기만 한다. */
        html.student-view [data-teacher-only] { display: none !important; }
        .prep-note {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 5px 8px;
            border: 1px solid rgba(255, 77, 77, 0.45);
            border-radius: 8px;
            background: rgba(255, 77, 77, 0.10);
            color: #7ce4ff;
            font-size: 0.85rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .timetable-empty { padding: 16px 4px; color: var(--text-muted); font-size: 0.9rem; }

        /* Toolbar Bottom */
        footer.toolbar {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }

        .tool-btn:hover {
            background: var(--accent-green-dark);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .tool-btn.active {
            background: var(--accent-green);
            color: #0b0f0c;
        }

        /* Modal Overlay */
        .modal-overlay[hidden] {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #141b17;
            border: 1px solid var(--accent-green);
            border-radius: 20px;
            width: min(92vw, 620px);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;

            align-items: center;
            justify-content: space-between;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;

            min-height: 44px;
        }

        .modal-close:hover { color: #fff; }

        .day-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .day-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-muted);
            min-height: 44px;
        }

        .day-tab.active {
            background: var(--accent-green-dark);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .edit-period-row {
            display: grid;
            grid-template-columns: 50px 1.1fr 0.9fr 1.2fr;
            gap: 6px;
            align-items: center;
        }

        .modal-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.9rem;
            min-height: 44px;
        }

        /* Timer */
        /* 타이머: 시간이 흐르는 만큼 로켓이 지구에서 달로 날아간다. */
        #timerModal .timer-box {
            position: relative;
            width: min(96vw, 1060px);
            max-height: 96vh;
            max-height: 96dvh;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
            background: #0b1020;
            border-color: #3d4d7d;
        }

        .timer-close {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 3;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
        }

        .timer-stage {
            position: relative;
            width: min(100%, calc((96vh - 92px) * 1000 / 540));
            width: min(100%, calc((96dvh - 92px) * 1000 / 540));
            aspect-ratio: 1000 / 540;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 14px;
            background: radial-gradient(circle at 78% 22%, #27305f 0%, #141a3a 42%, #080b1c 100%);
        }

        .timer-stars {
            --tile: 240px;
            position: absolute;
            inset: 0 calc(var(--tile) * -1) 0 0;
            background-size: var(--tile) 200px;
            background-image:
                radial-gradient(1.5px 1.5px at 24px 36px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 92px 150px, #cfe0ff, transparent),
                radial-gradient(1px 1px at 150px 74px, #fff, transparent),
                radial-gradient(1px 1px at 205px 172px, #ffe9b8, transparent);
            opacity: 0.6;
            animation: timer-drift 26s linear infinite paused;
            will-change: transform;
        }

        .timer-stars.near {
            --tile: 340px;
            background-size: var(--tile) 270px;
            background-image:
                radial-gradient(2.2px 2.2px at 60px 58px, #fff, transparent),
                radial-gradient(2px 2px at 210px 196px, #bcd4ff, transparent),
                radial-gradient(2px 2px at 296px 112px, #fff, transparent);
            opacity: 0.9;
            animation-duration: 11s;
        }

        .timer-stage[data-phase="running"] .timer-stars { animation-play-state: running; }
        @keyframes timer-drift { to { transform: translateX(calc(var(--tile) * -1)); } }

        .timer-scene, .timer-fx, .timer-flash { position: absolute; inset: 0; width: 100%; height: 100%; }
        .timer-fx, .timer-flash { pointer-events: none; }
        .timer-flash { background: #fff; opacity: 0; }

        .timer-route { fill: none; stroke: rgba(255, 255, 255, 0.28); stroke-width: 3; stroke-dasharray: 2 13; stroke-linecap: round; }
        .timer-trail { fill: none; stroke: #ffb35c; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0.85; }

        .timer-digits {
            font-family: 'Outfit', sans-serif;
            font-size: 200px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            text-anchor: middle;
            fill: #7cf0b0;
            stroke: #0b1020;
            stroke-width: 12px;
            paint-order: stroke;
            transform-box: fill-box;
            transform-origin: center;
        }

        .timer-stage[data-phase="paused"] .timer-digits { opacity: 0.55; }
        .timer-stage.final .timer-digits { font-size: 330px; fill: #ff4f43; }
        .timer-stage[data-phase="done"] .timer-digits { font-size: 240px; fill: #ffe600; animation: timer-cheer 0.45s ease-in-out infinite alternate; }

        .timer-rocket-body, .timer-moon, .timer-flag, .timer-flame, .timer-shock { transform-box: fill-box; }
        .timer-rocket-body { transform-origin: center; }
        .timer-stage[data-phase="idle"] .timer-rocket-body { animation: timer-ready 1.2s ease-in-out infinite alternate; }
        .timer-stage.final .timer-rocket-body { animation: timer-shake 0.09s linear infinite; }
        .timer-flame { display: none; transform-origin: 50% 0; animation: timer-flame 0.12s ease-in-out infinite alternate; }
        .timer-stage[data-phase="running"] .timer-flame { display: inline; }
        .timer-stage[data-phase="done"] #timerRocket { display: none; }

        .timer-moon { transform-origin: center; }
        .timer-stage.final .timer-moon { animation: timer-moon 1s ease-in-out infinite; }
        .timer-stage[data-phase="done"] .timer-moon { animation: timer-hit 0.6s ease-out; }

        .timer-flag { transform-origin: 0 100%; transform: scaleY(0); }
        .timer-stage[data-phase="done"] .timer-flag { animation: timer-flag 0.45s cubic-bezier(0.2, 1.5, 0.4, 1) 0.3s forwards; }
        .timer-shock { fill: none; stroke: #fff; stroke-width: 3; opacity: 0; transform-origin: center; }
        .timer-stage[data-phase="done"] .timer-shock { animation: timer-shock 0.8s ease-out; }
        .timer-stage[data-phase="done"] .timer-flash { animation: timer-flash 0.55s ease-out; }

        .timer-stage.final::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(255, 40, 28, 0.06) 35%, rgba(255, 40, 28, 0.55) 100%);
            box-shadow: inset 0 0 110px rgba(255, 54, 40, 0.9);
            opacity: 0.4;
        }

        .timer-stage.urgent::after { box-shadow: inset 0 0 180px rgb(255, 40, 28); }

        @keyframes timer-ready { to { transform: translateY(-3px); } }
        @keyframes timer-shake { 0% { transform: translate(-1.2px, 0.6px); } 50% { transform: translate(1.2px, -0.6px); } 100% { transform: translate(-0.6px, -0.8px); } }
        @keyframes timer-flame { from { transform: scale(0.85, 0.8); } to { transform: scale(1.1, 1.2); } }
        @keyframes timer-moon { 50% { transform: scale(1.1); } }
        @keyframes timer-hit { 0% { transform: translate(14px, -5px) scale(1.14); } 40% { transform: translate(-6px, 2px) scale(0.97); } 100% { transform: none; } }
        @keyframes timer-flag { to { transform: scaleY(1); } }
        @keyframes timer-shock { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(17); } }
        @keyframes timer-flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
        @keyframes timer-cheer { from { transform: translateY(8px) rotate(-3deg) scale(0.97); } to { transform: translateY(-12px) rotate(3deg) scale(1.05); } }

        @media (prefers-reduced-motion: reduce) {
            .timer-stage *, .timer-stage::after { animation: none !important; }
            .timer-stage[data-phase="done"] .timer-flag { transform: none; }
        }

        .timer-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .timer-presets, .timer-actions { display: flex; gap: 8px; }
        .timer-presets .tool-btn[aria-pressed="true"] { border-color: #7cf0b0; color: #7cf0b0; }
        #startTimerBtn { min-width: 116px; }

        /* Fit the full class into the available picker area. */
        #multiPickerModal .modal-box {
            width: min(96vw, 1400px);
            height: min(94vh, 960px);
            height: min(94dvh, 960px);
            max-height: none;
            min-height: 0;
            overflow: hidden;
            padding: clamp(12px, 2vw, 20px);
            gap: 10px;
            background: #000000;
            border: 2px solid #2ec4b6;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        #multiPickerModal .modal-title {
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .student-picker-title { font-size: 1.2rem; font-weight: 800; color: #7ce4ff; }
        .student-picker-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .student-picker-actions .btn { min-height: 36px; padding: 6px 10px; font-size: 0.85rem; font-weight: 800; border-radius: 9px; }
        #shuffleBubblesBtn { background: #ffe600; color: #111; border: none; }
        #resetBubblesBtn { background: rgba(255,255,255,0.12); color: #fff; border: none; }
        #closeMultiPickerModal { width: 34px; min-height: 36px; font-size: 1.8rem; background: none; border: none; color: #fff; }

        .bubble-picker-grid {
            --bubble-size: 100px;
            --bubble-columns: 6;
            --bubble-rows: 4;
            --bubble-gap: 10px;
            display: grid;
            grid-template-columns: repeat(var(--bubble-columns), minmax(0, 1fr));
            grid-template-rows: repeat(var(--bubble-rows), minmax(0, 1fr));
            gap: var(--bubble-gap);
            padding: 8px;
            flex: 1;
            min-width: 0;
            min-height: 0;
            justify-items: center;
            align-items: center;
        }

        .bubble-card {
            position: relative;
            width: var(--bubble-size);
            height: var(--bubble-size);
            min-width: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4a5863 0%, #22292f 70%, #151a1e 100%);
            border: 3px solid #5a6a77;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35), inset 0 3px 6px rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
            user-select: none;
        }

        .bubble-card:hover:not(.revealed) {
            transform: scale(1.04);
            border-color: #2ec4b6;
        }

        .bubble-question { font-size: calc(var(--bubble-size) * 0.27); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .bubble-card.revealed {
            background: none;
            border-color: transparent;
            box-shadow: none;
            animation: pop-bounce 0.35s ease-out forwards;
            cursor: default;
        }

        @keyframes pop-bounce {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            65% { transform: scale(1.04) rotate(4deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .bubble-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: calc(var(--bubble-size) * 0.43);
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
        }

        /* 가장 최근에 뽑힌 학생만 춤춘다. 다음 학생이 뽑히면 멈춘다. */
        .bubble-card.latest .bubble-avatar {
            animation: picked-dance 0.9s ease-in-out 0.3s infinite;
            transform-origin: 50% 90%;
            will-change: transform;
        }

        @keyframes picked-dance {
            0%, 50%, 100% { transform: translateY(0) rotate(0deg) scale(1.08, 0.92); }
            25% { transform: translateY(-22%) rotate(-9deg) scale(0.97, 1.05); }
            75% { transform: translateY(-22%) rotate(9deg) scale(0.97, 1.05); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bubble-card.latest .bubble-avatar { animation: none; }
        }

        .bubble-name {
            max-width: 100%;
            font-size: clamp(10px, calc(var(--bubble-size) * 0.14), 20px);
            font-weight: 800;
            line-height: 1.2;
            color: #fff;
            margin-top: 3px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 1280px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            header.dashboard-header { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .forecast-card { grid-column: 1 / -1; }
            .clock-card, .weather-card { padding: 10px; }
            .clock-time { font-size: clamp(1.9rem, 6vw, 2.8rem); }
            .clock-seconds { font-size: 1rem; }
            .clock-weekday { font-size: 0.9rem; }
            .clock-month-day { font-size: 0.82rem; }
            .weather-card .weather-temp { font-size: 1.35rem; }
            .weather-condition { font-size: 0.8rem; }
            .air-row { font-size: 0.74rem; gap: 4px; }
            .air-row dd { gap: 4px; }
            .air-value { font-size: 0.84rem; }
            .air-unit.dust-unit { display: none; }
            .dashboard-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

    <script>
        // 학생 보기(?view=student): 자기 반 것을 읽기만 한다. 권한은 서버가 따로 확인한다.
        const studentView = document.documentElement.classList.contains("student-view");
        const STUDENT_API = "/api/student/class-dashboard";
        const schoolApi = studentView ? {
            events: month => STUDENT_API + "/events?month=" + month,
            holidays: year => STUDENT_API + "/holidays?year=" + year,
            vacation: year => STUDENT_API + "/vacation?academicYear=" + year
        } : {
            events: month => "/api/teacher/general-events?month=" + month,
            holidays: year => "/api/teacher/public-holidays?year=" + year,
            vacation: year => "/api/teacher/vacation-settings?academicYear=" + year
        };
        let studentDashboardLoaded = false;
        let studentLayoutStore = null; // 학생이 옮긴 카드 순서. 그 학생에게만 적용된다.
        if (studentView) document.getElementById("seatingLink").search = location.search;

        // State & LocalStorage
        let schedules = [];
        let schoolSchedules = [];
        let schedulesLoading = true;
        let scheduleLoadErrors = [];
        let scheduleLoadVersion = 0;
        let activeScheduleClassId = null;
        let canEditSchedules = false;
        // 결원 학생·교시 준비물은 계정별 서버 저장 공간에 둔다(아래 loadDashboardSettingsFromDB 에서 받는다).
        let dashboardStore = null;
        const PREP_DAY_ITEM = { "월": "preps-mon", "화": "preps-tue", "수": "preps-wed", "목": "preps-thu", "금": "preps-fri" };
        const prepItem = (day) => PREP_DAY_ITEM[day] || ("preps-" + day);
        let rosterStudents = [];
        let rosterLoadMessage = "";

        // 반 시간표는 학교 기초시간표 + 담임이 바꾼 칸이다(서버가 합쳐서 준다). 없으면 비워 둔다.
        let customTimetable = {};
        let timetableLoaded = false;
        let timetableEditable = false;
        let timetableSource = "none";
        let selectedDayTab = "목";

        // Elements
        const resetBtn = document.getElementById("resetBtn");

        const clockHM = document.getElementById("clockHM");
        const clockSec = document.getElementById("clockSec");
        const clockWeekday = document.getElementById("clockWeekday");
        const clockMonthDay = document.getElementById("clockMonthDay");
        const englishWeekdayFormatter = new Intl.DateTimeFormat("en-US", { weekday: "long" });
        const englishMonthDayFormatter = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric" });
        const currentDayLabel = document.getElementById("currentDayLabel");

        const checklistGrid = document.getElementById("checklistGrid");

        const scheduleList = document.getElementById("scheduleList");
        const scheduleDateInput = document.getElementById("scheduleDateInput");
        const scheduleTitleInput = document.getElementById("scheduleTitleInput");
        const scheduleDetailsInput = document.getElementById("scheduleDetailsInput");
        const addScheduleBtn = document.getElementById("addScheduleBtn");
        const scheduleCountBadge = document.getElementById("scheduleCountBadge");
        const scheduleEditor = document.getElementById("scheduleEditor");
        const cancelScheduleEditBtn = document.getElementById("cancelScheduleEditBtn");
        let editingScheduleId = null;

        const mealList = document.getElementById("mealList");
        // 급식은 달력에서 고른 날 것을 보여 준다. 달력이 처음 그려질 때 읽으므로 여기서 먼저 만든다.
        let mealSchool = null;
        let mealDate = "";
        let mealRequestVersion = 0;
        const mealDishesByDay = new Map();

        // 1. Clock & Timetable
        let lastRenderedMin = -1;
        let lastRenderedDay = "";
        let lastPanelThemeDay = -1;

        const weekdayPanelImages = {
            1: "url('./assets/dashboard-panels/monday.webp')",
            2: "url('./assets/dashboard-panels/tuesday.webp')",
            3: "url('./assets/dashboard-panels/wednesday.webp')",
            4: "url('./assets/dashboard-panels/thursday.webp')",
            5: "url('./assets/dashboard-panels/friday.webp')"
        };
        const weekdayBoxImages = {
            1: "url('./assets/dashboard-panels/monday-box.webp')",
            2: "url('./assets/dashboard-panels/tuesday-box.webp')",
            3: "url('./assets/dashboard-panels/wednesday-box.webp')",
            4: "url('./assets/dashboard-panels/thursday-box.webp')",
            5: "url('./assets/dashboard-panels/friday-box.webp')"
        };

        function applyWeekdayPanelTheme(date) {
            const day = date.getDay();
            if (day === lastPanelThemeDay) return;
            lastPanelThemeDay = day;
            // 주말 그림은 따로 없으니 색이 없는 월요일 회색 나무를 깐다.
            document.documentElement.style.setProperty(
                "--weekday-panel-image",
                weekdayPanelImages[day] || weekdayPanelImages[1]
            );
            document.documentElement.style.setProperty("--weekday-box-image", weekdayBoxImages[day] || weekdayBoxImages[1]);
        }

        function updateClock() {
            const now = new Date();
            applyWeekdayPanelTheme(now);
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            
            clockHM.textContent = `${hours}:${mins}`;
            clockSec.textContent = `:${secs}`;

            const days = ["일", "월", "화", "수", "목", "금", "토"];
            const dayName = days[now.getDay()];

            clockWeekday.textContent = englishWeekdayFormatter.format(now);
            clockMonthDay.textContent = englishMonthDayFormatter.format(now);
            currentDayLabel.textContent = `${dayName}요일`;
            selectedDayTab = (["월","화","수","목","금"].includes(dayName)) ? dayName : "월";

            const currentTotalMin = now.getHours() * 60 + now.getMinutes();
            const isInputActive = document.activeElement && document.activeElement.classList.contains("prep-input");

            if (!isInputActive && (currentTotalMin !== lastRenderedMin || selectedDayTab !== lastRenderedDay)) {
                lastRenderedMin = currentTotalMin;
                lastRenderedDay = selectedDayTab;
                renderTimetable(selectedDayTab, now);
            }

        function renderTimetable(dayName, now = new Date()) {
            const listEl = document.getElementById("timetableList");
            if (!listEl) return;
            listEl.replaceChildren();

            const periods = customTimetable[dayName] || [];
            const currentMins = now.getHours() * 60 + now.getMinutes();

                    const [sH, sM] = item.s.split(":").map(Number);
                    const [eH, eM] = item.e.split(":").map(Number);
                    if (currentMins >= sH * 60 + sM && currentMins <= eH * 60 + eM) div.classList.add("active");

                let placeTag = '';
                if (item.place) {
                    const isNormalClassroom = (item.place === '교실' || item.place === '우리교실');

                            <span>${escHtmlLocal(item.e || "")}</span>

                            ${item.changed ? '<span class="period-place highlight" title="학교 기초시간표와 다르게 바꾼 시간">학급 변경</span>' : ''}
                        </div>
                    </div>
                    <div class="period-col-right">
                        ${studentView
                            ? (hasVal ? `<div class="prep-note">${escHtmlLocal(prepVal)}</div>` : "")
                            : `${prepBadge}<input class="prep-input${hasVal ? ' has-value' : ''}" data-day="${dayName}" data-p="${item.p}" value="${prepVal}" placeholder="준비물 입력..." draggable="false" autocomplete="off">`}
                    </div>

            if ((studentView ? studentDashboardLoaded : timetableLoaded) && periods.length === 0) {

                input.addEventListener("mousedown", (e) => e.stopPropagation());
                input.addEventListener("dragstart", (e) => e.stopPropagation());
                input.addEventListener("input", (e) => {

                    if (!dashboardStore) return;

        // 2. Timetable Modal Customizer

        async function loadDashboardSettingsFromDB() {
            if (studentView) return;
            try {
                dashboardStore = await SiteStorage.open("dashboard");
                // 예전에 브라우저에 두던 것을 한 번 옮기고 지운다. 시간표·카드 순서는 서버 설정이 이미 맡는다.
                dashboardStore.adopt([
                    { localKey: "dashboardMissingStudents", item: "missing-students" },
                    ...Object.entries(PREP_DAY_ITEM).map(([day, item]) => ({ localKey: `dashboardPreps_${day}`, item })),

                ]);
                renderTimetable(selectedDayTab);

            try {

        function getAvatarForStudent(num) {

        }

        function escHtmlLocal(str) {
            return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 오늘 날짜 + 우리 학급(전교 포함) 대상 일반 행사를 배너로만 보여준다.
        // 기존 시간표 위젯의 과목/장소는 절대 건드리지 않는다.
        async function loadTodayEvents(grade) {
            const banner = document.getElementById("todayEventsBanner");
            if (!banner) return;
            try {
                const now = new Date();
                const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
                const todayStr = `${month}-${String(now.getDate()).padStart(2, "0")}`;
                const res = await fetch(schoolApi.events(month));
                const data = await res.json();
                const events = (data.events || []).filter(ev => {
                    const inRange = ev.event_date <= todayStr && (ev.end_date || ev.event_date) >= todayStr;
                    const matchesGrade = ev.target_scope === "ALL" || (Array.isArray(ev.target_grades) && grade && ev.target_grades.includes(grade));
                    return inRange && matchesGrade;
                });

                banner.replaceChildren();
                if (events.length === 0) {
                    banner.hidden = true;
                    return;
                }
                events.forEach(ev => {
                    const line = document.createElement("div");
                    line.className = "today-event-line";
                    const metaParts = [ev.event_time, ev.period, ev.location].filter(Boolean).join(", ");
                    line.innerHTML = `<span>📌 ${escHtmlLocal(ev.title)}</span>${metaParts ? `<span class="today-event-meta">(${escHtmlLocal(metaParts)})</span>` : ""}`;
                    banner.appendChild(line);
                });
                banner.hidden = false;
            } catch (err) {
                banner.hidden = true;
            }
        }

        // 4. Student Roster Checklist & Birthday Check & Class Switcher
        let rosterLoadVersion = 0;
        async function fetchRosterAndRenderChecklist(classId = null) {
            const version = ++rosterLoadVersion;
            activeScheduleClassId = null;
            canEditSchedules = false;
            try {
                const classSwitcherSelect = document.getElementById("classSwitcherSelect");
                
                // Fetch available classes for switcher
                const availableRes = studentView
                    ? { ok: true, json: async () => ({ classes: [] }) }
                    : await fetch("/api/teacher/available-classes");
                const availableData = await availableRes.json();
                if (version !== rosterLoadVersion) return;
                if (!availableRes.ok) throw new Error(availableData.message || "학급 목록을 불러오지 못했습니다.");
                const prevVal = classSwitcherSelect?.value;
                if (classSwitcherSelect) {
                    classSwitcherSelect.replaceChildren();
                    classSwitcherSelect.hidden = true;
                }
                
                if (availableData.classes && availableData.classes.length > 0 && classSwitcherSelect) {
                    classSwitcherSelect.hidden = false;
                    // 이 계정 자신의 담임 학급이 아직 정해지지 않은 상태(관리자 등)에서
                    // <select>가 아무것도 선택 안 된 채로 남으면 브라우저가 그냥 목록의
                    // 첫 번째 학급(다른 담임의 반)을 자동으로 보여준다 -- 마치 그게 내
                    // 학급인 것처럼 보이므로, 명시적인 빈 선택지를 기본값으로 둔다.
                    const placeholderOpt = document.createElement("option");
                    placeholderOpt.value = "";
                    placeholderOpt.textContent = "학급을 선택하세요";
                    classSwitcherSelect.appendChild(placeholderOpt);
                    // 전담교사별 시간표에서 내가 배정된 반(내 수업)을 먼저, ★ 표시와 과목명을 붙여서 보여준다.
                    const sortedClasses = availableData.classes.slice().sort((a, b) => {
                        if (Boolean(b.isMyTeaching) !== Boolean(a.isMyTeaching)) return b.isMyTeaching ? 1 : -1;
                        if (a.grade !== b.grade) return a.grade - b.grade;
                        return a.classNumber - b.classNumber;
                    });
                    sortedClasses.forEach(c => {
                        const opt = document.createElement("option");
                        opt.value = c.id;
                        const subjects = Array.isArray(c.myTeachingSubjects) && c.myTeachingSubjects.length ? ` · ${c.myTeachingSubjects.join(",")}` : "";
                        opt.textContent = c.isMyTeaching
                            ? `★ ${c.grade}학년 ${c.classNumber}반 (내 수업${subjects})`
                            : `${c.grade}학년 ${c.classNumber}반 (${c.teacherName})`;
                        classSwitcherSelect.appendChild(opt);
                    });
                    if (classId) classSwitcherSelect.value = classId;
                    else if (prevVal) classSwitcherSelect.value = prevVal;
                    else classSwitcherSelect.value = "";
                }

                const fetchUrl = studentView ? STUDENT_API
                    : classId ? `/api/teacher/class?classId=${classId}` : "/api/teacher/class";
                const res = await fetch(fetchUrl);
                const data = await res.json();
                if (version !== rosterLoadVersion) return;
                if (!res.ok) {
                    throw new Error(data?.message || "학급 정보를 불러오지 못했습니다.");
                }
                if (studentView) applyStudentDashboard(data);
                else applyTimetableData(data);
                if (data?.classroom) {
                    fetchRealtimeWeatherAndAirQuality();
                    rosterStudents = data.classroom.students || [];
                    activeRosterClass = data.classroom;
                    loadMeals(data.classroom);
                    activeScheduleClassId = data.classroom.id;
                    canEditSchedules = !data.classroom.isReadOnly;
                    if (data.classroom.id && classSwitcherSelect) {
                        classSwitcherSelect.value = data.classroom.id;
                    }
                    rosterLoadMessage = rosterStudents.length ? "" : "등록된 학생이 없습니다.";
                    loadTodayEvents(data.classroom.grade);
                } else {
                    rosterStudents = [];
                    activeRosterClass = null;
                    loadMeals(null);
                    rosterLoadMessage = data?.message || "담임 학급 정보를 불러오지 못했습니다. 학교 관리자에게 학급 배정을 확인해 주세요.";
                    fetchRealtimeWeatherAndAirQuality();
                }
            } catch (err) {
                if (version !== rosterLoadVersion) return;
                console.error("/api/teacher/class request threw:", err);
                if (!studentView) applyTimetableData(null);
                const select = document.getElementById("classSwitcherSelect");
                if (select) { select.replaceChildren(); select.hidden = true; }
                rosterStudents = [];
                activeRosterClass = null;
                loadMeals(null);
                rosterLoadMessage = err.message || "담임 학급 정보를 불러오지 못했습니다. 학교 관리자에게 학급 배정을 확인해 주세요.";
                fetchRealtimeWeatherAndAirQuality();
            }
            document.title = activeRosterClass?.grade && activeRosterClass?.classNumber
                ? String(activeRosterClass.grade) + "학년 " + String(activeRosterClass.classNumber) + "반"
                : "학급";
            fetchQuickAlertsForDashboard();
            document.getElementById("attendanceArrival").hidden = true;
            attendanceLive.selectClass(activeRosterClass?.id);
            await loadSchedules(activeScheduleClassId);
            await loadCalendarData();
        }

        const classSwitcherSelectEl = document.getElementById("classSwitcherSelect");
        if (classSwitcherSelectEl) {
            classSwitcherSelectEl.addEventListener("change", (e) => {
                const selectedClassId = e.target.value;
                if (selectedClassId) fetchRosterAndRenderChecklist(selectedClassId);
            });
        }

        function isTodayBirthday(student) {
            const birthdayMmdd = student?.birthdayMmdd || "";
            if (!student?.birthdayVisible || birthdayMmdd.length !== 4) return false;
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return birthdayMmdd === (mm + dd);
        }

        let todayQuickAlerts = new Map();
        let activeRosterClass = null;
        let attendanceRequestVersion = 0;
        let attendanceSnapshotKey = "";
        let attendanceLoadFailed = false;

        function attendanceKey(grade, classNumber, studentNumber) {
            return [grade, classNumber, studentNumber].map(String).join(":");
        }

        async function fetchQuickAlertsForDashboard() {
            const requestVersion = ++attendanceRequestVersion;
            const classroom = activeRosterClass;
            const today = koreanWeatherClock().date;
            const snapshotKey = classroom ? classroom.id + ":" + today : "";
            if (snapshotKey !== attendanceSnapshotKey) {
                todayQuickAlerts = new Map();
                attendanceSnapshotKey = snapshotKey;
            }
            attendanceLoadFailed = false;
            renderChecklist();
            if (!classroom?.id && !(studentView && classroom)) return;
            try {
                const attendanceUrl = studentView ? STUDENT_API + "/attendance"
                    : "/api/teacher/class-attendance?classId=" + encodeURIComponent(classroom.id);
                const res = await fetch(attendanceUrl, {
                    cache: "no-store",
                    signal: AbortSignal.timeout(10000)
                });
                if (!res.ok) throw new Error("Attendance fetch failed");
                const data = await res.json();
                if (requestVersion !== attendanceRequestVersion || activeRosterClass?.id !== classroom.id) return;
                if (String(data.classId) !== String(classroom.id) || data.date !== koreanWeatherClock().date
                    || !Array.isArray(data.alerts)) throw new Error("Attendance response does not match the class/date");
                const nextAlerts = new Map();
                for (const row of data.alerts) {
                    if (row.studentNumber == null || !["결석", "지각", "조퇴", "체험학습"].includes(row.noticeType)) continue;
                    const key = attendanceKey(classroom.grade, classroom.classNumber, row.studentNumber);
                    const alerts = nextAlerts.get(key) || [];
                    if (!alerts.some(alert => alert.noticeType === row.noticeType)) {
                        alerts.push({ noticeType: row.noticeType, source: row.source });
                    }
                    nextAlerts.set(key, alerts);
                }
                todayQuickAlerts = nextAlerts;
                attendanceSnapshotKey = classroom.id + ":" + data.date;
            } catch (error) {
                if (requestVersion !== attendanceRequestVersion || activeRosterClass?.id !== classroom.id) return;
                attendanceLoadFailed = true;
            }
            renderChecklist();
        }

        function renderChecklist() {
            document.getElementById("attendanceStatus").hidden = !attendanceLoadFailed;
            checklistGrid.replaceChildren();
            if (rosterStudents.length === 0) {
                const notice = document.createElement("div");
                notice.className = "roster-empty-notice";
                notice.style.cssText = "grid-column: 1 / -1; color: var(--muted, #6b7280); font-size: 13px; padding: 8px 4px;";
                notice.textContent = rosterLoadMessage || "등록된 학생이 없습니다.";
                checklistGrid.append(notice);
                return;
            }
            rosterStudents.forEach((student) => {
                const num = String(student.number);
                const chip = document.createElement("div");
                chip.className = "num-chip";

                const alerts = activeRosterClass
                    ? todayQuickAlerts.get(attendanceKey(activeRosterClass.grade, activeRosterClass.classNumber, num)) || []
                    : [];
                const attendanceLabel = alerts.map(alert => [alert.source, alert.noticeType].filter(Boolean).join(" ")).join(", ");
                const name = document.createElement("span");
                name.className = "roster-student-copy";
                const numberLabel = document.createElement("span");
                numberLabel.className = "roster-student-number";
                numberLabel.textContent = num + "번";
                const studentName = document.createElement("span");
                studentName.className = "roster-student-name";
                studentName.textContent = student.name || "";
                name.append(numberLabel, studentName);
                chip.append(name);

                if (alerts.length) {
                    const tags = document.createElement("span");
                    tags.className = "attendance-tags";
                    for (const alert of alerts) {
                        const tag = document.createElement("span");
                        tag.className = "attendance-tag";
                        tag.dataset.kind = alert.noticeType;
                        tag.textContent = alert.noticeType;
                        tags.append(tag);
                    }
                    chip.append(tags);
                    chip.title = attendanceLabel;
                }
                if (isTodayBirthday(student)) {
                    const birthday = document.createElement("span");
                    birthday.className = "bday-tag";
                    birthday.textContent = "🎂";
                    chip.append(birthday);
                }
                checklistGrid.append(chip);
            });
        }

        let attendanceArrivalTimer;
        const attendanceLive = studentView ? { selectClass() {} } : createDashboardAttendanceLive({
            soundButton: document.getElementById("attendanceSound"),
            onChange: fetchQuickAlertsForDashboard,
            onConnectionChange: failed => {
                document.getElementById("attendanceConnectionStatus").hidden = !failed;
            },
            onArrival: (event, soundNeedsInteraction) => {
                const notice = document.getElementById("attendanceArrival");
                const student = rosterStudents.find(row => String(row.number) === String(event.studentNumber));
                notice.textContent = (student?.name || event.studentNumber + "번") + " · " + event.noticeType + " 알림 도착"
                    + (soundNeedsInteraction ? " · 소리를 켜려면 화면을 눌러 주세요" : "");
                notice.hidden = false;
                clearTimeout(attendanceArrivalTimer);
                attendanceArrivalTimer = setTimeout(() => { notice.hidden = true; }, 8000);
            }
        });
        document.getElementById("attendanceRetry").addEventListener("click", fetchQuickAlertsForDashboard);
        // One rollover refresh per day; attendance itself is updated by incoming events.
        let attendanceMidnightTimer;
        function scheduleAttendanceRollover() {
            clearTimeout(attendanceMidnightTimer);
            const nextMidnight = new Date(koreanWeatherClock().date + "T00:00:00+09:00").getTime() + 86400000;
            attendanceMidnightTimer = setTimeout(() => {
                fetchQuickAlertsForDashboard();
                scheduleAttendanceRollover();
            }, Math.max(1000, nextMidnight - Date.now() + 100));
        }
        scheduleAttendanceRollover();
        if (studentView) {
            // 학생 화면은 실시간 연결 없이 가끔 새로 받는다.
            setInterval(() => { if (!document.hidden) fetchQuickAlertsForDashboard(); }, 5 * 60 * 1000);
            document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchQuickAlertsForDashboard(); });
        }
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && attendanceSnapshotKey
                && !attendanceSnapshotKey.endsWith(":" + koreanWeatherClock().date)) {
                fetchQuickAlertsForDashboard();
                scheduleAttendanceRollover();
            }
        });
        fetchRosterAndRenderChecklist();

        // 5. Important schedules
        function localDateKey(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        scheduleDateInput.value = localDateKey();

        async function scheduleApi(path, options = {}) {
            const response = await fetch(path, {
                ...options,
                headers: { "Content-Type": "application/json", ...(options.headers || {}) }
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.message || "일정을 불러오지 못했습니다.");
            return payload;
        }

        function upcomingDateWindow() {
            const today = localDateKey();
            const end = new Date(today + "T00:00:00");
            end.setDate(end.getDate() + 30);
            return { today, end: localDateKey(end) };
        }

        function schoolEventMatchesGrade(event, grade) {
            return event.target_scope === "ALL" || (event.target_scope === "GRADE"
                && (event.target_grades || []).some(value => Number(value) === Number(grade)));
        }

        async function loadUpcomingSchoolSchedules(grade) {
            const window = upcomingDateWindow();
            const cursor = new Date(window.today.slice(0, 7) + "-01T00:00:00");
            const months = [];
            while (localDateKey(cursor) <= window.end) {
                months.push(localDateKey(cursor).slice(0, 7));
                cursor.setMonth(cursor.getMonth() + 1);
            }
            const years = [...new Set(months.map(month => Number(month.slice(0, 4))))];
            const academicYears = [...new Set(months.map(month =>
                Number(month.slice(0, 4)) - (Number(month.slice(5, 7)) < 3 ? 1 : 0)))];
            const sources = [
                ...months.map(month => ({ kind: "events", label: "학교 행사", path: schoolApi.events(month) })),
                ...years.map(year => ({ kind: "holidays", label: "공휴일", path: schoolApi.holidays(year) })),
                ...academicYears.map(year => ({ kind: "vacation", label: "방학·학사일정", path: schoolApi.vacation(year) }))
            ];
            const results = await Promise.allSettled(sources.map(source => scheduleApi(source.path)));
            const items = [];
            const errors = [];
            results.forEach((result, index) => {
                const source = sources[index];
                if (result.status === "rejected") {
                    errors.push(source.label);
                    return;
                }
                const data = result.value;
                if (source.kind === "events") {
                    (data.events || []).filter(event => schoolEventMatchesGrade(event, grade)).forEach(event =>
                        items.push({
                            id: "school_event_" + event.id, date: event.event_date,
                            endDate: event.end_date || event.event_date, title: event.title,
                            details: [event.event_time, event.period, event.location].filter(Boolean).join(" · "),
                            scope: event.target_scope, type: "school_event", canDelete: false
                        }));
                } else if (source.kind === "holidays") {
                    (data.holidays || []).forEach(holiday => items.push({
                        id: "holiday_" + holiday.date + "_" + holiday.name, date: holiday.date,
                        title: holiday.name, type: "public_holiday", canDelete: false
                    }));
                } else if (data.settings) {
                    const settings = data.settings;
                    [
                        ["summer", "여름방학", settings.summer_start, settings.summer_end],
                        ["winter", settings.is_integrated ? "겨울/학년말방학" : "겨울방학", settings.winter_start, settings.winter_end],
                        ...(!settings.is_integrated ? [["spring", "학년말방학", settings.spring_start, settings.spring_end]] : [])
                    ].forEach(([kind, title, start, end]) => {
                        if (start && end) items.push({
                            id: "vacation_" + kind + "_" + start, date: start, endDate: end,
                            title, type: "vacation", canDelete: false
                        });
                    });
                    [[settings.entrance_ceremony_date, "입학식"], [settings.graduation_ceremony_date, "졸업식"]]
                        .forEach(([date, title]) => {
                            if (date) items.push({ id: "ceremony_" + date + title, date, title,
                                type: "annual_schedule", scope: "ALL", canDelete: false });
                        });
                }
            });
            return { items, errors: [...new Set(errors)] };
        }

        async function loadSchedules(classId = null) {
            const version = ++scheduleLoadVersion;
            schedules = [];
            schoolSchedules = [];
            schedulesLoading = true;
            scheduleLoadErrors = [];
            renderSchedules();
            if (!classId) {
                activeScheduleClassId = null;
                canEditSchedules = false;
                scheduleEditor.hidden = true;
                schedulesLoading = false;
                renderSchedules();
                renderCalendar();
                return;
            }
            const query = classId ? "?classId=" + encodeURIComponent(classId) : "";
            const grade = activeRosterClass?.grade;
            const results = await Promise.allSettled([
                scheduleApi("/api/class/schedules" + query),
                loadUpcomingSchoolSchedules(grade)
            ]);
            if (version !== scheduleLoadVersion) return;
            if (results[0].status === "fulfilled") {
                const data = results[0].value;
                activeScheduleClassId = data.classId;
                canEditSchedules = Boolean(data.canEdit);
                schedules = Array.isArray(data.schedules) ? data.schedules : [];
                scheduleEditor.hidden = !canEditSchedules;
