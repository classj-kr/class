                try {
                    await migrateLocalSchedules();
                } catch (migrationError) {
                    console.warn("기기 저장 일정을 아직 이전하지 못했습니다.", migrationError);
                }
            } else {
                canEditSchedules = false;
                scheduleEditor.hidden = true;
                scheduleLoadErrors.push("학급·학사일정");
            }
            if (version !== scheduleLoadVersion) return;
            if (results[1].status === "fulfilled") {
                schoolSchedules = results[1].value.items;
                scheduleLoadErrors.push(...results[1].value.errors);
            } else {
                scheduleLoadErrors.push("학교 일정·공휴일");
            }
            schedulesLoading = false;
            renderSchedules();
            renderCalendar();
        }

        // 예전에 브라우저에 두던 일정을 서버로 옮긴다. 옮기면 브라우저에서 지우므로 표시가 따로 필요 없다.
        async function migrateLocalSchedules() {
            if (!canEditSchedules || !activeScheduleClassId) return;
            let localSchedules = [];
            try {
                const saved = JSON.parse(localStorage.getItem("dashboardSchedules") || "[]");
                localSchedules = Array.isArray(saved) ? saved : [];
            } catch (_) {
                localSchedules = [];
            }
            try {
                for (const key of Object.keys(localStorage)) if (key.startsWith("dashboardSchedulesMigrated_")) localStorage.removeItem(key);
            } catch (_) {}
            if (localSchedules.length === 0) return;
            for (const item of localSchedules) {
                if (!item?.date || !item?.title) continue;
                const data = await scheduleApi("/api/teacher/schedules", {
                    method: "POST",
                    body: JSON.stringify({ classId: activeScheduleClassId, date: item.date, title: item.title, details: item.details || "" })
                });
                schedules.push(data.schedule);
            }
            localStorage.removeItem("dashboardSchedules");
        }

        function renderSchedules() {
            scheduleList.replaceChildren();
            const today = localDateKey();
            const now = new Date(`${today}T00:00:00`);
            const weekEnd = new Date(now);
            weekEnd.setDate(now.getDate() + (7 - now.getDay()) % 7);
            const weekEndKey = localDateKey(weekEnd);
            const scheduleWindowEnd = new Date(now);
            scheduleWindowEnd.setDate(now.getDate() + 30);
            const scheduleWindowEndKey = localDateKey(scheduleWindowEnd);
            const seen = new Set();
            const upcoming = [...schedules, ...schoolSchedules]
                .filter(item => {
                    if (item.date > scheduleWindowEndKey || (item.endDate || item.date) < today) return false;
                    // Overlapping month queries return a multi-day school event more than once.
                    const key = item.canDelete === false
                        ? [item.date, item.endDate || item.date, item.title].join("|")
                        : [item.type, item.id].join("|");
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                })
                .sort((a, b) => (a.date < today ? today : a.date).localeCompare(b.date < today ? today : b.date)
                    || a.title.localeCompare(b.title));
            scheduleCountBadge.textContent = schedulesLoading ? "불러오는 중"
                : scheduleLoadErrors.length ? "확인된 " + upcoming.length + "개"
                : "예정 " + upcoming.length + "개";
            const status = document.getElementById("scheduleLoadStatus");
            status.replaceChildren();
            status.hidden = scheduleLoadErrors.length === 0;
            if (scheduleLoadErrors.length) {
                status.textContent = scheduleLoadErrors.join("·") + " 정보를 불러오지 못했습니다.";
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", () => loadSchedules(activeScheduleClassId));
                status.append(retry);
            }

            if (!upcoming.length) {
                const empty = document.createElement("div");
                empty.className = "schedule-empty";
                empty.textContent = schedulesLoading ? "학교 일정과 공휴일을 불러오는 중입니다."
                    : scheduleLoadErrors.length ? "일정을 모두 확인하지 못했습니다. 다시 불러와 주세요."
                    : "오늘부터 30일 이내에 예정된 주요일정이 없습니다.";
                scheduleList.append(empty);
                return;
            }

            upcoming.forEach((item) => {
                const div = document.createElement("div");
                div.className = "board-item";
                const displayDate = item.date < today ? today : item.date;
                if (displayDate === today) div.classList.add("schedule-today");
                else if (displayDate <= weekEndKey) div.classList.add("schedule-this-week");
                const date = new Date(`${item.date}T00:00:00`);
                const isThisWeek = item.date > today && item.date <= weekEndKey;
                const weekday = ["일", "월", "화", "수", "목", "금", "토"][date.getDay()];
                const label = item.date === today ? "오늘" : isThisWeek ? `${weekday}요일` : `${date.getMonth() + 1}/${date.getDate()}`;
                const dateSpan = document.createElement("span");
                dateSpan.className = "schedule-date";
                if (isThisWeek) dateSpan.classList.add("this-week");
                dateSpan.textContent = item.date < today ? "진행 중" : label;
                if (item.endDate && item.endDate !== item.date) {
                    const range = document.createElement("span");
                    range.className = "schedule-date-range";
                    range.textContent = Number(item.date.slice(5, 7)) + "/" + Number(item.date.slice(8, 10))
                        + "–" + Number(item.endDate.slice(5, 7)) + "/" + Number(item.endDate.slice(8, 10));
                    dateSpan.append(range);
                }
                const copy = document.createElement("span");
                copy.className = "schedule-copy";
                if (item.type === "public_holiday" || item.type === "vacation") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge " + (item.type === "public_holiday" ? "scope-holiday" : "scope-vacation");
                    badge.textContent = item.type === "public_holiday" ? "공휴일" : "방학";
                    copy.append(badge);
                } else if (item.scope === "ALL") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge scope-all";
                    badge.textContent = "전교";
                    copy.append(badge);
                } else if (item.scope === "GRADE") {
                    const badge = document.createElement("span");
                    badge.className = "schedule-badge scope-grade";
                    badge.textContent = "학년";
                    copy.append(badge);
                }
                const titleSpan = document.createElement("span");
                titleSpan.textContent = item.title;
                copy.append(titleSpan);
                if (item.details) {
                    const detailSpan = document.createElement("span");
                    detailSpan.className = "schedule-detail";
                    detailSpan.textContent = item.details;
                    copy.append(detailSpan);
                }
                div.append(dateSpan, copy);
                if (canEditSchedules && item.type !== "birthday" && item.canDelete !== false) {
                    const actions = document.createElement("span");
                    actions.className = "schedule-actions";
                    const edit = document.createElement("button");
                    edit.className = "board-item-del board-item-edit";
                    edit.textContent = "✎";
                    edit.setAttribute("aria-label", `${item.title} 일정 수정`);
                    edit.addEventListener("click", () => {
                        editingScheduleId = item.id;
                        scheduleDateInput.value = item.date;
                        scheduleTitleInput.value = item.title;
                        scheduleDetailsInput.value = item.details || "";
                        addScheduleBtn.textContent = "✓";
                        addScheduleBtn.setAttribute("aria-label", "주요일정 수정 저장");
                        cancelScheduleEditBtn.hidden = false;
                        renderCalendar();
                        scheduleTitleInput.focus();
                        scheduleTitleInput.select();
                    });
                    const del = document.createElement("button");
                    del.className = "board-item-del";
                    del.innerHTML = "&times;";
                    del.setAttribute("aria-label", `${item.title} 일정 삭제`);
                    del.addEventListener("click", async () => {
                        try {
                            await scheduleApi(`/api/teacher/schedules/${encodeURIComponent(item.id)}`, { method: "DELETE" });
                            schedules = schedules.filter((schedule) => schedule.id !== item.id);
                            if (editingScheduleId === item.id) resetScheduleEditor();
                            renderSchedules();
                            await loadCalendarData();
                        } catch (error) {
                            alert(error.message);
                        }
                    });
                    actions.append(edit, del);
                    div.append(actions);
                }
                scheduleList.append(div);
            });
        }

        async function addSchedule() {
            const date = scheduleDateInput.value;
            const title = scheduleTitleInput.value.trim();
            const details = scheduleDetailsInput.value.trim();
            if (!canEditSchedules || !activeScheduleClassId || !date || !title) return;
            addScheduleBtn.disabled = true;
            try {
                const data = await scheduleApi(editingScheduleId
                    ? `/api/teacher/schedules/${encodeURIComponent(editingScheduleId)}`
                    : "/api/teacher/schedules", {
                    method: editingScheduleId ? "PATCH" : "POST",
                    body: JSON.stringify({ classId: activeScheduleClassId, date, title, details })
                });
                if (editingScheduleId) {
                    schedules = schedules.map((item) => item.id === editingScheduleId ? data.schedule : item);
                } else {
                    schedules.push(data.schedule);
                }
                resetScheduleEditor();
                renderSchedules();
                await loadCalendarData();
                scheduleTitleInput.focus();
            } catch (error) {
                alert(error.message);
            } finally {
                addScheduleBtn.disabled = false;
            }
        }

        function resetScheduleEditor() {
            editingScheduleId = null;
            scheduleTitleInput.value = "";
            scheduleDetailsInput.value = "";
            addScheduleBtn.textContent = "+";
            addScheduleBtn.setAttribute("aria-label", "주요일정 추가");
            cancelScheduleEditBtn.hidden = true;
        }

        addScheduleBtn.addEventListener("click", addSchedule);
        cancelScheduleEditBtn.addEventListener("click", () => {
            resetScheduleEditor();
            renderCalendar();
        });
        scheduleTitleInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") addSchedule();
            if (event.key === "Escape" && editingScheduleId) {
                resetScheduleEditor();
                renderCalendar();
            }
        });
        scheduleDetailsInput.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && editingScheduleId) {
                resetScheduleEditor();
                renderCalendar();
            }
        });

        renderSchedules();

        // 6. Mini Calendar
        let calendarCursor = new Date();
        calendarCursor.setDate(1);
        let calendarRequestVersion = 0;
        let calendarData = { schedules: [], events: [], holidays: [], vacation: null };

        async function loadCalendarData() {
            const version = ++calendarRequestVersion;
            const status = document.getElementById("calendarStatus");
            calendarData = { schedules: [], events: [], holidays: [], vacation: null };
            renderCalendar();
            if (!activeRosterClass) {
                status.hidden = false;
                status.textContent = studentView ? "학교 일정을 불러오지 못했습니다." : "학급을 선택하면 학교 일정이 표시됩니다.";
                return;
            }
            status.hidden = false;
            status.textContent = "학교 일정 불러오는 중...";
            const year = calendarCursor.getFullYear();
            const month = localDateKey(calendarCursor).slice(0, 7);
            const academicYear = calendarCursor.getMonth() >= 2 ? year : year - 1;
            const grade = Number(activeRosterClass.grade);
            const classId = activeRosterClass.id;
            const results = await Promise.allSettled([
                scheduleApi("/api/class/schedules?" + new URLSearchParams({ classId, month })),
                scheduleApi(schoolApi.events(month)),
                scheduleApi(schoolApi.holidays(year)),
                scheduleApi(schoolApi.vacation(academicYear))
            ]);
            if (version !== calendarRequestVersion) return;
            const values = results.map(result => result.status === "fulfilled" ? result.value : {});
            calendarData = {
                schedules: values[0].schedules || [],
                events: (values[1].events || []).filter(event => schoolEventMatchesGrade(event, grade)),
                holidays: values[2].holidays || [],
                vacation: values[3].settings || null
            };
            const failed = results.map((result, index) => result.status === "rejected"
                ? ["학사·학급 일정", "학교 행사", "공휴일", "방학"][index] : "").filter(Boolean);
            status.replaceChildren();
            status.hidden = failed.length === 0;
            if (failed.length) {
                status.textContent = failed.join("·") + " 정보를 불러오지 못했습니다.";
                const retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", loadCalendarData);
                status.append(retry);
            }
            renderCalendar();
        }

        function calendarEntries(dateKey) {
            const entries = [];
            calendarData.holidays.filter(item => item.date === dateKey).forEach(item =>
                entries.push({ title: item.name, kind: "공휴일", holiday: true }));
            calendarData.schedules.filter(item => item.date === dateKey).forEach(item =>
                entries.push({ title: item.title, details: item.details,
                    kind: item.type === "annual_schedule" ? "학사" : item.type === "birthday" ? "생일" : "학급",
                    holiday: ["HOLIDAY", "DISCRETIONARY"].includes(item.category) }));
            calendarData.events.filter(item => item.event_date <= dateKey && (item.end_date || item.event_date) >= dateKey)
                .forEach(item => entries.push({ title: item.title, kind: "학교",
                    details: [item.event_time, item.period, item.location].filter(Boolean).join(" · ") }));
            const settings = calendarData.vacation;
            if (settings) {
                const periods = [
                    [settings.summer_start, settings.summer_end, "여름방학"],
                    [settings.winter_start, settings.winter_end, settings.is_integrated ? "겨울/학년말방학" : "겨울방학"],
                    ...(!settings.is_integrated ? [[settings.spring_start, settings.spring_end, "학년말방학"]] : [])
                ];
                periods.forEach(([start, end, title]) => {
                    if (start && end && start <= dateKey && end >= dateKey) entries.push({ title, kind: "방학" });
                });
                if (settings.entrance_ceremony_date === dateKey && !entries.some(item => item.title === "입학식"))
                    entries.push({ title: "입학식", kind: "학사" });
                if (settings.graduation_ceremony_date === dateKey && !entries.some(item => item.title === "졸업식"))
                    entries.push({ title: "졸업식", kind: "학사" });
            }
            return entries;
        }

        function renderCalendarAgenda() {
            const agenda = document.getElementById("calendarAgenda");
            const dateKey = scheduleDateInput.value;
            const entries = dateKey.startsWith(localDateKey(calendarCursor).slice(0, 7)) ? calendarEntries(dateKey) : [];
            agenda.replaceChildren();
            agenda.hidden = entries.length === 0;
            if (!entries.length) return;
            const heading = document.createElement("div");
            heading.className = "calendar-agenda-date";
            heading.textContent = Number(dateKey.slice(5, 7)) + "월 " + Number(dateKey.slice(8, 10)) + "일";
            agenda.append(heading);
            entries.forEach(entry => {
                const row = document.createElement("div");
                row.className = "calendar-agenda-item";
                const kind = document.createElement("span");
                kind.className = "calendar-agenda-kind";
                kind.textContent = entry.kind;
                row.append(kind, document.createTextNode(entry.title));
                if (entry.details) {
                    const detail = document.createElement("span");
                    detail.className = "calendar-agenda-meta";
                    detail.textContent = entry.details;
                    row.append(detail);
                }
                agenda.append(row);
            });
        }

        function renderCalendar() {
            const calendarMini = document.getElementById("calendarMini");
            const calMonthTitle = document.getElementById("calMonthTitle");
            const now = new Date();
            const year = calendarCursor.getFullYear();
            const month = calendarCursor.getMonth();

            calMonthTitle.textContent = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            calendarMini.replaceChildren();
            const daysHeader = ["일", "월", "화", "수", "목", "금", "토"];
            daysHeader.forEach((d, i) => {
                const h = document.createElement("div");
                h.className = "cal-head";
                if (i === 0) h.classList.add("sun");
                if (i === 6) h.classList.add("sat");
                h.textContent = d;
                calendarMini.append(h);
            });

            // 다른 달력들처럼 첫 주·마지막 주의 빈칸은 앞뒤 달 날짜로 흐리게 채운다.
            // 누르면 그 달로 넘어가며 그 날을 고른다(일정은 보고 있는 달 것만 불러온다).
            const appendOtherMonthDay = (dayDate) => {
                const dayEl = document.createElement("div");
                dayEl.className = "cal-day other-month";
                if (dayDate.getDay() === 0) dayEl.classList.add("sun");
                if (dayDate.getDay() === 6) dayEl.classList.add("sat");
                const number = document.createElement("span");
                number.className = "cal-day-number";
                number.textContent = dayDate.getDate();
                dayEl.append(number);
                dayEl.setAttribute("role", "button");
                dayEl.setAttribute("aria-label", `${dayDate.getFullYear()}년 ${dayDate.getMonth() + 1}월 ${dayDate.getDate()}일로 이동`);
                dayEl.addEventListener("click", () => {
                    calendarCursor = new Date(dayDate.getFullYear(), dayDate.getMonth(), 1);
                    scheduleDateInput.value = localDateKey(dayDate);
                    loadCalendarData();
                });
                calendarMini.append(dayEl);
            };
            for (let i = firstDay; i > 0; i--) appendOtherMonthDay(new Date(year, month, 1 - i));

            for (let date = 1; date <= lastDate; date++) {
                const dayEl = document.createElement("div");
                dayEl.className = "cal-day";
                const dayOfWeek = (firstDay + date - 1) % 7;
                if (dayOfWeek === 0) dayEl.classList.add("sun");
                if (dayOfWeek === 6) dayEl.classList.add("sat");
                const dateKey = localDateKey(new Date(year, month, date));
                if (dateKey === localDateKey(now)) {
                    dayEl.classList.add("today");
                    dayEl.setAttribute("aria-current", "date");
                }
                const isSelected = dateKey === scheduleDateInput.value;
                if (isSelected) dayEl.classList.add("selected");
                dayEl.setAttribute("aria-pressed", String(isSelected));
                const entries = calendarEntries(dateKey);
                if (entries.some(entry => entry.holiday)) dayEl.classList.add("holiday");
                const number = document.createElement("span");
                number.className = "cal-day-number";
                number.textContent = date;
                dayEl.append(number);
                if (entries.length) {
                    const label = document.createElement("span");
                    label.className = "cal-event-label";
                    const primaryEntry = entries.find(entry => entry.holiday)
                        || entries.find(entry => entry.kind === "방학") || entries[0];
                    label.textContent = primaryEntry.kind === "방학"
                        ? (primaryEntry.title.includes("여름") ? "여름방학"
                            : primaryEntry.title.includes("겨울") ? "겨울방학" : "학년말")
                        : primaryEntry.title.includes("추석") ? "추석"
                        : primaryEntry.title;
                    dayEl.append(label);
                    dayEl.title = entries.map(entry => entry.title).join(" · ");
                }
                dayEl.tabIndex = 0;
                dayEl.setAttribute("role", "button");
                dayEl.setAttribute("aria-label", `${year}년 ${month + 1}월 ${date}일 일정 선택`);
                const selectDate = () => {
                    scheduleDateInput.value = dateKey;
                    renderCalendar();
                    calendarMini.querySelector(".cal-day.selected")?.focus({ preventScroll: true });
                };
                if (entries.length) dayEl.setAttribute("aria-label", dayEl.getAttribute("aria-label") + ": " + dayEl.title);
                dayEl.addEventListener("click", selectDate);
                dayEl.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        selectDate();
                    }
                });
                calendarMini.append(dayEl);
            }
            const trailing = (7 - (firstDay + lastDate) % 7) % 7;
            for (let i = 1; i <= trailing; i++) appendOtherMonthDay(new Date(year, month + 1, i));
            renderCalendarAgenda();
            showSelectedDayMeals();
        }
        document.getElementById("prevMonthBtn").addEventListener("click", () => {
            calendarCursor.setMonth(calendarCursor.getMonth() - 1);
            loadCalendarData();
        });
        document.getElementById("nextMonthBtn").addEventListener("click", () => {
            calendarCursor.setMonth(calendarCursor.getMonth() + 1);
            loadCalendarData();
        });
        document.getElementById("todayMonthBtn").addEventListener("click", () => {
            calendarCursor = new Date();
            calendarCursor.setDate(1);
            scheduleDateInput.value = localDateKey();
            loadCalendarData();
        });
        renderCalendar();

        // 7. NEIS Meals — 학급의 학교에서, 달력에서 고른 날의 급식을 받아 온다(처음엔 오늘).
        function selectedMealDate() {
            return scheduleDateInput.value || localDateKey();
        }

        function showSelectedDayMeals() {
            if (mealSchool && mealDate !== selectedMealDate()) loadMeals(mealSchool);
        }

        function showMealDishes(dishes) {
            mealList.replaceChildren();
            dishes.forEach((dish) => {
                const item = document.createElement("div");
                item.className = "meal-dish-item";
                const bullet = document.createElement("span");
                bullet.style.color = "var(--accent-green)";
                const iconMarkup = getMealDishIcon(dish);
                if (iconMarkup.startsWith("<svg")) {
                    bullet.innerHTML = iconMarkup;
                } else {
                    bullet.textContent = iconMarkup;
                }
                const text = document.createElement("span");
                text.textContent = dish;
                item.append(bullet, text);
                mealList.append(item);
            });
        }

        function showMealMessage(message, retrySchool = null) {
            const notice = document.createElement("div");
            notice.style.cssText = "color: var(--text-muted); font-size: 0.88rem; padding: 12px 4px; text-align: center;";
            notice.textContent = message;
            mealList.replaceChildren(notice);
            if (retrySchool) {
                const retry = document.createElement("button");
                retry.type = "button";
                retry.className = "btn";
                retry.textContent = "다시 불러오기";
                retry.addEventListener("click", () => loadMeals(retrySchool));
                mealList.append(retry);
            }
        }

        async function loadMeals(school) {
            const requestVersion = ++mealRequestVersion;
            const dateKey = selectedMealDate();
            mealSchool = school;
            mealDate = dateKey;
            mealList.removeAttribute("aria-busy");
            if (!school) {
                showMealMessage("학급의 학교 정보를 불러오지 못했습니다.");
                return;
            }
            const officeCode = school.officeCode;
            const schoolCode = school.schoolCode;
            if (!officeCode || !schoolCode) {
                showMealMessage("연결된 학교의 급식 조회 코드가 없습니다. 학교 관리자에게 확인해 주세요.");
                return;
            }

            // 한 번 받은 날은 바로 보여 준다. 받는 동안에는 앞 메뉴를 흐리게 두어 칸이 들썩이지 않게 한다.
            const dayKey = [officeCode, schoolCode, dateKey].join("/");
            if (mealDishesByDay.has(dayKey)) {
                showMealDishes(mealDishesByDay.get(dayKey));
                return;
            }
            mealList.setAttribute("aria-busy", "true");
            try {
                const query = new URLSearchParams({
                    officeCode,
                    schoolCode,
                    date: dateKey.replace(/-/g, "")
                });
                const mealRes = await fetch("/api/school/meal?" + query.toString());
                if (!mealRes.ok) throw new Error("Meal request failed");
                const mealData = await mealRes.json();
                if (!Array.isArray(mealData.meals)) throw new Error("Invalid meal response");
                if (requestVersion !== mealRequestVersion) return;
                mealList.removeAttribute("aria-busy");

                const meal = mealData.meals.find(item => item.mealType === "중식" || item.mealType === "점심")
                    || mealData.meals[0];
                // 흰 우유는 날마다 나오므로 메뉴에 적지 않는다.
                const dishes = (Array.isArray(meal?.dishes) ? meal.dishes : []).filter((dish) => !window.MealIcons?.isDailyMilk(dish));
                if (dishes.length > 0) {
                    mealDishesByDay.set(dayKey, dishes);
                    showMealDishes(dishes);
                } else {
                    // 아직 안 올라온 날일 수 있으니 기억하지 않는다.
                    showMealMessage(Number(dateKey.slice(5, 7)) + "월 " + Number(dateKey.slice(8, 10)) + "일에 등록된 급식이 없습니다.");
                }
            } catch (err) {
                if (requestVersion !== mealRequestVersion) return;
                mealList.removeAttribute("aria-busy");
                showMealMessage("급식 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.", school);
            }
        }

        // 7-2. 날씨·습도·미세먼지: 우리 서버(/api/school-weather)가 학교 위치로 받아 묶어 준다.
        // 브라우저는 바깥 서버를 부르지 않고 학교 이름도 밖으로 보내지 않는다.
        // 서버가 학교 위치를 모를 때만 이 기기 위치를 물어 넘기고, 그것도 안 되면 서울 둘레로 추정한다.
        let weatherDevicePlace = null;
        let weatherStarted = false;

        function askDevicePlace() {
            return new Promise((resolve) => {
                const guess = () => resolve({ lat: 37.65, lon: 127.06, isEstimated: true });
                if (!navigator.geolocation) return guess();
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, isEstimated: false }),
                    guess,
                    { timeout: 3000 }
                );
            });
        }

        async function schoolWeatherJson(place) {
            const query = place ? "?" + new URLSearchParams({ lat: place.lat, lon: place.lon }) : "";
            const response = await fetch("/api/school-weather" + query, { credentials: "include", signal: AbortSignal.timeout(20000) });
            const data = await response.json().catch(() => ({}));
            if (response.status === 404 && data.error === "SCHOOL_LOCATION_UNKNOWN") return null;
            if (!response.ok) throw new Error(data.message || "Weather request failed");
            return data;
        }

        // 학급을 바꿔도 학교는 그대로라 처음 한 번만 부르고, 이후는 30분마다 새로 받는다.
        function fetchRealtimeWeatherAndAirQuality() {
            if (weatherStarted) return;
            weatherStarted = true;
            refreshWeather();
        }

        let hourlyWeather = [];
        let forecastDate = "";
        let forecastRequestVersion = 0;
        let weatherLastRequestedAt = 0;

        function koreanWeatherClock() {
            const parts = new Intl.DateTimeFormat("en-GB", {
                timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23"
            }).formatToParts(new Date());
            const value = type => parts.find(part => part.type === type).value;
            return { date: value("year") + "-" + value("month") + "-" + value("day"), hour: Number(value("hour")) };
        }

        function describeWeather(code, isDay = 1) {
            if (code === 0) return { icon: isDay ? "☀️" : "🌙", name: "맑음" };
            if (code === 1 || code === 2) return { icon: isDay ? "🌤️" : "☁️", name: "구름조금" };
            if (code === 3) return { icon: "☁️", name: "흐림" };
            if ([45, 48].includes(code)) return { icon: "🌫️", name: "안개" };
            if ([51, 53, 55, 56, 57].includes(code)) return { icon: "🌦️", name: "이슬비" };
            if ([61, 63, 65, 66, 67].includes(code)) return { icon: "🌧️", name: "비" };
            if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "🌨️", name: "눈" };
            if ([80, 81, 82].includes(code)) return { icon: "🌦️", name: "소나기" };
            if ([95, 96, 97, 99].includes(code)) return { icon: "⛈️", name: "뇌우" };
            return { icon: "—", name: "날씨 정보 없음" };
        }

        function showForecastMessage(message, retry = false) {
            const grid = document.getElementById("hourlyForecast");
            grid.replaceChildren();
            const text = document.createElement("span");
            text.className = "forecast-message";
            text.textContent = message;
            grid.append(text);
            document.getElementById("forecastRetry").hidden = !retry;
        }

        function renderHourlyForecast() {
            // 지난 시간은 빼고 지금 시간대부터 24시간을 보여 준다.
            const now = koreanWeatherClock();
            const nowKey = now.date + "T" + String(now.hour).padStart(2, "0");
            const upcoming = hourlyWeather.filter(item => item.time.slice(0, 13) >= nowKey).slice(0, 24);
            if (!upcoming.length) return;
            const grid = document.getElementById("hourlyForecast");
            const capacity = Math.max(1, Math.floor(grid.clientWidth / 48));
            const step = [1, 2, 3, 4, 6, 12, 24].find(value => Math.ceil(upcoming.length / value) <= capacity) || 24;
            // 몇 시간씩 건너뛸 때도 사이에 낀 비 소식을 놓치지 않게 강수확률은 그 구간의 최댓값을 쓴다.
            const hours = upcoming.filter((_, index) => index % step === 0).map((item, index) => {
                const span = upcoming.slice(index * step, index * step + step).map(slot => slot.rain).filter(Number.isFinite);
                return { ...item, rain: span.length ? Math.max(...span) : item.rain };
            });
            grid.style.setProperty("--forecast-columns", hours.length);
            grid.replaceChildren();
            let markedNextDay = false;
            hours.forEach((item, index) => {
                const condition = describeWeatherItem(item);
                const cell = document.createElement("div");
                cell.className = "forecast-hour";
                if (item.isDay === 1 || item.isDay === 0) cell.classList.add(item.isDay ? "is-day" : "is-night");
                if (index === 0) cell.classList.add("is-current");
                const isNextDay = !item.time.startsWith(now.date);
                if (isNextDay && !markedNextDay) {
                    cell.classList.add("next-day");
                    markedNextDay = true;
                }
                const temperature = Number.isFinite(item.temperature) ? Math.round(item.temperature) + "°" : "--°";
                const rain = Number.isFinite(item.rain) ? Math.round(item.rain) : null;
                const probability = rain === null ? "--%" : rain + "%";
                cell.title = (isNextDay ? "내일 " : "") + item.hour + "시 · " + condition.name + " · " + temperature + " · " + (rain >= 30 && isSnowHour(item) ? "눈 올 확률 " : "강수확률 ") + probability;
                cell.setAttribute("aria-label", cell.title);
                const rainClass = rain >= 60 ? " rain-high" : rain >= 30 ? " rain-some" : "";
                const rainIcon = rain >= 30 ? (isSnowHour(item) ? "❄️" : "☔") : "";
                [["forecast-time", String(item.hour).padStart(2, "0") + "시"], ["forecast-icon", condition.icon],
                 ["forecast-temperature", temperature], ["forecast-rain" + rainClass, [rainIcon, probability]]].forEach(([className, value]) => {
                    const span = document.createElement("span");
                    span.className = className;
                    if (Array.isArray(value)) {
                        const [icon, number] = value;
                        if (icon) span.append(Object.assign(document.createElement("span"), { className: "rain-icon", textContent: icon }));
                        span.append(Object.assign(document.createElement("span"), { className: "rain-value", textContent: number }));
                    } else span.textContent = value;
                    cell.append(span);
                });
                grid.append(cell);
            });
        }

        const forecastResizeObserver = new ResizeObserver(renderHourlyForecast);
        forecastResizeObserver.observe(document.getElementById("hourlyForecast"));

        // 눈: 기상청 강수형태가 눈·비/눈이면 눈, 강수형태가 없으면(확률만 있으면) 0도 이하일 때 눈으로 본다.
        const SNOW_CODES = [56, 66, 71, 73, 75, 77, 85, 86];
        const RAIN_CODES = [51, 53, 55, 57, 61, 63, 65, 67, 80, 81, 82, 95, 96, 97, 99];
        function isSnowHour(item) {
            if (SNOW_CODES.includes(item.code)) return true;
            if (RAIN_CODES.includes(item.code)) return false;
            return Number.isFinite(item.temperature) && item.temperature <= 0;
        }

        // 맑은 밤: 달이 떠 있으면 그날 모양으로, 졌거나 그믐 무렵이면 별을 그린다.
        // 달이 떠 있는지와 모양(위상 0 삭·0.25 상현·0.5 보름·0.75 하현)은 서버가 학교 자리에서 계산해 준다.
        const MOON_PHASE_ICONS = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
        function describeWeatherItem(item) {
            const condition = describeWeather(item.code, item.isDay);
            if (item.label) condition.name = item.label;
            if (item.code === 0 && !item.isDay && item.moon) {
                const visible = item.moon.up && item.moon.fraction >= 0.03;
                condition.icon = visible ? MOON_PHASE_ICONS[Math.round(item.moon.phase * 8) % 8] : "✨";
            }
            return condition;
        }

        async function refreshWeather() {
            const version = ++forecastRequestVersion;
            weatherLastRequestedAt = Date.now();
            hourlyWeather = [];
            showForecastMessage("시간대별 예보 불러오는 중...");
            document.getElementById("weatherTemp").textContent = "--°";
            for (const id of ["weatherHumidity", "pm10Value", "pm25Value"]) showAirValue(id, null);
            let data = null;
            try {
                data = await schoolWeatherJson(weatherDevicePlace);
                if (!data && !weatherDevicePlace) {
                    weatherDevicePlace = await askDevicePlace();
                    if (version !== forecastRequestVersion) return;
                    data = await schoolWeatherJson(weatherDevicePlace);
                }
            } catch (err) {
                console.error("날씨 불러오기 오류:", err);
                data = null;
            }
            if (version !== forecastRequestVersion) return;
            if (!data) {
                showForecastMessage("일기예보를 불러오지 못했습니다.", true);
                return;
            }
            const { source, current = {}, hourly = [], air } = data;
            const isEstimated = data.located === "device" && weatherDevicePlace?.isEstimated;
            document.getElementById("forecastCard").title = "자료: " + (source === "kma" ? "기상청" : "Open-Meteo");
            const condition = describeWeatherItem(current);
            const temp = document.getElementById("weatherTemp");
            temp.classList.toggle("is-day", current.isDay === 1);
            temp.classList.toggle("is-night", current.isDay === 0);
            temp.textContent = Number.isFinite(current.temperature) ? Math.round(current.temperature) + "° " : "--° ";
            const conditionText = document.createElement("span");
            conditionText.className = "weather-condition";
            conditionText.textContent = condition.icon + " " + condition.name + (isEstimated ? " (위치 추정)" : "");
            temp.append(conditionText);
            showAirValue("weatherHumidity", current.humidity, "%");
            forecastDate = koreanWeatherClock().date;
            hourlyWeather = hourly;
            if (hourlyWeather.length) {
                document.getElementById("forecastRetry").hidden = true;
                renderHourlyForecast();
            } else showForecastMessage("시간대별 예보를 불러오지 못했습니다.", true);
            showAirValue("pm10Value", air?.pm10, "㎍/㎥", [30, 80, 150]);
            showAirValue("pm25Value", air?.pm25, "㎍/㎥", [15, 35, 75]);
        }

        // 등급 경계는 환경부 기준: 미세먼지 30·80·150, 초미세먼지 15·35·75 ㎍/㎥ 이하.
        const AIR_GRADES = [["good", "좋음"], ["normal", "보통"], ["bad", "나쁨"], ["worst", "매우나쁨"]];
        function showAirValue(id, raw, unit = "", limits = null) {
            const box = document.getElementById(id);
            box.replaceChildren();
            if (!Number.isFinite(raw)) {
                box.append(Object.assign(document.createElement("span"), { className: "air-empty", textContent: "--" }));
                return;
            }
            const value = Math.round(raw);
            if (limits) {
                const index = limits.findIndex(limit => value <= limit);
                const [grade, label] = AIR_GRADES[index < 0 ? 3 : index];
                const tag = Object.assign(document.createElement("span"), { className: "air-grade", textContent: label });
                tag.dataset.grade = grade;
                box.append(tag);
            }
            box.append(
                Object.assign(document.createElement("span"), { className: "air-value", textContent: value }),
                Object.assign(document.createElement("span"), { className: limits ? "air-unit dust-unit" : "air-unit", textContent: unit })
            );
        }

        document.getElementById("forecastRetry").addEventListener("click", refreshWeather);
        setInterval(() => {
            if (!weatherStarted) return;
            if (Date.now() - weatherLastRequestedAt >= 30 * 60 * 1000
                || (forecastDate && forecastDate !== koreanWeatherClock().date)) refreshWeather();
            else renderHourlyForecast();
        }, 60000);

        // 8. Presenter Picker & Web Audio Feedback
        const multiPickerModalBtn = document.getElementById("multiPickerModalBtn");
        const multiPickerModal = document.getElementById("multiPickerModal");
        const closeMultiPickerModal = document.getElementById("closeMultiPickerModal");
        const shuffleBubblesBtn = document.getElementById("shuffleBubblesBtn");
        const resetBubblesBtn = document.getElementById("resetBubblesBtn");
        const bubblePickerGrid = document.getElementById("bubblePickerGrid");

        let bubbleList = [];

        function fitBubblePicker() {
            if (multiPickerModal.hidden || !bubblePickerGrid.children.length) return;
            const count = bubblePickerGrid.children.length;
            const width = bubblePickerGrid.clientWidth - 16;
            const height = bubblePickerGrid.clientHeight - 16;
            if (width <= 0 || height <= 0) return;
            const gap = width < 600 ? 6 : 10;
            let best = { size: 0, columns: 1, rows: count };
            for (let columns = 1; columns <= count; columns++) {
                const rows = Math.ceil(count / columns);
                const size = Math.min((width - gap * (columns - 1)) / columns,
                    (height - gap * (rows - 1)) / rows);
                if (size > best.size) best = { size, columns, rows };
            }
            bubblePickerGrid.style.setProperty("--bubble-columns", best.columns);
            bubblePickerGrid.style.setProperty("--bubble-rows", best.rows);
            bubblePickerGrid.style.setProperty("--bubble-gap", gap + "px");
            bubblePickerGrid.style.setProperty("--bubble-size", Math.max(1, Math.floor(Math.min(146, best.size))) + "px");
        }

        const bubbleResizeObserver = new ResizeObserver(fitBubblePicker);
        bubbleResizeObserver.observe(bubblePickerGrid);

        function playTingSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(1046.50, ctx.currentTime); // C6 맑은 띵 소리
                osc1.frequency.exponentialRampToValueAtTime(2093.00, ctx.currentTime + 0.15); // C7

                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1318.51, ctx.currentTime); // E6
                osc2.frequency.exponentialRampToValueAtTime(2637.02, ctx.currentTime + 0.15); // E7

                gain.gain.setValueAtTime(0.6, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(ctx.currentTime + 0.45);
                osc2.stop(ctx.currentTime + 0.45);
            } catch(err) {
                console.error("Audio error:", err);
            }
        }

        function renderBubblePicker(shouldShuffle = true) {
            if (!bubblePickerGrid) return;
            bubblePickerGrid.replaceChildren();

            let targetStudents = [...rosterStudents];
            if (targetStudents.length === 0) {
                for (let i = 1; i <= 20; i++) {
                    targetStudents.push({ number: String(i), name: `${i}번` });
                }
            }

            if (shouldShuffle) {
                for (let i = targetStudents.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [targetStudents[i], targetStudents[j]] = [targetStudents[j], targetStudents[i]];
                }
            }

            bubbleList = targetStudents;

            bubbleList.forEach((student) => {
                const avatar = getAvatarForStudent(student.number);
                const card = document.createElement("div");
                card.className = "bubble-card";
                card.title = "터치하여 학생을 추첨하세요!";
                card.innerHTML = '<span class="bubble-question">❓</span>';

                card.addEventListener("click", () => {
                    if (card.classList.contains("revealed")) return;
                    playTingSound();
                    bubblePickerGrid.querySelector(".bubble-card.latest")?.classList.remove("latest");
                    card.classList.add("revealed", "latest");
                    card.innerHTML = `
                        <div class="bubble-avatar">${avatar.icon}</div>
                        <div class="bubble-name">${escHtmlLocal(student.name || student.number + "번")}</div>
                    `;
                });

                bubblePickerGrid.append(card);
            });
            fitBubblePicker();
        }

        multiPickerModalBtn.addEventListener("click", () => {
            multiPickerModal.hidden = false;
            renderBubblePicker(true);
        });

        closeMultiPickerModal.addEventListener("click", () => {
            multiPickerModal.hidden = true;
        });

        shuffleBubblesBtn.addEventListener("click", () => {
            renderBubblePicker(true);
        });

        resetBubblesBtn.addEventListener("click", () => {
            renderBubblePicker(false);
        });

        // 9. 타이머 — 시간이 흐르는 만큼 로켓이 지구에서 달로 날아가고, 끝나면 달에 닿아 불꽃이 터진다.
        const timerModalBtn = document.getElementById("timerModalBtn");
        const timerModal = document.getElementById("timerModal");
        const closeTimerModal = document.getElementById("closeTimerModal");
        const timerStage = document.getElementById("timerStage");
        const timerDisplay = document.getElementById("timerDisplay");
        const timerRocket = document.getElementById("timerRocket");
        const timerRoute = document.getElementById("timerRoute");
        const timerTrail = document.getElementById("timerTrail");
        const timerFx = document.getElementById("timerFx");
        const timerFxContext = timerFx.getContext("2d");
        const timerPresetButtons = [...document.querySelectorAll("[data-timer-sec]")];
        const startTimerBtn = document.getElementById("startTimerBtn");
        const resetTimerBtn = document.getElementById("resetTimerBtn");
        const TIMER_FINAL_SECONDS = 10;
        const TIMER_START_LABEL = { idle: "시작", running: "일시정지", paused: "계속", done: "다시" };
        const TIMER_SPARK_COLORS = ["255,214,102", "255,107,94", "124,240,176", "120,200,255", "255,150,220"];

        let timerTotalMs = 300000;
        let timerLeftMs = timerTotalMs;
        let timerEndAt = 0;
        let timerPhase = "idle";
        let timerShownSecond = 0;
        let timerClock = 0;
        let timerFrameId = 0;
        let timerLastFrame = 0;
        let timerLastPuff = 0;
        let timerFireworksUntil = 0;
        let timerNextBurst = 0;
        let timerRouteLength = 0;
        let timerAudio = null;
        let timerParticles = [];

        const timerMotionAllowed = () => !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const timerLeftNow = () => timerPhase === "running" ? Math.max(0, timerEndAt - Date.now()) : timerLeftMs;

        function setTimerPhase(phase) {
            timerPhase = phase;
            timerStage.dataset.phase = phase;
            startTimerBtn.textContent = TIMER_START_LABEL[phase];
        }

        function showTimerTime() {
            const seconds = Math.ceil(timerLeftNow() / 1000);
            const counting = timerPhase === "running" || timerPhase === "paused";
            const final = counting && seconds > 0 && seconds <= TIMER_FINAL_SECONDS;
            timerStage.classList.toggle("final", final);
            timerStage.classList.toggle("urgent", final && seconds <= 3);
            timerDisplay.setAttribute("y", timerPhase === "done" ? 445 : final ? 490 : 430);
            if (timerPhase === "done") {
                timerDisplay.textContent = "끝!";
            } else if (final) {
                timerDisplay.textContent = String(seconds);
            } else {
                timerDisplay.textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
            }
        }

        function timerBeep(frequency, delay = 0, length = 0.12, volume = 0.16) {
            if (!timerAudio) return;
            const at = timerAudio.currentTime + delay;
            const osc = timerAudio.createOscillator();
            const gain = timerAudio.createGain();
            osc.type = "triangle";
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.linearRampToValueAtTime(volume, at + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + length);
            osc.connect(gain);
            gain.connect(timerAudio.destination);
            osc.start(at);
            osc.stop(at + length + 0.02);
        }

        // 째·깍이 번갈아 나도록 짧은 잡음을 두 높이로 걸러 낸다. 마지막 3초는 더 크게.
        function timerTick(seconds) {
            if (!timerAudio) return;
            const rate = timerAudio.sampleRate;
            const buffer = timerAudio.createBuffer(1, Math.ceil(rate * 0.05), rate);
            const samples = buffer.getChannelData(0);
            for (let i = 0; i < samples.length; i++) samples[i] = (Math.random() * 2 - 1) * (1 - i / samples.length) ** 4;
            const click = timerAudio.createBufferSource();
            const tone = timerAudio.createBiquadFilter();
            const gain = timerAudio.createGain();
            click.buffer = buffer;
            tone.type = "bandpass";
            tone.frequency.value = seconds % 2 ? 2300 : 3400;
            tone.Q.value = 5;
            gain.gain.value = (seconds <= 3 ? 1.5 : 1) * (seconds % 2 ? 1.6 : 1.1);
            click.connect(tone);
            tone.connect(gain);
            gain.connect(timerAudio.destination);
            click.start();
        }

        function addTimerParticle(particle) {
            if (timerParticles.length < 700) timerParticles.push(particle);
        }

        function burstTimerFirework(x, y) {
            const color = TIMER_SPARK_COLORS[Math.floor(Math.random() * TIMER_SPARK_COLORS.length)];
            for (let i = 0; i < 46; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 70 + Math.random() * 230;
                const life = 0.8 + Math.random() * 0.7;
                addTimerParticle({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, gravity: 170, drag: 0.98, life, max: life, size: 2 + Math.random() * 2.5, color });
            }
        }

        function dropTimerConfetti() {
            for (let i = 0; i < 130; i++) {
                const life = 2.6 + Math.random() * 1.8;
                addTimerParticle({ x: Math.random() * 1000, y: -20 - Math.random() * 260, vx: -30 + Math.random() * 60, vy: 90 + Math.random() * 120, gravity: 14, drag: 1, life, max: life, size: 5 + Math.random() * 4,
                    color: TIMER_SPARK_COLORS[i % TIMER_SPARK_COLORS.length], spin: Math.random() * 6, turn: -5 + Math.random() * 10 });
            }
        }

        function drawTimerParticles(now, dt) {
            const width = timerStage.clientWidth;
            const pixels = Math.round(width * Math.min(window.devicePixelRatio || 1, 2));
            if (pixels && timerFx.width !== pixels) {
                timerFx.width = pixels;
                timerFx.height = Math.round(pixels * 0.54);
            }
            if (now < timerFireworksUntil && now >= timerNextBurst) {
                burstTimerFirework(90 + Math.random() * 820, 50 + Math.random() * 290);
                timerNextBurst = now + 170 + Math.random() * 230;
            }
            const scale = timerFx.width / 1000;
            timerFxContext.setTransform(scale, 0, 0, scale, 0, 0);
            timerFxContext.clearRect(0, 0, 1000, 540);
            timerParticles = timerParticles.filter((item) => (item.life -= dt) > 0 && item.y < 580);
            timerParticles.forEach((item) => {
                item.vx *= item.drag;
                item.vy = item.vy * item.drag + item.gravity * dt;
                item.x += item.vx * dt;
                item.y += item.vy * dt;
                timerFxContext.fillStyle = `rgba(${item.color},${Math.min(1, item.life / item.max * 1.6)})`;
                if (item.turn === undefined) {
                    timerFxContext.beginPath();
                    timerFxContext.arc(item.x, item.y, item.size, 0, Math.PI * 2);
                    timerFxContext.fill();
                } else {
                    item.spin += item.turn * dt;
                    timerFxContext.save();
                    timerFxContext.translate(item.x, item.y);
                    timerFxContext.rotate(item.spin);
                    timerFxContext.fillRect(-item.size / 2, -item.size / 3, item.size, item.size / 1.5);
                    timerFxContext.restore();
                }
            });
        }

        function drawTimerScene(now = performance.now()) {
            timerRouteLength = timerRouteLength || timerRoute.getTotalLength();
            const progress = Math.min(1, Math.max(0, 1 - timerLeftNow() / timerTotalMs));
            const at = timerRouteLength * progress;
            const point = timerRoute.getPointAtLength(at);
            const back = timerRoute.getPointAtLength(Math.max(0, at - 1));
            const ahead = timerRoute.getPointAtLength(Math.min(timerRouteLength, at + 1));
            const angle = Math.atan2(ahead.y - back.y, ahead.x - back.x);
            timerRocket.setAttribute("transform", `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) rotate(${(angle * 180 / Math.PI + 90).toFixed(2)}) scale(1.4)`);
            timerTrail.style.strokeDashoffset = String(1 - progress);
            if (timerPhase === "running" && now - timerLastPuff > 70 && timerMotionAllowed()) {
                timerLastPuff = now;
                const life = 0.55 + Math.random() * 0.4;
                addTimerParticle({ x: point.x - Math.cos(angle) * 60, y: point.y - Math.sin(angle) * 60, vx: -Math.cos(angle) * 34 + (Math.random() - 0.5) * 26, vy: -Math.sin(angle) * 34 + (Math.random() - 0.5) * 26,
                    gravity: 0, drag: 0.99, life, max: life * 1.7, size: 3 + Math.random() * 4, color: Math.random() < 0.5 ? "255,179,92" : "226,232,245" });
            }
        }

        function timerFrame(now) {
            timerFrameId = 0;
            if (timerModal.hidden) return;
            const dt = Math.min(0.05, (now - timerLastFrame) / 1000 || 0);
            timerLastFrame = now;
            drawTimerScene(now);
            drawTimerParticles(now, dt);
            if (timerPhase === "running" || timerParticles.length || now < timerFireworksUntil) requestTimerFrame();
        }

        function requestTimerFrame() {
            if (!timerFrameId && !timerModal.hidden) timerFrameId = requestAnimationFrame(timerFrame);
        }

        function finishTimer() {
            clearInterval(timerClock);
            timerLeftMs = 0;
            setTimerPhase("done");
            showTimerTime();
            timerModal.hidden = false;
            for (let round = 0; round < 3; round++) {
                [523, 659, 784, 1047].forEach((note, i) => timerBeep(note, round * 0.85 + i * 0.13, i === 3 ? 0.5 : 0.18, 0.2));
            }
            if (timerMotionAllowed()) {
                timerParticles = [];
                burstTimerFirework(784, 121);
                dropTimerConfetti();
                timerFireworksUntil = performance.now() + 5000;
                timerNextBurst = 0;
            }
            drawTimerScene();
            requestTimerFrame();
        }

        function runTimerClock() {
            if (timerPhase !== "running") return;
            const left = timerLeftNow();
            const seconds = Math.ceil(left / 1000);
            if (seconds !== timerShownSecond) {
                timerShownSecond = seconds;
                showTimerTime();
                if (seconds > 0 && seconds <= TIMER_FINAL_SECONDS) {
                    timerTick(seconds);
                    if (timerMotionAllowed()) {
                        timerDisplay.animate([{ transform: "scale(1.4)" }, { transform: "scale(1)" }],
                            { duration: 420, easing: "cubic-bezier(0.2, 1.4, 0.4, 1)" });
                        timerStage.animate([{ opacity: 1 }, { opacity: 0.4 }],
                            { pseudoElement: "::after", duration: 800, easing: "ease-out" });
                    }
                }
            }
            if (left <= 0) finishTimer();
        }

        function setTimerLength(ms) {
            clearInterval(timerClock);
            timerTotalMs = ms;
            timerLeftMs = ms;
            timerParticles = [];
            timerFireworksUntil = 0;
            setTimerPhase("idle");
            showTimerTime();
            timerPresetButtons.forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.timerSec) * 1000 === ms)));
            if (!timerModal.hidden) {
                drawTimerScene();
                timerFxContext.clearRect(0, 0, 1000, 540);
            }
        }

        timerPresetButtons.forEach((button) => button.addEventListener("click", () => setTimerLength(Number(button.dataset.timerSec) * 1000)));
        resetTimerBtn.addEventListener("click", () => setTimerLength(timerTotalMs));

        startTimerBtn.addEventListener("click", () => {
            if (timerPhase === "running") {
                timerLeftMs = timerLeftNow();
                clearInterval(timerClock);
                setTimerPhase("paused");
                showTimerTime();
                return;
            }
            if (timerPhase === "done") setTimerLength(timerTotalMs);
            try {
                timerAudio = timerAudio || new (window.AudioContext || window.webkitAudioContext)();
                timerAudio.resume();
            } catch (err) {
                timerAudio = null;
            }
            timerEndAt = Date.now() + timerLeftMs;
            setTimerPhase("running");
            timerShownSecond = Math.ceil(timerLeftMs / 1000);
            showTimerTime();
            timerClock = setInterval(runTimerClock, 200);
            requestTimerFrame();
        });

        timerModalBtn.addEventListener("click", () => {
            timerModal.hidden = false;
            showTimerTime();
            drawTimerScene();
            requestTimerFrame();
        });

        // 시간이 가는 중에 닫아도 계속 흐르고, 끝나면 창이 다시 열린다.
        closeTimerModal.addEventListener("click", () => {
            timerModal.hidden = true;
            if (timerPhase === "done") setTimerLength(timerTotalMs);
        });

        setTimerLength(timerTotalMs);

        // 10. Drag & Drop Card Reordering
        const grid = document.getElementById("dashboardGrid");
        let draggedItem = null;

        // 카드 순서는 서버 설정(loadDashboardSettingsFromDB)에서 받아 적용한다.

        grid.addEventListener("dragstart", (e) => {
            const card = e.target.closest(".widget-card");
            if (card) {
                draggedItem = card;
                card.classList.add("dragging");
                e.dataTransfer.effectAllowed = "move";
            }
        });

        grid.addEventListener("dragend", (e) => {
            const card = e.target.closest(".widget-card");
            if (card) {
                card.classList.remove("dragging");
                draggedItem = null;
                // Save order
                syncDashboardSettingsToDB();
            }
        });

        grid.addEventListener("dragover", (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
            if (draggedItem) {
                if (afterElement == null) {
                    grid.appendChild(draggedItem);
                } else {
                    grid.insertBefore(draggedItem, afterElement);
                }
            }
        });

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.widget-card:not(.dragging)')];
            let closest = null;
            let closestDistance = Number.POSITIVE_INFINITY;
            for (const child of draggableElements) {
                const box = child.getBoundingClientRect();
                const centerX = box.left + box.width / 2;
                const centerY = box.top + box.height / 2;
                const distance = Math.hypot(x - centerX, y - centerY);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closest = { element: child, centerX, centerY };
                }
            }
            if (!closest) return null;
            const isBeforeClosest = x < closest.centerX || (x === closest.centerX && y < closest.centerY);
            return isBeforeClosest ? closest.element : closest.element.nextElementSibling;
        }
    </script>
