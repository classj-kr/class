<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결재 서식 인쇄</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 15mm 15mm 15mm 15mm;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "Malgun Gothic", "맑은 고딕", Batang, serif;
            background: #f5f5f5;
            color: #000;
        }

        .no-print-bar {
            max-width: 210mm;
            margin: 0 auto 20px;
            padding: 12px 20px;
            background: #fff;
            color: #1c2329;
            /* 테두리 대신 그림자 고리. 테두리를 달면 막대 높이가 2px 늘어난다. */
            box-shadow: 0 0 0 1px #dde3e8, 0 1px 3px rgba(16,24,40,.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 8px;
        }

        .no-print-bar button {
            padding: 8px 16px;
            background: #17804a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .no-print-bar button:hover { background: #11683c; }

        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm 18mm;
            margin: 0 auto 30px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Table styles matching official school format */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 15px;
        }

        .sub-note {
            font-size: 13px;
            text-align: left;
            margin-bottom: 10px;
        }

        .approval-box {
            border-collapse: collapse;
            float: right;
            margin-bottom: 10px;
        }

        .approval-box td, .approval-box th {
            border: 1px solid #000;
            text-align: center;
            padding: 4px 8px;
            font-size: 12px;
        }

        .approval-box .stamp-cell {
            height: 45px;
            width: 55px;
            vertical-align: middle;
        }

        .clear {
            clear: both;
        }

        table.form-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        table.form-table td, table.form-table th {
            border: 1px solid #000;
            padding: 8px 10px;
            font-size: 14px;
            vertical-align: middle;
        }

        table.form-table th {
            background-color: #f8f8f8;
            font-weight: normal;
            text-align: center;
        }

        .center { text-align: center; }

        .checkbox-group {
            line-height: 1.8;
            font-size: 13px;
        }

        .signature-section {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 2;
        }

        .school-principal {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .bottom-notice {
            border: 1px solid #000;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .teacher-record-box {
            border: 1px solid #000;
            margin-top: 15px;
            padding: 10px;
        }

        .teacher-record-box p {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: bold;
        }

        .sig-img {
            max-height: 35px;
            /* 폭도 막아야 한다. 가로로 긴 서명이 들어오면 결재란 칸이 밀려 표가 깨진다. */
            max-width: 100%;
            object-fit: contain;
            vertical-align: middle;
        }

        .photo-container {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 10px;
        }

        .head-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 10px;
        }
        .head-row .approval-box { float: none; margin: 0; }
        .head-row .sub-note { margin: 0 0 4px; }
        .row-tall td, .row-tall th { height: 44px; }
        .nowrap { white-space: nowrap; }
        .reason-cell { height: 76px; vertical-align: top; line-height: 1.6; }
        .checkbox-group .cg-title { font-weight: bold; margin-top: 6px; }
        .checkbox-group .cg-title:first-child { margin-top: 0; }
        .checkbox-group .cg-line { margin-left: 14px; }
        .checkbox-group .cg-sub { margin-left: 40px; color: #333; }
        .signature-section { font-size: 17px; line-height: 2.1; }
        .period-cell { padding: 10px 12px; line-height: 1.8; }
        .period-label { color: #1f4bd6; }
        .period-sub { display: inline-block; margin-left: 24px; }
        .plan-cell { height: 240px; vertical-align: top; line-height: 1.7; }
        .gender { color: #555; font-size: 13px; }

        @media print {
            body { background: transparent; padding: 0; }
            .no-print-bar { display: none !important; }
            .a4-page {
                border: none;
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100%;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <span>📄 결재 서식 출력</span>
        <button onclick="window.print()">🖨️ A4 인쇄하기</button>
    </div>

    <!-- Container for dynamic form rendering -->
    <div id="printContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const formType = urlParams.get('type') || 'absence';
        const docId = urlParams.get('id');

        // 결재란. 서버가 준 결재 단계(approvals)대로 칸을 만들고, 승인된 칸에는 그 사람의
        // 서명과 날짜를 찍는다. 학교가 전결자로 정한 칸에는 '전결'이 붙는다.
        function approvalBox(d) {
            const fallback = [{ roleLabel: '담임' }, { roleLabel: '교무부장' }, { roleLabel: '교감' }, { roleLabel: '교장' }];
            const steps = (Array.isArray(d.approvals) && d.approvals.length > 0) ? d.approvals : fallback;
            const fmt = function (iso) { if (!iso) return ''; const t = new Date(iso); return (t.getMonth() + 1) + '.' + t.getDate(); };
            const head = steps.map(function (s) {
                return '<th width="64">' + s.roleLabel + (s.isFinal ? '<br><span style="font-size:10px;">(전결)</span>' : '') + '</th>';
            }).join('');
            const cells = steps.map(function (s) {
                if (s.status === 'approved' && s.signature) {
                    return '<td class="stamp-cell"><img src="' + s.signature + '" class="sig-img" alt="서명"><div style="font-size:9px;">' + fmt(s.decidedAt) + (s.isFinal ? ' 전결' : '') + '</div></td>';
                }
                if (s.status === 'rejected') return '<td class="stamp-cell" style="color:#c00;font-weight:bold;">반려</td>';
                return '<td class="stamp-cell">' + (s.isFinal ? '<span style="font-size:10px;color:#666;">전결</span>' : '') + '</td>';
            }).join('');
            return '<table class="approval-box"><tr><th rowspan="2" width="20">결<br>재</th>' + head + '</tr><tr>' + cells + '</tr></table>';
        }

        async function loadDocumentData() {
            let data = {};
            if (docId) {
                try {
                    const res = await fetch(`/api/notice/docs/${formType}/${docId}`);
                    if (res.ok) data = await res.json();
                } catch(e) { console.error(e); }
            }
            renderForm(formType, data);
        }

        function renderForm(type, data) {
            const container = document.getElementById('printContainer');
            if (type === 'absence') {
                container.innerHTML = getAbsenceHTML(data);
            } else if (type === 'exp_app') {
                container.innerHTML = getExpAppHTML(data);
            } else if (type === 'exp_report') {
                container.innerHTML = getExpReportHTML(data);
            }
        }

        // 날짜 '2026-09-01' -> '2026년 9월 1일'. 없으면 종이 양식처럼 빈칸을 둔다.
        function koreanDate(value) {
            const m = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return '202&nbsp;&nbsp;년 &nbsp;&nbsp;월 &nbsp;&nbsp;일';
            return Number(m[1]) + '년 ' + Number(m[2]) + '월 ' + Number(m[3]) + '일';
        }

        function box(on) { return on ? '☑' : '☐'; }

        function getAbsenceHTML(d) {
            const year = d.year || new Date().getFullYear();
            const month = d.month || (new Date().getMonth() + 1);
            const day = d.day || new Date().getDate();
            const school = d.schoolName || '';
            const days = Number(d.totalDays || 0);
            const reason = String(d.reasonType || '');
            // 학부모가 고른 결석 구분에 맞춰 증빙서류 칸에 표시한다.
            const isDust = reason === '미세먼지결석';
            const isSick = reason === '질병결석';
            const isOther = reason === '기타결석';
            const isRecognized = reason === '출석인정결석';
            // 담임 확인란. 결재가 끝난 문서만 표시한다.
            const done = d.teacherCheck === 'approved' || d.status === 'approved';
            const col = done ? ((isSick || isDust) ? '질병' : isOther ? '기타' : isRecognized ? '인정' : '') : '';

            return `
            <div class="a4-page">
                <div class="title">결 석 계</div>
                <div class="head-row">
                    <div class="sub-note">※ 결석한 날부터 5일 이내에 제출</div>
                    ${approvalBox(d)}
                </div>

                <table class="form-table">
                    <tr>
                        <th width="20%">학교</th>
                        <th width="30%">학년 반</th>
                        <th width="20%">번호</th>
                        <th width="30%">성명</th>
                    </tr>
                    <tr class="row-tall">
                        <td class="center">${school}</td>
                        <td class="center">${d.grade || ''}학년 ${d.classNumber || ''}반</td>
                        <td class="center">${d.studentNumber || ''}</td>
                        <td class="center"><strong>${d.studentName || ''}</strong></td>
                    </tr>
                    <tr class="row-tall">
                        <th>결석기간</th>
                        <td colspan="3" class="center">
                            ${koreanDate(d.startDate)} ~ ${koreanDate(d.endDate)} ( ${days || '&nbsp;&nbsp;'} )일간
                        </td>
                    </tr>
                    <tr>
                        <th>결석사유<br>(학부모 의견)</th>
                        <td colspan="3" class="reason-cell">${d.reasonDetail || ''}</td>
                    </tr>
                    <tr>
                        <th>증빙서류</th>
                        <td colspan="3" class="checkbox-group">
                            <div class="cg-title">* 질병으로 인한 결석</div>
                            <div class="cg-line">- 미세먼지 민감군 학생 결석: ${box(isDust)} 의사 진단서 또는 소견서</div>
                            <div class="cg-line cg-sub">(등교시간 '나쁨' 이상일 때 사전연락)</div>
                            <div class="cg-line">- 2일 이내: ${box(isSick && days > 0 && days <= 2)} 위의 학부모의견서(결석계)로 갈음함</div>
                            <div class="cg-line">- 3일 이상: ${box(isSick && days >= 3)} 의사 소견서 &nbsp;&nbsp; ☐ 진료 확인서</div>
                            <div class="cg-line cg-sub">☐ 기타 병명, 진료기간 등이 기록된 증빙서류</div>
                            <div class="cg-title">* 기타 결석: ${box(isOther)} 기타</div>
                            <div class="cg-title">* 출석인정결석: ${box(isRecognized)} 뒷면 참조, ☐ 코로나19 관련</div>
                            ${d.evidenceUrl ? '<img src="' + d.evidenceUrl + '" class="photo-container" alt="증빙서류">' : ''}
                        </td>
                    </tr>
                </table>

                <div class="signature-section">
                    ${year}년 ( ${month} )월 ( ${day} )일<br>
                    보호자 : &nbsp; ${d.parentName || ''} &nbsp;
                    ${d.parentSignature ? '<img src="' + d.parentSignature + '" class="sig-img" alt="서명">' : '(서명)'}
                </div>

                <div class="school-principal">${school ? school + '장' : '학교장'} 귀하</div>

                <div class="bottom-notice">
                    ※ 본 결석계는 학부모 의견서를 겸합니다.<br>
                    ※ 첨부할 내용: 증빙서류(위의 항목 참고)를 함께 제출해 주시기 바랍니다.
                </div>

                <div class="teacher-record-box">
                    <p>▶ 아래 부분은 담임선생님이 확인 기록하는 것이니 <u>가정에서는 기록하지 마시기 바랍니다.</u></p>
                    <table class="form-table" style="margin:0;">
                        <tr>
                            <th>질병결석</th>
                            <th>미인정결석</th>
                            <th>기타결석</th>
                            <th>출석인정결석<br><small>(천재지변, 감염병, 경조사 등)</small></th>
                        </tr>
                        <tr class="row-tall">
                            <td class="center">${col === '질병' ? 'V' : ''}</td>
                            <td class="center"></td>
                            <td class="center">${col === '기타' ? 'V' : ''}</td>
                            <td class="center">${col === '인정' ? 'V' : ''}</td>
                        </tr>
                    </table>
                </div>
            </div>
            `;
        }

        function periodText(d) {
            const days = Number(d.totalDays || 0);
            return koreanDate(d.startDate) + ' ~ ' + koreanDate(d.endDate) + ' ( ' + (days || '&nbsp;&nbsp;') + ' )일간';
        }
        const BLANK_PERIOD = '202&nbsp;&nbsp;년 &nbsp;&nbsp;월 &nbsp;&nbsp;일 ~ 202&nbsp;&nbsp;년 &nbsp;&nbsp;월 &nbsp;&nbsp;일 ( &nbsp;&nbsp; )일간';

        function personRows(d, withPhone) {
            const gender = d.gender === '남' || d.gender === '여' ? '(' + d.gender + ')' : '(남 · 여)';
            return `
                    <tr>
                        <th width="12%" ${withPhone ? 'rowspan="2"' : ''}>인 적<br>사 항</th>
                        <th width="12%">성 명</th>
                        <td width="36%"><strong>${d.studentName || ''}</strong> <span class="gender">${gender}</span></td>
                        <th width="16%" class="nowrap">학년반번호</th>
                        <td width="24%" class="nowrap">${d.grade || ''}학년 ${d.classNumber || ''}반 ${d.studentNumber || ''}번</td>
                    </tr>
                    ${withPhone ? '<tr><th>전화번호</th><td colspan="3">' + (d.parentPhone || '010-') + '</td></tr>' : ''}`;
        }

        // 학생은 서명하지 않는다. 학부모 서명만 받는다.
        function closing(d, sentence) {
            const year = d.year || new Date().getFullYear();
            const month = d.month || (new Date().getMonth() + 1);
            const day = d.day || new Date().getDate();
            const school = d.schoolName || '';
            return `
                <div class="signature-section">
                    ${sentence}<br>
                    ${year}년 ( ${month} )월 ( ${day} )일<br>
                    학부모 : &nbsp; ${d.parentName || ''} &nbsp;
                    ${d.parentSignature ? '<img src="' + d.parentSignature + '" class="sig-img" alt="서명">' : '(서명)'}
                </div>
                <div class="school-principal">${school ? school + '장' : '학교장'} 귀하</div>`;
        }

        function getExpAppHTML(d) {
            // 감염병 위기경보 '심각' 단계에 한해 가정학습으로 신청할 수 있다.
            const isHome = d.learningType === 'home';
            return `
            <div class="a4-page">
                <div class="title" style="letter-spacing:6px;">교외체험학습 신청서</div>
                <div class="head-row">
                    <div class="sub-note">※ 체험학습 실시 3일 전까지 제출</div>
                    ${approvalBox(d)}
                </div>

                <table class="form-table">
                    ${personRows(d, true)}
                    <tr>
                        <th rowspan="2">기 간</th>
                        <td colspan="4" class="period-cell">
                            <span class="period-label">(일반 체험학습)</span> ${isHome ? BLANK_PERIOD : periodText(d)}
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" class="period-cell">
                            <span class="period-label">(감염병위기경보 - 심각 단계인 경우에 한해, '가정학습'으로 신청 가능)</span><br>
                            <span class="period-sub">${isHome ? periodText(d) : BLANK_PERIOD}</span>
                        </td>
                    </tr>
                    <tr class="row-tall">
                        <th>장 소</th>
                        <td colspan="4">${d.location || ''}</td>
                    </tr>
                    <tr>
                        <th>활동계획</th>
                        <td colspan="4" class="plan-cell">${d.planDetail || ''}</td>
                    </tr>
                </table>
                ${closing(d, '위와 같이 교외체험학습을 신청하오니 허락하여 주시기 바랍니다.')}
            </div>
            `;
        }

        function getExpReportHTML(d) {
            return `
            <div class="a4-page">
                <div class="title" style="letter-spacing:4px; font-size:24px;">교외체험학습 결과 보고서</div>
                <div class="head-row">
                    <div class="sub-note">※ 교외체험학습 실시 후 7일 이내 제출함</div>
                    ${approvalBox(d)}
                </div>

                <table class="form-table">
                    ${personRows(d, false)}
                    <tr class="row-tall">
                        <th>기 간</th>
                        <td colspan="4" class="period-cell"><span class="period-label">(일반 체험학습)</span> ${periodText(d)}</td>
                    </tr>
                    <tr class="row-tall">
                        <th>장 소</th>
                        <td colspan="4">${d.location || ''}</td>
                    </tr>
                    <tr>
                        <th>현장학습<br>실천내용<br>및 효과</th>
                        <td colspan="4" class="plan-cell">
                            ${d.reportDetail || ''}
                            ${d.photoUrl ? '<br><br><img src="' + d.photoUrl + '" class="photo-container" alt="현장사진">' : ''}
                        </td>
                    </tr>
                </table>
                ${closing(d, '위와 같이 현장 학습 결과를 보고합니다.')}
            </div>
            `;
        }

        loadDocumentData();
    </script>
</body>
</html>
