<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기초학력 진단검사 · 클래스제이</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header><a href="/">← 학급 홈</a><h1>기초학력 진단검사</h1><span id="clock"></span></header>
  <main>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="joinView" class="panel">
      <h2>시험 입장</h2>
      <form id="joinForm">
        <label>방번호 <input id="joinCode" inputmode="numeric" maxlength="4" required></label>
        <label>번호 <input id="joinNumber" type="number" min="1" max="60"></label>
        <label>이름 <input id="joinName" maxlength="80"></label>
        <button>입장하기</button>
      </form>
      <p class="muted">사이트에 로그인한 학생은 등록된 이름과 번호로 입장합니다.</p>
    </section>
    <section id="teacherHome" hidden>
      <div class="panel"><h2>새 시험</h2><form id="createForm" class="row">
        <label>시험 이름 <input id="newTitle" maxlength="80" required placeholder="예: 2학년 문해력 진단"></label>
        <label>제한시간(분) <input id="newDuration" type="number" min="1" max="180" value="40" required></label>
        <button>만들기</button>
      </form></div>
      <div class="panel"><h2>내 시험</h2><div id="examList"></div></div>
    </section>
    <section id="teacherExam" hidden>
      <div class="panel"><div class="topline"><h2 id="examHeading"></h2><a href="?mode=teacher">내 시험 목록</a></div>
        <p id="examMeta"></p>
        <div class="actions"><button id="startButton">시험 시작</button><button id="closeButton" class="secondary">지금 종료</button><button id="deleteButton" class="danger">시험 삭제</button><button id="refreshButton" class="secondary">현황 새로고침</button></div>
      </div>
      <div id="draftTools" class="panel">
        <h2>시험지 준비</h2><p>PDF에서 문항 초안을 추출한 뒤 문제와 정답을 확인하세요. 별도 정답지가 있으면 해당 내용을 정답란에 직접 입력할 수 있습니다.</p>
        <div class="row"><label>시험 이름 <input id="editTitle" maxlength="80"></label><label>제한시간(분) <input id="editDuration" type="number" min="1" max="180"></label></div>
        <div class="row"><label>PDF 시험지 <input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><button id="extractButton">AI로 문항 추출</button></div>
        <p id="extractNote" class="muted"></p><div id="editor"></div>
        <div class="actions"><button id="addChoiceButton" class="secondary">객관식 추가</button><button id="addOxButton" class="secondary">OX 추가</button><button id="addShortButton" class="secondary">단답형 추가</button><button id="saveButton">문항 저장</button></div>
      </div>
      <div id="results" class="panel"><h2>응시 현황</h2><div id="resultsTable"></div></div>
    </section>
    <section id="studentExam" hidden>
      <div class="panel"><div class="topline"><h2 id="studentTitle"></h2><strong id="remaining"></strong></div><p id="studentMeta"></p></div>
      <div id="waitingPanel" class="panel" hidden><h2>입장 완료</h2><p>선생님이 시험을 시작할 때까지 기다려 주세요. 시작하면 문제가 자동으로 열리고 제한시간이 시작됩니다.</p></div>
      <div id="questionPanel" class="panel"><div id="progress"></div><h3 id="questionText"></h3><div id="answerArea"></div><div class="actions"><button id="previousButton" class="secondary">이전</button><button id="nextButton" class="secondary">다음</button><button id="submitButton">답안 제출</button></div></div>
    </section>
  </main>
</body>
</html>
