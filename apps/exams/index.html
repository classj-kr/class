<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기초학력 진단검사 · 클래스제이</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="teacherHome" hidden>
      <div class="panel"><h2>새 시험</h2>
        <div class="row"><label>제한시간(분) <input id="newDuration" type="number" min="1" max="180" value="40" required></label></div>
        <label id="dropZone" class="drop-zone">
          <input id="newPdfs" type="file" accept="application/pdf,.pdf,audio/mpeg,.mp3,.xlsx,.xls,.csv" multiple>
          <strong>시험지·정답지·MP3를 끌어다 놓으세요</strong>
        </label>
        <ul id="uploadList" class="upload-list"></ul>
      </div>
      <div class="panel"><h2>우리 학교 시험</h2><div id="examList"></div></div>
    </section>
    <section id="teacherExam" hidden>
      <div class="panel"><div class="topline"><h2 id="examHeading"></h2><a href="?mode=teacher">시험 목록</a></div>
        <p id="examMeta"></p>
        <div id="audioTools" class="audio-tools"><strong>듣기 음원</strong><audio id="teacherAudio" controls preload="none" hidden></audio><span id="audioNote" class="muted"></span>
          <span id="audioEdit" class="actions"><label class="secondary file-button">MP3 올리기<input id="audioFile" type="file" accept="audio/mpeg,.mp3"></label><button id="audioDelete" class="secondary" type="button">음원 삭제</button></span></div>
        <p id="readyNote" class="muted"></p>
        <div class="actions"><button id="refreshButton" class="secondary">현황 새로고침</button><button id="closeButton" class="secondary">응시 마감</button><button id="deleteButton" class="danger">시험 삭제</button></div>
      </div>
      <div id="results" class="panel"><h2>응시 현황</h2><div id="resultsTable"></div><div id="memberDetail"></div></div>
      <div id="paperView" class="panel" hidden><h2>시험지</h2><div id="paperList"></div></div>
      <div id="draftTools" class="panel">
        <h2>문항</h2>
        <div class="row"><label>시험 이름 <input id="editTitle" maxlength="80"></label><label>제한시간(분) <input id="editDuration" type="number" min="1" max="180"></label></div>
        <div class="row"><label>PDF 시험지 <input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><button id="extractButton">AI로 문항 추출</button><label class="file-button">정답지 올리기<input id="keyFile" type="file" accept="application/pdf,.pdf,.xlsx,.xls,.csv"></label></div>
        <p id="extractNote" class="muted"></p><div id="editor"></div>
        <div class="actions"><button id="addChoiceButton" class="secondary">객관식 추가</button><button id="addOxButton" class="secondary">OX 추가</button><button id="addShortButton" class="secondary">단답형 추가</button><button id="saveButton">문항 저장</button></div>
      </div>    </section>
    <section id="studentExam" hidden>
      <div class="student-bar"><strong id="studentTitle"></strong><span id="studentMeta"></span><strong id="remaining"></strong><audio id="studentAudio" controls preload="metadata" hidden></audio></div>
      <div id="waitingPanel" class="panel" hidden><h2>입장 완료</h2><p>준비 중입니다. 잠시 기다려 주세요.</p></div>
      <div id="beginPanel" class="panel" hidden><h2>시험 시작</h2><p id="beginInfo"></p><button id="beginButton">시작하기</button></div>
      <div id="closedPanel" class="panel" hidden><h2>응시 마감</h2><p>이 시험은 응시가 마감되었습니다.</p></div>
      <div id="questionPanel" class="panel"><div id="progress"></div><h3 id="questionText"></h3><img id="questionImage" class="question-image" alt="" hidden><div id="answerArea"></div><div class="actions student-actions"><button id="previousButton" class="secondary">이전</button><button id="nextButton" class="secondary">다음</button><button id="submitButton">답안 제출</button></div></div>
    </section>
  </main>
</body>
</html>
