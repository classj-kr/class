<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인정보 요청 관리</title><link rel="stylesheet" href="/assets/legal.css"><style>.admin-list{display:grid;gap:12px}.admin-item{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.meta{display:flex;gap:8px 16px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.admin-actions button{min-height:44px;padding:8px 12px;border:1px solid var(--green);border-radius:9px;background:white;color:var(--green);font-weight:900;cursor:pointer}</style></head><body>
<header class="site-head"><div class="site-head-inner"><a class="brand" href="/admin/">관리자</a><nav><a class="nav-link" href="/privacy">처리방침</a><a class="nav-link" href="/support">요청 화면</a></nav></div></header><main><header class="lead"><h1>개인정보 요청 관리</h1></header><p id="status" class="notice" role="status">관리자 권한을 확인하고 있습니다.</p><div id="list" class="admin-list"></div></main>
<script>const labels={view:'열람',correct:'정정',delete:'삭제',stop:'처리정지',birthday:'생일 공개 변경',guardian:'법정대리인 동의 확인·철회',technical:'기술 문제',other:'기타',received:'접수',reviewing:'확인 중',completed:'처리 완료',rejected:'처리 제한'};const list=document.querySelector('#list'),statusEl=document.querySelector('#status');async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'요청 실패');return d}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function update(id,status){await api(`/api/admin/privacy-requests/${id}`,{method:'PATCH',body:JSON.stringify({status})});await load()}function render(items){list.innerHTML=items.length?items.map(x=>`<article class="admin-item"><div class="request-head"><strong>#${x.id} ${labels[x.category]||x.category}</strong><span class="badge">${labels[x.status]||x.status}</span></div><div class="meta"><span>${esc(x.display_name)} (${esc(x.role||'미지정')})</span><span>${esc(x.email)}</span><span>${new Date(x.created_at).toLocaleString('ko-KR')}</span></div><p>${esc(x.details)}</p><div class="admin-actions"><button onclick="update(${x.id},'reviewing')">확인 중</button><button onclick="update(${x.id},'completed')">처리 완료</button><button onclick="update(${x.id},'rejected')">처리 제한</button></div></article>`).join(''):'<p>접수된 요청이 없습니다.</p>'}async function load(){const me=await api('/api/auth/me');if(!me.signedIn||me.user.role!=='admin')throw new Error('관리자 로그인이 필요합니다.');const data=await api('/api/admin/privacy-requests');statusEl.textContent=`총 ${data.requests.length}건을 표시합니다.`;render(data.requests)}load().catch(e=>{statusEl.textContent=e.message});</script></body></html>
