# GitHub Pages must not publish the withdrawn art course.
# Retain the standard exclusions for Jekyll 3 as well as Jekyll 4.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - learning/arts/art-theory/
