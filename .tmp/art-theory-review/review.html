<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{width:100%;height:100vh;border:0}pre{display:none}</style><iframe src="../../learning/arts/art-theory/index.html"></iframe><pre id="result">pending</pre><script>
const frame=document.querySelector('iframe');
frame.onload=()=>{try{
 const d=frame.contentDocument,w=frame.contentWindow,checks=[];
 const ok=(value,message)=>{if(!value)throw Error(message);checks.push(message)};
 ok(!d.querySelector('.menu-heading'),'removed duplicate heading');
 const lessons=[...d.querySelectorAll('[data-open-lesson]')];
 ok(lessons.length===9,'nine lessons available');
 for(const button of lessons){
  button.click();
  ok(!d.querySelector('#lessonView').hidden,button.dataset.openLesson+' opens');
  ok(d.activeElement.id==='lessonTitle','focus moves to lesson heading');
  ok(!d.querySelector('#observePanel').hidden,'observation shown on entry');
  d.querySelector('#studyTab').click();
  ok(!d.querySelector('#studyPanel').hidden&&d.querySelector('#observePanel').hidden,'study switches panels');
  ok(d.querySelector('#artworkFigure').textContent.trim().length>0,'artwork remains available');
  d.querySelector('#checkTab').click();
  d.querySelector('[data-answer="0"]').click();
  ok(!d.querySelector('.check-feedback').hidden,'quiz feedback appears');
  d.querySelector('#observeTab').click();
  d.querySelector('#checkTab').click();
  ok(!d.querySelector('.check-feedback').hidden,'quiz answer survives tab switch');
  d.querySelector('#checkTab').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
  ok(d.activeElement.id==='observeTab','arrow keys wrap between activities');
  d.querySelector('#observeTab').dispatchEvent(new w.KeyboardEvent('keydown',{key:'End',bubbles:true}));
  ok(d.activeElement.id==='checkTab','End selects last activity');
  d.querySelector('#courseListButton').click();
  ok(!d.querySelector('#courseMenu').hidden&&d.activeElement===button,'return restores lesson list and focus');
 }
 lessons[1].click();d.querySelector('#studyTab').click();
 const value=d.querySelector('#valueControl');value.value='8';value.dispatchEvent(new w.Event('input'));
 ok(d.querySelector('#valueOutput').textContent==='8','value slider updates');
 d.querySelector('[data-hue-index="0"]').click();
 ok(d.querySelector('#propertyNotation').textContent.startsWith('R 8/'),'hue selection preserves value');
 d.querySelector('#courseListButton').click();lessons[2].click();d.querySelector('#studyTab').click();
 d.querySelector('[data-mix-index="2"]').click();
 const zoom=d.querySelector('#zoomSlider');zoom.value='24';zoom.dispatchEvent(new w.Event('input'));
 ok(d.querySelector('#pointillismCanvas').style.backgroundPosition.includes('12px'),'point offsets scale with dot size');
 w.dispatchEvent(new w.CustomEvent('sitebackrequest',{cancelable:true}));
 ok(!d.querySelector('#courseMenu').hidden,'shared back navigation preserved');
 lessons[0].click();d.querySelector('#studyTab').click();d.querySelector('[data-light="candle"]').click();
 ok(d.querySelector('#primaryArtworkImg').style.filter.includes('sepia'),'light control changes visible artwork');
 ok(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'no horizontal page overflow');
 document.querySelector('#result').textContent=JSON.stringify({passed:checks.length,checks});
 document.title='PASS '+checks.length;
}catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;document.title='FAIL'}};
</script>
