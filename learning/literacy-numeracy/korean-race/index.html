<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6efe1">
  <title>순위전</title>
  <link rel="stylesheet" href="race.css?v=20261109-team-race">
</head>
<body data-screen="entry">
  <div class="paper" aria-hidden="true">
    <div class="sky-sun"></div>
    <i class="cloud" style="--top:9%;--speed:80s;--delay:-12s;--size:1"></i>
    <i class="cloud" style="--top:20%;--speed:62s;--delay:-40s;--size:.7"></i>
    <i class="cloud" style="--top:5%;--speed:95s;--delay:-70s;--size:.55"></i>
    <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none">
      <path d="M0 170 Q120 90 240 150 T480 130 T720 110 T960 140 T1200 100 V300 H0Z" fill="#b9d8c6"/>
      <path d="M0 220 Q160 150 320 205 T640 190 T960 200 T1200 175 V300 H0Z" fill="#8fc19f"/>
      <path d="M0 262 Q200 232 400 255 T800 250 T1200 245 V300 H0Z" fill="#6fae7f"/>
    </svg>
    <svg class="village" viewBox="0 0 1200 270" preserveAspectRatio="xMidYMax slice">
      <g transform="translate(40 186) scale(1.15)"><rect x="14" y="30" width="92" height="34" fill="#f6ead6"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#4b3f3a"/><path d="M22 12 Q60 2 98 12" stroke="#4b3f3a" stroke-width="6" fill="none" stroke-linecap="round"/></g><g transform="translate(250 196) scale(0.9)"><rect x="14" y="30" width="92" height="34" fill="#f3e4cc"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#5a4a40"/><path d="M22 12 Q60 2 98 12" stroke="#5a4a40" stroke-width="6" fill="none" stroke-linecap="round"/></g><g transform="translate(430 180) scale(1.3)"><rect x="14" y="30" width="92" height="34" fill="#f7ecd9"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#433733"/><path d="M22 12 Q60 2 98 12" stroke="#433733" stroke-width="6" fill="none" stroke-linecap="round"/></g><g transform="translate(690 194) scale(0.95)"><rect x="14" y="30" width="92" height="34" fill="#f4e6cf"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#584840"/><path d="M22 12 Q60 2 98 12" stroke="#584840" stroke-width="6" fill="none" stroke-linecap="round"/></g><g transform="translate(880 184) scale(1.2)"><rect x="14" y="30" width="92" height="34" fill="#f6ead6"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#4b3f3a"/><path d="M22 12 Q60 2 98 12" stroke="#4b3f3a" stroke-width="6" fill="none" stroke-linecap="round"/></g><g transform="translate(1080 198) scale(0.85)"><rect x="14" y="30" width="92" height="34" fill="#f3e4cc"/><rect x="14" y="30" width="92" height="34" fill="none" stroke="#7a5a3c" stroke-width="2"/><path d="M30 30v34M60 30v34M90 30v34" stroke="#7a5a3c" stroke-width="3"/><path d="M-6 26 Q8 24 16 12 L104 12 Q112 24 126 26 Q118 32 104 30 L16 30 Q2 32 -6 26Z" fill="#5a4a40"/><path d="M22 12 Q60 2 98 12" stroke="#5a4a40" stroke-width="6" fill="none" stroke-linecap="round"/></g>
      <path d="M0 252 H1200 V270 H0Z" fill="#c9b08a"/>
      <path d="M0 250 H1200" stroke="#a88d66" stroke-width="3"/>
    </svg>
    <div class="kites"></div>
    <div class="drift"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <nav class="topbar">
    <a id="backLink" class="back" href="/" aria-label="돌아가기">←</a>
    <span id="roomBadge" class="room-badge" hidden>방 <b id="roomBadgeCode"></b></span>
    <button id="stopButton" class="chip-button host-only" type="button" hidden>그만하기</button>
    <button id="leaveButton" class="chip-button" type="button" hidden>나가기</button>
  </nav>

  <main>
    <!-- 입장 -->
    <section id="entryScreen" class="screen entry">
      <h1 class="title-blocks" aria-label="순위전"></h1>
      <div class="panel create">
        <div class="settings" data-settings="create"></div>
        <label id="spectateRow" class="spectate" hidden><input id="spectateInput" type="checkbox"> 나는 참여하지 않고 관전하기</label>
        <button id="createButton" class="big-button" type="button">방 만들기</button>
        <p class="entry-note">친구 방은 메인 화면 <b>방번호</b>로 들어가요.</p>
      </div>
    </section>

    <!-- 대기실 -->
    <section id="lobbyScreen" class="screen lobby" hidden>
      <!-- 설정은 왼쪽 내용과 따로 둔다: 설정 칸이 길어도 팀 칸이 그 높이만큼 밀려 내려가지 않게 -->
      <div class="host-only lobby-settings">
        <div class="settings" data-settings="lobby"></div>
        <button id="startButton" class="big-button go" type="button">🏁 출발!</button>
      </div>
      <div class="lobby-main">
      <div class="lobby-head">
        <div class="code-card host-only"><span>방번호</span><strong id="lobbyCode">0000</strong><em id="lobbySet"></em></div>
        <div class="me-card player-only"><span id="myRacer" class="racer-big"></span><strong id="myName"></strong><span id="myTeam" class="team-badge" hidden></span><p id="myLobbyHint">선생님이 출발을 누르면 시작해요!</p></div>
      </div>
      <p class="lobby-count"><b id="racerCount">0</b>명 대기 중 · <span id="lobbyRule"></span> <button id="shuffleButton" class="chip-button host-only" type="button" hidden>🎲 랜덤 배정</button></p>
      <ul id="lobbyRacers" class="lobby-racers"></ul>
      <div id="teamPanel" class="team-panel" hidden>
        <div id="teamColumns" class="team-columns"></div>
        <div id="benchZone" class="bench"><p>아직 팀 없음 · 출발할 때 자동으로 팀에 들어가요</p><ul id="benchList" class="lobby-racers"></ul></div>
        <p class="team-tip host-only">학생을 누르면 다음 팀으로 옮겨요.</p>
      </div>
      </div>
    </section>

    <!-- 문제 풀기 -->
    <section id="raceScreen" class="screen race" hidden>
      <div class="hud">
        <div class="hud-time"><span>남은 시간</span><strong id="timeLeft">0</strong></div>
        <div class="hud-score player-only"><span>점수</span><strong id="scoreNow">0</strong></div>
        <div class="hud-combo player-only"><span>콤보</span><strong id="comboNow">0</strong><em id="worthNow">한 문제 +1</em><i id="comboMeter" class="combo-meter" aria-hidden="true"></i></div>
        <div class="hud-rank player-only"><span>순위</span><strong id="rankNow">-</strong></div>
        <div class="hud-mode spectator-only"><span id="modeNow"></span><strong id="hostCode">0000</strong></div>
        <div class="time-bar"><i id="timeBar"></i></div>
      </div>

      <div id="teamBar" class="team-bar" hidden></div>

      <div class="arena player-only">
        <div class="play">
          <article id="card" class="q-card">
            <header><span id="qLabel" class="q-label"></span><span id="qNo" class="q-no"></span><span id="qStamp" class="q-stamp" hidden></span></header>
            <p id="qAsk" class="q-ask"></p>
            <p id="qText" class="q-text"></p>
            <div id="choices" class="choices"></div>
            <div id="reveal" class="reveal" hidden><b id="revealTitle"></b><p id="revealText"></p></div>
          </article>
          <p id="chase" class="chase"></p>
        </div>
        <aside class="side">
          <div class="my-tower"><p class="side-title">맞힌 말 <b id="floorNow"></b></p><div id="myWords" class="words"></div></div>
          <ol id="miniBoard" class="mini-board"></ol>
        </aside>
      </div>

      <div id="towers" class="towers"></div>
    </section>

    <!-- 결과 -->
    <section id="resultScreen" class="screen results" hidden>
      <h2 class="result-title">🏆 결과 발표</h2>
      <p id="myResult" class="my-result player-only"></p>
      <div id="teamResult" class="team-result" hidden></div>
      <h3 id="soloTitle" class="solo-title" hidden>개인 순위</h3>
      <div id="podium" class="podium"></div>
      <div class="table-wrap">
        <table class="result-table">
          <thead><tr><th>순위</th><th>이름</th><th>점수</th><th>맞힘</th><th>틀림</th><th>정답률</th><th>최고 콤보</th></tr></thead>
          <tbody id="resultRows"></tbody>
        </table>
      </div>
      <div class="host-only result-actions">
        <button id="againButton" class="big-button go" type="button">🔁 한 판 더</button>
        <button id="settingsButton" class="big-button ghost" type="button">설정 바꾸기</button>
      </div>
    </section>
  </main>

  <div id="countdown" class="countdown" hidden><span id="countNum">3</span></div>
  <div id="finish" class="finish" hidden><span>끝!</span></div>
  <p id="banner" class="banner" aria-live="polite"></p>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="/assets/site-storage.js?v=20261006-1"></script>
  <template id="settingsHelp">
    <p>방을 만들고 친구에게 방번호를 알려 주세요. 친구는 메인 화면에서 방번호로 들어올 수 있어요.</p>
    <p>보기를 누르거나 번호 숫자 키로 골라요. 맞히면 +1, 5문제 연속이면 +2, 10문제 연속이면 +3이에요.</p>
    <p>틀릴 때마다 1점이 깎이고, 맞힐 때까지 같은 문제를 다시 골라요. 고른 오답에는 줄이 그어져요.</p>
    <p>팀전은 팀원 모두가 모은 점수의 합계로 겨뤄요.</p>
  </template>
  <script src="/assets/sound/game-sfx.js?v=20261009-explosion-file"></script>
  <script src="/assets/sound/race-music.js?v=20261106-1"></script>
  <script src="/assets/sound/music-control.js?v=20261105-settings-panel" data-settings-help="settingsHelp"></script>
  <script src="korean-race-core.js?v=20261109-team-size"></script>
  <script src="race.js?v=20261109-team-race"></script>
</body>
</html>
