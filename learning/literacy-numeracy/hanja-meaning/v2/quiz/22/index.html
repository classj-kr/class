</style></head><body><main class="page"><header class="topbar"><strong>22단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>22단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"律","reading":"율·률","prompt":"律(율·률)이 들어가지 않은 말은?","note":"‘환율’에는 ‘비율 률’을 씁니다.","options":[{"word":"법률","sentence":"현행 {{법률}}이 인정하는 범위 내에서 이번 일을 처리하도록 하겠습니다.","correct":false},{"word":"자율","sentence":"봉사 활동을 학생 {{자율}}에 맡겼더니, 강제로 참여하게 했을 때 보다 참여하는 학생이 늘었다.","correct":false},{"word":"조율","sentence":"악기가 정확한 음으로 아름다운 소리를 내기 위해서는 {{조율}}을 하는 것이 중요하다.","correct":false},{"word":"환율","sentence":"중국으로 여행 가기 전에 은행에서 {{환율}} 우대를 받아 싸게 환전했다.","correct":true}]},{"target":"罰","reading":"벌","prompt":"罰(벌)이 들어가지 않은 말은?","note":"‘문벌’에는 ‘문벌 벌’을 씁니다.","options":[{"word":"형벌","sentence":"법을 어기는 사람에게는 {{형벌}}을 가해진다.","correct":false},{"word":"벌금","sentence":"도서관에서 빌린 책을 기한 안에 반납하지 못해 {{벌금}}을 물었다.","correct":false},{"word":"벌점","sentence":"그 선수는 경기 도중 반칙을 해서 {{벌점}}을 받았다.","correct":false},{"word":"문벌","sentence":"사내는 무관 집안 출신으로 크게 높은 {{문벌}}을 갖추지는 못했다.","correct":true}]},{"target":"違","reading":"위","prompt":"違(위)가 들어가지 않은 말은?","note":"‘위치’에는 ‘자리 위’를 씁니다.","options":[{"word":"위헌","sentence":"판사는 법원에서 내려진 이번 판결에 대해 {{위헌}} 결정을 내렸다.","correct":false},{"word":"위반","sentence":"한 후보가 주민들에게 식사를 대접하는 등의 선거와 관련한 법을 {{위반}}을 한 혐의로 기소되었다.","correct":false},{"word":"위배","sentence":"안전모를 착용하지 않고 일을 하는 것은 규정에 {{위배}}가 된다.","correct":false},{"word":"위치","sentence":"부동산 사장님은 집의 {{위치}}와 면적 등을 자세히 소개해 주셨다.","correct":true}]},{"target":"偏","reading":"편","prompt":"偏(편)이 들어가지 않은 말은?","note":"‘편찬’에는 ‘엮을 편’을 씁니다.","options":[{"word":"편서풍","sentence":"매년 황사가 {{편서풍}}을 타고 한국으로 날아온다.","correct":false},{"word":"편차","sentence":"이번 시험은 학생들의 점수 {{편차}}가 크다.","correct":false},{"word":"편모","sentence":"{{편모}}의 헌신 덕분에 아이들은 부족함 없이 사랑받으며 자랄 수 있었다.","correct":false},{"word":"편찬","sentence":"교육부는 교과서 {{편찬}}을 맡을 학자들을 선정했다.","correct":true}]},{"target":"私","reading":"사","prompt":"私(사)가 들어가지 않은 말은?","note":"‘사회’에는 ‘모일 사’를 씁니다.","options":[{"word":"사적","sentence":"회사에서만 보던 동료를 주말에 {{사적}}으로 만났는데 왠지 모르게 두근거렸다.","correct":false},{"word":"사심","sentence":"심판은 {{사심}} 없이 공정하게 판정해야 한다.","correct":false},{"word":"사익","sentence":"공무원은 나랏일을 하면서 {{사익}}에 손해되는 일이라도 공익을 해치는 일은 해서는 안 된다.","correct":false},{"word":"사회","sentence":"보다 깨끗한 대학 {{사회}}를 만들기 위해서는 학생들의 의견 존중이 중요하다.","correct":true}]},{"target":"衆","reading":"중","prompt":"衆(중)이 들어가지 않은 말은?","note":"‘중심’에는 ‘가운데 중’을 씁니다.","options":[{"word":"민중","sentence":"열악한 생활 환경에서도 나라를 위해 희생하며 묵묵히 일한 {{민중}}들이야말로 눈부신 경제 성장의 원동력이라 할 수 있다.","correct":false},{"word":"중의","sentence":"수익금을 어디에 기부할지에 대한 {{중의}}가 팽팽해 아직 성금을 전달하지 못했다.","correct":false},{"word":"대중문화","sentence":"매체가 발전함에 따라 {{대중문화}}는 점점 고급스럽고 전문적인 부분들까지 수용하고 있다.","correct":false},{"word":"중심","sentence":"그가 아무렇게나 쏜 화살은 과녁의 {{중심}}을 맞히었다.","correct":true}]},{"target":"寡","reading":"과","prompt":"寡(과)가 들어가지 않은 말은?","note":"‘과학’에는 ‘과목 과’를 씁니다.","options":[{"word":"과점","sentence":"{{과점}}은 자유로운 경쟁이라는 시장의 원리를 해친다.","correct":false},{"word":"과묵","sentence":"그의 {{과묵}}은 백 마디의 말보다 오히려 신뢰감을 주었다.","correct":false},{"word":"청상과부","sentence":"자식도 없는 {{청상과부}}는 혼자서 외롭게 늙어 갔다.","correct":false},{"word":"과학","sentence":"{{과학}}은 물리학과 생물학 등의 여러 분야로 나눌 수 있다.","correct":true}]},{"target":"央","reading":"앙 word":"순서","sentence":"아이들은 선생님의 지시에 따라 출석 번호 {{순서}}대로 섰다.","correct":false},{"word":"순위","sentence":"먼저 결승선을 통과한 선수부터 {{순위}}가 매겨졌다.","correct":false},{"word":"순차적","sentence":"이 소설은 {{순차적}}인 시간 질서를 따라 서술되고 있다.","correct":false},{"word":"순환","sentence":"태양열과 지구의 자전에 의해 대기의 {{순환}}이 이루어진다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
