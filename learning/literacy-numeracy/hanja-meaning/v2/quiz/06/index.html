rrect":false},{"word":"두뇌","sentence":"왼쪽 {{두뇌}}는 주로 언어의 청각 기능을 다스리고 오른쪽 {{두뇌}}는 그 외의 청각 기능을 다스린다.","correct":false},{"word":"구두","sentence":"내게는 {{구두}} 계약을 증명할 방법이 전혀 없었다.","correct":false},{"word":"두부","sentence":"오늘 아침에는 {{두부}}를 넣고 된장국을 끓여 먹었다.","correct":true}]},{"target":"登","reading":"등","prompt":"登(등)이 들어가지 않은 말은?","note":"‘고등’에는 ‘무리 등’을 씁니다.","options":[{"word":"등장","sentence":"죽었다가 살아난 주인공의 {{등장}} 부분이 이 영화의 가장 큰 볼거리이다.","correct":false},{"word":"등기","sentence":"일단은 살 집의 {{등기}}를 떼어서 채무 관계가 걸려 있지는 않은지 확인해 보세요.","correct":false},{"word":"등판","sentence":"박 선수께서는 이번에 첫 {{등판}}을 하시는데요, 한 말씀 부탁드립니다.","correct":false},{"word":"고등","sentence":"우리 대학은 좋은 커리큘럼과 최첨단 시설을 갖추어 국내 최고 {{고등}} 교육 기관으로 꼽힌다.","correct":true}]},{"target":"等","reading":"등","prompt":"等(등)이 들어가지 않은 말은?","note":"‘갈등’에는 ‘등나무 등’을 씁니다.","options":[{"word":"고등","sentence":"우리 대학은 좋은 커리큘럼과 최첨단 시설을 갖추어 국내 최고 {{고등}} 교육 기관으로 꼽힌다.","correct":false},{"word":"초등","sentence":"우리 학교는 수학 수업을 {{초등}}, 중등, 고등으로 반을 나누어 진행한다.","correct":false},{"word":"등급","sentence":"우리 학교에 입학하려면 적어도 두 개의 과목에서 최고 {{등급}}을 받아야 한다.","correct":false},{"word":"갈등","sentence":"우리 부부는 {{갈등}}을 해결하기 위해 서로의 생각을 이해하려고 노력했다.","correct":true}]},{"target":"樂","reading":"락·악·요·낙","prompt":"樂(락·악·요·낙)이 들어가지 않은 말은?","note":"‘필요’에는 ‘요긴할 요’를 씁니다.","options":[{"word":"음악","sentence":"{{음악}}의 빠르기와 리듬, 화성은 장면의 분위기와 청자의 정서 반응을 바꿉니다.","correct":false},{"word":"악기","sentence":"오케스트라 연습실에서는 많은 {{악기}}들의 웅장한 합주 소리가 들려왔다.","correct":false},{"word":"음악회","sentence":"오는 1일과 2일에는 그 회관에서 신년 {{음악회}}가 열립니다.","correct":false},{"word":"필요","sentence":"5층 이상 되는 건물은 오르내리기 쉽도록 엘리베이터를 설치할 {{필요}}가 있다.","correct":true}]},{"target":"來","reading":"래·내","prompt":"來(래·내)가 들어가지 않은 말은?","note":"‘내용’에는 ‘안 내’를 씁니다.","options":[{"word":"내일","sentence":"오늘 조사한 자료를 정리해 {{내일}} 모둠 발표에서 공유하겠습니다.","correct":false},{"word":"원래","sentence":"이 건물은 {{원래}} 기차역이었지만 지금은 미술관으로 쓰입니다.","correct":false},{"word":"미래","sentence":"공상 과학 영화를 보면 {{미래}}에서 쓰일 기계나 {{미래}} 사회의 모습이 자주 등장한다.","correct":false},{"wo correct":false},{"word":"복용","sentence":"약의 과다 {{복용}}은 오히려 몸에 해가 될 수 있으니 반드시 처방에 따라 적당한 양을 먹는 것이 좋다.","correct":false},{"word":"행복","sentence":"새해에는 선생님 댁에 {{행복}}이 가득하시길 기원합니다.","correct":true}]},{"target":"本","reading":"본","prompt":"本(본)이 들어가지 않은 말은?","note":"‘본드’는 외래어이므로 한자를 쓰지 않습니다.","options":[{"word":"일본","sentence":"{{일본}}은 우리나라의 동쪽에 자리한 섬나라입니다.","correct":false},{"word":"기본","sentence":"그들이 우리와 약속한 {{기본}} 원칙을 지키지 않으면 우리도 그들의 요구를 들어줄 수 없다.","correct":false},{"word":"본인","sentence":"{{본인}}의 의견에 찬성하시는 분은 손을 들어 주시기 바랍니다.","correct":false},{"word":"본드","sentence":"목재를 붙일 때 사용할 {{본드}}의 접착력을 비교했습니다.","correct":true}]},{"target":"夫","reading":"부","prompt":"夫(부)가 들어가지 않은 말은?","note":"‘부탁’에는 ‘줄 부’를 씁니다.","options":[{"word":"공부","sentence":"수학 문제를 풀 때는 답만 외우지 말고 풀이 방법을 스스로 {{공부}}해야 합니다.","correct":false},{"word":"부인","sentence":"{{부인}}께서 요즘 건강이 좋지 않아서 걱정이 되시겠어요.","correct":false},{"word":"부부","sentence":"현대 민법은 {{부부}}가 혼인 생활에서 동등한 권리와 책임을 지닌다고 규정합니다.","correct":false},{"word":"부탁","sentence":"숙제가 너무 어려워서 친구에게 도와 달라고 {{부탁}}했다.","correct":true}]},{"target":"部","reading":"부","prompt":"部(부)가 들어가지 않은 말은?","note":"‘정부’에는 ‘마을 부’를 씁니다.","options":[{"word":"부분","sentence":"아이는 자기가 좋아하는 {{부분}}이라며 노래의 일부를 들려주었다.","correct":false},{"word":"대부분","sentence":"저녁이 되자 아이들은 {{대부분}} 집으로 가고 한두 명의 아이만 놀이터에 있었다.","correct":false},{"word":"일부","sentence":"표본은 전체 집단의 {{일부}}이므로 추출 방식이 치우치면 조사 결과도 왜곡될 수 있습니다.","correct":false},{"word":"정부","sentence":"국가는 {{정부}}로 대표되어서 국민들의 재산과 생명을 보호할 의무가 있다.","correct":true}]},{"target":"不","reading":"불","prompt":"不(불)이 들어가지 않은 말은?","note":"‘불교’에는 ‘부처 불’을 씁니다.","options":[{"word":"불편","sentence":"두꺼운 코트를 입으면 몸을 움직이는 데 {{불편}}을 느껴서 답답하다.","correct":false},{"word":"불리","sentence":"우리 팀은 편파 판정이라는 {{불리}}를 겪으면서도 꿋꿋이 싸워 승리를 거두었다.","correct":false},{"word":"불구","sentence":"신체적 {{불구}}를 개인의 결함으로만 보는 관점은 사회 환경의 장벽을 놓치기 쉽습니다.","correct":false},{"word":"불교","sentence":"{{불교}}는 인도에서 시작되어 동아시아 여러 지역으로 전해졌습니다.","correct":true}]},{"target":"事","reading":"사","prompt":"事(사)가 들어가지 않은 말은?","note":"‘사과’에는 ‘사례할 사’를 씁니다.","options":[{"word":"사실","sentence":"{{사실}} 그가 하고 싶었던 말은 그게 아니었지만 자기도 모르게 엉뚱한 말을 하고 말았다.","correct":false},{"word":"사건","sentence":"동네에서 흉악한 {{사건}}이 터지자 사람들은 이사 갈 집을 알아보기 시작했다.","correct":false},{"word":"사업","sentence":"우리 교회는 불우이웃 돕기나 장학금 지급 등의 선교 {{사업}}을 꾸준히 하고 있다.","correct":false},{"word":"사과","sentence":"사장은 종업원의 실수에 대해 고객에게 진심으로 {{사과}}를 했다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
