t:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--blue);font:800 15px system-ui,sans-serif;cursor:pointer}.primary[hidden],.card[hidden],.result[hidden]{display:none}.result{margin-top:12px;padding:28px 20px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97);text-align:center}.result h1{margin:0 0 8px;font-size:25px}.result-score{margin:8px 0 20px;color:var(--blue);font:800 34px system-ui,sans-serif}.choice:focus-visible,.primary:focus-visible,.back:focus-visible{outline:3px solid #77a9cb;outline-offset:2px}@media(max-width:600px){.card{padding:15px}.choice{min-height:58px}}
</style></head><body><main class="page"><header class="topbar"><strong>4단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>4단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"敎","reading":"교","prompt":"敎(교)가 들어가지 않은 말은?","note":"‘교통’에는 ‘사귈 교’를 씁니다.","options":[{"word":"교실","sentence":"우리 반은 오늘 날씨가 좋아서 {{교실}}이 아닌 야외에서 수업을 했다.","correct":false},{"word":"교육","sentence":"우리 회사에서는 한 달 동안 신입 사원들을 위한 {{교육}}을 실시할 예정이다.","correct":false},{"word":"종교","sentence":"{{종교}}라는 건 일반적으로 인간을 보살펴 주는 신을 받든다는 개념이다.","correct":false},{"word":"교통","sentence":"그 도시는 유명한 관광 도시이지만 길이 좁고 차가 많아서 {{교통}}이 불편하다.","correct":true}]},{"target":"室","reading":"실","prompt":"室(실)이 들어가지 않은 말은?","note":"‘실력’에는 ‘열매 실’을 씁니다.","options":[{"word":"교실","sentence":"우리 반은 오늘 날씨가 좋아서 {{교실}}이 아닌 야외에서 수업을 했다.","correct":false},{"word":"침실","sentence":"{{침실}}의 빛과 소음을 줄이면 수면을 방해하는 자극이 감소하여 휴식에 도움이 됩니다.","correct":false},{"word":"실내","sentence":"{{실내}}에서 오래 생활하는 사람은 가능한 한 자주 공기를 환기하는 것이 건강에 좋다.","correct":false},{"word":"실력","sentence":"이번 임금 협상에서 노조는 결성 이후 처음으로 {{실력}}을 사용한 투쟁을 벌였다.","correct":true}]},{"target":"場","reading":"장","prompt":"場(장)이 들어가지 않은 말은?","note":"‘문장’에는 ‘글 장’을 씁니다.","options":[{"word":"운동장","sentence":"선수들은 경기에 앞서 몸을 풀기 위해 {{운동장}} 한 바퀴를 가볍게 뛰고 있었다.","correct":false},{"word":"시장","sentence":"여러 갈래의 길들이 뻗어 있는 {{시장}} 안은 길마다 같은 종류의 점포들이 빽빽이 들어차 있었다.","correct":false},{"word":"입장","sentence":"공연의 시작 시간이 다가오자 {{입장}}을 서둘러 달라는 안내 방송이 나왔다.","correct":false},{"word":"문장","sentence":"사람들은 최고의 {{문장}}으로 알려진 그에게 묘비명을 부탁하곤 했다.","correct":true}]},{"target":"所","reading":"소","prompt":"所(소)가 들어가지 않은 말은?","note":"‘소리’의 ‘소’는 한자음이 아닙니다.","options":[{"word":"장소","sentence":"우리 팀이 댄스 대회에 나가기로 했는데 춤을 연습할 {{장소}}가 없어 문제였다.","correct":false},{"word":"소속","sentence":"{{소속}} 집단은 개인에게 역할과 정체성을 부여하지만 행동의 자유를 제약하기도 합니다.","correct":false},{"word":"주소","sentence":"이 사이트의 {{주소}}는 너무 길어서 외우기가 쉽지 않다.","correct":false},{"word":"소리","sentence":"{{소리}}는 물체의 진동이 공기와 같은 매질을 따라 전달될 때 귀에서 감지됩니다.","correct":true}]},{"target":"道","reading":"도","prompt":"道(도)가 들어가지 않은 말은?","note":"‘약도’에는 ‘그림 도’를 씁니다.","options":[{"word":"도로","sentence":"{{도로}}의 폭과 연결 구조는 도시의 교통량뿐 아니라 상권과 주거지의 형성에도 영향을 줍니다.","correct":false},{"word":"철도","sentence":"한국은 {{철도}} 교통이 발달되어 있어서 전국을 쉽게 이동할 수 있다.","correct":false},{"word":"수도","sentence":"마을의 공동 우물을 사용하던 옛날과 달리 지금은 각 가정에서 {{수도}}로 물을 받아 쓴다.","correct":false},{"word":"약도","sentence":"{{약도}}는 목적지까지 필요한 길과 주요 지점만 간략하게 표시한 그림입니다.","correct":true}]},{"target":"路","reading":"로","prompt":"路(로)가 들어가지 않은 말은?","note":"‘피로’에는 ‘일할 로’를 씁니다.","options":[{"word":"도로","sentence":"{{도로}}의 폭과 연결 구조는 도시의 교통량뿐 아니라 상권과 주거지의 형성에도 영향을 줍니다.","correct":false},{"word":"철로","sentence":"기차가 달리는 {{철로}} 옆으로 예쁜 코스모스가 피어 있었다.","correct":false},{"word":"진로","sentence":"학교에서 실시하는 {{진로}} 검사를 통해 자신의 적성을 파악할 수 있다.","correct":false},{"word":"피로","sentence":"하루 종일 박물관을 걸어 다녔더니 {{피로}}가 몰려와 저녁을 먹자마자 잠들었다.","correct":true}]},{"target":"都","reading":"도","prompt":"都(도)가 들어가지 않은 말은?","note":"‘도서’에는 ‘그림 도’를 씁니다.","options":[{"word":"도시","sentence":"{{도시}}에서 살다 보니 여러 가지 시설이 많아 편리하기도 하지만 오염이 심해서 건강이 나빠졌다.","correct":false},{"word":"수도","sentence":"태조 이성계는 조선을 건국하고 한양으로 {{수도}}를 옮겼다.","correct":false},{"word":"도심","sentence":"빌딩에 둘러싸여 있는 {{도심}} 한복판에 분수가 생기자 아이들이 무척 좋아했다." :"轉","reading":"전","prompt":"轉(전)이 들어가지 않은 말은?","note":"‘전화’에는 ‘전기 전’을 씁니다.","options":[{"word":"자전거","sentence":"아이들은 서로 앞서 가려고 {{자전거}} 발판을 힘차게 돌렸다.","correct":false},{"word":"회전","sentence":"도형을 {{회전}}했을 때 위치 변화를 기록했습니다.","correct":false},{"word":"전환","sentence":"정부는 운전자보다는 보행자의 안전을 위한 방향으로 교통 정책의 {{전환}}을 시도하였다.","correct":false},{"word":"전화","sentence":"{{전화}}는 음성을 전기 신호로 바꾸어 먼 곳에 전달하고 다시 소리로 복원합니다.","correct":true}]},{"target":"車","reading":"차·거","prompt":"車(차·거)가 들어가지 않은 말은?","note":"‘차이’에는 ‘다를 차’를 씁니다.","options":[{"word":"전차","sentence":"1960년대까지만 해도 서울 중심가에서 달리는 {{전차}}를 흔히 볼 수 있었다.","correct":false},{"word":"주차장","sentence":"유료 {{주차장}}에서는 한 시간에 오천 원씩 주차 요금을 받았다.","correct":false},{"word":"자전거","sentence":"아이들은 서로 앞서 가려고 {{자전거}} 발판을 힘차게 돌렸다.","correct":false},{"word":"차이","sentence":"그들이 우리와 큰 입장 {{차이}}를 보이는 바람에 회의가 예상 외로 길어졌다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
