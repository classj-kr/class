<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>11단계 문제 풀기 | 한자</title><style>

t:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--blue);font:800 15px system-ui,sans-serif;cursor:pointer}.primary[hidden],.card[hidden],.result[hidden]{display:none}.result{margin-top:12px;padding:28px 20px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97);text-align:center}.result h1{margin:0 0 8px;font-size:25px}.result-score{margin:8px 0 20px;color:var(--blue);font:800 34px system-ui,sans-serif}.choice:focus-visible,.primary:focus-visible,.back:focus-visible{outline:3px solid #77a9cb;outline-offset:2px}@media(max-width:600px){.card{padding:15px}.choice{min-height:58px}}
</style></head><body><main class="page"><header class="topbar"><strong>11단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>11단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"像","reading":"상","prompt":"像(상)이 들어가지 않은 말은?","note":"‘상자’에는 ‘상자 상’을 씁니다.","options":[{"word":"영상","sentence":"이웃집 아주머니는 사고로 잃은 아들의 {{영상}}을 되새기며 울음을 참지 못했다.","correct":false},{"word":"동영상","sentence":"이 교육 사이트는 학생들에게 실제 강의를 듣는 것 같은 강의 {{동영상}} 자료를 제공한다.","correct":false},{"word":"상상력","sentence":"그 영화는 감독의 풍부한 {{상상력}}이 돋보이는 작품으로 평가받는다.","correct":false},{"word":"상자","sentence":"친구에게 줄 선물을 예쁜 {{상자}}에 담고 리본을 달아 정성껏 포장했다.","correct":true}]},{"target":"提","reading":"제","prompt":"提(제)가 들어가지 않은 말은?","note":"‘견제’에는 ‘절제할 제’를 씁니다.","options":[{"word":"제공","sentence":"행사장에서 식사 {{제공}}을 한다고 하니 점심을 먹지 않고 그냥 가면 돼요.","correct":false},{"word":"제안","sentence":"많은 시민들의 {{제안}}으로 시청 도서관이 일반에게 공개되었다.","correct":false},{"word":"제시","sentence":"이전에 방문한 적이 있는 환자는 의료 보험증 {{제시}} 없이 진료를 받을 수 있다.","correct":false},{"word":"견제","sentence":"네. 핵심 공격수라 상대 수비수들의 {{견제}}가 심할 것 같은데 부상을 조심했으면 좋겠군요.","correct":true}]},{"target":"以","reading":"이","prompt":"以(이)가 들어가지 않은 말은?","note":"‘이별’에는 ‘떠날 리(이)’를 씁니다.","options":[{"word":"이후","sentence":"젊었을 때 아저씨는 {{이후}}의 삶을 대비하지 않고 그저 흥청망청 살았다.","correct":false},{"word":"이상","sentence":"보통 술은 이십 세 {{이상}}에게만 판매하므로 십대들은 구입할 수 없다.","correct":false},{"word":"이래","sentence":"대한민국은 건국 {{이래}} 급격한 변화를 겪으며 성장하고 있다.","correct":false},{"word":"이별","sentence":"전학 가는 친구와 {{이별}}하는 날, 우리는 서로 편지를 주고받았다.","correct":true}]},{"target":"制","reading":"제","prompt":"制(제)가 들어가지 않은 말은?","note":"‘과제’에는 ‘제목 제’를 씁니다.","options":[{"word":"제한","sentence":"새로 개봉한 영화는 십오 세 미만의 청소년들에게 관람 {{제한}}을 두었다.","correct":false},{"word":"통제","sentence":"국가 공휴일을 맞아 행사가 열리는 시청 앞 광장은 교통이 일시적으로 {{통제}}가 되었다.","correct":false},{"word":"체제","sentence":"대학가를 중심으로 사회 {{체제}}의 변혁을 요구하는 시위가 일어났다.","correct":false},{"word":"과제","sentence":"그 대통령에게 주어진 최우선 {{과제}}는 경제 성장을 지속하는 것이다.","correct":true}]},{"target":"眞","reading":"진","prompt":"眞(진)이 들어가지 않은 말은?","note":"‘촉진제’에는 ‘나아갈 진’을 씁니다.","options":[{"word":"사진","sentence":"학생들이 모두 모이자 선생님은 하나, 둘, 셋까지 세고 {{사진}}을 찍으셨다.","correct":false},{"word":"진실","sentence":"이번 사건의 {{진실}}을 밝히기 위해 많은 전문가들이 조사에 참여했다.","correct":false},{"word":"진상","sentence":"수사 담당자는 일의 {{진상}} 규명을 위해 증거를 다시 철저하게 조사하기로 했다.","correct":false},{"word":"촉진제","sentence":"서로 간의 공통된 부분들이 우리 둘의 관계가 발전될 수 있는 {{촉진제}}로 작용한 셈이었다.","correct":true}]},{"target":"害","reading":"해","prompt":"害(해)가 들어가지 않은 말은?","note":"‘고해’에는 ‘바다 해’를 씁니다.","options":[{"word":"위해","sentence":"도둑은 한밤중에 가정집에 침범하여 주인에게 {{위해}}를 가하며 돈을 요구하였다.","correct":false},{"word":"피해","sentence":"이번 집중 호우에 제대로 대비하지 못한 농가의 {{피해}}는 심각했다.","correct":false},{"word":"피해자","sentence":"정부는 이번 재해로 인한 {{피해자}}들에게 보상금을 지불했다.","correct":false},{"word":"고해","sentence":"사람의 마음이 괴로우면 아무리 좋은 곳에서 맛있는 것을 먹어도 {{고해}}처럼 느껴질 뿐이다.","correct":true}]},{"target":"無","reading":"무","prompt":"無(무)가 들어가지 않은 말은?","note":"‘군무’에는 ‘춤출 무’를 씁니다.","options":[{"word":"무료","sentence":"이 놀이 공원은 입장은 {{무료}}이고, 시설 이용료를 각각 내야 한다.","correct":false},{"word":"무시","sentence":"회사에서는 계약 조건은 {{무시}}를 한 채 직원들에게 초과 근무를 시켰다.","correct":false},{"word":"무리","sentence":"잡곡밥이 건강에는 좋지만 꼭꼭 씹어 먹지 않으면 위에 {{무리}}가 갈 수 있다.","correct":false},{"word":"군무","  씁니다.","options":[{"word":"건물","sentence":"{{건물}} 앞 주차장에는 그 {{건물}}에서 일하는 사람들만 주차할 수 있다.","correct":false},{"word":"건설","sentence":"새로운 사회의 {{건설}}을 위해서는 국가 전반의 개혁이 필요하다.","correct":false},{"word":"건축","sentence":"지붕을 긴 밧줄로 묶는 것은 거센 바람을 견디게 하는 {{건축}} 기술이었다.","correct":false},{"word":"물수건","sentence":"오늘 주사를 맞아서 샤워를 할 수 없기 때문에 자기 전에 대강 {{물수건}}으로 몸을 닦았다.","correct":true}]},{"target":"考","reading":"고","prompt":"考(고)가 들어가지 않은 말은?","note":"‘고졸’에는 ‘높을 고’를 씁니다.","options":[{"word":"참고","sentence":"논문의 맨 뒷장에는 본문에서 언급된 {{참고}} 문헌들이 상세히 적혀 있었다.","correct":false},{"word":"고려","sentence":"취업을 준비하는 많은 대학생들은 직장을 선택할 때 {{고려}} 사항 중 하나로 연봉을 꼽는다.","correct":false},{"word":"사고","sentence":"책을 많이 읽지 않는 아이들은 책을 많이 읽는 아이들에 비해 {{사고}} 능력이 떨어진다.","correct":false},{"word":"고졸","sentence":"{{고졸}}인 그가 사장의 자리에 오른 걸 보면 학력과 능력이 항상 비례하지는 않는 것 같다.","correct":true}]},{"target":"確","reading":"확","prompt":"確(확)이 들어가지 않은 말은?","note":"‘수확’에는 ‘거둘 확’을 씁니다.","options":[{"word":"확인","sentence":"사람들은 사실 여부에 대한 {{확인}}도 없이 나에 대한 나쁜 소문을 퍼뜨렸다.","correct":false},{"word":"정확","sentence":"최 기자는 사실 그대로의 기사를 쓰려고 {{정확}}을 기하였다.","correct":false},{"word":"확보","sentence":"사건 현장에 도착한 경찰은 일반인의 출입을 통제하고 증거물 {{확보}}에 나섰다.","correct":false},{"word":"수확","sentence":"{{수확}}의 계절인 가을이 되면 농가마다 누렇게 익은 곡식을 거두느라 바쁘게 움직였다.","correct":true}]},{"target":"檢","reading":"검","prompt":"檢(검)이 들어가지 않은 말은?","note":"‘대검’에는 ‘칼 검’을 씁니다.","options":[{"word":"검사","sentence":"뒷산 약수터의 물은 수질 {{검사}} 결과 매우 깨끗한 것으로 드러났다.","correct":false},{"word":"검색","sentence":"컴퓨터를 이용하면 훨씬 쉽고 빠르게 자료 {{검색}}을 할 수 있다.","correct":false},{"word":"검찰","sentence":"변호사는 재판에서 {{검찰}} 측 주장을 조목조목 반박했다.","correct":false},{"word":"대검","sentence":"전쟁 기념관에는 옛날에 군인들이 총 끝에 달아 사용했던 날카로운 {{대검}}이 전시되어 있었다.","correct":true}]},{"target":"職","reading":"직","prompt":"職(직)이 들어가지 않은 말은?","note":"‘직관’에는 ‘곧을 직’을 씁니다.","options":[{"word":"직원","sentence":"근무 시간은 늘어났지만 월급이 오르지 않아 {{직원}}들의 불만이 점점 더 커졌다.","correct":false},{"word":"직업","sentence":"우리 삼촌은 서른 살이 넘었는데도 {{직업}}도 없이 집에서 놀고먹는다.","correct":false},{"word":"직무","sentence":"일처리를 잘해서 {{직무}}에 탁월하다는 평가를 받고 있습니다.","correct":false},{"word":"직관","sentence":"이 글에 대한 근거 자료가 부족하여 최 교수는 {{직관}}에 의해 판단을 내릴 수밖에 없었다.","correct":true}]},{"target":"識","reading":"식","prompt":"識(식)이 들어가지 않은 말은?","note":"‘공식’에는 ‘법 식’을 씁니다.","options":[{"word":"인식","sentence":"새로운 유행을 만들기 위해서는 기존의 사고방식에서 벗어난 독특한 {{인식}}이 필요하다.","correct":false},{"word":"지식","sentence":"그 박사님은 {{지식}}의 수준이 높기 때문에 어려운 질문에도 대답할 수 있다.","correct":false},{"word":"의식","sentence":"외국인들이 월드컵 때의 거리 응원을 보고 우리나라 사람은 공동체 {{의식}}이 높다고 말한다.","correct":false},{"word":"공식","sentence":"삼각형의 넓이를 구하는 {{공식}}을 그림과 식으로 설명했습니다.","correct":true}]},{"target":"論","reading":"론","prompt":"論(론)이 들어가지 않은 말은?","note":"‘나일론’는 외래어이므로 한자를 쓰지 않습니다.","options":[{"word":"물론","sentence":"자료의 양은 {{물론}}이고 출처가 믿을 만한지도 함께 확인해야 합니다.","correct":false},{"word":"언론","sentence":"신문, 방송 등 {{언론}}의 영향력을 두려워한 나머지, 정부는 {{언론}}의 각종 비리를 눈감아 주었다.","correct":false},{"word":"이론","sentence":"{{이론}}만 앞세우고 행동에 옮기지 않는 사람의 말은 영향력이 없다.","correct":false},{"word":"나일론","sentence":"신축성이 뛰어난 {{나일론}} 스타킹은 처음 나오자마자 폭발적인 인기를 끌었다.","correct":true}]},{"target":"處","reading":"처","prompt":"處(처)가 들어가지 않은 말은?","note":"‘처가’에는 ‘아내 처’를 씁니다.","options":[{"word":"처리","sentence":"과학자는 새로운 폐수 {{처리}} 시설을 이용해 오염된 물을 깨끗하게 만들었다.","correct":false},{"word":"상처","sentence":"어린 시절에 선생님으로부터 당했던 체벌은 아직까지도 지울 수 없는 {{상처}}로 남아 있다.","correct":false},{"word":"출처","sentence":"근무 시간 중 외출할 경우에는 회사에 자신의 {{출처}}를 알려야 한다.","correct":false},{"word":"처가","sentence":"삼촌은 설날에 숙모와 함께 {{처가}}에 가서 장인어른께 세배를 드렸다.","correct":true}]},{"target":"演","reading":"연","prompt":"演(연)이 들어가지 않은 말은?","note":"‘연필’에는 ‘납 연’을 씁니다.","options":[{"word":"공연","sentence":"무용수들은 해외 {{공연}} 준비를 앞두고 늦은 시간까지 열심히 연습했다.","correct":false},{"word":"연주","sentence":"오늘 음악회의 피아노 {{연주}}는 정말 최고였어요.","correct":false},{"word":"연출","sentence":"이번 경기에서 이변의 {{연출}}에 성공한 것은 우리 선수들의 무수한 연습이 있었기 때문이다.","correct":false},{"word":"연필","sentence":"시험 전날 밤 {{연필}}을 뾰족하게 깎아 필통에 넣어 두었다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
