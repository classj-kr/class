t:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--blue);font:800 15px system-ui,sans-serif;cursor:pointer}.primary[hidden],.card[hidden],.result[hidden]{display:none}.result{margin-top:12px;padding:28px 20px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97);text-align:center}.result h1{margin:0 0 8px;font-size:25px}.result-score{margin:8px 0 20px;color:var(--blue);font:800 34px system-ui,sans-serif}.choice:focus-visible,.primary:focus-visible,.back:focus-visible{outline:3px solid #77a9cb;outline-offset:2px}@media(max-width:600px){.card{padding:15px}.choice{min-height:58px}}
</style></head><body><main class="page"><header class="topbar"><strong>13단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>13단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"種","reading":"종","prompt":"種(종)이 들어가지 않은 말은?","note":"‘종래’에는 ‘좇을 종’을 씁니다.","options":[{"word":"종류","sentence":"식당에서는 대여섯 {{종류}}의 음료를 각 테이블 위에 준비해 두었다.","correct":false},{"word":"각종","sentence":"명절을 맞아 시장에는 사과, 배와 같은 {{각종}} 과일들이 잔뜩 나와 있다.","correct":false},{"word":"일종","sentence":"비록 회사가 지금은 {{일종}}의 경제 위기를 겪고 있지만 내년에는 좋아지리라고 예측된다.","correct":false},{"word":"종래","sentence":"{{종래}} 집안일은 많은 수고가 필요했지만 여러 가전제품의 발달로 최근에는 한결 수월해졌다.","correct":true}]},{"target":"週","reading":"주","prompt":"週(주)가 들어가지 않은 말은?","note":"‘숙주’에는 ‘임금 주’를 씁니다.","options":[{"word":"주말","sentence":"우리 회사는 {{주말}}에 쉬고 월요일부터 일을 하기로 했다.","correct":false},{"word":"주기","sentence":"지난 이십여 년간 약 오 년을 {{주기}}로 주택 가격의 상승과 하락이 반복되고 있다.","correct":false},{"word":"주일","sentence":"사장은 휴일도 없이 {{주일}} 내내 일한 직원들에게 휴가를 주었다.","correct":false},{"word":"숙주","sentence":"스스로는 살 수 없는 생물들은 주변의 생물을 {{숙주}}로 삼아 기생하며 영양분을 공급받는다.","correct":true}]},{"target":"標","reading":"표","prompt":"標(표)가 들어가지 않은 말은?","note":"‘표현’에는 ‘겉 표’를 씁니다.","options":[{"word":"목표","sentence":"자, 오늘도 최고 매출 달성을 {{목표}}로 열심히 일해 봅시다.","correct":false},{"word":"표준","sentence":"의사는 의학이 정한 {{표준}}에 의해 병을 진단했다.","correct":false},{"word":"표지","sentence":"남자는 담배를 꺼내다 금연 {{표지}}를 보고 다시 넣었다.","correct":false},{"word":"표현","sentence":"그림은 말로 하기 어려운 마음을 {{표현}}하는 좋은 방법이다.","correct":true}]},{"target":"存","reading":"존","prompt":"存(존)이 들어가지 않은 말은?","note":"‘존중’에는 ‘높을 존’을 씁니다.","options":[{"word":"존재","sentence":"정말 양궁에서만큼은 우리나라 선수들이 독보적인 {{존재}}네요.","correct":false},{"word":"기존","sentence":"새로 인상된 가격은 내년부터 적용되며 그 이전까지는 {{기존}}의 제품 가격이 유지된다.","correct":false},{"word":"보존","sentence":"이 건물은 백 년이 지난 지금까지도 잘 {{보존}}이 되어 있어 마치 지은 지 얼마 안 된 건물 같다.","correct":false},{"word":"존중","sentence":"선생님은 학생의 결정에 대해 {{존중}}을 하기 때문에 학교를 그만두는 것을 허락했다.","correct":true}]},{"target":"追","reading":"추","prompt":"追(추)가 들어가지 않은 말은?","note":"‘추진’에는 ‘밀 추’를 씁니다.","options":[{"word":"추가","sentence":"이 대학은 지난주의 합격자 발표에 이어, 2주 뒤에 {{추가}} 합격자 발표가 있을 예정이다.","correct":false},{"word":"추억","sentence":"사진첩 속에는 내 어린 시절의 {{추억}}들이 담겨 있었다.","correct":false},{"word":"추적","sentence":"요즘 위치 {{추적}} 기능이 있는 전화기가 시중에 유통되면서 사생활 침해 논란이 일고 있다.","correct":false},{"word":"추진","sentence":"이 책은 로켓이 발사될 때의 {{추진}} 원리에 대해 상세히 설명하고 있다.","correct":true}]},{"target":"節","reading":"절","prompt":"節(절)이 들어가지 않은 말은?","note":"‘굴절’에는 ‘꺾을 절’을 씁니다.","options":[{"word":"시절","sentence":"어려웠던 {{시절}}에는 책을 살 돈이 없어 필요한 부분만 베껴 쓰는 사람이 많았다.","correct":false},{"word":"절차","sentence":"입학 {{절차}}에 따라 서류 전형 후에 면접이 있을 예정이다.","correct":false},{"word":"조절","sentence":"직장인은 과도한 업무와 잦은 회식으로 인하여 생기는 스트레스의 {{조절}} 능력이 필요하다.","correct":false},{"word":"굴절","sentence":"빛의 {{굴절}}에 의해 물속에 놓아둔 동전이 실제 위치보다 조금 위쪽에 있는 것처럼 보인다.","correct":true}]},{"target":"終","reading":"종","prompt":"終(종)이 들어가지 않은 말은?","note":"‘기종’에는 ‘씨 종’을 씁니다.","options":[{"word":"최종","sentence":"선생님은 학생들의 의견을 고려하여 {{최종}} 결정은 다음 주에 내리겠다고 하시며 결정을 다음 주로 미루셨다.","correct":false},{"word":"종료","sentence":"경기 {{종료}} 오 분을 남기고 역전 골을 넣어서 우리 팀이 경기에서 이겼다.","correct":false},{"word":"종말","sentence":"많은 예언가들이 세계의 {{종말}}에 대해 예언했지만 그들의 예언은 아직 이루어진 바가 없다.","correc 구직자도 늘어났다.","correct":false},{"word":"노동자","sentence":"사내의 몸에는 공사판 {{노동자}}로 일하며 단련된 근육이 자리 잡혀 있었다.","correct":false},{"word":"위로","sentence":"갑자기 상을 당하셔서 뭐라고 {{위로}}의 말씀을 드려야 할지 모르겠습니다.","correct":false},{"word":"장로","sentence":"오랜 세월 경험을 통해 우러나오는 {{장로}}의 발언은 그 어느 누구의 말보다 권위가 있었다.","correct":true}]},{"target":"調","reading":"조","prompt":"調(조)가 들어가지 않은 말은?","note":"‘조상’에는 ‘할아비 조’를 씁니다.","options":[{"word":"조사","sentence":"하천 {{조사}}는 물의 산성도와 탁도뿐 아니라 주변에 사는 생물도 함께 살핍니다.","correct":false},{"word":"조절","sentence":"직장인은 과도한 업무와 잦은 회식으로 인하여 생기는 스트레스의 {{조절}} 능력이 필요하다.","correct":false},{"word":"조정","sentence":"{{조정}} 기간 동안 법원은 당사자들에게 조금씩 양보할 것을 요구했다.","correct":false},{"word":"조상","sentence":"추석 아침에는 온 가족이 모여 {{조상}}께 차례를 지내고 성묘를 간다.","correct":true}]},{"target":"請","reading":"청","prompt":"請(청)이 들어가지 않은 말은?","note":"‘청소’에는 ‘맑을 청’을 씁니다.","options":[{"word":"신청","sentence":"수강 {{신청}} 기간이 얼마 남지 않아서 어떤 수업을 들을지 고민이 된다.","correct":false},{"word":"요청","sentence":"인터넷 게시판에서 특정인의 명예를 훼손한 글들에 대해 삭제 {{요청}}이 들어왔다.","correct":false},{"word":"초청","sentence":"학교 축제는 {{초청}} 가수의 공연으로 금방 분위기가 좋아졌다.","correct":false},{"word":"청소","sentence":"매일 아침 {{청소}}를 하시는 아줌마가 사무실의 쓰레기통도 비워 주시고 책상도 닦아 주신다.","correct":true}]},{"target":"原","reading":"원","prompt":"原(원)이 들어가지 않은 말은?","note":"‘신원’에는 ‘으뜸 원’을 씁니다.","options":[{"word":"원인","sentence":"아이들의 식중독 {{원인}}은 급식에 나온 상한 생선 때문인 것으로 밝혀졌다.","correct":false},{"word":"원칙","sentence":"우리 회사는 문제를 해결할 때 직원들의 의견을 반영하기 위해 다수결의 {{원칙}}에 따른다.","correct":false},{"word":"원작","sentence":"지난달에 개봉한 영화가 크게 인기를 끌면서 영화의 {{원작}} 소설도 함께 인기를 끌고 있다.","correct":false},{"word":"신원","sentence":"여기는 국가 기밀을 다루고 있는 곳이라 {{신원}}이 확실하지 않은 사람은 출입이 어렵습니다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
