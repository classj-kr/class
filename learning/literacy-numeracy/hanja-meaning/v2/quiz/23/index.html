정했다.","correct":false},{"word":"편찬자","sentence":"이 책의 {{편찬자}}는 여러 해에 걸쳐 자료를 모았다.","correct":false},{"word":"찬성","sentence":"법이 통과되기 위해서는 과반수 이상의 {{찬성}}이 있어야 한다.","correct":true}]},{"target":"絡","reading":"락","prompt":"絡(락)이 들어가지 않은 말은?","note":"‘하락’에는 ‘떨어질 낙’을 씁니다.","options":[{"word":"맥락","sentence":"경찰은 일전에 일어난 강도 사건과 이번 강도 사건의 범행 수법이 같은 점으로 미루어 두 사건을 같은 {{맥락}}에서 보고 있다.","correct":false},{"word":"경락","sentence":"{{경락}} 마사지는 막힌 혈을 뚫어 혈액 순환이 원활하게 되도록 돕는 효과가 있다.","correct":false},{"word":"연락처","sentence":"{{연락처}}를 알려 드릴 테니 필요하실 때 연락 주세요.","correct":false},{"word":"하락","sentence":"매출 {{하락}}으로 회사는 큰 타격을 입었다.","correct":true}]},{"target":"憶","reading":"억","prompt":"憶(억)이 들어가지 않은 말은?","note":"‘억압’에는 ‘누를 억’을 씁니다.","options":[{"word":"기억","sentence":"옛 사진을 보니 어릴 때의 즐거웠던 {{기억}}이 떠오른다.","correct":false},{"word":"추억","sentence":"사진첩 속에는 내 어린 시절의 {{추억}}들이 담겨 있었다.","correct":false},{"word":"기억력","sentence":"잠을 충분히 자야 {{기억력}}이 좋아진다.","correct":false},{"word":"억압","sentence":"여성들은 가부장제 사회에서 살면서 겪는 {{억압}}과 불평등에서 해방되고자 하였다.","correct":true}]},{"target":"己","reading":"기","prompt":"己(기)가 들어가지 않은 말은?","note":"‘기후’에는 ‘기운 기’를 씁니다.","options":[{"word":"자기","sentence":"딸은 전화를 받으러 {{자기}} 방으로 들어가 버렸다.","correct":false},{"word":"극기","sentence":"옛날 선비들은 인내와 {{극기}}를 미덕으로 삼고 살았다.","correct":false},{"word":"이기심","sentence":"우리 반 아이들은 {{이기심}}만 내세우며 화장실 청소를 서로에게 떠넘겼다.","correct":false},{"word":"기후","sentence":"올해는 {{기후}} 상황이 좋지 않아서 흉년이 들었다.","correct":true}]},{"target":"禦","reading":"어","prompt":"禦(어)가 들어가지 않은 말은?","note":"‘언어’에는 ‘말씀 어’를 씁니다.","options":[{"word":"방어","sentence":"성준이는 골목길에서 불량배들이 시비를 걸자 슬며시 {{방어}} 자세를 취했다.","correct":false},{"word":"방어선","sentence":"우리 군은 이 지역을 최후의 {{방어선}}으로 삼고 필사적으로 싸웠다.","correct":false},{"word":"방어벽","sentence":"도성을 둘러싼 {{방어벽}}이 적에 의해 무너지자 왕실과 관료들은 혼란에 빠졌다.","correct":false},{"word":"언어","sentence":"학자들에 따르면 두 살부터 사춘기까지가 인간 {{언어}} 발달의 결정적 시기라고 한다.","correct":true}]},{"target":"克","reading":"극","prompt":"克(극)이 들어가지 않은 말은?","note":"‘북극성’에는 ‘끝 극’을 씁니다.","options":[{"word":"극복","sentence":"경기 불황의 {{극복}}을 위해 정부와 국민 모두 노력하고 있다.","correct":false},{"word":"극기","sentence":"옛날 선비들은 인내와 {{극기}}를 미덕으로 삼고 살았다.","correct":false},{"word":"북극성","sentence":"선원들이 {{북극성}}을 길잡이로 삼아 항해를 했다.","correct":true}]},{"target":"了","reading":"료","prompt":"了(료)가 들어가지 않은 말은?","note":"‘자료’에는 ‘헤아릴 료’를 씁니다.","options":[{"word":"완료","sentence":"전지의 충전이 다 되자 충전의 {{완료}}를 알리는 소리가 났다.","correct":false},{"word":"종료","sentence":"시합의 {{종료}}를 알리는 심판의 호루라기 소리가 들려왔다.","correct":false},{"word":"만료","sentence":"회사는 근로 계약 기간 {{만료}}로 별도의 해고 조치 없이 고용 관계가 종료되었음을 나에게 통보했다.","correct":false},{"word":"자료","sentence":"노트북에 물이 들어가면서 저장된 모든 {{자료}}가 지워졌다.","correct":true}]},{"target":"肥","reading":"비","prompt":"肥(비)가 들어가지 않은 말은?","note":"‘비교’에는 ‘견줄 비’를 씁니다.","options":[{"word":"비료","sentence":"작물에 따라서 알맞은 {{비료}}의 성분과 {{비료}}를 주는 시기가 다르다.","correct":false},{"word":"비만","sentence":"{{비만}}은 모든 병의 원인이 될 수 있다.","correct":false},{"word":"퇴비","sentence":"오늘은 밭의 곳곳에 {{퇴비}}를 뿌렸다.","correct":false},{"word":"비교","sentence":"자신을 잘 알기 위해서는 우선 남과 {{비교}}를 해 보는 것이 필요하다.","correct":true}]},{"target":"弛","reading":"이","prompt":"弛(이)가 들어가지 않은 말은?","note":"‘이후’에는 ‘써 이’를 씁니다.","options":[{"word":"이완","sentence":"조용한 클래식 음악은 긴장된 마음의 {{이완}}에 좋다.","correct":false},{"word":"해이","sentence":"골키퍼는 순간적인 집중력의 {{해이}}로 인해 상대편에게 골을 허용하고 말았다.","correct":false},{"word":"이후","sentence":"젊었을 때 아저씨는 {{이후}}의 삶을 대비하지 않고 그저 흥청망청 살았다.","correct":true}]},{"target":"礎","reading":"초","prompt":"礎(초)가 들어가지 않은 말은?","note":"‘초기’에는 ‘처음 초’를 씁니다.","options":[{"word":"기초","sentence":"그 학생은 공부의 {{기초}}가 없어서 아무리 비싼 과외를 해도 성적이 오르지 않았다.","correct":false},{"word":"초석","sentence":"새로 지은 건물은 크고 단단한 바위로 {{초석}}을 깔아 튼튼하다.","correct":false},{"word":"기초적","sentence":"{{기초적}}인 어휘 능력이 부족하면 전문 서적을 읽기 어렵다.","correct":false},{"word":"초기","sentence":"입사 {{초기}}에는 회사에 적응하느라 바쁘다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
