rd":"조인","sentence":"두 나라는 무역에 관한 구두 협정을 끝내고는 {{조인}}을 기다리는 중이다.","correct":false},{"word":"인상적","sentence":"기차에서 바라본 창밖의 경치는 눈을 뗄 수 없을 정도로 {{인상적}}이었다.","correct":false},{"word":"인구","sentence":"지나치게 많은 {{인구}}의 이동은 도시에 큰 문제를 만들고 있다.","correct":true}]},{"target":"麗","reading":"려·여","prompt":"麗(려·여)가 들어가지 않은 말은?","note":"‘참여’에는 ‘더불 여’를 씁니다.","options":[{"word":"고려자기","sentence":"고려 시대에 세워진 절 근처에서 {{고려자기}}가 다량으로 발굴되었다.","correct":false},{"word":"고려청자","sentence":"{{고려청자}}는 역사적 가치가 높다 보니까 모조품이 많다.","correct":false},{"word":"미사여구","sentence":"이번에 나온 그 영화는 쓸데없는 {{미사여구}}를 모두 없애고 기본기에 충실한 작품이라는 평을 들었다.","correct":false},{"word":"참여","sentence":"선생님은 학생들에게 학교 행사 {{참여}}를 부탁했다.","correct":true}]},{"target":"羅","reading":"라·나","prompt":"羅(라·나)가 들어가지 않은 말은?","note":"‘나선’에는 ‘소라 라’를 씁니다.","options":[{"word":"나열","sentence":"그의 글은 의미 없는 내용들의 {{나열}}이어서 읽어 볼 가치도 없는 글이다.","correct":false},{"word":"총망라","sentence":"프로, 대학 축구팀을 {{총망라}}를 하는 최고 권위의 축구 대회가 열린다.","correct":false},{"word":"나침반","sentence":"지도와 {{나침반}}이 있으면 험한 산속에서도 길을 찾을 수 있다.","correct":false},{"word":"나선","sentence":"종이에 지문을 찍어 보니 선명한 {{나선}} 모양이 나타났다.","correct":true}]},{"target":"紀","reading":"기","prompt":"紀(기)가 들어가지 않은 말은?","note":"‘기후’에는 ‘기운 기’를 씁니다.","options":[{"word":"세기","sentence":"1900년대는 한국에 역사적인 사건들이 많은 {{세기}}였다.","correct":false},{"word":"기원","sentence":"그 장군은 나라를 강대국으로 만드는 데 새로운 {{기원}}을 이룩한 위인이었다.","correct":false},{"word":"기념관","sentence":"그 시인을 위해 지은 {{기념관}}에 가면 시인이 생전에 썼던 모든 작품들을 읽어 볼 수 있다.","correct":false},{"word":"기후","sentence":"올해는 {{기후}} 상황이 좋지 않아서 흉년이 들었다.","correct":true}]},{"target":"帝","reading":"제","prompt":"帝(제)가 들어가지 않은 말은?","note":"‘경제’에는 ‘건널 제’를 씁니다.","options":[{"word":"제국","sentence":"그 {{제국}}의 영향력이 주변 나라에까지 미칠 정도로 황제의 권력이 막강했다.","correct":false},{"word":"황제","sentence":"{{황제}}는 왕과 제후들을 거느리고 사냥을 나갔다.","correct":false},{"word":"제왕","sentence":"주변 국가들을 모두 점령한 왕은 {{제왕}}으로 군림했다.","correct":false},{"word":"경제","sentence":"우리나라는 {{경제}} 개발 정책을 통해 눈부신 {{경제}} 성장을 이룰 수 있었다.","correct":true}]},{"target 아서 항상 교통이 혼잡하다.","correct":false},{"word":"고령화","sentence":"{{고령화}}가 진행되면서 노년층의 취업률이 높아지고 있다.","correct":true}]},{"target":"詩","reading":"시","prompt":"詩(시)가 들어가지 않은 말은?","note":"‘시청’에는 ‘저자 시’를 씁니다.","options":[{"word":"시화","sentence":"{{시화}}에 뛰어난 재주꾼이 나를 위한 작품을 만들어 주었다.","correct":false},{"word":"시상","sentence":"그의 시에는 독립에 대한 열망의 {{시상}}이 반영되어 있다.","correct":false},{"word":"명시","sentence":"이 시인의 묘비에는 그가 생전에 남긴 {{명시}}가 새겨져 있다.","correct":false},{"word":"시청","sentence":"새해 첫날 아침 {{시청}} 앞 광장에서 해맞이 행사가 열렸다.","correct":true}]},{"target":"令","reading":"령·영","prompt":"令(령·영)이 들어가지 않은 말은?","note":"‘영웅’에는 ‘꽃부리 영’을 씁니다.","options":[{"word":"명령","sentence":"외근 중인 직원들에게 팀장은 빨리 사무실로 돌아오라고 {{명령}}을 했다.","correct":false},{"word":"법령","sentence":"그 국회 의원은 요즘 교육 현실에 맞는 교육 {{법령}} 개정안을 국회에 제출하였다.","correct":false},{"word":"총사령관","sentence":"우리 군은 {{총사령관}}의 지휘 아래 적군을 공격했다.","correct":false},{"word":"영웅","sentence":"불길 속에서 아이를 구한 소방관은 마을의 {{영웅}}이 되었다.","correct":true}]},{"target":"司","reading":"사","prompt":"司(사)가 들어가지 않은 말은?","note":"‘행사’에는 ‘일 사’를 씁니다.","options":[{"word":"총사령관","sentence":"우리 군은 {{총사령관}}의 지휘 아래 적군을 공격했다.","correct":false},{"word":"사법부","sentence":"시청 앞에서 벌어진 폭력적인 시위에 대해 {{사법부}}는 불법 집회라는 판결을 내렸다.","correct":false},{"word":"사서","sentence":"{{사서}}들은 도서 반납이 연체된 사람들에게 반납을 재촉하는 이메일을 보냈다.","correct":false},{"word":"행사","sentence":"학생들이 솜씨를 뽐내는 교내 {{행사}}에 학부모들도 초대되었다.","correct":true}]},{"target":"徵","reading":"징","prompt":"徵(징)이 들어가지 않은 말은?","note":"‘응징’에는 ‘징계할 징’을 씁니다.","options":[{"word":"특징","sentence":"매콤한 맛이 {{특징}}인 식당은 인기가 높았다.","correct":false},{"word":"징용","sentence":"갑자기 적군이 쳐들어오자 나라에서는 군대를 만들기 위해 {{징용}}을 결정하였다.","correct":false},{"word":"상징적","sentence":"고인돌은 선사시대의 {{상징적}}인 유물이다.","correct":false},{"word":"응징","sentence":"소년은 자라서 자신을 따돌렸던 아이들에게 {{응징}}을 가했다.","correct":true}]},{"target":"探","reading":"탐","prompt":"探(탐)이 들어가지 않은 말은?","note":"‘탐관’에는 ‘탐낼 탐’을 씁니다.","options":[{"word":"탐색","sentence":"과학 기술의 발전으로 우주 {{탐색}}이 정교하게 가능해지고 있다.","correct":false},{"word":"탐사","sentence":"전문가들은 새롭게 발견된 동굴 {{탐사}}에 나섰다.","correct":false},{"word":"탐구","sentence":"이 책은 인간의 진리 {{탐구}}에 대한 내용을 담고 있어 이해하기 어려웠다.","correct":false},{"word":"탐관","sentence":"탐욕스러운 {{탐관}}의 부임으로 백성들의 생활은 더욱 궁핍해졌다.","correct":true}]},{"target":"列","reading":"열·렬","prompt":"列(열·렬)이 들어가지 않은 말은?","note":"‘가열’에는 ‘더울 열’을 씁니다.","options":[{"word":"계열","sentence":"국문학이나 영문학 등은 인문 {{계열}}에 속한다.","correct":false},{"word":"열강","sentence":"힘이 약한 나라는 {{열강}}의 침략을 많이 받았다.","correct":false},{"word":"나열","sentence":"그의 글은 의미 없는 내용들의 {{나열}}이어서 읽어 볼 가치도 없는 글이다.","correct":false},{"word":"가열","sentence":"이 우유는 저온에서 {{가열}} 살균한 것으로 안심하고 드실 수 있습니다.","correct":true}]},{"target":"到","reading":"도","prompt":"到(도)가 들어가지 않은 말은?","note":"‘온도’에는 ‘법도 도’를 씁니다.","options":[{"word":"도달","sentence":"선생님은 학생들에게 {{도달}} 가능한 목표를 세우는 것이 중요하다고 말했다.","correct":false},{"word":"도착","sentence":"오후 네 시쯤 {{도착}} 예정인 비행기는 한 편밖에 없었다.","correct":false},{"word":"도래","sentence":"정보화 사회의 {{도래}}로 지식과 정보력을 갖춘 인재들이 각광받고 있다.","correct":false},{"word":"온도","sentence":"건물 안과 밖의 {{온도}} 차이가 너무 크면 건강에 좋지 않다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
