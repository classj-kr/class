<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>9단계 문제 풀기 | 한자</title><style>
:root{--card:#fffdf8;--ink:#202630;--muted:#68717a;--line:#d8d4ca;--blue:#245f8d;--soft:#eaf2f7;--good:#226847;--bad:#a43d36}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:#ded8ca url("../../../assets/hanja-background.webp") center/cover fixed no-repeat;font-family:"Noto Serif KR","Batang",serif}body:before{content:"";position:fixed;inset:0;background:rgba(247,245,239,.84);pointer-events:none}.page{position:relative;width:min(860px,100%);min-height:100svh;margin:auto;padding:8px clamp(16px,4vw,34px) 30px}.topbar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar strong{font-size:18px}.back{min-height:44px;display:inline-flex;align-items:center;color:var(--blue);font:800 14px system-ui,sans-serif;text-decoration:none}.status{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 8px;color:var(--muted);font:800 14px system-ui,sans-serif}.progress-track{height:7px;overflow:hidden;border-radius:999px;background:#dfe5e8}.progress-bar{display:block;width:0;height:100%;background:var(--blue);transition:width .2s}.card{margin-top:12px;padding:clamp(16px,3vw,24px);border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97)}.question-number{margin:0 0 8px;color:var(--muted);font:800 13px system-ui,sans-serif}.prompt{margin:0 0 16px;font-size:clamp(20px,3vw,25px);line-height:1.45}.choices{display:grid;gap:8px}.choice{min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;line-height:1.55;text-align:left;cursor:pointer}.choice:hover{background:var(--soft)}.choice:disabled{cursor:default}.choice.correct{color:var(--good);border-color:var(--good);background:#eaf5ee}.choice.wrong{color:var(--bad);border-color:var(--bad);background:#fbeceb}.feedback{min-height:48px;margin:12px 0 0;line-height:1.55}.actions{display:flex;justify-content:flex-end;margin-top:10px}.primary{min-height:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--blue);font:800 15px system-ui,sans-serif;cursor:pointer}.primary[hidden],.card[hidden],.result[hidden]{display:none}.result{margin-top:12px;padding:28px 20px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97);text-align:center}.result h1{margin:0 0 8px;font-size:25px}.result-score{margin:8px 0 20px;color:var(--blue);font:800 34px system-ui,sans-serif}.choice:focus-visible,.primary:focus-visible,.back:focus-visible{outline:3px solid #77a9cb;outline-offset:2px}@media(max-width:600px){.card{padding:15px}.choice{min-height:58px}}
</style></head><body><main class="page"><header class="topbar"><strong>9단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>9단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"晝","reading":"주","prompt":"晝(주)가 들어가지 않은 말은?","note":"‘주말’에는 ‘주일 주’를 씁니다.","options":[{"word":"주간","sentence":"그들은 평일과 주말을 가리지 않고 {{주간}}에는 늘 일을 했다.","correct":false},{"word":"주야","sentence":"한겨울이 되자 {{주야}}를 가리지 않고 매서운 추위가 계속됐다.","correct":false},{"word":"백주","sentence":"{{백주}} 대낮에도 거리낌 없이 도둑질을 하고 다니는 강도가 잡히지 않자 동네 사람들은 계속 불안에 떨었다.","correct":false},{"word":"주말","sentence":"{{주말}}이 되면 우리 가족은 도시락을 싸서 함께 뒷산에 오른다.","correct":true}]},{"target":"注","reading":"주","prompt":"注(주)가 들어가지 않은 말은?","note":"‘주장’에는 ‘임금 주’를 씁니다.","options":[{"word":"주의","sentence":"공부를 잘하려면 수업 시간에 {{주의}}를 기울여서 선생님의 말씀을 들어야 한다.","correct":false},{"word":"주목","sentence":"최 교사는 자신만의 독특한 교육 방법을 소개해 학부모들의 {{주목}}을 끌었다.","correct":false},{"word":"주입","sentence":"학생들에게 수업 내용을 {{주입}}만 하려고 하지 말고 학생들의 흥미를 유도할 수 있는 방법을 찾아 봐요.","correct":false},{"word":"주장","sentence":"그 토론자는 여러 가지 근거를 들어서 자신의 {{주장}}이 맞음을 증명하였다.","correct":true}]},{"target":"重","reading":"중","prompt":"重(중)이 들어가지 않은 말은?","note":"‘중국’에는 ‘가운데 중’을 씁니다.","options":[{"word":"중요","sentence":"시간이 얼마 없으니까 {{중요}} 개념 위주로 복습하는 게 좋겠다.","correct":false},{"word":"존중","sentence":"선생님은 학생의 결정에 대해 {{존중}}을 하기 때문에 학교를 그만두는 것을 허락했다.","correct":false},{"word":"신중","sentence":"인터넷의 정보를 공유하기 전에는 출처와 사실 여부를 {{신중}}하게 확인해야 합니다.","correct":false},{"word":"중국","sentence":"{{중국}}의 황허강과 창장강 유역에서는 오래전부터 문명이 발달했습니다.","correct":true}]},{"target":"紙","reading":"지","prompt":"紙(지)가 들어가지 않은 말은?","note":"‘지금’에는 ‘다만 지’를 씁니다.","options":[{"word":"편지","sentence":"멀리 이사한 친구에게 새 학교 생활을 소개하는 {{편지}}를 썼습니다.","correct":false},{"word":"한지","sentence":"내 외국인 친구는 전통 {{한지}}의 아름다운 색과 무늬에 감탄했다.","correct":false},{"word":"폐지","sentence":"사용한 종이를 {{폐지}}로 분리해 배출하면 다시 종이 원료로 활용할 수 있습니다.","correct":false},{"word":"지금","sentence":"이 일은 {{지금}} 한창 진행 중이기 때문에 결과를 예상할 수 없다.","correct":true}]},{"target":"直","reading":"직","prompt":"直(직)이 들어가지 않은 말은?","note":"‘조직’에는 ‘짤 직’을 씁니다.","options":[{"word":"직접","sentence":"형제를 잃은 아픔은 {{직접}} 겪어 보지 않고는 알기 어렵다.","correct":false},{"word":"직전","sentence":"육상 경기에서 출발 {{직전}}에 있는 선수가 호흡을 가다듬고 있다.","correct":false},{"word":"솔직","sentence":"잘못을 숨기지 않고 {{솔직}}하게 말한 뒤 해결 방법을 함께 찾았습니다.","correct":false},{"word":"조직","sentence":"정확한 병명을 알기 위해서는 {{조직}} 검사를 해야 될 것 같습니다.","correct":true}]},{"target":"集","reading":"집","prompt":"集(집)이 들어가지 않은 말은?","note":"‘고집’에는 ‘잡을 집’을 씁니다.","options":[{"word":"집중","sentence":"대부분의 문화 시설이 서울로 {{집중}}이 돼 있어서 지방에 있는 사람들은 문화 혜택을 누리기가 어렵다.","correct":false},{"word":"집단","sentence":"그들은 적은 수의 사람이 모인 소수 {{집단}}이지만 가장 큰 영향력을 가졌다.","correct":false},{"word":"모집","sentence":"과학 동아리는 새로운 연구 활동에 참여할 학생을 {{모집}}했습니다.","correct":false},{"word":"고집","sentence":"동생은 {{고집}}이 무척 세서 한번 정한 일은 누가 말려도 좀처럼 바꾸지 않는다.","correct":true}]},{"target":"窓","reading":"창","prompt":"窓(창)이 들어가지 않은 말은?","note":"‘창조’에는 ‘비롯할 창’을 씁니다.","options":[{"word":"창문","sentence":"{{창문}}을 열자 방 안으로 밝은 햇빛과 시원한 바람이 쏟아져 들어왔다.","correct":false},{"word":"학창","sentence":"{{학창}}을 떠나 이제는 부모가 된 친구를 보니 세월이 빠른 것 같다.","correct":false},{"word":"동창","sentence":"가끔 초등학교 {{동창}}들에게 연락이 오면 얼마나 반가운지 모른다.","correct":false},{"word":"창조","sentence":"게임 속 공간을 만 "아기가 갑자기 열이 나거나 급한 {{상황}}이 생기면 나한테 전화하세요.","correct":true}]},{"target":"會","reading":"회","prompt":"會(회)가 들어가지 않은 말은?","note":"‘회색’에는 ‘재 회’를 씁니다.","options":[{"word":"사회","sentence":"십 년 동안 군인으로 살아온 그가 {{사회}}로 나가 잘 적응할 수 있을지 의문이다.","correct":false},{"word":"회사","sentence":"요즘에는 안정적인 노후를 위하여 {{회사}}를 퇴직하고 창업을 하는 사람들이 늘고 있다.","correct":false},{"word":"대회","sentence":"노동자의 날을 맞아 전국 노동자 {{대회}}가 열렸다.","correct":false},{"word":"회색","sentence":"비가 오려는지 맑던 하늘이 어느새 온통 {{회색}}으로 변했다.","correct":true}]},{"target":"孝","reading":"효","prompt":"孝(효)가 들어가지 않은 말은?","note":"‘효과’에는 ‘본받을 효’를 씁니다.","options":[{"word":"효자","sentence":"전통 설화의 {{효자}} 이야기는 부모 봉양을 중시한 사회의 윤리 기준을 보여 줍니다.","correct":false},{"word":"효성","sentence":"늙으신 부모님에 대한 그의 {{효성}}은 매우 극진했다.","correct":false},{"word":"효도","sentence":"부부는 늙은 부모를 지극 정성으로 모시며 {{효도}}를 했다.","correct":false},{"word":"효과","sentence":"정책의 {{효과}}는 시행 전후의 변화를 비교하고 다른 요인의 영향을 통제하여 평가해야 합니다.","correct":true}]},{"target":"訓","reading":"훈","prompt":"訓(훈)이 들어가지 않은 말은?","note":"‘보훈’에는 ‘공 훈’을 씁니다.","options":[{"word":"훈련","sentence":"대피 {{훈련}}에서 비상구 위치와 안전한 이동 순서를 익혔습니다.","correct":false},{"word":"교훈","sentence":"가난했던 과거는 내게 절약과 근면이라는 {{교훈}}을 남겼다.","correct":false},{"word":"훈장","sentence":"서당의 {{훈장}}은 학생들에게 한문과 예절을 가르쳤습니다.","correct":false},{"word":"보훈","sentence":"새로운 {{보훈}} 정책의 일환으로 참전 유공자는 위탁 병원에서 진료비 감면을 받을 수 있도록 했다.","correct":true}]},{"target":"休","reading":"휴","prompt":"休(휴)가 들어가지 않은 말은?","note":"‘휴대’에는 ‘이끌 휴’를 씁니다.","options":[{"word":"휴가","sentence":"유급 {{휴가}}는 노동자가 소득을 유지하면서 휴식과 회복의 시간을 보장받는 제도입니다.","correct":false},{"word":"휴식","sentence":"시에서 주민들의 편의를 위해 {{휴식}} 공원을 조성하였다.","correct":false},{"word":"연휴","sentence":"긴 {{연휴}} 기간이 시작되자 사람들은 모두 여행을 떠났다.","correct":false},{"word":"휴대","sentence":"새로 산 노트북은 작고 가벼워서 {{휴대}}가 간편하다.","correct":true}]},{"target":"商","reading":"상","prompt":"商(상)이 들어가지 않은 말은?","note":"‘상벌’에는 ‘상줄 상’을 씁니다.","options":[{"word":"협상","sentence":"회의장에서는 {{협상}}을 순조롭게 하기 위한 각국 대표들의 대화가 이어졌다.","correct":false},{"word":"상업","sentence":"최근 신도시의 교통이 편리해짐에 따라 인근의 {{상업}} 시설도 증가하고 있다.","correct":false},{"word":"상품","sentence":"날씨가 더운 여름에는 더위를 잊게 해 주는 선풍기나 에어컨 등의 {{상품}}이 잘 팔린다.","correct":false},{"word":"상벌","sentence":"{{상벌}}에는 반드시 적당한 기준이 있어야 하며 그렇지 않으면 {{상벌}}의 효과를 잃을 수 있다.","correct":true}]},{"target":"象","reading":"상","prompt":"象(상)이 들어가지 않은 말은?","note":"‘상처’에는 ‘다칠 상’을 씁니다.","options":[{"word":"상징","sentence":"보통 빛은 기쁨, 어둠은 슬픔의 {{상징}}으로 여겨진다.","correct":false},{"word":"현상","sentence":"사람은 나이가 들면 자연적으로 피부 노화 {{현상}}이 생긴다.","correct":false},{"word":"인상","sentence":"그를 만난 적은 한 번뿐이지만, 그의 독특한 옷차림은 매우 강렬한 {{인상}}을 남겼다.","correct":false},{"word":"상처","sentence":"운동장에서 뛰다가 넘어져서 무릎에 작은 {{상처}}가 났다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
