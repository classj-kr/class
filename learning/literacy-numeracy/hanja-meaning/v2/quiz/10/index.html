<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10단계 문제 풀기 | 한자</title><style>
:root{--card:#fffdf8;--ink:#202630;--muted:#68717a;--line:#d8d4ca;--blue:#245f8d;--soft:#eaf2f7;--good:#226847;--bad:#a43d36}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:#ded8ca url("../../../assets/hanja-background.webp") center/cover fixed no-repeat;font-family:"Noto Serif KR","Batang",serif}body:before{content:"";position:fixed;inset:0;background:rgba(247,245,239,.84);pointer-events:none}.page{position:relative;width:min(860px,100%);min-height:100svh;margin:auto;padding:8px clamp(16px,4vw,34px) 30px}.topbar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar strong{font-size:18px}.back{min-height:44px;display:inline-flex;align-items:center;color:var(--blue);font:800 14px system-ui,sans-serif;text-decoration:none}.status{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 8px;color:var(--muted);font:800 14px system-ui,sans-serif}.progress-track{height:7px;overflow:hidden;border-radius:999px;background:#dfe5e8}.progress-bar{display:block;width:0;height:100%;background:var(--blue);transition:width .2s}.card{margin-top:12px;padding:clamp(16px,3vw,24px);border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97)}.question-number{margin:0 0 8px;color:var(--muted);font:800 13px system-ui,sans-serif}.prompt{margin:0 0 16px;font-size:clamp(20px,3vw,25px);line-height:1.45}.choices{display:grid;gap:8px}.choice{min-height:54px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;line-height:1.55;text-align:left;cursor:pointer}.choice:hover{background:var(--soft)}.choice:disabled{cursor:default}.choice.correct{color:var(--good);border-color:var(--good);background:#eaf5ee}.choice.wrong{color:var(--bad);border-color:var(--bad);background:#fbeceb}.feedback{min-height:48px;margin:12px 0 0;line-height:1.55}.actions{display:flex;justify-content:flex-end;margin-top:10px}.primary{min-height:46px;padding:0 20px;border:0;border-radius:8px;color:white;background:var(--blue);font:800 15px system-ui,sans-serif;cursor:pointer}.primary[hidden],.card[hidden],.result[hidden]{display:none}.result{margin-top:12px;padding:28px 20px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,248,.97);text-align:center}.result h1{margin:0 0 8px;font-size:25px}.result-score{margin:8px 0 20px;color:var(--blue);font:800 34px system-ui,sans-serif}.choice:focus-visible,.primary:focus-visible,.back:focus-visible{outline:3px solid #77a9cb;outline-offset:2px}@media(max-width:600px){.card{padding:15px}.choice{min-height:58px}}
</style></head><body><main class="page"><header class="topbar"><strong>10단계 문제 풀기</strong><a class="back" href="../../">진도표</a></header><section id="quiz"><div class="status"><span id="progress"></span><span id="score"></span></div><div class="progress-track" aria-hidden="true"><span class="progress-bar" id="progress-bar"></span></div><article class="card" id="question-card"><p class="question-number" id="question-number"></p><h1 class="prompt" id="prompt"></h1><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="actions"><button class="primary" id="next" type="button" hidden>다음 문제</button></div></article><section class="result" id="result" hidden><h1>10단계 완료</h1><p>이 단계의 문제를 모두 풀었습니다.</p><p class="result-score" id="result-score"></p><button class="primary" id="restart" type="button">다시 풀기</button></section></section></main><script type="application/json" id="quiz-data">[{"target":"結","reading":"결","prompt":"結(결)이 들어가지 않은 말은?","note":"‘대결’에는 ‘결단할 결’을 씁니다.","options":[{"word":"결과","sentence":"경영진들이 회사를 잘못 경영한 {{결과}}로 많은 종업원들이 일자리를 잃었다.","correct":false},{"word":"결국","sentence":"자동차 운전기사는 계속 뺑소니 혐의를 부인하다가 {{결국}}에는 사실을 인정했다.","correct":false},{"word":"연결","sentence":"글을 쓰는데 문장이 매끄럽게 {{연결}}이 되지 않아서 고민이다.","correct":false},{"word":"대결","sentence":"연기파 배우로 알려진 두 배우의 연기 {{대결}}로 그 드라마는 촬영 전부터 화제를 모았다.","correct":true}]},{"target":"當","reading":"당","prompt":"當(당)이 들어가지 않은 말은?","note":"‘전당’에는 ‘집 당’을 씁니다.","options":[{"word":"당신","sentence":"{{당신}}이 한 일이 얼마나 잘못된 일인지 알게 되기를 바랍니다.","correct":false},{"word":"해당","sentence":"직원은 다음 중 하나라도 {{해당}}이 안 되면 세금 감면 혜택을 받을 수 없다고 했다.","correct":false},{"word":"담당","sentence":"부장이 {{담당}} 부서의 직원들에게 새 프로젝트의 일정에 대해 설명을 하였다.","correct":false},{"word":"전당","sentence":"집 근처에 문화의 {{전당}}이 새롭게 지어지면서 문화생활을 할 수 있는 기회가 늘게 되었다.","correct":true}]},{"target":"政","reading":"정","prompt":"政(정)이 들어가지 않은 말은?","note":"‘정직’에는 ‘바를 정’을 씁니다.","options":[{"word":"정치","sentence":"박 교수는 한 나라의 {{정치}}가 발전하려면 국민들의 관심과 참여가 높아져야 한다고 주장했다.","correct":false},{"word":"정부","sentence":"국가는 {{정부}}로 대표되어서 국민들의 재산과 생명을 보호할 의무가 있다.","correct":false},{"word":"정책","sentence":"내세운 {{정책}}이 좋은 반응을 얻은 정당의 후보들이 많이 당선되었다.","correct":false},{"word":"정직","sentence":"그 아이는 잘못을 해도 거짓말을 하지 않고 솔직히 말하는 {{정직}}한 사람이다.","correct":true}]},{"target":"要","reading":"요","prompt":"要(요)가 들어가지 않은 말은?","note":"‘요일’에는 ‘빛날 요’를 씁니다.","options":[{"word":"필요","sentence":"5층 이상 되는 건물은 오르내리기 쉽도록 엘리베이터를 설치할 {{필요}}가 있다.","correct":false},{"word":"중요","sentence":"시간이 얼마 없으니까 {{중요}} 개념 위주로 복습하는 게 좋겠다.","correct":false},{"word":"주요","sentence":"영화의 등장인물은 크게 {{주요}} 인물과 주변 인물로 나눌 수 있다.","correct":false},{"word":"요일","sentence":"도서관에 가기 전에 무슨 {{요일}}에 문을 닫는지 누리집에서 알아보았다.","correct":true}]},{"target":"最","reading":"최","prompt":"最(최)가 들어가지 않은 말은?","note":"‘개최국’에는 ‘재촉할 최’를 씁니다.","options":[{"word":"최고","sentence":"이 자동차가 낼 수 있는 {{최고}} 속도는 시속 백오십 킬로미터이다.","correct":false},{"word":"최초","sentence":"인류가 달에 {{최초}}로 착륙한 사건은 우주 탐사의 역사를 크게 바꾸었습니다.","correct":false},{"word":"최대","sentence":"약 만 명의 선수가 참여한 이번 대회는 지금껏 열린 대회 중 {{최대}} 규모이다.","correct":false},{"word":"개최국","sentence":"한국은 세계 정상 회의 {{개최국}}의 국민으로서 성숙한 시민 의식을 전 세계에 보여 주었다.","correct":true}]},{"target":"置","reading":"치","prompt":"置(치)가 들어가지 않은 말은?","note":"‘기치’에는 ‘기 치’를 씁니다.","options":[{"word":"위치","sentence":"시장은 이번 선거에서 다시 당선될 확률이 높아 시장으로서의 {{위치}}가 확고할 것으로 보인다.","correct":false},{"word":"설치","sentence":"교사들은 과학실의 시설들이 노후되어 새로운 실험 장비의 {{설치}}가 시급하다고 학교에 건의했다.","correct":false},{"word":"장치","sentence":"회의에서는 극심한 불평등의 해소 {{장치}}를 마련해야 한다는 주장이 제기됐다.","correct":false},{"word":"기치","sentence":"대통령은 국민의 삶의 질 향상이라는 {{기치}}에 맞게 빈부 격차를 줄이기 위한 정책을 폈다.","correct":true}]},{"target":"認","reading":"인","prompt":"認(인)이 들어가지 않은 말은?","note":"‘법인’에는 ‘사람 인’을 씁니다.","options":[{"word":"확인","sentence":"사람들은 사실 여부에 대한 {{확인}}도 없이 나에 대한 나쁜 소문을 퍼뜨렸다.","correct":false},{"word":"인가","sentence":"박 씨는 대학을 설립하기 위해 정부의 {{인가}}를 기다렸다.","correct":false},{"word":"인지","sentence":"공사장은 옆 사람의 말소리도 {{인지}}를 할 수 없을 만큼 시끄러웠다."," true}]},{"target":"委","reading":"위","prompt":"委(위)가 들어가지 않은 말은?","note":"‘국위’에는 ‘위엄 위’를 씁니다.","options":[{"word":"위원회","sentence":"유명한 과학자들이 함께 과학 기술을 발전시키기 위해 기술 개발 {{위원회}}를 구성하였다.","correct":false},{"word":"위원장","sentence":"안건의 부결을 공표하는 것은 {{위원장}}의 고유 권한이다.","correct":false},{"word":"위원","sentence":"당의 대표 {{위원}}들이 모여 이번 선거에 대해서 토의를 했다.","correct":false},{"word":"국위","sentence":"해외여행에서 질서를 지키지 않거나 무례한 행동을 하여 {{국위}}를 손상시키는 사람들이 있다.","correct":true}]},{"target":"解","reading":"해","prompt":"解(해)가 들어가지 않은 말은?","note":"‘해변’에는 ‘바다 해’를 씁니다.","options":[{"word":"이해","sentence":"어떤 작가의 생각에 대한 {{이해}}는 주로 그 작가가 쓴 책을 통해 이루어진다.","correct":false},{"word":"해결","sentence":"환경 문제의 {{해결}}에는 과학 기술과 제도 개선뿐 아니라 시민의 행동 변화도 필요합니다.","correct":false},{"word":"해석","sentence":"아직은 섣불리 {{해석}}을 내리지 않는 게 좋겠습니다. 조금 더 지켜보도록 하지요.","correct":false},{"word":"해변","sentence":"여름 방학에 가족과 바다에 가서 {{해변}}에서 모래성을 쌓으며 하루 종일 즐겁게 놀았다.","correct":true}]},{"target":"豫","reading":"예","prompt":"豫(예)가 들어가지 않은 말은?","note":"‘예증’에는 ‘법식 례(예)’를 씁니다.","options":[{"word":"예정","sentence":"비가 오지 않으면 운동회는 {{예정}}대로 금요일 오전에 열립니다.","correct":false},{"word":"예약","sentence":"사람들이 많이 몰리는 휴가철에는 적어도 한 달 전에 항공권 {{예약}}을 해 두어야 한다.","correct":false},{"word":"예상","sentence":"엎치락뒤치락하는 경기 점수로 인해 우승 팀 {{예상}}을 할 수가 없었다.","correct":false},{"word":"예증","sentence":"그 고등학교 교장은 좋은 학교임을 증명하기 위해 명문대 진학률을 {{예증}}으로 보여 주었다.","correct":true}]},{"target":"想","reading":"상","prompt":"想(상)이 들어가지 않은 말은?","note":"‘상벌’에는 ‘상줄 상’을 씁니다.","options":[{"word":"예상","sentence":"엎치락뒤치락하는 경기 점수로 인해 우승 팀 {{예상}}을 할 수가 없었다.","correct":false},{"word":"환상","sentence":"아이는 온 세상이 사탕으로 만들어진 {{환상}}의 세계를 그린 영화를 보고 좋아했다.","correct":false},{"word":"가상","sentence":"{{가상}} 실험은 실제로 재현하기 위험하거나 비용이 큰 상황을 모형으로 탐구하게 합니다.","correct":false},{"word":"상벌","sentence":"{{상벌}}에는 반드시 적당한 기준이 있어야 하며 그렇지 않으면 {{상벌}}의 효과를 잃을 수 있다.","correct":true}]},{"target":"境","reading":"경","prompt":"境(경)이 들어가지 않은 말은?","note":"‘경찰’에는 ‘깨우칠 경’을 씁니다.","options":[{"word":"경우","sentence":"사람이 계속 실패만 하는 {{경우}}에 우울증에 빠지기 쉽다.","correct":false},{"word":"환경","sentence":"외국인들은 한국인과 문화적 {{환경}}이 다르기 때문에 문화적 차이를 존중해 주어야 한다.","correct":false},{"word":"변경","sentence":"지금처럼 국토의 경계가 명확하지 않았던 시절에는 {{변경}} 부근에서 많은 전투가 있었다.","correct":false},{"word":"경찰","sentence":"길을 잃고 울던 아이를 {{경찰}} 아저씨가 부모님께 무사히 데려다주었다.","correct":true}]},{"target":"規","reading":"규","prompt":"規(규)가 들어가지 않은 말은?","note":"‘규탄’에는 ‘꼴 규’를 씁니다.","options":[{"word":"규모","sentence":"요즈음은 {{규모}}가 큰 대형 상점이 늘어나서 주변의 소형 상점에는 손님이 끊겼다.","correct":false},{"word":"규정","sentence":"예술을 어떻게 {{규정}}을 하느냐에 따라서 그의 작품은 예술로 인정되지 않을 수도 있다.","correct":false},{"word":"규칙","sentence":"아이들은 일주일에 한 번씩 돌아가면서 교실 청소를 한다는 {{규칙}}을 세워 놓고 실천하고 있다.","correct":false},{"word":"규탄","sentence":"당시에는 대학생들의 주도하에 부정 선거와 독재에 항거하는 {{규탄}} 운동이 수시로 일어났다.","correct":true}]},{"target":"裝","reading":"장","prompt":"裝(장)이 들어가지 않은 말은?","note":"‘광장’에는 ‘마당 장’을 씁니다.","options":[{"word":"가장","sentence":"동물의 {{가장}} 행동은 천적의 눈을 피하거나 먹이에 접근하는 생존 전략이 되기도 합니다.","correct":false},{"word":"장치","sentence":"회의에서는 극심한 불평등의 해소 {{장치}}를 마련해야 한다는 주장이 제기됐다.","correct":false},{"word":"장비","sentence":"안전하게 등산을 하려면 등산화를 비롯한 여러 가지 {{장비}}를 갖추어야 한다.","correct":false},{"word":"광장","sentence":"많은 사람들이 시청 앞 {{광장}}에 모여 대형 스크린을 보며 우리 대표 선수들을 응원하였다.","correct":true}]},{"target":"期","reading":"기","prompt":"期(기)가 들어가지 않은 말은?","note":"‘기본’에는 ‘터 기’를 씁니다.","options":[{"word":"기간","sentence":"미안해요. 요즘 시험 {{기간}}이라 공부해야 돼서 같이 영화 보러 가기는 힘들겠어요.","correct":false},{"word":"후기","sentence":"이전 왕조는 {{후기}}로 갈수록 민심을 잃어 통치자의 세력이 약해졌다.","correct":false},{"word":"초기","sentence":"조선 {{초기}}에는 문화와 과학 기술이 발달하였다.","correct":false},{"word":"기본","sentence":"그들이 우리와 약속한 {{기본}} 원칙을 지키지 않으면 우리도 그들의 요구를 들어줄 수 없다.","correct":true}]},{"target":"格","reading":"격","prompt":"格(격)이 들어가지 않은 말은?","note":"‘격변’에는 ‘격할 격’을 씁니다.","options":[{"word":"가격","sentence":"오랜 장마 때문에 채소와 과일 {{가격}}이 올랐다.","correct":false},{"word":"성격","sentence":"삼촌은 어디를 가나 사교적이고 {{성격}}이 좋다는 말을 많이 듣는다.","correct":false},{"word":"자격","sentence":"서류 심사를 통과한 지원자들에게는 면접에 응시할 {{자격}}이 부여된다.","correct":false},{"word":"격변","sentence":"이번 총선에 다수의 새 국회 의원이 당선되어서 앞으로 상당한 정치적 {{격변}}이 예상된다.","correct":true}]}]</script><script>
const labels=['①','②','③','④'];const source=JSON.parse(document.getElementById('quiz-data').textContent);const card=document.getElementById('question-card');const result=document.getElementById('result');const progress=document.getElementById('progress');const scoreText=document.getElementById('score');const bar=document.getElementById('progress-bar');const questionNumber=document.getElementById('question-number');const prompt=document.getElementById('prompt');const choices=document.getElementById('choices');const feedback=document.getElementById('feedback');const next=document.getElementById('next');let questions=[];let current=0;let score=0;let answered=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function escapeText(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function sentenceHtml(option){return escapeText(option.sentence).replace('{{'+escapeText(option.word)+'}}','<u>'+escapeText(option.word)+'</u>')}
function start(){questions=shuffle(source).map((question)=>({...question,options:shuffle(question.options)}));current=0;score=0;result.hidden=true;card.hidden=false;show()}
function show(){answered=false;const question=questions[current];progress.textContent=(current+1)+' / '+questions.length;scoreText.textContent='맞힌 문제 '+score;bar.style.width=(current/questions.length*100)+'%';questionNumber.textContent='문제 '+(current+1);prompt.textContent=question.prompt;feedback.textContent='';next.hidden=true;choices.replaceChildren();question.options.forEach((option,index)=>{const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML=labels[index]+' '+sentenceHtml(option);button.addEventListener('click',()=>answer(index));choices.append(button)})}
function answer(selected){if(answered)return;const question=questions[current];const buttons=[...choices.children];const correct=question.options[selected].correct;if(!correct){buttons[selected].classList.add('wrong');buttons[selected].disabled=true;feedback.textContent='다시 생각해 보세요.';return}answered=true;score+=1;question.options.forEach((option,index)=>{buttons[index].disabled=true;if(option.correct)buttons[index].classList.add('correct')});scoreText.textContent='맞힌 문제 '+score;feedback.textContent='맞았습니다. '+question.note;next.textContent=current===questions.length-1?'결과 보기':'다음 문제';next.hidden=false;next.focus()}
function advance(){current+=1;if(current<questions.length){show();return}card.hidden=true;result.hidden=false;bar.style.width='100%';progress.textContent=questions.length+' / '+questions.length;document.getElementById('result-score').textContent=score+' / '+questions.length;document.getElementById('restart').focus()}
next.addEventListener('click',advance);document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
