<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b0f10">
    <title>시집</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260910-rightcornerv8">
    <script src="poems-index.js?v=20260910-rightcornerv8" defer></script>
    <script src="lessons.js?v=20260910-rightcornerv8" defer></script>
    <script src="/assets/learning-records.js?v=20261006-book"></script>
    <script src="app.js?v=20261006-reading" defer></script>
    <script src="poetry-bgm.js?v=20260911-1" defer></script>
    <script src="../../../../assets/sound/music-control.js?v=20261001-reading-music-1" defer></script>
</head>
<body>
    <audio id="bgm" preload="auto"></audio>
    <div class="top-bar">
        <a class="back-link" id="shelfBackLink" href="../../../../" aria-label="메인 화면으로 돌아가기">← 메인</a>
        <button class="toc-link" id="tocBtn" type="button" aria-label="시 목차로 이동" hidden>☰ 차례</button>
    </div>

    <!-- 1. 책장 화면 (Lobby) -->
    <div class="screen screen-shelf" id="shelfScreen">
        <div class="shelf-container">
            <div class="shelf-head">
                <div class="grade-tabs" role="tablist" aria-label="찾는 방법">
                    <button id="orderTabBtn" class="grade-tab is-active" type="button" role="tab" aria-selected="true">차례대로</button>
                    <button id="topicTabBtn" class="grade-tab" type="button" role="tab" aria-selected="false">소재로 찾기</button>
                </div>
            </div>

            <div id="orderView">
                <div class="shelf" id="bookShelf" aria-label="시집 목록"></div>
            </div>

            <div id="topicView" class="hidden">
                <div class="grade-tabs topic-chips" id="topicChips" aria-label="소재 선택"></div>
                <ol class="topic-poem-list" id="topicPoemList" aria-label="소재별 시 목록"></ol>
            </div>
        </div>
    </div>

    <!-- 2. 책 펼침면 화면 (Book Reader: 전래동화/소설과 동일한 2쪽 펼침면 구조) -->
    <div class="screen screen-book" id="bookScreen" hidden>
        <div class="book-stage">
            <div class="book" id="book">
                <div class="book-spread" id="spread"></div>
                <span class="folio folio-left" id="folioLeft"></span>
                <span class="folio folio-right" id="folioRight"></span>

                <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="이전 페이지">‹</button>
                <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="다음 페이지">›</button>
            </div>

            <div class="page-indicator" id="pageIndicator"></div>
        </div>
    </div>
</body>
</html>
