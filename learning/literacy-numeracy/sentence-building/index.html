<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12223d">
    <meta name="description" content="2022 개정 국어과 성취기준에 따른 초등 3~6학년 문장 고르기 24차시">
    <title>문장 고르기 | ClassJ</title>
    <link rel="stylesheet" href="styles.css?v=20260912-2">
    <script src="curriculum.js?v=20260918-quiz" defer></script>
    <script src="app.js?v=20260912-1" defer></script>
</head>
<body>
    <div class="app-shell">
        <main>
            <section id="courseScreen" class="screen course-screen" aria-label="차시 목록">
                <div id="lessonList" class="unit-list" aria-label="차시 목록"></div>
            </section>

            <section id="lessonScreen" class="screen lesson-screen" hidden aria-labelledby="lessonTitle">
                <div class="lesson-toolbar">
                    <div>
                        <h1 id="lessonTitle"></h1>
                        <p id="lessonMeta" class="teacher-meta"></p>
                    </div>
                    <div class="mission-counter"><span id="missionNumber">1</span>/<span id="missionTotal">10</span></div>
                </div>
                <div class="mission-track" aria-hidden="true"><span id="missionProgressFill"></span></div>

                <article class="mission-card" aria-labelledby="taskPrompt">
                    <h2 id="taskPrompt"></h2>
                    <p id="taskScene" class="task-scene"></p>
                    <div id="activityArea" class="activity-area"></div>
                    <div id="feedback" class="feedback" hidden aria-live="polite">
                        <strong id="feedbackTitle"></strong>
                        <p id="feedbackText"></p>
                    </div>
                    <div class="mission-actions">
                        <button id="hintButton" class="hint-button" type="button">힌트</button>
                        <button id="checkButton" class="primary-button" type="button">확인하기</button>
                        <button id="nextButton" class="primary-button" type="button" hidden>다음 문제 →</button>
                    </div>
                </article>
            </section>

            <section id="resultScreen" class="screen result-screen" hidden aria-labelledby="resultTitle">
                <h1 id="resultTitle">학습 완료</h1>
                <p id="resultMessage" class="result-message"></p>
                <div class="result-stats">
                    <div><span>정답</span><strong id="resultScore">0/6</strong></div>
                </div>
                <div class="result-actions">
                    <button id="nextLessonButton" class="primary-button" type="button">다음 차시</button>
                    <button id="retryButton" class="secondary-button" type="button">다시 도전</button>
                </div>
            </section>
        </main>
    </div>
    <p id="announcer" class="visually-hidden" aria-live="assertive"></p>
</body>
</html>
