<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="한자성어의 뜻, 유래, 출전과 복습 문제를 제공하는 학습 도구">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" content="한자성어 학습기">
    <meta property="og:description" content="뜻, 유래, 출전, 문제">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="한자성어 학습기">
    <meta name="twitter:description" content="뜻, 유래, 출전, 문제">
    <title>한자성어</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lessons.css?v=20260926-tablet-1">
    <script src="idioms-bgm.js" defer></script>
    <script src="../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
    <script src="idioms-data.js" defer></script>
    <script src="idioms-lessons-data.js" defer></script>
    <script src="idioms-core.js" defer></script>
    <script src="app.js?v=20260906-1" defer></script>
</head>
<body>
    <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

    <header class="site-header">
        <a class="back-link" href="../../../" aria-label="학습과 게임 메인으로 돌아가기">← 메인</a>
        <div class="header-score" aria-label="현재 암기 현황">
            <span>암기 완료</span>
            <strong id="headerKnown">0</strong><span id="headerTotal">/ 0</span>
        </div>
    </header>

    <audio id="bgm" src="assets/audio/paper-lantern-drift.ogg" preload="auto"></audio>

    <main id="mainContent">
        <h1 id="pageTitle" class="visually-hidden">한자성어 뜻과 유래</h1>
        <p id="playerGreeting" class="visually-hidden"></p>

        <section id="lessonOverview" class="lesson-overview" aria-label="차시 목록">
            <div class="lesson-overview-actions">
                <p class="lesson-overview-total"><strong id="lessonKnownTotal">0</strong> / <span id="lessonItemTotal">0</span> 암기</p>
                <button id="allQuizButton" class="lesson-quiz-button" type="button">전체 문제은행</button>
            </div>
            <div id="lessonList" class="lesson-list"></div>
        </section>

        <section id="learningShell" hidden>
            <div class="lesson-toolbar">
                <div class="lesson-toolbar-actions">
                    <a class="lesson-home-link" href="../../../">← 메인</a>
                    <button id="backToLessons" type="button">차시 목록</button>
                </div>
                <div class="lesson-heading"><span id="currentLessonNumber"></span><strong id="currentLessonTitle"></strong></div>
                <button id="currentLessonQuiz" class="lesson-quiz-button" type="button">이 차시 문제</button>
            </div>

        <div class="progress-card" aria-label="전체 학습 현황">
            <div class="progress-heading">
                <span>학습 현황</span>
                <strong id="masteryPercent">0%</strong>
            </div>
            <div class="progress-track" aria-hidden="true"><span id="masteryBar"></span></div>
            <div class="progress-counts">
                <span><i class="dot known-dot"></i>암기 <b id="knownCount">0</b></span>
                <span><i class="dot review-dot"></i>복습 <b id="reviewCount">0</b></span>
                <span><i class="dot unseen-dot"></i>미학습 <b id="unseenCount">0</b></span>
            </div>
        </div>

        <nav class="mode-tabs" aria-label="학습 모드">
            <button class="mode-tab active" type="button" data-view="learn" aria-selected="true">
                <span aria-hidden="true">冊</span><b>학습</b>
            </button>
            <button class="mode-tab" type="button" data-view="game" aria-selected="false">
                <span aria-hidden="true">問</span><b>문제</b>
            </button>
            <button class="mode-tab" type="button" data-view="library" aria-selected="false">
                <span aria-hidden="true">目</span><b>전체 목록</b>
            </button>
        </nav>

        <section id="learnView" class="view-panel learn-view" aria-labelledby="learnHeading">
            <div class="section-heading">
                <h2 id="learnHeading" class="visually-hidden">카드</h2>
                <div class="deck-tools">
                    <label class="select-label" for="themeSelect">주제</label>
                    <select id="themeSelect">
                        <option value="전체">전체</option>
                    </select>
                    <button id="reviewOnlyButton" class="quiet-button" type="button" aria-pressed="false">복습 카드만</button>
                    <button id="shuffleDeckButton" class="quiet-button" type="button">순서 섞기</button>
                </div>
            </div>

            <div id="emptyDeck" class="empty-state" hidden>
                <strong>복습 목록이 비어 있습니다.</strong>
                <p>카드에서 ‘복습 필요’를 선택하면 목록에 추가됩니다.</p>
                <button id="showAllButton" type="button">전체 카드 보기</button>
            </div>

            <div id="studyArea" class="study-area">
                <div class="card-position">
                    <span id="cardPosition" aria-live="polite">1 / 1</span>
                    <div class="mini-track" aria-hidden="true"><span id="cardProgress"></span></div>
                    <nav id="cardNavigation" class="card-navigation" aria-label="성어 이동">
                        <button id="previousCard" type="button">← 이전</button>
                        <button id="nextCard" type="button">다음 →</button>
                    </nav>
                </div>

                <article id="idiomCard" class="idiom-card" tabindex="-1">
                    <div class="card-topline">
                        <span id="themeBadge" class="theme-badge">지혜</span>
                        <span id="verificationBadge" class="verification-badge">원전 확인</span>
                    </div>
                    <div class="idiom-face">
                        <p id="idiomHanja" class="idiom-hanja">守株待兔</p>
                        <h3 id="idiomWord">수주대토</h3>
                    </div>

                    <div id="cardDetails" class="card-details" hidden>
                        <div class="card-summary">
                            <div class="hanja-expl-block">
                                <div id="idiomHanjaExpl" class="hanja-chips"></div>
                            </div>
                            <div class="meaning-block">
                                <p id="idiomMeaning"></p>
                            </div>
                        </div>
                        <div class="card-media">
                            <figure id="idiomIllustration" class="idiom-illustration" hidden>
                                <img id="idiomIllustrationImage" alt="" width="1200" height="800" loading="lazy" decoding="async">
                            </figure>
                            <div class="source-block">
                                <div><strong id="idiomSource"></strong></div>
                                <p id="sourceNote"></p>
                            </div>
                        </div>
                        <div class="story-block">
                            <p id="idiomStory"></p>
                        </div>
                    </div>
                </article>


                <div id="memoryActions" class="memory-actions" hidden aria-label="암기 상태 선택">
                    <p>학습 상태</p>
                    <div>
                        <button id="markReview" class="review-action" type="button"><span>↺</span> 복습 필요 <kbd>R</kbd></button>
                        <button id="markKnown" class="known-action" type="button"><span>✓</span> 암기 완료 <kbd>K</kbd></button>
                    </div>
                </div>
            </div>
        </section>

        <section id="gameView" class="view-panel game-view" hidden aria-labelledby="gameHeading">
            <div id="gameIntro" class="game-intro">
                <div class="section-heading centered-heading">
                    <div>
                        <h2 id="gameHeading" class="visually-hidden">문제</h2>
                        <p>뜻·유래·삽화에 맞는 한자성어를 선택하세요.</p>
                    </div>
                </div>
                <div class="quiz-mode-grid" role="radiogroup" aria-label="문제 유형">
                    <button class="quiz-mode selected" type="button" data-quiz-mode="mixed" aria-pressed="true"><b>혼합</b><span>뜻 · 유래</span></button>
                    <button class="quiz-mode" type="button" data-quiz-mode="meaning" aria-pressed="false"><b>뜻</b><span>뜻을 보고 선택</span></button>
                    <button class="quiz-mode" type="button" data-quiz-mode="story" aria-pressed="false"><b>유래</b><span>유래를 보고 선택</span></button>
                    <button class="quiz-mode" type="button" data-quiz-mode="image" aria-pressed="false"><b>삽화</b><span>그림을 보고 선택</span></button>
                </div>
                <div class="best-score">최고 점수 <strong id="bestScore">0 / 10</strong></div>
                <button id="startQuiz" class="primary-button" type="button">문제 시작</button>
            </div>

            <div id="quizStage" class="quiz-stage" hidden>
                <div class="quiz-status">
                    <span id="quizPosition">문제 1 / 10</span>
                    <span>연속 정답 <strong id="quizStreak">0</strong></span>
                    <span>점수 <strong id="quizScore">0</strong></span>
                </div>
                <div class="quiz-track" aria-hidden="true"><span id="quizBar"></span></div>
                <article class="question-card">
                    <span id="questionType" class="question-type">뜻 문제</span>
                    <figure id="questionIllustration" class="question-illustration" hidden>
                        <img id="questionIllustrationImage" alt="" width="1200" height="800" decoding="async">
                    </figure>
                    <p id="questionPrompt"></p>
                    <div id="answerOptions" class="answer-options"></div>
                    <div id="answerFeedback" class="answer-feedback" role="status" hidden>
                        <strong id="feedbackTitle"></strong>
                        <p id="feedbackCopy"></p>
                        <details id="feedbackStory" class="feedback-story">
                            <summary>유래 확인</summary>
                            <p id="feedbackStoryCopy"></p>
                        </details>
                        <button id="nextQuestion" type="button">다음 문제 →</button>
                    </div>
                </article>
            </div>

            <div id="quizResult" class="quiz-result" hidden>
                <h2 id="resultTitle">문제 결과</h2>
                <strong id="resultScore">0 / 10</strong>
                <p id="resultMessage"></p>
                <ul id="resultMistakeList" class="result-mistake-list" aria-label="틀린 한자성어" hidden></ul>
                <div class="result-actions">
                    <button id="retryQuiz" class="primary-button" type="button">새 문제 풀기</button>
                    <button id="retryMistakes" class="quiet-button" type="button">오답 다시 풀기</button>
                    <button id="reviewMistakes" class="quiet-button" type="button">카드로 복습</button>
                </div>
            </div>
        </section>

        <section id="libraryView" class="view-panel library-view" hidden aria-labelledby="libraryHeading">
            <div class="section-heading library-heading">
                <div>
                    <h2 id="libraryHeading" class="visually-hidden">목록</h2>
                    <p><strong id="libraryTotal">0</strong>개 항목</p>
                </div>
                <div class="library-tools">
                    <label class="search-box">
                        <span class="visually-hidden">성어 검색</span>
                        <input id="librarySearch" type="search" placeholder="성어·한자·뜻 검색">
                    </label>
                </div>
            </div>
            <div id="themeFilters" class="theme-filters" aria-label="주제별 필터"></div>
            <div id="libraryGrid" class="library-grid"></div>
            <p id="libraryEmpty" class="library-empty" hidden>검색 결과가 없습니다.</p>
        </section>
        </section>
    </main>


    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
