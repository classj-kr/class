<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#24150c">
    <title>한글 맞춤법</title>
    <link rel="stylesheet" href="styles.css?v=20260906-1">
    <script src="questions.js?v=20260924-1" defer></script>
    <script src="questions-extra.js?v=20260905-2" defer></script>
    <script src="lessons.js?v=20260924-1" defer></script>
    <script src="question-deck.js?v=20260905-2" defer></script>
    <script src="../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
    <script src="app.js?v=20260906-1" defer></script>
</head>
<body>
    <audio id="bgm" src="/learning/literacy-numeracy/spelling/assets/sound/bgm.ogg" loop preload="auto"></audio>
    <div class="page-shell">
        <nav class="topbar" aria-label="페이지 기능">
            <a class="back-link" href="../../../" aria-label="메인 화면으로 돌아가기">←</a>
            <div class="topbar-actions">
                <div class="record" aria-label="무작위 10문제 최고 기록">
                    <span>무작위 최고 기록</span>
                    <strong id="headerBestScore">0/10</strong>
                </div>
            </div>
        </nav>

        <main>

            <section id="lessonScreen" class="panel lesson-panel" aria-label="차시 목록">
                <p id="lessonProgressSummary" class="lesson-progress-line"></p>
                <ol id="lessonList" class="lesson-list" aria-label="차시 목록"></ol>
            </section>


            <section id="quizScreen" class="quiz-screen hidden" aria-labelledby="questionText">
                <div class="quiz-status">
                    <div>
                        <span id="quizModeLabel" class="mode-status">개인 모드</span>
                        <span class="status-label">문제</span>
                        <strong><span id="questionNumber">1</span>/<span id="questionTotal">10</span></strong>
                    </div>
                    <div class="score-box">
                        <span class="status-label">점수</span>
                        <strong><span id="currentScore">0</span>점</strong>
                    </div>
                </div>
                <div class="progress-track" aria-hidden="true">
                    <span id="progressFill"></span>
                </div>

                <article class="panel question-panel">
                    <span id="questionCategory" class="question-category">표준어</span>
                    <p id="questionPrompt" class="question-prompt">빈칸에 들어갈 알맞은 말을 고르세요.</p>
                    <h2 id="questionText" class="question-text"></h2>
                    <div id="choiceList" class="choice-list" aria-label="답 선택"></div>

                    <div id="feedback" class="feedback hidden" aria-live="polite">
                        <h3 id="feedbackTitle"></h3>
                        <p id="correctAnswer" class="correct-answer"></p>
                        <p id="explanation" class="explanation"></p>
                        <button id="nextButton" class="primary-button next-button" type="button">다음 문제</button>
                    </div>
                </article>
            </section>

            <section id="resultScreen" class="panel result-panel hidden" aria-labelledby="resultTitle">
                <p id="resultEyebrow" class="eyebrow">LEARNING COMPLETE</p>
                <h2 id="resultTitle">학습 결과</h2>
                <div class="score-medallion" aria-label="최종 점수">
                    <strong id="finalScore">0</strong>
                    <span>/ <span id="finalTotal">10</span></span>
                </div>
                <p id="resultMessage" class="result-message"></p>
                <p id="bestMessage" class="best-message"></p>

                <div id="reviewArea" class="review-area">
                    <h3>나의 오답노트</h3>
                    <p id="perfectReview" class="perfect-review hidden">틀린 문제가 없어요. 완벽합니다!</p>
                    <ol id="missedList" class="missed-list"></ol>
                </div>

                <div class="result-actions">
                    <button id="restartButton" class="primary-button" type="button">새 문제 풀기</button>
                    <button id="nextLessonButton" class="primary-button hidden" type="button">다음 차시</button>
                    <button id="lessonListButton" class="secondary-button" type="button">차시 목록</button>
                    <a class="secondary-button" href="../../../">메인으로</a>
                </div>
            </section>
        </main>

        <footer>
            문항 해설은
            <a href="https://www.korean.go.kr/kornorms/main/main.do" target="_blank" rel="noopener noreferrer">한국어 어문 규범</a>과
            <a href="https://stdict.korean.go.kr/" target="_blank" rel="noopener noreferrer">표준국어대사전</a>을 기준으로 구성했습니다.
        </footer>
    </div>

    <p id="announcer" class="visually-hidden" aria-live="assertive"></p>
</body>
</html>
