<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4ee" />
    <title>퀴즈네어 막대 · 수학 교구</title>
    <link rel="icon" href="/assets/icons/favicon.webp" />
    <link rel="stylesheet" href="../assets/ui.css?v=20261108-2" />
    <style>
      .stage {
        min-height: 320px;
      }
      .rod-palette {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px;
      }
      .rod-swatch {
        min-width: 40px;
        min-height: 38px;
        padding: 4px 10px;
        border-radius: 10px;
        font-weight: 800;
        border: 2px solid var(--stroke);
        background: var(--fill);
        color: var(--text);
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.14);
      }
      .rod-swatch:hover:enabled {
        background: var(--fill);
        filter: brightness(0.96);
      }
      .rod-swatch[aria-pressed="true"] {
        outline: 3px solid #304a41;
        outline-offset: 2px;
      }
      .row-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px 16px;
      }
      .row-box {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 12px;
        background: #fffdf8;
        border: 2px solid #d5dfd4;
      }
      .row-box.is-selected {
        border-color: #305f50;
        background: #f0f7f3;
      }
      .row-box input[type="number"] {
        width: 72px;
        min-height: 36px;
        font-weight: 700;
        text-align: center;
      }
      .row-box button {
        min-height: 36px;
        padding: 4px 10px;
        font-weight: 700;
      }
      @media (max-width: 600px) {
        .stage {
          min-height: 260px;
        }
      }
    </style>
    <script src="../assets/math.js?v=20261108-2" defer></script>
    <script src="../assets/ui.js?v=20261108-2" defer></script>
    <script src="/assets/site-storage.js?v=20261006-1" defer></script>
    <script src="core.js?v=20261111-2" defer></script>
    <script src="app.js?v=20261111-2" defer></script>
    <script
      src="/assets/sound/music-control.js?v=20261105-settings-panel"
      data-sfx-controls
      data-settings-help="tool-help"
      defer
    ></script>
    <script
      src="/assets/site-back-navigation.js?v=20260926-empty-header"
      defer
    ></script>
  </head>
  <body>
    <h1 class="sr-only">퀴즈네어 막대</h1>
    <div class="toolbar">
      <select id="preset" aria-label="예시 문제">
        <option value="">예시 선택…</option>
        <option value="4-6">4와 6</option>
        <option value="6-8">6과 8</option>
        <option value="22-33">22와 33</option>
        <option value="12-18">12와 18</option>
        <option value="3-4-6">3, 4, 6 (세 줄)</option>
      </select>
      <button id="step-match" class="primary">짧은 줄 +1</button>
      <button id="auto-match">길이 딱 맞추기</button>
      <button id="toggle-third-row">3줄 비교</button>
      <button id="labels" aria-pressed="true">수 표시</button>
      <div class="history">
        <button id="undo" class="icon" aria-label="되돌리기">↶</button>
        <button id="redo" class="icon" aria-label="다시 하기">↷</button>
      </div>
      <button id="reset" aria-label="처음 상태로">초기화</button>
    </div>

    <main class="workspace">
      <div class="stage-wrap">
        <svg
          id="stage"
          class="stage"
          viewBox="0 0 1040 420"
          tabindex="0"
          role="group"
          aria-label="퀴즈네어 막대 비교판"
        ></svg>
      </div>

      <div id="row-controls" class="row-controls" aria-label="줄별 막대 설정"></div>

      <div
        id="palette"
        class="rod-palette"
        role="group"
        aria-label="1부터 10까지 기본 퀴즈네어 막대 색상표"
      ></div>

      <output id="result" class="measurements math"></output>
    </main>

    <p id="notice" role="status" hidden></p>
    <span id="save-status" class="sr-only" role="status"></span>

    <template id="tool-help">
      <ul>
        <li>
          각 줄의 오른쪽 끝에 있는 점선 <b>[+ 막대]</b>를 누르면 같은 막대가
          옆으로 이어 붙어요. 마지막 막대를 누르면 하나 빠져요.
        </li>
        <li>
          두 줄의 막대 끝이 <b>똑같은 길이</b>에서 만나면 세로선이 생기며
          <b>최소공배수</b>와 <b>공배수</b>를 바로 확인할 수 있어요.
        </li>
        <li>
          기본 퀴즈네어 막대(1~10)뿐 아니라 입력칸에 <code>22</code>,
          <code>33</code>처럼 원하는 수를 직접 넣어 비교할 수도 있어요.
        </li>
      </ul>
    </template>
  </body>
</html>
