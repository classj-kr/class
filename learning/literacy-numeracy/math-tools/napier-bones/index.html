<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4ee" />
    <title>네이피어 계산봉 · 수학 교구</title>
    <link rel="icon" href="/assets/icons/favicon.webp" />
    <link rel="stylesheet" href="../assets/ui.css?v=20261108-2" />
    <style>
      .stage-wrap {
        width: min(1120px, 100%);
        overflow-x: auto;
      }
      .stage {
        min-height: 460px;
        max-height: none;
      }
      .rod-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px 12px;
        width: min(100%, 1040px);
        background: #fffdf8;
        border: 1px solid #d5dfd4;
        border-radius: 14px;
        padding: 10px 14px;
      }
      .quick-digits {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .quick-digits button {
        min-width: 38px;
        min-height: 38px;
        padding: 4px 9px;
        font-weight: 700;
      }
      .custom-form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .custom-form input[type="text"] {
        width: 148px;
        min-height: 38px;
      }
      .active-rods {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .rod-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #eef4ef;
        border: 1.5px solid var(--rod-color, #2c8979);
        font-size: 14px;
        font-weight: 700;
        color: #243b34;
      }
      .rod-chip button {
        min-height: 22px;
        width: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(48, 74, 65, 0.12);
        color: #243b34;
        font-size: 13px;
        line-height: 1;
      }
      .rod-chip button:hover:enabled {
        background: rgba(200, 60, 60, 0.2);
      }
      .summary-panel {
        width: min(100%, 1040px);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 10px;
      }
      .summary-card {
        background: #fffdf8;
        border: 1px solid #d5dfd4;
        border-radius: 14px;
        padding: 12px 16px;
      }
      .summary-card h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #567063;
      }
      .summary-card .value {
        font-size: 21px;
        font-weight: 700;
        color: #214035;
      }
      .summary-card .sub {
        margin-top: 5px;
        font-size: 13px;
        color: #4f665b;
        line-height: 1.5;
      }
      .common-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .common-pill {
        min-height: 32px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
      }
      .common-pill.is-lcm {
        background: #fff3cd;
        border-color: #d99b26;
        color: #7c4d00;
      }
      @media (max-width: 600px) {
        .stage {
          min-height: 360px;
        }
        .custom-form input[type="text"] {
          width: 124px;
        }
      }
    </style>
    <script src="../assets/math.js?v=20261108-2" defer></script>
    <script src="../assets/ui.js?v=20261108-2" defer></script>
    <script src="/assets/site-storage.js?v=20261006-1" defer></script>
    <script src="core.js?v=20261111-1" defer></script>
    <script src="app.js?v=20261111-1" defer></script>
    <script
      src="/assets/sound/music-control.js?v=20261105-settings-panel"
      data-sfx-controls
      data-settings-help="tool-help"
      defer
    ></script>
    <script
      src="/assets/site-back-navigation.js?v=20260926-empty-header"
      defer
    ></script>
  </head>
  <body>
    <h1 class="sr-only">네이피어 계산봉</h1>
    <div class="toolbar">
      <select id="mode" aria-label="학습 모드">
        <option value="lcm">공배수 · 최소공배수</option>
        <option value="multiply">네이피어 격자 곱셈</option>
      </select>
      <select id="preset" aria-label="예시 문제">
        <option value="">예시 선택…</option>
        <option value="4-6">예시: 4와 6</option>
        <option value="6-8">예시: 6과 8</option>
        <option value="22-33">예시: 22와 33 (두 자리 커스텀)</option>
        <option value="12-18">예시: 12와 18 (두 자리 커스텀)</option>
        <option value="15-25">예시: 15와 25 (두 자리 커스텀)</option>
        <option value="3-4-6">예시: 3, 4, 6 (세 수)</option>
      </select>
      <select id="rows" aria-label="표시할 배수 단">
        <option value="9">×1 ~ ×9단</option>
        <option value="12">×1 ~ ×12단</option>
        <option value="15">×1 ~ ×15단</option>
        <option value="20">×1 ~ ×20단</option>
      </select>
      <div class="history">
        <button id="undo" class="icon" aria-label="되돌리기">↶</button>
        <button id="redo" class="icon" aria-label="다시 하기">↷</button>
      </div>
      <button id="reset" aria-label="처음 상태로">초기화</button>
    </div>

    <main class="workspace">
      <section
        id="lcm-controls"
        class="rod-bar"
        aria-label="비교할 수 막대 설정"
      >
        <div class="quick-digits" role="group" aria-label="한 자리 계산봉 빠른 선택">
          <span class="control" style="font-weight:700">기본 봉:</span>
          <button type="button" data-quick="2">2</button>
          <button type="button" data-quick="3">3</button>
          <button type="button" data-quick="4">4</button>
          <button type="button" data-quick="5">5</button>
          <button type="button" data-quick="6">6</button>
          <button type="button" data-quick="7">7</button>
          <button type="button" data-quick="8">8</button>
          <button type="button" data-quick="9">9</button>
        </div>

        <form id="custom-form" class="custom-form" autocomplete="off">
          <label class="control" for="custom-input">
            <span>커스텀 수:</span>
            <input
              id="custom-input"
              type="text"
              inputmode="numeric"
              placeholder="예: 22, 33 또는 22"
              aria-label="커스텀 수 또는 비교할 수 입력 (예: 22, 33)"
            />
          </label>
          <button type="submit" id="add-custom" class="primary compact">
            막대 놓기
          </button>
        </form>

        <div
          id="active-rods"
          class="active-rods"
          role="group"
          aria-label="현재 놓인 수 막대"
        ></div>
      </section>

      <section
        id="multiply-controls"
        class="rod-bar"
        hidden
        aria-label="네이피어 격자 곱셈 설정"
      >
        <label class="control">
          곱해지는 수 (1 ~ 9999)
          <input
            id="multiplicand"
            type="number"
            min="1"
            max="9999"
            step="1"
            inputmode="numeric"
          />
        </label>
        <label class="control">
          곱하는 수 (×1 ~ ×9)
          <select id="multiplier" aria-label="곱하는 수">
            <option value="1">× 1</option>
            <option value="2">× 2</option>
            <option value="3">× 3</option>
            <option value="4">× 4</option>
            <option value="5">× 5</option>
            <option value="6">× 6</option>
            <option value="7">× 7</option>
            <option value="8">× 8</option>
            <option value="9">× 9</option>
          </select>
        </label>
      </section>

      <div class="controls">
        <button id="toggle-diagonals" aria-pressed="true" class="compact">
          대각선 격자(십/일) 보기
        </button>
        <button id="toggle-multiples" aria-pressed="true" class="compact">
          배수 값 보기
        </button>
      </div>

      <div class="stage-wrap">
        <svg
          id="stage"
          class="stage"
          viewBox="0 0 1060 560"
          tabindex="0"
          role="group"
          aria-label="네이피어 계산봉 작업판"
        ></svg>
      </div>

      <output id="result" class="measurements math"></output>

      <section
        id="summary-panel"
        class="summary-panel"
        aria-label="공배수와 최소공배수 풀이"
      ></section>
    </main>

    <p id="notice" role="status" hidden></p>
    <span id="save-status" class="sr-only" role="status"></span>

    <template id="tool-help">
      <ul>
        <li>
          <b>공배수·최소공배수 모드</b>: 기본 봉(2~9)을 누르거나,
          <b>커스텀 수</b> 입력칸에 <code>22, 33</code>처럼 두 자리 이상의 수를
          입력해 배수를 나란히 비교할 수 있어요.
        </li>
        <li>
          두 자리 이상의 수(예: 22)는 네이피어 계산봉 <code>[2][2]</code>를
          나란히 붙인 묶음 막대로 놓이며, 각 단의 대각선 숫자를 더해 배수(22, 44,
          66…)가 만들어지는 원리를 함께 보여 줍니다.
        </li>
        <li>
          모든 막대에 공통으로 나타나는 <b>공배수</b>는 노란색으로 강조되고, 그중
          가장 작은 <b>최소공배수</b>는 연결선과 배지로 표시됩니다.
        </li>
        <li>
          <b>네이피어 격자 곱셈 모드</b>에서는 여러 자리 수의 계산봉을 나란히
          놓고 대각선끼리 더해 곱셈 결과를 구할 수 있어요.
        </li>
      </ul>
    </template>
  </body>
</html>
