<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>자·각도기 · 수학 교구</title>
    <link rel="icon" href="/assets/icons/favicon.webp" />
    <link rel="stylesheet" href="../assets/ui.css?v=20261108-2" />
    <script src="../assets/math.js?v=20261108-2" defer></script>
    <script src="../assets/ui.js?v=20261108-2" defer></script>
    <script src="/assets/site-storage.js?v=20261006-1" defer></script>
    <script src="core.js?v=20261108-2" defer></script>
    <script src="app.js?v=20261108-2" defer></script>
    <script
      src="/assets/sound/music-control.js?v=20261105-settings-panel"
      data-sfx-controls
      data-settings-help="tool-help"
      defer
    ></script>
  </head>
  <body>
    <h1 class="sr-only">자·각도기</h1>
    <div class="toolbar">
      <select id="mode" aria-label="측정 도구">
        <option value="angle">각도기</option>
        <option value="ruler">자</option></select
      ><button id="zoom" aria-pressed="false">확대 보기</button
      ><button id="new">다른 모양</button
      ><button id="visible" aria-pressed="true">도구 표시</button
      ><button id="show" aria-pressed="false">값 표시</button>
      <div class="history">
        <button id="undo" class="icon" aria-label="되돌리기">↶</button
        ><button id="redo" class="icon" aria-label="다시 하기">↷</button>
      </div>
      <button id="reset">초기화</button>
    </div>
    <main class="workspace">
      <div class="stage-wrap">
        <svg
          id="stage"
          class="stage"
          viewBox="0 0 1000 600"
          tabindex="0"
          role="group"
          aria-label="도형과 측정 도구를 끌어 맞추는 판"
        ></svg>
      </div>
      <div class="controls">
        <label class="control"
          >도구 회전
          <input
            id="tool-angle"
            type="range"
            min="-180"
            max="180"
            step="1"
            aria-label="측정 도구 회전" /><output id="rotation"></output></label
        ><button id="align">도구 맞추기</button
        ><label id="angle-control" class="control"
          >각도
          <input
            id="angle"
            type="number"
            min="0"
            max="180"
            aria-label="각도" /></label
        ><label id="length-control" class="control" hidden
          >길이
          <input
            id="length"
            type="number"
            min="10"
            max="120"
            aria-label="선분 길이 (mm)"
          />mm</label
        >
      </div>
      <output id="measurement" class="measurements math"></output>
    </main>
    <p id="notice" role="status" hidden></p>
    <span id="save-status" class="sr-only" role="status"></span
    ><template id="tool-help"
      ><ul>
        <li>
          색 점을 끌어 도형을 바꾸고, 도구의 아래쪽 손잡이를 끌어 자나 각도기를
          옮겨요.
        </li>
        <li>
          각도기의 중심을 꼭짓점에, 0° 눈금을 한 변에 맞추고 같은 쪽에서
          시작하는 눈금을 읽어요. 바깥·안쪽 눈금을 모두 표시해요.
        </li>
        <li>
          자의 0 눈금을 선분의 한 끝에 맞춰요. 자의 가장자리와 0 눈금은 서로
          달라요.
        </li>
        <li>
          화면 속 cm·mm는 모형의 단위예요. 실제 물건을 화면에 대고 재는 자가
          아니에요.
        </li>
        <li>
          값 표시를 켜면 입력칸으로 도형을 바꿀 수 있어요. 판에서 방향키로 측정
          도구를 옮겨요.
        </li>
      </ul></template
    >
  </body>
</html>
