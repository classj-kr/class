<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국 속담과 영어 속담의 뜻과 쓰임을 익히는 학습 도구">
  <title>속담</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
  <script src="proverbs-data.js?v=20260927-1" defer></script>
  <script src="proverbs-essential-additions.js?v=20260927-1" defer></script>
  <script src="proverbs-lookalikes.js?v=20260927-1" defer></script>
  <script src="/assets/learning-records.js?v=20261001-1" defer></script>
  <script src="/assets/learning-lesson.js?v=20261001-1" defer></script>
  <script src="app.js?v=20261001-common-records" defer></script>
</head>
<body>
  <header>
    <a class="back" href="../../../">← 메인</a>
  </header>
  <audio id="bgm" src="assets/paper-lantern-drift.ogg" preload="auto" loop></audio>
  <main>
    <section id="lessonToolbar" class="lesson-toolbar">
      <div class="language-tabs" aria-label="속담 언어 선택">
        <button class="language-tab active" data-language="ko" type="button">한국 속담</button>
        <button class="language-tab" data-language="en" type="button">영어 속담</button>
      </div>
      
    </section>
    <section id="lessonOverview" class="lesson-overview" aria-label="속담 차시 목록">
      <div id="lessonList" class="lesson-list"></div>
    </section>
    <div id="learningShell" hidden>
      <div class="learning-header">
        <div class="learning-utility"><button id="backToLessons" type="button">← 차시 목록</button><strong id="currentLessonTitle"></strong></div>
        <nav class="mode-tabs" aria-label="학습 모드 선택">
          <button class="mode-tab active" data-mode="study" type="button" aria-selected="true">속담 공부</button>
          <button class="mode-tab" data-mode="quiz" type="button" aria-selected="false">문제 풀기</button>
        </nav>
      </div>

    <section id="studyView" class="panel study-card" aria-live="polite">
      <p id="label" class="label"></p>
      <h2 id="proverb"></h2>
      <p id="literal" class="literal" hidden></p>
      <p id="meaning" class="meaning"></p>
      <figure id="proverbIllustrationFrame" class="proverb-illustration" hidden>
        <img id="proverbIllustrationImage" alt="" loading="lazy" decoding="async">
      </figure>
      <p id="example" class="example"></p>
      <div class="actions">
        <button id="previous" type="button">이전</button>
        <button id="next" class="primary" type="button">다음 속담</button>
      </div>
    </section>

    <section id="quizView" class="panel quiz" aria-labelledby="quiz-title" hidden>
      <p id="quizKicker" class="label">확인 퀴즈</p>
      <h2 id="quiz-title">이 상황에 알맞은 속담은?</h2>
      <p id="question"></p>
      <div id="choices" class="choices"></div>
      <p id="feedback" role="status"></p>
      <div class="actions">
        <button id="reviewAnswer" type="button" hidden>이 속담 다시 공부하기</button>
        <button id="nextQuestion" class="primary" type="button" disabled>다음 문제</button>
      </div>
    </section>
    </div>
  </main>
</body>
</html>
