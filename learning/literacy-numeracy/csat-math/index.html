<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>평가원·수능 기출</title>
<meta name="description" content="한국교육과정평가원 6월·9월 모의평가와 수능의 공통·선택 과목 기출을 단원별로 모았습니다.">
<!-- 수식은 vendor/ 에 둔 KaTeX 0.16.11 로 그린다(바깥 서버에서 받지 않는다). katex.min.css 는 woff2 글꼴만 가리키게 줄였다. -->
<link rel="stylesheet" href="vendor/katex.min.css?v=0.16.11">
<script defer src="vendor/katex.min.js?v=0.16.11"></script>
<script defer src="vendor/auto-render.min.js?v=0.16.11"></script>
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>

<a class="home-back" href="../../../index.html" aria-label="메인 화면으로 돌아가기">←</a>

<main>
  <!-- 「수학 문제」와 같은 드롭다운. 여기는 맨 밑의 「평가원·수능 기출」이고, 학기를 고르면 수학 문제의 그 학기로 간다(../math-bank/terms.js 가 채운다). -->
  <nav class="term-nav" aria-label="학년과 학기 고르기">
    <select class="term-select" id="term-select" data-math-terms="../math-bank/" aria-label="학년과 학기"></select>
  </nav>
  <section class="picker" aria-label="고르기">
    <div class="picker-row picker-row--subject">
      <span class="picker-label" id="subj-label">과목</span>
      <div class="subject-tabs" role="tablist" aria-labelledby="subj-label" id="subject-tabs"></div>
    </div>
    <div class="picker-row picker-row--unit" id="unit-row" hidden>
      <span class="picker-label" id="unit-label">단원</span>
      <div class="chips" role="group" aria-labelledby="unit-label" id="unit-chips"></div>
    </div>
    <div class="picker-row picker-row--select">
      <label class="picker-label" for="exam-select">회차</label>
      <div class="picker-select-wrap">
        <select class="picker-select" id="exam-select" aria-label="회차 선택"></select>
      </div>
    </div>
    <div class="picker-row picker-row--tail">
      <p class="count" id="count" role="status"></p>
      <label class="hide-done"><input type="checkbox" id="hide-done"> 푼 문제 감추기</label>
      <button type="button" class="reset" id="reset">학습 마치기</button>
    </div>
  </section>

  <ol class="list" id="list"></ol>
  <div class="more-wrap" id="more-wrap" hidden>
    <button type="button" class="btn-more" id="btn-more">더 보기</button>
  </div>
  <p class="empty" id="empty" hidden>고른 조건에 맞는 문항이 없습니다.</p>
</main>

<script src="../math-bank/terms.js?v=20261012-133"></script>
<script src="data/index.js?v=11"></script>
<script src="/assets/learning-records.js?v=20261001-1"></script>
<script src="app.js?v=20261008-math-check"></script>
</body>
</html>
