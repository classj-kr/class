<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>평가원·수능 기출</title>
<meta name="description" content="한국교육과정평가원 6월·9월 모의평가와 수능의 공통·선택 과목 기출을 단원별로 모았습니다.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<a class="home-back" href="../../../index.html" aria-label="메인 화면으로 돌아가기">←</a>

<main>
  <section class="picker" aria-label="고르기">
    <div class="picker-row picker-row--subject">
      <span class="picker-label" id="subj-label">과목</span>
      <div class="subject-tabs" role="tablist" aria-labelledby="subj-label" id="subject-tabs"></div>
    </div>
    <div class="picker-row picker-row--unit" id="unit-row" hidden>
      <span class="picker-label" id="unit-label">단원</span>
      <div class="chips" role="group" aria-labelledby="unit-label" id="unit-chips"></div>
    </div>
    <div class="picker-row picker-row--select">
      <label class="picker-label" for="exam-select">회차</label>
      <div class="picker-select-wrap">
        <select class="picker-select" id="exam-select" aria-label="회차 선택"></select>
      </div>
    </div>
    <div class="picker-row picker-row--tail">
      <p class="count" id="count" role="status"></p>
      <label class="hide-done"><input type="checkbox" id="hide-done"> 푼 문제 감추기</label>
      <button type="button" class="reset" id="reset">기록 지우기</button>
    </div>
  </section>

  <ol class="list" id="list"></ol>
  <div class="more-wrap" id="more-wrap" hidden>
    <button type="button" class="btn-more" id="btn-more">더 보기</button>
  </div>
  <p class="empty" id="empty" hidden>고른 조건에 맞는 문항이 없습니다.</p>
</main>

<script src="data/index.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
