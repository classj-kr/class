<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="학생이 자주 만나는 핵심 관용어의 뜻과 쓰임을 익히는 학습 도구">
  <title>관용어</title>
  <link rel="stylesheet" href="styles.css?v=20260822-2">
  <script src="../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
  <script src="idiomatic-expressions-data.js?v=20260927-1" defer></script>
  <script src="idiomatic-expressions-illustrations.js" defer></script>
  <script src="/assets/learning-records.js?v=20261001-1" defer></script>
  <script src="/assets/learning-lesson.js?v=20261001-1" defer></script>
  <script src="app.js?v=20261001-common-records" defer></script>
</head>
<body>
  <header>
    <a class="back" href="../../../">← 메인</a>
  </header>
  <audio id="bgm" src="assets/quiet-dobble-board.ogg" preload="auto" loop></audio>

  <main>
    <section id="lessonOverview" class="lesson-overview" aria-labelledby="lessonHeading">
      <div class="overview-heading"><h1 id="lessonHeading" class="sr-only">차시 선택</h1></div>
      <div id="lessonList" class="lesson-list"></div>
    </section>
    <div id="learningShell" hidden>
      <div class="learning-utility"><button id="backToLessons" type="button">← 차시 목록</button><strong id="currentLessonTitle"></strong></div>
    <nav class="mode-tabs" aria-label="학습 모드 선택">
      <button class="mode-tab active" data-mode="study" type="button" aria-selected="true">관용어 공부</button>
      <button class="mode-tab" data-mode="quiz" type="button" aria-selected="false">문제 풀기</button>
    </nav>

    <section id="studyView" class="panel study-card" aria-live="polite">
      <p id="progress" class="label"></p>
      <p id="category" class="category"></p>
      <h1 id="expression"></h1>
      <img id="illustration" class="illustration" alt="" hidden>
      <div class="meaning-block">
        <strong>뜻</strong>
        <p id="meaning"></p>
      </div>
      <p id="example" class="example"></p>
      <div class="actions">
        <button id="previous" type="button">이전</button>
        <button id="next" class="primary" type="button">다음 관용어</button>
      </div>
    </section>

    <section id="quizView" class="panel quiz" aria-labelledby="quizTitle" hidden>
      <p id="quizProgress" class="label">확인 문제</p>
      <h1 id="quizTitle">이 상황에 알맞은 관용어는?</h1>
      <p id="question" class="question"></p>
      <div id="choices" class="choices"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="nextQuestion" class="primary" type="button" disabled>다음 문제</button>
      </div>
    </section>
    </div>
  </main>
</body>
</html>
