<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>글씨 쓰기</title>
    <link rel="stylesheet" href="styles.css?v=20261108-pen-m-1400" />
  </head>
  <body>
    <main class="app">
      <h1 class="sr-only">글씨 쓰기</h1>
      <div class="topbar">
        <a class="back-link" href="/" aria-label="학습 홈">←</a>
        <div id="lessonPanel" class="lesson-controls">
          <label class="sr-only" for="lessonSelect">연습할 글자</label>
          <select id="lessonSelect">
            <optgroup label="기본 글자">
              <option value="consonants">자음</option>
              <option value="vowels">모음</option>
              <option value="gana" selected>가나다</option>
              <option value="double">쌍자음·겹모음</option>
            </optgroup>
            <optgroup label="낱말">
              <option value="nature">낱말 · 자연</option>
              <option value="school">낱말 · 학교</option>
            </optgroup>
            <optgroup label="속담·성어 (무작위)">
              <option value="proverbs">속담</option>
              <option value="idioms">한자성어</option>
              <option value="expressions">관용어</option>
            </optgroup>
            <option value="custom">직접 넣기</option>
          </select>
          <label class="sr-only" for="styleSelect">글씨체</label>
          <select id="styleSelect">
            <option value="gyeongpil">경필체 M</option>
            <option value="badasseugi">받아쓰기체</option>
          </select>
          <div class="phase-tabs" role="group" aria-label="연습 단계">
            <button data-phase="trace" aria-pressed="true">따라 쓰기</button
            ><button data-phase="solo" aria-pressed="false">혼자 쓰기</button>
          </div>
        </div>
        <!-- 순위전 화면에서만: 방번호·남은 시간·제출 줄. 이 줄 하나로 위쪽 띠를 따로 두지 않는다. -->
        <div id="raceBar" class="race-bar" hidden>
          <span id="roomChip" class="room-chip" hidden>방 <b id="codeLabel"></b></span>
          <div id="raceClock" class="race-clock" hidden>
            <span class="clock-bar"><i id="clockFill"></i></span><strong id="clockText">5:00</strong>
          </div>
          <div class="race-actions">
            <button id="submitRound" class="primary submit-round" hidden>제출</button
            ><button id="stopRound" hidden>마치기</button
            ><button id="leaveRoom" hidden>나가기</button>
          </div>
        </div>
        <div class="topbar-end">
          <details id="settingsMenu" class="settings-menu">
            <summary>설정</summary>
            <div class="settings-content">
              <label for="inputMode">입력 방식</label
              ><select id="inputMode">
                <option value="pen">펜 전용</option>
                <option value="touch">터치·일반 터치펜</option>
              </select>
              <button id="testInput">펜 입력 확인</button>
              <p id="inputStatus" role="status">펜 또는 마우스</p>
              <label for="cellSize">쓰기 칸 크기</label>
              <select id="cellSize">
                <option value="auto" selected>자동</option>
                <option value="small">작게</option>
                <option value="medium">보통</option>
                <option value="large">크게</option>
              </select>
              <label for="penWidth">펜 굵기</label
              ><select id="penWidth">
                <option value="3.5">가늘게</option>
                <option value="5.5" selected>보통</option>
                <option value="7.5">굵게</option>
              </select>
              <label class="check"><input id="guideCheck" type="checkbox" checked /> 보조선</label
              ><button id="printButton">연습지 인쇄</button>
              <p id="saveStatus" role="status">저장 확인 중</p>
            </div>
          </details>
        </div>
      </div>
      <form id="customForm" class="custom-form" hidden>
        <label class="sr-only" for="customText">연습할 한글</label
        ><textarea id="customText" rows="1" maxlength="80" placeholder="연습할 한글을 넣으세요"></textarea
        ><button type="submit">적용</button>
      </form>
      <section id="roomPanel" class="room-panel" hidden aria-label="순위전" data-sfx-feedback="none">
        <div id="roomEntry" class="room-entry">
          <button id="createRoom" class="create-room">방 만들기</button>
          <a class="join-room" href="/room/">방번호로 들어가기</a>
        </div>
        <div id="lobbyView" class="lobby-view" hidden>
          <div class="lobby-top">
            <div class="text-scroll">
              <div id="textTiles" class="text-tiles" aria-label="쓸 글"></div>
              <span id="modeTag" class="mode-tag"></span>
            </div>
            <div id="codeBoard" class="code-board" hidden><span>방번호</span><b id="bigCode"></b></div>
            <div id="meBoard" class="me-board" hidden><span id="meFace" class="me-face"></span><b id="meName"></b></div>
          </div>
          <div id="lobbyPlayers" class="lobby-players" aria-label="참가자"></div>
        </div>
        <div id="trackView" class="track-view" hidden>
          <div id="raceTrack" class="race-track" aria-label="쓰는 중">
            <i class="track-line" aria-hidden="true"></i>
            <div id="trackStations" class="track-stations" aria-hidden="true"></div>
            <div class="track-finish" aria-hidden="true"><b>끝</b><span id="doneCount"></span></div>
            <div id="trackTokens" class="track-tokens"></div>
          </div>
        </div>
        <div id="ceremonyView" class="ceremony" hidden>
          <div id="podium" class="podium"></div>
          <div class="ceremony-side">
            <div id="myCard" class="my-card" hidden></div>
            <div id="rankRows" class="rank-rows" aria-label="순위"></div>
          </div>
        </div>
        <div id="roomControls" class="room-controls" hidden>
          <div id="roomSettings" class="room-settings" hidden>
            <select id="raceSource" aria-label="순위전 글감">
              <option value="custom">직접 넣기</option>
              <option value="proverbs">속담</option>
              <option value="idioms">한자성어</option>
              <option value="expressions">관용어</option></select
            ><input id="raceText" value="가나다" maxlength="40" aria-label="쓸 글" /><button
              id="raceAnother"
              type="button"
              hidden
            >다른 문구</button
            ><select id="raceMode" aria-label="순위전 쓰기 모드">
              <option value="trace">따라 쓰기</option>
              <option value="solo">혼자 쓰기</option></select
            ><label id="spectateRow" class="check spectate" hidden><input id="spectateInput" type="checkbox" /> 관전만</label>
          </div>
          <button id="readyButton" class="ready-button" hidden>준비</button
          ><button id="startRound" class="start-round" hidden>시작<small id="readyCount"></small></button>
        </div>
        <p id="roomStatus" role="status"></p>
      </section>
      <div id="workspace" class="workspace">
        <section class="practice-panel" aria-label="글씨 연습장">
          <p id="touchNotice" class="touch-notice" hidden>
            터치 모드에서는 손바닥을 화면에서 떼고 써 주세요.
          </p>
          <!-- 공책처럼: 글 전체를 칸에 늘어놓고, 칸마다 바로 위에 같은 크기의 본보기 칸을 둔다. -->
          <div class="text-head">
            <p id="textMeaning" class="text-meaning" hidden></p>
            <button id="anotherText" class="another-text" hidden>다른 문구</button>
          </div>
          <div id="sheet" class="sheet" aria-label="글씨 연습장"></div>
          <div class="toolbar">
            <div>
              <button id="undoButton" disabled aria-label="마지막 획 되돌리기">↶ 되돌리기</button
              ><button id="redoButton" disabled aria-label="되돌린 획 다시 실행">↷</button
              ><button id="clearButton">이 칸 지우기</button
              ><button id="demoButton">획순</button>
            </div>
            <span id="strokeStatus" class="stroke-status" role="status"></span
            ><span id="strokeCount" class="stroke-count"></span
            ><span id="progressLabel" class="progress-label"></span
            ><button id="checkButton" class="primary">확인</button>
          </div>
          <p id="feedback" class="feedback" role="status" hidden></p>
        </section>
      </div>
    </main>
    <a class="race-link" href="race/">🏁 순위전</a>
    <div id="countdown" class="countdown" hidden aria-hidden="true"><span id="countNum">3</span></div>
    <div id="finishSign" class="finish-sign" hidden aria-hidden="true"><span id="finishText">끝!</span></div>
    <div id="raceBanner" class="race-banner" aria-live="polite" data-sfx-feedback="none"></div>
    <template id="raceHelp">
      <p>한글 1~24글자를 5분 동안 함께 씁니다. 방장이 대기실에서 글과 따라/혼자 쓰기를 고릅니다.</p>
      <p>점수 = 모양 × 획순입니다. 서버가 실제 획으로 다시 채점합니다.</p>
      <p>시간이 끝나면 쓴 글씨를 자동으로 냅니다. 결과는 모두 함께 공개됩니다.</p>
    </template>
    <dialog id="inputDialog" aria-labelledby="inputTitle">
      <h2 id="inputTitle">펜 입력 확인</h2>
      <p>아래 칸에 펜으로 써 보세요.</p>
      <canvas id="testCanvas" width="600" height="230" aria-label="펜 입력 시험 영역"></canvas>
      <p id="testResult" role="status">입력을 기다립니다.</p>
      <p class="help">펜으로 인식되면 손바닥 입력을 무시합니다. 터치로 인식되면 손을 떼고 써 주세요.</p>
      <button id="closeInput">닫기</button>
    </dialog>
    <section id="printSheet" aria-label="인쇄용 글씨 연습지"></section>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="/assets/site-storage.js?v=20261006-1"></script>
    <script src="font-source.js?v=20261107-pen-m-1300"></script>
    <script src="style-badasseugi.js?v=20261107-2"></script>
    <script src="/assets/fonts/classj-pen-m/source.js?v=1.400"></script>
    <script src="font-engine.js?v=20261107-pen-m-1300"></script>
    <script src="pen-reference.js?v=20261107-pen-m-1300"></script>
    <script src="core.js?v=20261107-pen-m-1300"></script>
    <script src="writing-texts.js?v=20261107-1"></script>
    <script src="app.js?v=20261107-race-show"></script>
    <script src="race.js?v=20261107-avatar"></script>
  </body>
</html>
