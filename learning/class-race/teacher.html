<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#24150c">
    <title>학급 순위전 · 교사용</title>
    <link rel="stylesheet" href="/assets/network/multiplayer-lobby.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260921-1">
    <script src="/assets/network/game-network.js?v=20260821" defer></script>
    <script src="/assets/network/multiplayer-lobby.js?v=20260918-1" defer></script>
    <script data-class-game-sfx="true" src="/assets/sound/game-sfx.js?v=20260912-feedback-scope-1" defer></script>
    <script src="apps.js?v=20260909-1" defer></script>
    <script src="teacher.js?v=20260921-1" defer></script>
</head>
<body class="teacher-page">
    <div class="page-shell">
        <nav class="topbar" aria-label="페이지 이동">
            <div class="topbar-links">
                <a class="back-link" href="/classtools/">← 교사 포털</a>
                <a class="back-link" href="./">학생 화면</a>
            </div>
        </nav>

        <main>
            <section id="setupPanel" class="panel" aria-label="학급 순위전 준비">
                <span class="step-label">1. 어떤 앱으로 할까요?</span>
                <div id="appGrid" class="app-grid" role="group" aria-label="앱 선택"></div>

                <span class="step-label">2. 어떤 문제를 낼까요?</span>
                <div class="range-row">
                    <label><input type="radio" name="rangeMode" value="random" checked> 전체에서 무작위</label>
                    <select id="randomCount" aria-label="무작위 문제 수">
                        <option value="5">5문제</option>
                        <option value="10" selected>10문제</option>
                        <option value="15">15문제</option>
                        <option value="20">20문제</option>
                    </select>
                    <label><input type="radio" name="rangeMode" value="lesson"> 차시 하나</label>
                    <select id="lessonSelect" aria-label="차시 선택" disabled>
                        <option value="">앱을 먼저 고르세요</option>
                    </select>
                </div>
                <p id="rangeSummary" class="range-summary">앱을 고르면 문제 수가 여기에 나옵니다.</p>

                <span class="step-label">3. 누구끼리 겨룰까요?</span>
                <div class="range-row">
                    <label><input type="radio" name="raceMode" value="solo" checked> 개인전</label>
                    <label><input type="radio" name="raceMode" value="team"> 모둠전</label>
                    <select id="teamSize" aria-label="모둠 인원" disabled>
                        <option value="3">3명씩</option>
                        <option value="4" selected>4명씩</option>
                        <option value="5">5명씩</option>
                    </select>
                    <button id="shuffleTeamsButton" class="secondary-button hidden" type="button">모둠 다시 섞기</button>
                </div>

                <span id="savedName" class="hidden">교사</span>
                <div id="hostPane" class="room-card">
                    <span>학급 코드</span>
                    <strong id="roomCode">----</strong>
                    <button id="copyBtn" class="secondary-button" type="button">코드 복사</button>
                    <p id="hostStatus" class="lobby-status">학급을 만드는 중입니다.</p>
                </div>

                <div class="counts">
                    <div><span>참가 학생</span><strong id="lobbyStudentCount">0명</strong></div>
                    <div><span>출제 문항</span><strong id="questionCountLabel">-</strong></div>
                    <div><span>순위 기준</span><strong id="rankRuleLabel">처음 맞힌 수</strong></div>
                </div>

                <div id="lobbyRoster" class="lobby-roster" aria-label="참가 학생"></div>
                <p id="lobbyGuide" class="lobby-status">학생 참가를 기다리는 중입니다.</p>
                <button id="teacherStartButton" class="primary-button main-button" type="button" disabled>학생 참가 대기</button>
                <p id="teacherNotice" class="notice" role="status" aria-live="polite"></p>
            </section>

            <section id="racePanel" class="board hidden" aria-labelledby="raceTitle">
                <header class="board-bar">
                    <div class="board-title">
                        <p class="board-code">학급 코드 <strong id="raceRoomCode">----</strong></p>
                        <h2 id="raceTitle">학급 순위전</h2>
                        <p id="raceSubject" class="board-subject"></p>
                    </div>
                    <div id="raceToasts" class="race-toasts" aria-live="polite"></div>
                    <div class="board-clock" aria-label="지난 시간">
                        <strong id="raceClock">0:00</strong>
                        <span id="raceProgress">0명 도착 / 0명</span>
                    </div>
                    <div class="board-actions">
                        <button id="endRaceButton" class="primary-button" type="button">경기 끝내기</button>
                        <button id="resetRaceButton" class="secondary-button" type="button">새 순위전 준비</button>
                    </div>
                </header>

                <div id="raceTrack" class="race-track" aria-label="경기장"></div>

                <div id="finishArea" class="finish-area hidden">
                    <div id="podium" class="podium" aria-label="시상대"></div>
                    <div class="finish-columns">
                        <section class="board-card missed-card" aria-labelledby="missedTitle">
                            <h3 id="missedTitle">반 전체가 많이 틀린 문제</h3>
                            <p class="board-card-note">처음 고른 답을 셌어요.</p>
                            <ol id="missedBoard" class="missed-board"></ol>
                            <p id="missedEmpty" class="board-card-note hidden">처음부터 모두 맞혔어요. 틀린 문제가 없습니다.</p>
                        </section>
                        <section class="board-card" aria-labelledby="finalRankTitle">
                            <h3 id="finalRankTitle">최종 순위</h3>
                            <p class="board-card-note">점수가 같으면 먼저 다 푼 쪽이 앞서요.</p>
                            <ol id="teamRankingList" class="ranking-list team-ranking-list hidden" aria-label="모둠 순위"></ol>
                            <ol id="teacherRankingList" class="ranking-list" aria-label="학급 순위"></ol>
                        </section>
                    </div>
                </div>

                <p id="raceNotice" class="board-notice" role="status" aria-live="polite"></p>
            </section>
        </main>
    </div>
</body>
</html>
