<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콩 거래 · 그림 11종</title>
<style>
:root{color-scheme:light;--paper:#f3eddd;--ink:#243629;--muted:#6f7567;--card:#fffaf0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic",sans-serif}
main{max-width:1480px;margin:auto;padding:48px 40px 56px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;color:#6e7d57}
h1{font-size:42px;letter-spacing:-2px;margin:6px 0 12px}.intro{font-size:15px;margin:0;color:var(--muted);line-height:1.6}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,.download{font:inherit;font-size:13px;font-weight:700;border:1px solid #c3cbb9;border-radius:24px;padding:10px 16px;background:#fffaf0;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}.download{background:#263e2d;color:#fff;border-color:#263e2d}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.section-title{font-size:23px;margin:38px 0 20px}.support-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:20px}.support-grid .art{height:280px;aspect-ratio:auto}.support-grid .landscape .art{padding:0}.support-grid .landscape img{object-fit:contain}
figure{margin:0;overflow:hidden;border:1px solid #d9decd;border-radius:20px;background:var(--card);box-shadow:0 5px 14px #24362907}
.art{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--card);transition:background .2s}
.art img{width:100%;height:100%;object-fit:contain;display:block}.art a{display:block;width:100%;height:100%}
figcaption{padding:14px 18px 18px;border-top:1px solid #e5e3d6;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:19px;margin:0 0 5px;letter-spacing:-.6px}.role{font-size:12px;color:var(--muted);margin:0}
.badge{font-size:11px;background:#edf0e5;border-radius:20px;padding:6px 9px;color:#5d7059;white-space:nowrap}
footer{margin-top:28px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}footer a{color:inherit}
body[data-background="dark"] .art{background:#24312e}
body[data-background="checker"] .art{background-color:#fafafa;background-image:linear-gradient(45deg,#e6e6e6 25%,transparent 25%),linear-gradient(-45deg,#e6e6e6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e6e6 75%),linear-gradient(-45deg,transparent 75%,#e6e6e6 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
@media(max-width:1000px){main{padding:28px 22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.support-grid{grid-template-columns:1fr 1fr}.support-grid .landscape{grid-column:1/-1}header{align-items:flex-start;flex-direction:column}h1{font-size:34px}}
@media(max-width:460px){main{padding:24px 12px}.grid{gap:10px}figure{border-radius:14px}.art{padding:8px}figcaption{padding:11px;display:block}.badge{display:none}h2{font-size:17px}.role{font-size:11px}footer{flex-direction:column;gap:8px}}
</style></head>

<section class="support-grid" aria-label="카드 뒷면, 금화, 밭 배경">
<figure><div class="art"><a href="images/card-back-v1.png" target="_blank" rel="noopener"><img src="images/card-back-v1.png" alt="콩 거래 카드 뒷면"></a></div><figcaption><div><h2>카드 뒷면</h2><p class="role">콩과 덩굴 문양</p></div></figcaption></figure>

<figure class="landscape"><div class="art"><a href="images/field-background-v1.webp" target="_blank" rel="noopener"><img src="images/field-background-v1.webp" alt="콩을 키우는 밭 배경"></a></div><figcaption><div><h2>밭 배경</h2><p class="role">카드를 놓을 넓은 밭</p></div></figcaption></figure>
</section><footer><span>그림을 누르면 원본을 볼 수 있습니다.</span><a href="art-prompts-final.json">ImageGen 제작 프롬프트</a></footer></main>
<script>const modes=["light","dark","checker"];const labels=["밝게","어둡게","투명 격자"];let mode=0;document.getElementById("backgroundButton").addEventListener("click",()=>{mode=(mode+1)%modes.length;document.body.dataset.background=modes[mode];document.getElementById("backgroundButton").textContent="배경: "+labels[mode]});</script></body></html>
