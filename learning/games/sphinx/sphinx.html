<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>스핑크스 문제</title>
    <style>
        @font-face {
            font-family: "Sphinx KoPubWorld Batang";
            src: url("/learning/games/sphinx/assets/fonts/kopub-world/KoPubWorld-Batang-Medium.woff2") format("woff2");
            font-style: normal;
            font-weight: 500;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: var(--site-game-height, 100dvh);
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Malgun Gothic', sans-serif;
            background:
                linear-gradient(rgba(30, 18, 10, 0.24), rgba(18, 10, 7, 0.48)),
                url('/learning/games/sphinx/assets/images/background.webp') center / cover fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at center, rgba(247, 205, 120, 0.10), transparent 36%),
                radial-gradient(circle at center, transparent 25%, rgba(18, 8, 4, 0.64) 100%);
        }

        .game-frame {
            width: min(960px, 100%);
            min-height: 580px;
            display: grid;
            grid-template-columns: 315px minmax(0, 1fr);
            position: relative;
            overflow: hidden;
            border: 4px double #b4863f;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.035), transparent 25%),
                linear-gradient(180deg, rgba(52, 25, 17, 0.98), rgba(25, 12, 11, 0.99));
            box-shadow:
                0 0 0 5px #2b1809,
                0 25px 65px rgba(0,0,0,0.72),
                inset 0 0 45px rgba(0,0,0,0.55);
        }

        .game-frame::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(232, 196, 120, 0.18);
            pointer-events: none;
        }

        .sphinx-panel {
            min-height: 580px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 34px 20px;
            border-right: 1px solid rgba(232, 196, 120, 0.26);
            background:
                radial-gradient(ellipse at 50% 45%, rgba(225, 169, 68, 0.20), transparent 45%),
                linear-gradient(180deg, rgba(21, 25, 30, 0.77), rgba(34, 13, 10, 0.94));
        }

        .sphinx-panel::before {
            content: "";
            position: absolute;
            width: 270px;
            height: 220px;
            border: 1px solid rgba(232, 196, 120, 0.34);
            box-shadow:
                0 0 0 8px rgba(97, 58, 20, 0.15),
                0 0 38px rgba(232, 196, 120, 0.14);
            pointer-events: none;
        }

        .sphinx-image {
            width: min(270px, 96%);
            aspect-ratio: 16 / 9;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 1px solid #a57631;
            box-shadow:
                0 12px 22px rgba(0,0,0,0.48),
                0 0 18px rgba(232,196,120,0.15);
        }

        .sphinx-name {
            width: min(250px, 88%);
            position: relative;
            z-index: 3;
            margin-top: 2px;
            padding: 9px 12px;
            border: 1px solid #a57631;
            color: #eccb83;
            background: linear-gradient(180deg, rgba(78,32,22,0.97), rgba(37,13,11,0.99));
            text-align: center;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 2px 3px #000;
        }

        .quiz-container {
            min-width: 0;
            min-height: 580px;
            padding: 28px 31px 23px;
            display: flex;
            flex-direction: column;
            position: relative;
            text-align: center;
        }

        .quiz-title {
            margin-bottom: 17px;
            padding-bottom: 13px;
            border-bottom: 1px solid rgba(232, 196, 120, 0.30);
            color: #ebca81;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 31px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 3px 5px #000;
        }

        #display-area {
            flex: 1;
            min-height: 385px;
            padding: 23px 23px 20px;
            position: relative;
            color: #2b1c0e;
            border: 2px solid #906832;
            background-color: #ecdba7;
            background-image:
                linear-gradient(rgba(255, 250, 234, 0.46), rgba(255, 250, 234, 0.30)),
                url('/learning/games/sphinx/assets/images/papyrus.webp');
            background-position: center, center;
            background-size: cover, cover;
            background-repeat: no-repeat, no-repeat;
            background-blend-mode: normal, multiply;
            box-shadow:
                inset 0 0 24px rgba(78, 43, 14, 0.18),
                0 10px 20px rgba(0,0,0,0.27);
        }

        #display-area::before,
        #display-area::after {
            content: "◆";
            position: absolute;
            color: #8c6228;
            font-size: 15px;
        }

        #display-area::before {
            top: 7px;
            left: 10px;
        }

        #display-area::after {
            right: 10px;
            bottom: 7px;
        }

        .question-text {
            min-height: 105px;
            margin-bottom: 16px;
            padding: 5px 10px 0;
            color: #25180c;
            text-shadow: 0 1px 0 rgba(255, 255, 244, 0.42);
            white-space: pre-wrap;
            text-align: left;
            word-break: keep-all;
            font-family: "Sphinx KoPubWorld Batang", "Noto Serif KR", Batang, serif;
            font-size: clamp(15px, 1.6vw, 17px);
            font-weight: 700;
            font-synthesis: weight;
            line-height: 1.75;
        }

        .options-container {
            width: min(430px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .quiz-btn {
            min-height: 44px;
            padding: 9px 12px;
            cursor: pointer;
            color: #fff4da;
            border: 1px solid #79511c;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.17), transparent),
                #674019;
            font-size: 15px;
            font-weight: bold;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.22),
                0 3px 5px rgba(49,24,6,0.22);
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .quiz-btn:hover {
            border-color: #dfae53;
            background-color: #8b5b22;
            transform: translateY(-2px);
        }

        .quiz-btn:active {
            transform: translateY(1px);
        }

        .confirm-btn {
            width: min(180px, 100%);
            max-width: none;
            margin: 20px auto 0;
            display: block;
        }

        .sphinx-coach {
            margin: 0 auto 14px;
            padding: 11px 14px;
            border: 1px solid rgba(144, 104, 50, 0.55);
            border-radius: 8px;
            background: rgba(255, 248, 228, 0.86);
            color: #2b1c0e;
            text-align: left;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .sphinx-coach-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .sphinx-summary-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .sphinx-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid rgba(144, 104, 50, 0.45);
            background: rgba(236, 219, 167, 0.9);
            color: #3a2310;
            font-size: 12.5px;
            font-weight: 700;
        }

        .sphinx-hint-toggle {
            min-height: 34px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #8b5b22;
            background: linear-gradient(180deg, #fff3cf, #e5c478);
            color: #3a210c;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .sphinx-hint-toggle:hover {
            background: linear-gradient(180deg, #fff8e2, #edd089);
        }

        .sphinx-steps {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(144, 104, 50, 0.45);
        }

        .sphinx-steps[hidden] {
            display: none;
        }

        .sphinx-steps ol {
            margin: 6px 0 0;
            padding-left: 20px;
        }

        .sphinx-steps li {
            margin: 5px 0;
        }

        .sphinx-retry-notice {
            margin: 0 0 8px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(180, 45, 30, 0.13);
            border: 1px solid rgba(180, 45, 30, 0.4);
            color: #7a1c12;
            font-weight: 700;
            font-size: 13px;
        }

        .sphinx-rule-card {
            margin: 8px 0;
            padding: 9px 12px;
            border-radius: 7px;
            background: rgba(255, 248, 228, 0.78);
            border: 1px solid rgba(144, 104, 50, 0.4);
            font-size: 13.5px;
            line-height: 1.6;
        }

        .sphinx-rule-card strong {
            color: #5a2d0c;
        }

        .sphinx-rule-card p { margin: 8px 0; }
        .sphinx-rule-card details { margin-top: 10px; }
        .sphinx-rule-card summary { cursor: pointer; font-weight: 700; color: #5a2d0c; }
        .sphinx-rule-card ol { padding-left: 22px; margin: 8px 0; }
        .sphinx-rule-card li + li { margin-top: 7px; }

        .solo-rules-dialog.sphinx-rules-dialog {
            padding: 24px;
            color: #2b1c0e;
            border: 2px solid #906832;
            background: #ecdba7 url('/learning/games/sphinx/assets/images/papyrus.webp') center / cover;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .sphinx-rules-dialog .question-text {
            min-height: 0;
            margin: 0 0 16px;
            padding: 0;
            text-align: center;
        }

        .volume-control {
            margin-top: 15px;
            padding: 10px 12px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            color: #c9a86f;
            border: 1px solid rgba(232, 196, 120, 0.20);
            background: rgba(0,0,0,0.22);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
        }

        .vol-btn {
            padding: 5px 11px;
            cursor: pointer;
            color: #edcf91;
            border: 1px solid #856027;
            background: #3a1813;
            font-size: 11px;
            font-weight: bold;
        }

        .vol-bar {
            display: flex;
            gap: 3px;
        }

        .bar-segment {
            width: 18px;
            height: 16px;
            padding: 0;
            cursor: pointer;
            border: 1px solid #76501e;
            background: #1a100d;
        }

        .bar-segment.active-1 {
            background: #72501f;
        }

        .bar-segment.active-2 {
            background: #986522;
        }

        .bar-segment.active-3 {
            background: #bf812d;
        }

        .bar-segment.active-4 {
            background: #e29f3d;
        }

        .bar-segment.active-5 {
            background: #f3cf78;
            box-shadow: 0 0 6px rgba(243,207,120,0.45);
        }

        @media (max-width: 760px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            .game-frame {
                min-height: var(--site-game-height, 100dvh);
                grid-template-columns: 1fr;
                border-left: 0;
                border-right: 0;
            }

            .sphinx-panel {
                min-height: 245px;
                padding: 20px 16px 16px;
                border-right: 0;
                border-bottom: 1px solid rgba(232, 196, 120, 0.26);
            }

            .sphinx-panel::before {
                width: 245px;
                height: 175px;
            }

            .sphinx-image {
                width: 245px;
                max-height: none;
                object-fit: cover;
            }

            .sphinx-name {
                width: min(330px, 92%);
                padding: 7px 10px;
            }

            .quiz-container {
                min-height: auto;
                padding: 21px 15px 20px;
            }

            #display-area {
                min-height: 420px;
                padding: 20px 16px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .volume-control {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }

/* iPad·터치 기기 공통 보완 */
button,
input,
select,
textarea,
[onclick],
.set-card,
.point,
.piece,
.gem,
.coin,
.pole,
.disk,
.quiz-btn,
.action-btn,
.option-btn,
.small-btn,
.primary-btn,
.secondary-btn,
.danger-btn,
.tab,
.room-tab,
.seg,
.music-segment,
.vol-block,
.diff-btn {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

@media (pointer: coarse) {
    button,
    .action-btn,
    .option-btn,
    .small-btn,
    .primary-btn,
    .secondary-btn,
    .danger-btn,
    .tab,
    .room-tab,
    .quiz-btn,
    .diff-btn {
        min-height: 44px;
    }

    input,
    select,
    textarea {
        font-size: 16px; /* iOS Safari 자동 확대 방지 */
    }

    .point,
    .set-card,
    .gem,
    .coin,
    .pole,
    .disk {
        cursor: pointer;
    }
}

.tablet-landscape-hint { display: none !important; }

@media (pointer: coarse) and (orientation: portrait) and (max-width: 900px) {
    .tablet-landscape-hint {
        display: block;
        position: fixed;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 10000;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 8px 12px;
        border: 1px solid rgba(240, 215, 124, .65);
        border-radius: 7px;
        background: rgba(5, 7, 11, .90);
        color: #fff4cc;
        font: 12px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        text-align: center;
        box-shadow: 0 5px 18px rgba(0,0,0,.45);
        pointer-events: none;
    }
}


/* TODAY’S FINISHERS */
.player-entry {
    width: min(420px, 100%);
    margin: 0 auto 14px;
    text-align: left;
}
.player-entry label {
    display: block;
    margin-bottom: 6px;
    color: #b4c6da;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}
.player-name-input {
    width: 100%;
    min-height: 43px;
    padding: 9px 12px;
    border: 1px solid #8a6c2d;
    background: rgba(4, 8, 13, .82);
    color: #f3e7c4;
    text-align: center;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    font-weight: bold;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
}
.player-name-input:focus {
    border-color: #f0d77c;
    box-shadow: 0 0 0 2px rgba(240, 215, 124, .15);
}
.player-name-help {
    min-height: 18px;
    margin-top: 5px;
    color: #9aa7b7;
    font: 12px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    text-align: center;
}
.player-name-help.error { color: #e0786f; }

.finishers-panel {
    width: min(460px, 100%);
    margin: 14px auto;
    padding: 11px 13px;
    border: 1px solid rgba(198, 170, 85, .34);
    background: rgba(2, 5, 9, .54);
    color: #e7e0ce;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.finishers-title {
    margin-bottom: 8px;
    color: #f0d77c;
    font: bold 13px/1.3 Georgia, "Times New Roman", serif;
    letter-spacing: 1.4px;
    text-align: center;
}
.finishers-list {
    max-height: 132px;
    overflow-y: auto;
}
.finisher-row {
    display: grid;
    grid-template-columns: 46px minmax(54px, .75fr) minmax(110px, 1.4fr);
    gap: 8px;
    align-items: center;
    padding: 5px 3px;
    border-top: 1px solid rgba(198, 170, 85, .13);
    font-size: 12px;
}
.finisher-row:first-child { border-top: 0; }
.finisher-time { color: #91a0b3; font-family: Consolas, monospace; }
.finisher-name {
    overflow: hidden;
    color: #fff0b6;
    font-weight: bold;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.finisher-difficulty {
    overflow: hidden;
    color: #cbd4df;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.finisher-empty {
    padding: 8px 4px;
    color: #8e9bab;
    font-size: 12px;
    text-align: center;
}
.result-finishers {
    margin-top: 14px;
}


/* 이름 입력·클리어 명단 컴팩트 보정 */
.player-entry {
    width: min(340px, 100%);
    margin: 0 auto 9px;
}
.player-entry label {
    margin-bottom: 4px;
    font-size: 11px;
}
.player-name-input {
    min-height: 36px;
    padding: 6px 10px;
    font-size: 16px;
}
.player-name-help {
    min-height: 15px;
    margin-top: 3px;
    font-size: 11px;
}
.finishers-panel {
    width: min(390px, 100%);
    margin: 9px auto;
    padding: 8px 10px;
}
.finishers-title {
    margin-bottom: 5px;
    font-size: 12px;
}
.finishers-list {
    max-height: 92px;
}
/* 처음 화면의 오늘 명단은 화면에 남는 높이만큼 길게 보인다(세 줄에서 끊지 않는다). */
.finishers-panel:not(.result-finishers) .finishers-list {
    max-height: clamp(92px, calc(100dvh - 530px), 420px);
}
.finisher-row {
    grid-template-columns: 42px minmax(48px, .7fr) minmax(96px, 1.35fr);
    gap: 6px;
    padding: 3px 2px;
    font-size: 11px;
}
.finisher-empty {
    padding: 5px 3px;
    font-size: 11px;
}
.result-finishers {
    margin-top: 8px;
}


.finishers-side-panel {
    background:
        linear-gradient(rgba(24, 12, 6, .90), rgba(12, 6, 3, .94)),
        url('../../../assets/images/mainbg2.webp') center / cover;
    border: 3px solid #bba16b;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
    border-radius: 16px;
    padding: 20px 18px;
}

@media (max-width: 760px), (pointer: coarse) {
    .volume-control {
        display: none !important;
    }
}


/* Compact Chromebook and iPad landscapes start at the top; tall desktops balance the start screen. */
@media (min-width:761px) and (max-width:900px), (min-width:761px) and (max-height:860px){
body{align-items:flex-start;padding:8px}
}
@media (min-width:901px) and (min-height:861px){
body{align-items:center;padding:18px}
}
</style>

<style>@media(min-width:700px){body{box-sizing:border-box;padding:12px;min-height:var(--site-game-height, 100dvh)}.game-frame{height:calc(var(--site-game-height, 100dvh) - 24px);min-height:0}.quiz-container{min-height:0;padding:14px;overflow:auto}#display-area{min-height:250px;padding:14px}}</style><link rel="stylesheet" href="../../../assets/network/single-player-entry.css?v=20261121-rules">

<body data-game-navigation="single-player" data-entry-game="sphinx">
<audio id="bgm" src="/learning/games/sphinx/assets/sound/bgm.ogg" loop preload="auto"></audio>

<div class="game-frame">
    <aside class="sphinx-panel">
        <img class="sphinx-image" src="/learning/games/sphinx/assets/images/sphinx.webp" alt="스핑크스">
        <div class="sphinx-name">SPHINX</div>
    </aside>

    <div class="quiz-container">
        <div class="quiz-title">SPHINX</div>
        <div class="race-info" id="raceInfo" hidden>TIME <strong id="raceTimer">00:00</strong></div>
        <div id="display-area"></div>
        <div class="race-standings" id="raceStandings" hidden></div>

        <div class="volume-control">
            <span>MUSIC VOLUME</span>
            <button class="vol-btn" onclick="toggleMute()">MUTE</button>
            <div class="vol-bar">
                <div class="bar-segment" onclick="setVolume(0.2, 1)"></div>
                <div class="bar-segment" onclick="setVolume(0.4, 2)"></div>
                <div class="bar-segment" onclick="setVolume(0.6, 3)"></div>
                <div class="bar-segment" onclick="setVolume(0.8, 4)"></div>
                <div class="bar-segment" onclick="setVolume(1.0, 5)"></div>
            </div>
        </div>
        <button class="quiz-btn solo-only" type="button" onclick="location.href='../../../'" style="margin-top:10px;">메인 화면으로</button>
    </div>
</div>

<aside class="finishers-panel finishers-side-panel" id="today-finishers-panel">
    <div class="finishers-title">🏆 FINISHERS</div>
    <div class="finishers-list" id="today-finishers-list"></div>
</aside>
<style>
/* 순위전(puzzle-race.js): 힌트는 틀렸을 때만 열리고, 메인 화면 단추 대신 경주로를 둔다. */
body.pr-racing .sphinx-hint-toggle, body.pr-racing .solo-only { display: none !important; }
.race-info { margin: 0 0 8px; font-weight: 800; letter-spacing: .08em; text-align: center; }
.race-info[hidden], .race-standings[hidden] { display: none; }
.race-standings { margin: 12px auto 0; max-width: 520px; text-align: left; }
.race-start { margin: 6px 0 0; }
</style>

<script>
    let currentStage = 0, difficulty = 5, currentAnswer = "";
    const displayArea = document.getElementById('display-area');
    const bgm = document.getElementById('bgm');

    const FINISHER_GAME_ID = "sphinx";
    const KOREAN_NAME_PATTERN = /^[가-힣]{2,6}$/;
    let playerName = "";
    let usedSoloHint = false;

    function escapeFinisherHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeKoreanName(value) {
        return String(value || "").replace(/[^가-힣]/g, "").slice(0, 6);
    }

    function isValidKoreanName(value) {
        return KOREAN_NAME_PATTERN.test(String(value || ""));
    }

    function getSavedPlayerName() {
        const handedOff = normalizeKoreanName(new URLSearchParams(window.location.search).get("name") || "");
        if (isValidKoreanName(handedOff)) return handedOff;

        let saved = "";
        try {
            saved = normalizeKoreanName((window.CLASS_PLAYER_NAME || "") || "");
        } catch (error) {
            // The home-page handoff still works when browser storage is unavailable.
        }
        return isValidKoreanName(saved) ? saved : "";
    }

    const finisherBoard = ClassroomFinisherBoard.create({
        gameId: FINISHER_GAME_ID,
        getPlayerName: () => playerName,
        isValidPlayerName: isValidKoreanName
    });
    function loadTodayFinishers(targetId = "today-finishers-list") { return finisherBoard.load(targetId); }
    function registerFinisher(difficulty, rank) {
        return finisherBoard.register({ difficulty, rank, usedHint: usedSoloHint });
    }

    function initializePlayerEntry() {
        playerName = getSavedPlayerName();
    }
    bgm.loop = true;

    document.body.addEventListener('click', () => { if(bgm.paused) bgm.play(); }, { once: true });

    function setVolume(val, level) {
        bgm.volume = val;
        const segments = document.querySelectorAll('.bar-segment');
        segments.forEach((seg, i) => {
            seg.className = 'bar-segment';
            if (i < level) seg.classList.add('active-' + level);
        });
    }

    function toggleMute() { bgm.muted = !bgm.muted; }
    setVolume(0.6, 3);

    // 순위전에서는 방장이 정한 씨앗으로 모두 같은 숫자의 문제를 받는다.
    let randomSource = Math.random;
    function seededRandom(seed) {
        let x = (seed >>> 0) || 1;
        return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
    }
    function getRandomInt(min, max) { return Math.floor(randomSource() * (max - min + 1)) + min; }

    function loadQuestion() {
        if (currentStage === 0) {
            document.getElementById('today-finishers-panel')?.style.removeProperty('display');
            displayArea.innerHTML = `
                <div class="question-text">${playerName ? `PLAYER · ${escapeFinisherHtml(playerName)}` : "<스핑크스> 도전할 자는 이름과 실력을 밝혀라."}</div>
                <div class="player-entry">
                    <div class="player-name-help" id="player-name-help">이름이 없습니다. 메인 화면에서 이름을 먼저 저장해 주세요.</div>
                    <button class="quiz-btn" type="button" onclick="location.href='../../../'">메인 화면으로</button>
                </div>
                <div class="options-container" data-game-entry>
                    <button class="quiz-btn" data-difficulty-button onclick="setDiff(5)">Start · Beginner</button>
                    <button class="quiz-btn" data-difficulty-button onclick="setDiff(10)">Start · Advanced</button>
                    <button data-game-rules class="quiz-btn" type="button" onclick="showSphinxRules()">Rules</button>
                    <button class="quiz-btn race-start" type="button" onclick="race.open()" ${playerName ? "" : "hidden"}>순위전</button>
                </div>`;
            if (playerName) window.ClassroomSoloAvatar.show(displayArea.querySelector(".question-text"));
            const playerEntry = document.querySelector(".player-entry");
            document.querySelectorAll("[data-difficulty-button]").forEach(button => {
                button.disabled = !isValidKoreanName(playerName);
            });
            if (playerName && playerEntry) {
                playerEntry.style.display = "none";
            }
            loadTodayFinishers();
            return;
        }

        document.getElementById('today-finishers-panel')?.style.setProperty('display', 'none');

        const standardOptions = Array.from({length: difficulty}, (_, i) => `${i + 1}마리`);
        let qText = "", ans = "", coachHtml = "";

        if (currentStage === 1) {
            qText = "<스핑크스> 아침에는 4개의 다리, 낮에는 2개의 다리, 밤에는 3개의 다리로 걷는 괴물은?";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">🌅 아침 = 다리 4개</span>
                            <span class="sphinx-badge">☀️ 낮 = 다리 2개</span>
                            <span class="sphinx-badge">🌙 밤 = 다리 3개</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 힌트</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 힌트</strong>
                        <ol>
                            <li><strong>아침(아기 때):</strong> 네 발(손과 무릎 <strong>4개</strong>)로 기어 다녀요.</li>
                            <li><strong>낮(어른이 되면):</strong> 두 발(<strong>2개</strong>)로 걸어 다녀요.</li>
                            <li><strong>밤(할머니·할아버지가 되면):</strong> 두 발에 <strong>지팡이 1개</strong>를 짚어 <strong>3개</strong>로 걸어요.</li>
                            <li>즉 이 수수께끼의 정답은 스핑크스 앞에 서 있는 사람, 바로 <strong>「자신」</strong>이에요!</li>
                        </ol>
                    </div>
                </div>`;
            let html = `<div class="question-text">${qText}</div>${coachHtml}<div class="options-container">`;
            ["스핑크스", "자신", "기타", "없다", "모른다", "무시한다", "도망간다"].forEach(o => html += `<button class="quiz-btn" onclick="check('${o}', '자신')">${o}</button>`);
            displayArea.innerHTML = html + `</div>`;
            return;
        }

        if (currentStage === 2) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(1, difficulty);
            const total = x + y, legs = 4 * x + 2 * y;
            const baseLegs = total * 2, extraLegs = legs - baseLegs;
            qText = `<스핑크스> 그럼 그대에게 묻겠다.\n다리가 4개 있는 괴물과 2개 있는 괴물이 ${total}마리 있다. 그 다리는 합쳐서 ${legs}개가 있다.\n그러면 다리가 4개있는 괴물은 몇 마린가?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">📋 전체 괴물: ${total}마리</span>
                            <span class="sphinx-badge">🦵 전체 다리: ${legs}개</span>
                            <span class="sphinx-badge">❓ 다리 4개 괴물 = 몇 마리?</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 힌트</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (모두 다리 2개라고 상상하기)</strong>
                        <ol>
                            <li>먼저 <strong>${total}마리 모두 다리가 2개</strong>라고 상상해 봐요: <strong>${total} × 2 = ${baseLegs}개</strong></li>
                            <li>실제 다리는 <strong>${legs}개</strong>니까, 다리가 <strong>${legs} − ${baseLegs} = ${extraLegs}개</strong> 남아요!</li>
                            <li>다리 4개 괴물은 다리 2개 괴물보다 다리가 <strong>2개씩 더 많아요.</strong></li>
                            <li>남은 다리 <strong>${extraLegs}개</strong>를 <strong>2개씩 묶어서</strong> 붙여 주면(<strong>${extraLegs} ÷ 2</strong>) 다리 4개 괴물이 몇 마리인지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else if (currentStage === 3) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(3, difficulty);
            const initLegs = 4 * x + 2 * y;
            const laterLegs = 2 * x + 2 * (y - 2) + 3 * 2;
            const expectedIfNoShrink = initLegs + 2;
            const lostLegs = expectedIfNoShrink - laterLegs;
            qText = `<스핑크스> 다시 그대에게 묻겠다.\n다리가 4개와 2개 있는 괴물의 다리를 합쳐서 ${initLegs}개가 있다. 세월이 지나서 다리 4개의 괴물은 모두 다리가 2개가 되고, 2개의 다리를 가지고 있는 것 중 2마리는 3개의 다리가 되었다. 괴물들의 다리를 모두 합치니 ${laterLegs}개가 되었다. 처음에 다리가 4개 있었던 괴물은 몇 마리였느냐?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">처음 다리: ${initLegs}개</span>
                            <span class="sphinx-badge">나중 다리: ${laterLegs}개</span>
                            <span class="sphinx-badge">변화: 4발→2발, 2마리는 2발→3발(+2개)</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 힌트</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (바뀐 다리 수만 비교하기)</strong>
                        <ol>
                            <li>다리 2개짜리 <strong>2마리</strong>가 다리 3개가 되었으니, 여기서 다리가 <strong>2개 늘어났어요</strong> (안 줄었다면 <strong>${initLegs} + 2 = ${expectedIfNoShrink}개</strong>).</li>
                            <li>그런데 나중 다리는 <strong>${laterLegs}개</strong>뿐이에요! 다리가 <strong>${expectedIfNoShrink} − ${laterLegs} = ${lostLegs}개</strong> 줄어들었어요.</li>
                            <li>왜 줄었을까요? <strong>다리 4개짜리가 다리 2개로 변하면서 1마리당 다리가 2개씩 줄었기 때문</strong>이에요!</li>
                            <li>줄어든 다리 <strong>${lostLegs}개</strong>를 <strong>2개씩 나누면(${lostLegs} ÷ 2)</strong> 처음 다리 4개 괴물이 몇 마리였는지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else if (currentStage === 4) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(5, difficulty);
            const initLegs = 4 * x + 2 * y;
            const laterLegs = 2 * x + 2 * (y - 4) + 3 * 4 + 4 * (2 * x);
            const withoutCane = laterLegs - 4;
            const gainedLegs = withoutCane - initLegs;
            qText = `<스핑크스> 마지막으로 그대에게 묻겠다.\n다리가 4개와 2개 있는 괴물의 다리를 합쳐서 ${initLegs}개가 있다. 세월이 지나서 4개의 다리를 가진 괴물은 모두 다리가 2개로 성장하고, 다리가 2개 있는 괴물중 4마리는 다리가 3개가 되었다. 게다가 다리가 4개였던 괴물의 2배가 되는 4개의 다리를 가지는 괴물이 새로이 태어났다. 괴물들의 다리를 다 합쳐 ${laterLegs}개가 있다. 그러면 처음에 다리가 4개 있었던 괴물은 몇 마리였느냐?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">처음 다리: ${initLegs}개</span>
                            <span class="sphinx-badge">나중 다리: ${laterLegs}개</span>
                            <span class="sphinx-badge">4마리 다리 +4개 / 4발 1마리당 아기 4발 2마리 탄생</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 힌트</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (1마리당 늘어난 다리 묶기)</strong>
                        <ol>
                            <li>먼저 다리 2개짜리 <strong>4마리</strong>가 다리 3개가 되며 늘어난 <strong>4개</strong>를 나중 다리에서 빼요: <strong>${laterLegs} − 4 = ${withoutCane}개</strong></li>
                            <li>처음 다리(<strong>${initLegs}개</strong>)와 비교하면 다리가 <strong>${withoutCane} − ${initLegs} = ${gainedLegs}개</strong> 늘어났어요!</li>
                            <li>처음 4발 괴물 <strong>1마리</strong>마다: 자기 다리는 4개→2개로 <strong>2개 줄었지만(−2)</strong>, 4발 아기 괴물이 <strong>2마리 태어나 다리 8개가 생겨요(+8)</strong>. 즉 <strong>처음 4발 괴물 1마리당 다리가 꼭 6개씩(8 − 2 = 6) 늘어나요!</strong></li>
                            <li>늘어난 다리 <strong>${gainedLegs}개</strong>를 <strong>6개씩 묶으면(${gainedLegs} ÷ 6)</strong> 처음 4발 괴물이 몇 마리였는지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else { showResult(true); return; }

        let html = `<div class="question-text">${qText}</div>${coachHtml}<div class="options-container">`;
        standardOptions.forEach(o => html += `<button class="quiz-btn" onclick="check('${o}', '${ans}')">${o}</button>`);
        displayArea.innerHTML = html + `</div>`;
    }

    function toggleSphinxHint(forceOpen = false) {
        const steps = document.getElementById("sphinxSteps");
        const btn = document.getElementById("sphinxHintBtn");
        if (!steps) return;
        const nextHidden = forceOpen ? false : !steps.hidden;
        if (!nextHidden && !race.active) usedSoloHint = true;
        steps.hidden = nextHidden;
        if (btn) btn.textContent = nextHidden ? "💡 힌트" : "▲ 힌트 접기";
    }

    function showSphinxRules() {
        const dialog = document.createElement('dialog');
        dialog.className = 'solo-rules-dialog sphinx-rules-dialog';
        dialog.setAttribute('aria-label', 'HOW TO PLAY');
        dialog.innerHTML = `
            <h2 class="question-text" tabindex="-1" autofocus>HOW TO PLAY</h2>
            <div style="text-align:left;line-height:1.65;margin:10px auto;max-width:640px">
                <p style="margin:0 0 8px;">네 질문을 차례로 풀어 스핑크스에게 도전하세요. <strong>동그라미와 다리 선을 그려 보고, 수가 바뀌는 규칙을 찾아보세요.</strong> 찾은 방법이 다른 수에서도 맞는지 확인해 보세요.</p>
                <div class="sphinx-rule-card">
                    <strong>1단계 · 말의 뜻을 바꾸어 생각하기</strong>
                    <p>같은 존재가 아침에는 네 발, 낮에는 두 발, 밤에는 세 발로 걸어요. 여기서 아침·낮·밤은 무엇을 빗댄 말일까요?</p>
                    <details><summary>생각을 이어 가는 질문</summary>
                        <ol>
                            <li>하루의 흐름을 아주 긴 시간으로 늘려 상상해 보세요. 처음·한창·마지막에는 어떤 변화가 있을까요?</li>
                            <li>걷는 모습을 떠올려 보세요. 몸의 다른 부분이나 도구가 땅을 짚는 수도 함께 셀 수 있을까요?</li>
                            <li>떠올린 존재가 세 조건을 모두 만족하는지 한 가지씩 확인해 보세요.</li>
                        </ol>
                    </details>
                </div>
                <div class="sphinx-rule-card">
                    <strong>2단계 · 한 마리씩 바꾸며 규칙 찾기</strong>
                    <p>괴물이 모두 5마리라고 해 보세요. 다리가 4개인 괴물이 한 마리씩 늘어나면 전체 다리 수는 어떻게 바뀔까요?</p>
                    <details><summary>그림으로 실험하기</summary>
                        <ol>
                            <li>동그라미 5개에 다리를 2개씩 그리세요. 전체 다리는 몇 개인가요?</li>
                            <li>한 마리의 다리를 4개로 바꾸어 세어 보세요. 한 마리를 더 바꾸면 어떻게 되나요?</li>
                            <li>4발 괴물이 0마리·1마리·2마리일 때의 전체 다리 수를 나란히 적어 보세요. 일정하게 늘어나는 수를 찾았나요?</li>
                            <li>문제의 전체 다리 수까지 몇 번 바꾸어야 할까요? 그 횟수는 무엇을 뜻할까요?</li>
                        </ol>
                        <details><summary>찾은 방법 확인하기</summary>
                            <p>구한 수만큼 4발 괴물을 그리고, 나머지는 2발로 그려 보세요. 괴물 수와 다리 수가 문제의 두 조건에 모두 맞나요? 괴물이 6마리일 때도 같은 방법을 써 보세요.</p>
                        </details>
                    </details>
                </div>
                <div class="sphinx-rule-card">
                    <strong>3단계 · 두 가지 변화를 나누어 살펴보기</strong>
                    <p>4발이 2발이 되는 변화와, 두 마리가 2발에서 3발이 되는 변화가 함께 일어나요. 각각 전체 다리 수에 어떤 영향을 줄까요?</p>
                    <details><summary>한 가지 변화씩 따라가기</summary>
                        <ol>
                            <li>4발 괴물 한 마리가 2발이 되는 그림을 그리세요. 두 마리라면 다리는 얼마나 달라질까요?</li>
                            <li>이번에는 2발 괴물 두 마리만 3발로 바꾸세요. 이 변화만 일어난다면 처음 다리 수는 어떻게 될까요?</li>
                            <li>그때 예상한 다리 수와 문제의 나중 다리 수를 비교해 보세요. 그 차이는 어떤 변화가 만든 것일까요?</li>
                            <li>한 마리가 변할 때의 차이를 몇 묶음 모아야 그 차이가 될까요? 묶음 수로 무엇을 알 수 있나요?</li>
                        </ol>
                        <details><summary>찾은 방법 확인하기</summary>
                            <p>처음에 4발 괴물이 1마리인 경우와 2마리인 경우를 만들어 두 변화를 모두 적용해 보세요. 찾은 방법으로 처음 마리 수를 되짚을 수 있나요?</p>
                        </details>
                    </details>
                </div>
                <div class="sphinx-rule-card">
                    <strong>4단계 · 한 가족의 변화를 한 묶음으로 보기</strong>
                    <p>처음 4발 괴물 한 마리가 자라고, 그 한 마리마다 4발 아기 둘이 태어나요. 처음 한 마리를 기준으로 보면 전체 다리 수는 얼마나 달라질까요?</p>
                    <details><summary>작은 경우부터 표로 만들기</summary>
                        <ol>
                            <li>처음 4발 괴물 한 마리의 다리 수를 적으세요. 자란 뒤의 다리와 새로 태어난 아기 둘의 다리를 함께 세어 비교하세요.</li>
                            <li>처음 4발 괴물이 2마리·3마리인 경우도 그리세요. 처음과 나중 다리 수의 차이를 표로 만들면 어떤 규칙이 보이나요?</li>
                            <li>문제에는 2발 괴물 네 마리가 3발이 되는 변화도 있어요. 이 변화로 늘어난 다리를 따로 떼어 생각하려면 나중 다리 수를 어떻게 다루어야 할까요?</li>
                            <li>남은 다리 수의 변화를 한 가족의 변화만큼씩 묶어 보세요. 묶음 수가 처음 4발 괴물 수가 되는 이유를 설명해 보세요.</li>
                        </ol>
                        <details><summary>찾은 방법 확인하기</summary>
                            <p>구한 마리 수로 성장·아기 탄생·3발로 바뀌기를 모두 따라가 보세요. 나중 다리 수가 맞나요? 친구에게 계산 순서와 그 순서가 필요한 이유를 말해 보세요.</p>
                        </details>
                    </details>
                </div>
                <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(147,103,45,.35); color:#1c130a; font-size:12px; line-height:1.5; text-align:center;">
                    문제 화면의 <strong>「💡 힌트」</strong> 버튼을 누르면 그 문제의 숫자로 한 걸음씩 계산 순서를 보여줍니다.<br>
                    이 퍼즐은 고전 게임 <strong>《대항해시대 III》</strong>의 스핑크스 이벤트에서 착안해 교육용으로 재구성했습니다.
                </div>
            </div>
            <div class="options-container"><button class="quiz-btn" type="button" data-rules-close>확인</button></div>`;
        dialog.querySelector('[data-rules-close]').addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
        dialog.addEventListener('close', () => dialog.remove(), { once: true });
        document.body.append(dialog);
        dialog.showModal();
    }

    function setDiff(d) {
        if (!isValidKoreanName(playerName)) {
            const input = document.getElementById("player-name");
            if (input) input.focus();
            return;
        }
        difficulty = d;
        usedSoloHint = false;
        currentStage = 1;
        loadQuestion();
    }
    function check(s, a) {
        if (racePaused || raceDone) return;
        if (s === a) {
            currentStage++;
            if (race.active) race.progress(currentStage - 1, 4);
            loadQuestion();
            return;
        }
        if (race.active) {
            raceElapsed += RACE_WRONG_PENALTY;
            document.getElementById('raceTimer').textContent = fmtTime(raceElapsed);
        }
        const retryBox = document.getElementById("sphinxRetryBox");
        if (retryBox) {
            retryBox.innerHTML = `<p class="sphinx-retry-notice">앗, <strong>"${escapeFinisherHtml(s)}"</strong>은(는) 정답이 아니에요!${race.active ? ` (+${RACE_WRONG_PENALTY}초)` : ''} 아래 힌트를 보고 다시 골라 보세요.</p>`;
            toggleSphinxHint(true);
            return;
        }
        showResult(false);
    }
    function showResult(win) {
        if (win && race.active) {
            raceDone = true;
            stopRaceTimer();
            displayArea.innerHTML = `<div class="question-text" style="text-align:center;">&lt;스핑크스&gt; 그대의 예지를 칭송하리라. · ${fmtTime(raceElapsed)}</div>`;
            window.ClassGameSfx?.play('success');
            race.finish(raceElapsed);
            return;
        }
        displayArea.innerHTML = `
            <div class="question-text" style="text-align:center;">
                ${win ? "<스핑크스> 그대의 예지를 칭송하리라." : "<스핑크스> 성스러운 땅에 합당치 않은 자여! 물러가라!"}
            </div>
            ${win ? `<div class="finishers-panel result-finishers">
                <div class="finishers-title">🏆 FINISHERS</div>
                <div class="finishers-list" id="result-finishers-list"></div>
            </div>` : ""}
            <button class="quiz-btn confirm-btn" onclick="currentStage=0; loadQuestion();">처음으로</button>`;
        if (win) {
            const label = difficulty === 10 ? "고급 · 1~10마리" : "초급 · 1~5마리";
            registerFinisher(label, difficulty);
        }
    }

    /* 순위전 */
    const RACE_WRONG_PENALTY = 10;
    let racePaused = false, raceDone = false, raceElapsed = 0, raceTimerId = null;
    const fmtTime = t => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    function startRaceTimer() {
        if (raceTimerId) return;
        raceTimerId = setInterval(() => { raceElapsed += 1; document.getElementById('raceTimer').textContent = fmtTime(raceElapsed); }, 1000);
    }
    function stopRaceTimer() { clearInterval(raceTimerId); raceTimerId = null; }
    const gameFrame = document.querySelector('.game-frame');
    const race = ClassroomPuzzleRace.create({
        gameId: 'sphinx',
        title: 'SPHINX',
        settings: [{ key: 'difficulty', label: '난이도', options: [{ value: 5, label: 'Beginner · 1~5마리' }, { value: 10, label: 'Advanced · 1~10마리' }] }],
        getSettings: () => ({ difficulty }),
        createPuzzle: settings => ({ difficulty: Number(settings.difficulty), seed: Math.floor(Math.random() * 2 ** 31) + 1 }),
        hideSolo: () => { gameFrame.style.display = 'none'; },
        start: data => {
            gameFrame.style.display = '';
            difficulty = data.difficulty;
            randomSource = seededRandom(data.seed);
            raceDone = false;
            raceElapsed = 0;
            document.getElementById('raceTimer').textContent = '00:00';
            document.getElementById('raceInfo').hidden = false;
            currentStage = 1;
            loadQuestion();
            race.progress(0, 4);
        },
        pause: on => { racePaused = on; displayArea.style.visibility = on ? 'hidden' : ''; if (!on && !raceDone) startRaceTimer(); },
        stop: () => { raceDone = true; stopRaceTimer(); },
        exit: () => {
            raceDone = false; racePaused = false;
            randomSource = Math.random;
            displayArea.style.visibility = '';
            document.getElementById('raceInfo').hidden = true;
            gameFrame.style.display = '';
            currentStage = 0;
            loadQuestion();
        },
        standingsHost: () => document.getElementById('raceStandings')
    });

    initializePlayerEntry();
    loadQuestion();
</script>
</body>
</html>
