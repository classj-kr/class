<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>스핑크스 문제</title>
    <style>
        @font-face {
            font-family: "Sphinx KoPubWorld Batang";
            src: url("/learning/games/sphinx/assets/fonts/kopub-world/KoPubWorld-Batang-Medium.woff2") format("woff2");
            font-style: normal;
            font-weight: 500;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: var(--site-game-height, 100dvh);
            padding: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Malgun Gothic', sans-serif;
            background:
                linear-gradient(rgba(30, 18, 10, 0.24), rgba(18, 10, 7, 0.48)),
                url('/learning/games/sphinx/assets/images/background.webp') center / cover fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at center, rgba(247, 205, 120, 0.10), transparent 36%),
                radial-gradient(circle at center, transparent 25%, rgba(18, 8, 4, 0.64) 100%);
        }

        .game-frame {
            width: min(960px, 100%);
            min-height: 580px;
            display: grid;
            grid-template-columns: 315px minmax(0, 1fr);
            position: relative;
            overflow: hidden;
            border: 4px double #b4863f;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.035), transparent 25%),
                linear-gradient(180deg, rgba(52, 25, 17, 0.98), rgba(25, 12, 11, 0.99));
            box-shadow:
                0 0 0 5px #2b1809,
                0 25px 65px rgba(0,0,0,0.72),
                inset 0 0 45px rgba(0,0,0,0.55);
        }

        .game-frame::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(232, 196, 120, 0.18);
            pointer-events: none;
        }

        .sphinx-panel {
            min-height: 580px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 34px 20px;
            border-right: 1px solid rgba(232, 196, 120, 0.26);
            background:
                radial-gradient(ellipse at 50% 45%, rgba(225, 169, 68, 0.20), transparent 45%),
                linear-gradient(180deg, rgba(21, 25, 30, 0.77), rgba(34, 13, 10, 0.94));
        }

        .sphinx-panel::before {
            content: "";
            position: absolute;
            width: 270px;
            height: 220px;
            border: 1px solid rgba(232, 196, 120, 0.34);
            box-shadow:
                0 0 0 8px rgba(97, 58, 20, 0.15),
                0 0 38px rgba(232, 196, 120, 0.14);
            pointer-events: none;
        }

        .sphinx-image {
            width: min(270px, 96%);
            aspect-ratio: 16 / 9;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 1px solid #a57631;
            box-shadow:
                0 12px 22px rgba(0,0,0,0.48),
                0 0 18px rgba(232,196,120,0.15);
        }

        .sphinx-name {
            width: min(250px, 88%);
            position: relative;
            z-index: 3;
            margin-top: 2px;
            padding: 9px 12px;
            border: 1px solid #a57631;
            color: #eccb83;
            background: linear-gradient(180deg, rgba(78,32,22,0.97), rgba(37,13,11,0.99));
            text-align: center;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 2px 3px #000;
        }

        .quiz-container {
            min-width: 0;
            min-height: 580px;
            padding: 28px 31px 23px;
            display: flex;
            flex-direction: column;
            position: relative;
            text-align: center;
        }

        .quiz-title {
            margin-bottom: 17px;
            padding-bottom: 13px;
            border-bottom: 1px solid rgba(232, 196, 120, 0.30);
            color: #ebca81;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 31px;
            font-weight: bold;
            letter-spacing: 5px;
            text-shadow: 0 3px 5px #000;
        }

        #display-area {
            flex: 1;
            min-height: 385px;
            padding: 23px 23px 20px;
            position: relative;
            color: #2b1c0e;
            border: 2px solid #906832;
            background-color: #ecdba7;
            background-image:
                linear-gradient(rgba(255, 250, 234, 0.46), rgba(255, 250, 234, 0.30)),
                url('/learning/games/sphinx/assets/images/papyrus.webp');
            background-position: center, center;
            background-size: cover, cover;
            background-repeat: no-repeat, no-repeat;
            background-blend-mode: normal, multiply;
            box-shadow:
                inset 0 0 24px rgba(78, 43, 14, 0.18),
                0 10px 20px rgba(0,0,0,0.27);
        }

        #display-area::before,
        #display-area::after {
            content: "◆";
            position: absolute;
            color: #8c6228;
            font-size: 15px;
        }

        #display-area::before {
            top: 7px;
            left: 10px;
        }

        #display-area::after {
            right: 10px;
            bottom: 7px;
        }

        .question-text {
            min-height: 105px;
            margin-bottom: 16px;
            padding: 5px 10px 0;
            color: #25180c;
            text-shadow: 0 1px 0 rgba(255, 255, 244, 0.42);
            white-space: pre-wrap;
            text-align: left;
            word-break: keep-all;
            font-family: "Sphinx KoPubWorld Batang", "Noto Serif KR", Batang, serif;
            font-size: clamp(15px, 1.6vw, 17px);
            font-weight: 700;
            font-synthesis: weight;
            line-height: 1.75;
        }

        .options-container {
            width: min(430px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .quiz-btn {
            min-height: 44px;
            padding: 9px 12px;
            cursor: pointer;
            color: #fff4da;
            border: 1px solid #79511c;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.17), transparent),
                #674019;
            font-size: 15px;
            font-weight: bold;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.22),
                0 3px 5px rgba(49,24,6,0.22);
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .quiz-btn:hover {
            border-color: #dfae53;
            background-color: #8b5b22;
            transform: translateY(-2px);
        }

        .quiz-btn:active {
            transform: translateY(1px);
        }

        .confirm-btn {
            width: min(180px, 100%);
            max-width: none;
            margin: 20px auto 0;
            display: block;
        }

        .sphinx-coach {
            margin: 0 auto 14px;
            padding: 11px 14px;
            border: 1px solid rgba(144, 104, 50, 0.55);
            border-radius: 8px;
            background: rgba(255, 248, 228, 0.86);
            color: #2b1c0e;
            text-align: left;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .sphinx-coach-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .sphinx-summary-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .sphinx-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid rgba(144, 104, 50, 0.45);
            background: rgba(236, 219, 167, 0.9);
            color: #3a2310;
            font-size: 12.5px;
            font-weight: 700;
        }

        .sphinx-hint-toggle {
            min-height: 34px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid #8b5b22;
            background: linear-gradient(180deg, #fff3cf, #e5c478);
            color: #3a210c;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .sphinx-hint-toggle:hover {
            background: linear-gradient(180deg, #fff8e2, #edd089);
        }

        .sphinx-steps {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(144, 104, 50, 0.45);
        }

        .sphinx-steps[hidden] {
            display: none;
        }

        .sphinx-steps ol {
            margin: 6px 0 0;
            padding-left: 20px;
        }

        .sphinx-steps li {
            margin: 5px 0;
        }

        .sphinx-retry-notice {
            margin: 0 0 8px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(180, 45, 30, 0.13);
            border: 1px solid rgba(180, 45, 30, 0.4);
            color: #7a1c12;
            font-weight: 700;
            font-size: 13px;
        }

        .sphinx-rule-card {
            margin: 8px 0;
            padding: 9px 12px;
            border-radius: 7px;
            background: rgba(255, 248, 228, 0.78);
            border: 1px solid rgba(144, 104, 50, 0.4);
            font-size: 13.5px;
            line-height: 1.6;
        }

        .sphinx-rule-card strong {
            color: #5a2d0c;
        }

        .volume-control {
            margin-top: 15px;
            padding: 10px 12px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            color: #c9a86f;
            border: 1px solid rgba(232, 196, 120, 0.20);
            background: rgba(0,0,0,0.22);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
        }

        .vol-btn {
            padding: 5px 11px;
            cursor: pointer;
            color: #edcf91;
            border: 1px solid #856027;
            background: #3a1813;
            font-size: 11px;
            font-weight: bold;
        }

        .vol-bar {
            display: flex;
            gap: 3px;
        }

        .bar-segment {
            width: 18px;
            height: 16px;
            padding: 0;
            cursor: pointer;
            border: 1px solid #76501e;
            background: #1a100d;
        }

        .bar-segment.active-1 {
            background: #72501f;
        }

        .bar-segment.active-2 {
            background: #986522;
        }

        .bar-segment.active-3 {
            background: #bf812d;
        }

        .bar-segment.active-4 {
            background: #e29f3d;
        }

        .bar-segment.active-5 {
            background: #f3cf78;
            box-shadow: 0 0 6px rgba(243,207,120,0.45);
        }

        @media (max-width: 760px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            .game-frame {
                min-height: var(--site-game-height, 100dvh);
                grid-template-columns: 1fr;
                border-left: 0;
                border-right: 0;
            }

            .sphinx-panel {
                min-height: 245px;
                padding: 20px 16px 16px;
                border-right: 0;
                border-bottom: 1px solid rgba(232, 196, 120, 0.26);
            }

            .sphinx-panel::before {
                width: 245px;
                height: 175px;
            }

            .sphinx-image {
                width: 245px;
                max-height: none;
                object-fit: cover;
            }

            .sphinx-name {
                width: min(330px, 92%);
                padding: 7px 10px;
            }

            .quiz-container {
                min-height: auto;
                padding: 21px 15px 20px;
            }

            #display-area {
                min-height: 420px;
                padding: 20px 16px;
            }

            .options-container {
                grid-template-columns: 1fr;
            }

            .volume-control {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
        }

<body data-game-navigation="single-player" data-entry-game="sphinx">
<audio id="bgm" src="/learning/games/sphinx/assets/sound/bgm.ogg" loop preload="auto"></audio>

<div class="game-frame">
    <aside class="sphinx-panel">
        <img class="sphinx-image" src="/learning/games/sphinx/assets/images/sphinx.webp" alt="스핑크스">
        <div class="sphinx-name">SPHINX</div>
    </aside>

    <div class="quiz-container">
        <div class="quiz-title">SPHINX</div>
        <div id="display-area"></div>

        <div class="volume-control">
            <span>MUSIC VOLUME</span>
            <button class="vol-btn" onclick="toggleMute()">MUTE</button>
            <div class="vol-bar">
                <div class="bar-segment" onclick="setVolume(0.2, 1)"></div>
                <div class="bar-segment" onclick="setVolume(0.4, 2)"></div>
                <div class="bar-segment" onclick="setVolume(0.6, 3)"></div>
                <div class="bar-segment" onclick="setVolume(0.8, 4)"></div>
                <div class="bar-segment" onclick="setVolume(1.0, 5)"></div>
            </div>
        </div>
        <button class="quiz-btn" type="button" onclick="location.href='../../../'" style="margin-top:10px;">메인 화면으로</button>
    </div>
</div>

<script>
    let currentStage = 0, difficulty = 5, currentAnswer = "";
    const displayArea = document.getElementById('display-area');
    const bgm = document.getElementById('bgm');

    const FINISHER_GAME_ID = "sphinx";
    const KOREAN_NAME_PATTERN = /^[가-힣]{2,6}$/;
    let playerName = "";

    function escapeFinisherHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeKoreanName(value) {
        return String(value || "").replace(/[^가-힣]/g, "").slice(0, 6);
    }

    function isValidKoreanName(value) {
        return KOREAN_NAME_PATTERN.test(String(value || ""));
    }

    function getSavedPlayerName() {
        const handedOff = normalizeKoreanName(new URLSearchParams(window.location.search).get("name") || "");
        if (isValidKoreanName(handedOff)) return handedOff;

        let saved = "";
        try {
            saved = normalizeKoreanName((window.CLASS_PLAYER_NAME || "") || "");
        } catch (error) {
            // The home-page handoff still works when browser storage is unavailable.
        }
        return isValidKoreanName(saved) ? saved : "";
    }

    const finisherBoard = ClassroomFinisherBoard.create({
        gameId: FINISHER_GAME_ID,
        getPlayerName: () => playerName,
        isValidPlayerName: isValidKoreanName
    });
    function loadTodayFinishers(targetId = "today-finishers-list") { return finisherBoard.load(targetId); }
    function registerFinisher(difficulty, rank, targetId = "result-finishers-list") {
        return finisherBoard.register({ difficulty, rank, targetId });
    }

    function initializePlayerEntry() {
        playerName = getSavedPlayerName();
    }
    bgm.loop = true;

    document.body.addEventListener('click', () => { if(bgm.paused) bgm.play(); }, { once: true });

    function setVolume(val, level) {
        bgm.volume = val;
        const segments = document.querySelectorAll('.bar-segment');
        segments.forEach((seg, i) => {
            seg.className = 'bar-segment';
            if (i < level) seg.classList.add('active-' + level);
        });
    }

    function toggleMute() { bgm.muted = !bgm.muted; }
    setVolume(0.6, 3);

    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function loadQuestion() {
        if (currentStage === 0) {
            displayArea.innerHTML = `
                <div class="question-text">${playerName ? `PLAYER · ${escapeFinisherHtml(playerName)}` : "<스핑크스> 도전할 자는 이름과 실력을 밝혀라."}</div>
                <div class="player-entry">
                    <div class="player-name-help" id="player-name-help">이름이 없습니다. 메인 화면에서 이름을 먼저 저장해 주세요.</div>
                    <button class="quiz-btn" type="button" onclick="location.href='../../../'">메인 화면으로</button>
                </div>
                <div class="options-container" data-game-entry>
                    <button class="quiz-btn" data-difficulty-button onclick="setDiff(5)">Start · Beginner</button>
                    <button class="quiz-btn" data-difficulty-button onclick="setDiff(10)">Start · Advanced</button>
                    <button data-game-rules class="quiz-btn" type="button" onclick="showSphinxRules()">Rules</button>
                </div>
                <div class="finishers-panel">
                    <div class="finishers-title">🏆 TODAY’S FINISHERS</div>
                    <div class="finishers-list" id="today-finishers-list"></div>
                </div>`;
            if (playerName) window.ClassroomSoloAvatar.show(displayArea.querySelector(".question-text"));
            const playerEntry = document.querySelector(".player-entry");
            document.querySelectorAll("[data-difficulty-button]").forEach(button => {
                button.disabled = !isValidKoreanName(playerName);
            });
            if (playerName && playerEntry) {
                playerEntry.style.display = "none";
            }
            loadTodayFinishers();
            return;
        }

        const standardOptions = Array.from({length: difficulty}, (_, i) => `${i + 1}마리`);
        let qText = "", ans = "", coachHtml = "";

        if (currentStage === 1) {
            qText = "<스핑크스> 아침에는 4개의 다리, 낮에는 2개의 다리, 밤에는 3개의 다리로 걷는 괴물은?";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">🌅 아침 = 다리 4개</span>
                            <span class="sphinx-badge">☀️ 낮 = 다리 2개</span>
                            <span class="sphinx-badge">🌙 밤 = 다리 3개</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 쉽게 풀기 도우미</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 초등학생 눈높이 힌트</strong>
                        <ol>
                            <li><strong>아침(아기 때):</strong> 네 발(손과 무릎 <strong>4개</strong>)로 기어 다녀요.</li>
                            <li><strong>낮(어른이 되면):</strong> 두 발(<strong>2개</strong>)로 걸어 다녀요.</li>
                            <li><strong>밤(할머니·할아버지가 되면):</strong> 두 발에 <strong>지팡이 1개</strong>를 짚어 <strong>3개</strong>로 걸어요.</li>
                            <li>즉 이 수수께끼의 정답은 스핑크스 앞에 서 있는 사람, 바로 <strong>「자신」</strong>이에요!</li>
                        </ol>
                    </div>
                </div>`;
            let html = `<div class="question-text">${qText}</div>${coachHtml}<div class="options-container">`;
            ["스핑크스", "자신", "기타", "없다", "모른다", "무시한다", "도망간다"].forEach(o => html += `<button class="quiz-btn" onclick="check('${o}', '자신')">${o}</button>`);
            displayArea.innerHTML = html + `</div>`;
            return;
        }

        if (currentStage === 2) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(1, difficulty);
            const total = x + y, legs = 4 * x + 2 * y;
            const baseLegs = total * 2, extraLegs = legs - baseLegs;
            qText = `<스핑크스> 그럼 그대에게 묻겠다.\n다리가 4개 있는 괴물과 2개 있는 괴물이 ${total}마리 있다. 그 다리는 합쳐서 ${legs}개가 있다.\n그러면 다리가 4개있는 괴물은 몇 마린가?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">📋 전체 괴물: ${total}마리</span>
                            <span class="sphinx-badge">🦵 전체 다리: ${legs}개</span>
                            <span class="sphinx-badge">❓ 다리 4개 괴물 = 몇 마리?</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 초등 풀이 도우미</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (모두 다리 2개라고 상상하기)</strong>
                        <ol>
                            <li>먼저 <strong>${total}마리 모두 다리가 2개</strong>라고 상상해 봐요: <strong>${total} × 2 = ${baseLegs}개</strong></li>
                            <li>실제 다리는 <strong>${legs}개</strong>니까, 다리가 <strong>${legs} − ${baseLegs} = ${extraLegs}개</strong> 남아요!</li>
                            <li>다리 4개 괴물은 다리 2개 괴물보다 다리가 <strong>2개씩 더 많아요.</strong></li>
                            <li>남은 다리 <strong>${extraLegs}개</strong>를 <strong>2개씩 묶어서</strong> 붙여 주면(<strong>${extraLegs} ÷ 2</strong>) 다리 4개 괴물이 몇 마리인지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else if (currentStage === 3) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(3, difficulty);
            const initLegs = 4 * x + 2 * y;
            const laterLegs = 2 * x + 2 * (y - 2) + 3 * 2;
            const expectedIfNoShrink = initLegs + 2;
            const lostLegs = expectedIfNoShrink - laterLegs;
            qText = `<스핑크스> 다시 그대에게 묻겠다.\n다리가 4개와 2개 있는 괴물의 다리를 합쳐서 ${initLegs}개가 있다. 세월이 지나서 다리 4개의 괴물은 모두 다리가 2개가 되고, 2개의 다리를 가지고 있는 것 중 2마리는 3개의 다리가 되었다. 괴물들의 다리를 모두 합치니 ${laterLegs}개가 되었다. 처음에 다리가 4개 있었던 괴물은 몇 마리였느냐?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">처음 다리: ${initLegs}개</span>
                            <span class="sphinx-badge">나중 다리: ${laterLegs}개</span>
                            <span class="sphinx-badge">변화: 4발→2발, 2마리는 2발→3발(+2개)</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 초등 풀이 도우미</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (바뀐 다리 수만 비교하기)</strong>
                        <ol>
                            <li>다리 2개짜리 <strong>2마리</strong>가 다리 3개가 되었으니, 여기서 다리가 <strong>2개 늘어났어요</strong> (안 줄었다면 <strong>${initLegs} + 2 = ${expectedIfNoShrink}개</strong>).</li>
                            <li>그런데 나중 다리는 <strong>${laterLegs}개</strong>뿐이에요! 다리가 <strong>${expectedIfNoShrink} − ${laterLegs} = ${lostLegs}개</strong> 줄어들었어요.</li>
                            <li>왜 줄었을까요? <strong>다리 4개짜리가 다리 2개로 변하면서 1마리당 다리가 2개씩 줄었기 때문</strong>이에요!</li>
                            <li>줄어든 다리 <strong>${lostLegs}개</strong>를 <strong>2개씩 나누면(${lostLegs} ÷ 2)</strong> 처음 다리 4개 괴물이 몇 마리였는지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else if (currentStage === 4) {
            const x = getRandomInt(1, difficulty), y = getRandomInt(5, difficulty);
            const initLegs = 4 * x + 2 * y;
            const laterLegs = 2 * x + 2 * (y - 4) + 3 * 4 + 4 * (2 * x);
            const withoutCane = laterLegs - 4;
            const gainedLegs = withoutCane - initLegs;
            qText = `<스핑크스> 마지막으로 그대에게 묻겠다.\n다리가 4개와 2개 있는 괴물의 다리를 합쳐서 ${initLegs}개가 있다. 세월이 지나서 4개의 다리를 가진 괴물은 모두 다리가 2개로 성장하고, 다리가 2개 있는 괴물중 4마리는 다리가 3개가 되었다. 게다가 다리가 4개였던 괴물의 2배가 되는 4개의 다리를 가지는 괴물이 새로이 태어났다. 괴물들의 다리를 다 합쳐 ${laterLegs}개가 있다. 그러면 처음에 다리가 4개 있었던 괴물은 몇 마리였느냐?`;
            ans = x + "마리";
            coachHtml = `
                <div class="sphinx-coach">
                    <div class="sphinx-coach-top">
                        <div class="sphinx-summary-badges">
                            <span class="sphinx-badge">처음 다리: ${initLegs}개</span>
                            <span class="sphinx-badge">나중 다리: ${laterLegs}개</span>
                            <span class="sphinx-badge">4마리 다리 +4개 / 4발 1마리당 아기 4발 2마리 탄생</span>
                        </div>
                        <button type="button" class="sphinx-hint-toggle" id="sphinxHintBtn" onclick="toggleSphinxHint()">💡 초등 풀이 도우미</button>
                    </div>
                    <div id="sphinxRetryBox"></div>
                    <div class="sphinx-steps" id="sphinxSteps" hidden>
                        <strong>🧒 방정식 없이 초등식으로 풀기 (1마리당 늘어난 다리 묶기)</strong>
                        <ol>
                            <li>먼저 다리 2개짜리 <strong>4마리</strong>가 다리 3개가 되며 늘어난 <strong>4개</strong>를 나중 다리에서 빼요: <strong>${laterLegs} − 4 = ${withoutCane}개</strong></li>
                            <li>처음 다리(<strong>${initLegs}개</strong>)와 비교하면 다리가 <strong>${withoutCane} − ${initLegs} = ${gainedLegs}개</strong> 늘어났어요!</li>
                            <li>처음 4발 괴물 <strong>1마리</strong>마다: 자기 다리는 4개→2개로 <strong>2개 줄었지만(−2)</strong>, 4발 아기 괴물이 <strong>2마리 태어나 다리 8개가 생겨요(+8)</strong>. 즉 <strong>처음 4발 괴물 1마리당 다리가 꼭 6개씩(8 − 2 = 6) 늘어나요!</strong></li>
                            <li>늘어난 다리 <strong>${gainedLegs}개</strong>를 <strong>6개씩 묶으면(${gainedLegs} ÷ 6)</strong> 처음 4발 괴물이 몇 마리였는지 바로 나와요!</li>
                        </ol>
                    </div>
                </div>`;
        } else { showResult(true); return; }

        let html = `<div class="question-text">${qText}</div>${coachHtml}<div class="options-container">`;
        standardOptions.forEach(o => html += `<button class="quiz-btn" onclick="check('${o}', '${ans}')">${o}</button>`);
        displayArea.innerHTML = html + `</div>`;
    }

    function toggleSphinxHint(forceOpen = false) {
        const steps = document.getElementById("sphinxSteps");
        const btn = document.getElementById("sphinxHintBtn");
        if (!steps) return;
        const nextHidden = forceOpen ? false : !steps.hidden;
        steps.hidden = nextHidden;
        if (btn) btn.textContent = nextHidden ? "💡 초등 풀이 도우미" : "▲ 풀이 도우미 접기";
    }

    function showSphinxRules() {
        displayArea.innerHTML = `
            <div class="question-text">HOW TO PLAY</div>
            <div style="text-align:left;line-height:1.65;margin:10px auto;max-width:640px">
                <p style="margin:0 0 8px;">스핑크스의 질문은 글이 길지만, <strong>방정식(x, y) 없이 초등학생 방법(다리 묶기)</strong>으로 아주 쉽게 풀 수 있어요!</p>
                <div class="sphinx-rule-card">
                    <strong>1단계 · 스핑크스의 수수께끼</strong><br>
                    아침(👶아기=4발) → 낮(🚶어른=2발) → 밤(🦯노인+지팡이=3발)로 걷는 존재는 바로 스핑크스 앞에 선 사람, <strong>「자신」</strong>입니다.
                </div>
                <div class="sphinx-rule-card">
                    <strong>2단계 · 모두 다리 2개라고 상상하기</strong> (예: 모두 5마리, 다리 16개)<br>
                    ① 5마리 모두 다리가 2개라면 <strong>5 × 2 = 10개</strong>예요.<br>
                    ② 남는 다리 <strong>16 − 10 = 6개</strong>를 <strong>2개씩 묶어(6 ÷ 2 = 3)</strong> 붙여 주면 다리 4개 괴물은 <strong>3마리</strong>!
                </div>
                <div class="sphinx-rule-card">
                    <strong>3단계 · 줄어든 다리 수만 보기</strong><br>
                    2마리가 다리 3개가 되어 <strong>2개 늘어났는데도</strong> 전체 다리가 줄어들었다면, 4발 괴물이 2발이 되면서 <strong>1마리당 2개씩 줄었기 때문</strong>이에요!<br>
                    👉 <strong>(처음 다리 + 2 − 나중 다리) ÷ 2</strong> = 처음 4발 괴물 수!
                </div>
                <div class="sphinx-rule-card">
                    <strong>4단계 · 1마리당 6개씩 늘어나는 규칙</strong><br>
                    처음 4발 괴물 1마리는 다리가 2개 줄지만(−2), 아기 4발 괴물이 2마리 태어나(+8) <strong>1마리당 다리가 꼭 6개씩 늘어나요!</strong><br>
                    👉 <strong>(나중 다리 − 4 − 처음 다리) ÷ 6</strong> = 처음 4발 괴물 수!
                </div>
                <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(147,103,45,.35); color:rgba(87,63,35,.72); font-size:12px; line-height:1.5; text-align:center;">
                    문제 화면의 <strong>「💡 초등 풀이 도우미」</strong> 버튼을 누르면 그 문제의 숫자로 한 걸음씩 계산 순서를 보여줍니다.<br>
                    이 퍼즐은 고전 게임 <strong>《대항해시대 III》</strong>의 스핑크스 이벤트에서 착안해 교육용으로 재구성했습니다.
                </div>
            </div>
            <div class="options-container"><button class="quiz-btn" type="button" onclick="loadQuestion()">BACK</button></div>`;
    }

    function setDiff(d) {
        if (!isValidKoreanName(playerName)) {
            const input = document.getElementById("player-name");
            if (input) input.focus();
            return;
        }
        difficulty = d;
        currentStage = 1;
        loadQuestion();
    }
    function check(s, a) {
        if (s === a) {
            currentStage++;
            loadQuestion();
            return;
        }
        const retryBox = document.getElementById("sphinxRetryBox");
        if (retryBox) {
            retryBox.innerHTML = `<p class="sphinx-retry-notice">앗, <strong>"${escapeFinisherHtml(s)}"</strong>은(는) 정답이 아니에요! 아래 초등 풀이 순서를 보고 다시 골라 보세요.</p>`;
            toggleSphinxHint(true);
            return;
        }
        showResult(false);
    }
    function showResult(win) {
        displayArea.innerHTML = `
            <div class="question-text" style="text-align:center;">
                ${win ? "<스핑크스> 그대의 예지를 칭송하리라." : "<스핑크스> 성스러운 땅에 합당치 않은 자여! 물러가라!"}
            </div>
            ${win ? `<div class="finishers-panel result-finishers">
                <div class="finishers-title">🏆 TODAY’S FINISHERS</div>
                <div class="finishers-list" id="result-finishers-list"></div>
            </div>` : ""}
            <button class="quiz-btn confirm-btn" onclick="currentStage=0; loadQuestion();">처음으로</button>`;
        if (win) {
            const label = difficulty === 10 ? "고급 · 1~10마리" : "초급 · 1~5마리";
            registerFinisher(label, difficulty);
        }
    }

    initializePlayerEntry();
    loadQuestion();
</script>
</body>
</html>
