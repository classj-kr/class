<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바둑</title>
<link rel="stylesheet" href="../../../assets/network/multiplayer-lobby.css?v=20260906">
<link rel="stylesheet" href="baduk.css?v=20260923-scoring">
<link rel="stylesheet" href="../../../assets/device-game.css?v=20260921c">
<script src="../../../assets/network/game-network.js?v=20260821"></script>
<script src="../../../assets/network/multiplayer-lobby.js?v=20260906b"></script>
<script src="../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
<script src="../../../assets/game-motion.js?v=20260921a"></script>
</head>
<body><main class="shell">
<section id="missingScreen" class="panel hidden"><h1>이름이 없습니다</h1><p>이름 변경은 메인 화면에서만 가능합니다.</p><button class="primary" type="button" onclick="location.href='../../../'">메인 화면으로</button></section>

<section id="lobbyScreen" class="hidden mp-lobby-compact mp-lobby-standard" data-multiplayer-lobby>
  <header class="panel"><h1 class="title">GO GAME</h1><p class="subtitle">바둑 · 2명</p><p>PLAYER · <strong id="savedName">-</strong></p><div class="mp-lobby-tabs"><button id="hostTab" class="primary" type="button">CREATE ROOM</button><button id="joinTab" class="secondary" type="button">JOIN ROOM</button></div></header>
  <section id="hostPane" class="panel mp-lobby-card hidden"><div class="code" id="roomCode">----</div><div id="hostStatus" class="mp-lobby-status">방을 만드는 중입니다.</div></section>
  <section id="joinPane" class="panel mp-lobby-card hidden"><div class="mp-lobby-row"><input id="joinCode" class="mp-lobby-code-input" inputmode="numeric" maxlength="4" placeholder="ROOM CODE · 4 DIGITS"><button id="joinBtn" class="primary" type="button">JOIN</button></div><div id="joinStatus" class="mp-lobby-status"></div></section>
  <section class="panel"><h2>대국 방식</h2><div class="mode-grid"><button class="mode-button active" data-mode="capture" type="button">돌 따먹기<small>7×7 · 3개 선취</small></button><button class="mode-button" data-mode="territory" type="button">땅 따먹기<small>7×7 · 40수</small></button><button class="mode-button" data-mode="standard" type="button">정식 바둑<small>9×9 · 합의 계가</small></button></div><p id="modeSummary" class="mode-summary">돌 따먹기 · 7×7</p><div id="lobbyPlayers" class="mp-lobby-players"></div><p id="lobbyGuide" class="mp-lobby-guide">상대방을 기다리는 중입니다.</p><button id="startBtn" class="primary" type="button" disabled>WAITING FOR OPPONENT</button><div class="row" style="margin-top:10px"><button id="rulesBtnLobby" class="secondary" type="button">HOW TO PLAY</button><button id="leaveBtnLobby" class="secondary" type="button">메인 화면</button></div></section>
</section>

<section id="gameScreen" class="hidden">
  <header class="panel"><div class="row spread"><div><strong id="gameRoomCode" hidden>----</strong><strong id="modeName"></strong></div><div class="row"><button id="rulesBtnGame" class="secondary" type="button">규칙</button><button id="leaveBtnGame" class="secondary" type="button">메인 화면</button></div></div><div class="players"><div id="blackCard" class="player"><span class="sample black"></span><span><small>흑 · 선공</small><br><strong id="blackName">-</strong> · 잡은 돌 <b id="blackCaptured">0</b></span></div><div id="whiteCard" class="player"><span class="sample white"></span><span><small>백 · 후공</small><br><strong id="whiteName">-</strong> · 잡은 돌 <b id="whiteCaptured">0</b></span></div></div><div class="turn-area"><div id="turnBanner" class="turn-banner">대국 준비 중</div><div id="turnClock" class="clock">30</div></div><div id="gameStatus" class="game-status"></div><div class="actions"><button id="passBtn" class="secondary hidden" type="button">패스</button><button id="resignBtn" class="secondary" type="button">기권</button><span id="scoringActions" class="hidden"><button id="agreeScoreBtn" class="primary" type="button">이 점수에 동의</button><button id="resumeGameBtn" class="secondary" type="button">대국 계속하기</button></span><span id="resultActions" class="hidden"><button id="rematchBtn" class="primary" type="button">재대국</button><button id="returnLobbyBtn" class="secondary" type="button">대기실</button></span></div></header>
  <section class="panel play-panel"><div class="board-stage"><div class="board-frame"><div id="board" class="board" role="grid"></div></div></div></section>
</section></main>

<audio id="bgm" src="/learning/games/baduk/assets/sound/baduk-bgm.ogg" loop preload="auto"></audio>

<section id="rulesOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="규칙"><div class="modal"><div id="rulesBody"></div><button id="closeRulesBtn" class="primary" type="button">확인</button></div></section>
<section id="abortOverlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal"><h2 id="abortTitle">연결 종료</h2><p id="abortMessage"></p><button class="primary" type="button" onclick="location.reload()">처음부터</button></div></section>
<div id="toast" class="toast hidden" role="status"></div>
<script src="baduk.js?v=20260923-scoring"></script>
</body></html>
