<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고누놀이</title>
  <link rel="stylesheet" href="/assets/network/multiplayer-lobby.css?v=20261114-avatars">
  <link rel="stylesheet" href="gonu.css?v=20261117-courtyard">
  <script src="/assets/network/game-network.js?v=20260821" defer></script>
  <script src="/assets/network/multiplayer-avatars.js?v=20261114-1" defer></script>
  <script src="/assets/network/multiplayer-lobby.js?v=20261118-main-join" defer></script>
  <script src="music.js?v=1" defer></script>
  <script src="/assets/sound/music-control.js?v=20261115-game-backdrop" defer></script>
  <script src="rules.js?v=20261117-view" defer></script>
  <script src="gonu.js?v=20261117-view" defer></script>
</head>
<body>
<audio id="bgm" preload="metadata"></audio>
<main>
  <section id="missingScreen" class="panel hidden">
    <h1>게임에 사용할 이름이 필요합니다</h1>
    <a href="/">메인 화면</a>
  </section>
  <section id="lobbyScreen" class="hidden">
    <div class="panel">
      <h1>고누놀이</h1>
      <p>PLAYER · <strong id="savedName">-</strong></p>
      <div class="mp-lobby-tabs">
        <button id="hostTab" class="primary" type="button">Create Room</button>
        <button id="joinTab" class="secondary" type="button" aria-label="방 번호 입력 방식 선택" role="tab">Join Room</button>
      </div>
    </div>
    <section id="hostPane" class="panel mp-lobby-card hidden">
      <div class="row spread">
        <div><div class="eyebrow">방 번호</div><div id="roomCode" class="code">----</div></div>
      </div>
      <div id="hostStatus" class="mp-lobby-status">방을 만드는 중입니다.</div>
    </section>
    <section id="joinPane" class="panel mp-lobby-card hidden">
      <div class="mp-lobby-row">
        <input id="joinCode" class="mp-lobby-code-input" inputmode="numeric" maxlength="4" placeholder="Room Code">
        <button id="joinBtn" class="primary" type="button" aria-label="입력한 방 번호로 참가">Join</button>
      </div>
      <div id="joinStatus" class="mp-lobby-status"></div>
    </section>
    <section class="panel">
      <fieldset id="gameChoice">
        <legend>고누 종류</legend>
        <div id="variants"></div>
      </fieldset>
      <div id="lobbyPlayers" class="mp-lobby-players"></div>
      <p id="lobbyGuide" class="mp-lobby-guide"></p>
      <button id="startBtn" class="primary" type="button" disabled>시작</button>
      <div class="row" style="margin-top:10px">
        <button id="rulesBtnLobby" class="secondary" type="button">Rules</button>
        <button id="leaveBtnLobby" class="secondary" type="button">메인 화면</button>
      </div>
    </section>
  </section>
  <section id="gameScreen" class="hidden">
    <div id="boardArea">
      <div id="board" role="group" aria-label="고누 말판">
        <svg id="lines" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <div id="cells"></div>
      </div>
    </div>
    <aside class="panel match-info">
      <h1 id="variantName"></h1>
      <div id="players" aria-label="참가자"></div>
      <p id="status" role="status"></p>
      <div id="turnClockBox" class="turn-clock hidden" aria-live="off">
        <span id="gonuClock"></span>
        <span class="turn-clock-bar" aria-hidden="true"><i id="gonuClockBar"></i></span>
      </div>
      <button id="rulesBtnGame" type="button">Rules</button>
      <button id="rematch" class="hidden" type="button">대기실로</button>
    </aside>
  </section>
</main>
<dialog id="help">
  <h2 id="ruleTitle"></h2>
  <p id="ruleText"></p>
  <p id="ruleTime"></p>
  <p>움직이는 단계에서 같은 판과 차례가 세 번 나오면 비겨요.</p>
  <form method="dialog"><button>닫기</button></form>
</dialog>
<dialog id="disconnect">
  <h2>대국이 끝났어요</h2><p id="notice"></p>
  <a href="./gonu">대기실로</a>
</dialog>
</body>
</html>
