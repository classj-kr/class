<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>조형 원리 작업실 · 미술 실험</title><link rel="stylesheet" href="../color-mixing/styles.css?v=20260920-type"><link rel="stylesheet" href="styles.css?v=studio2"><script src="model.js?v=studio2" defer></script><script src="app.js?v=studio2" defer></script></head>
<body><main class="lab-shell">
<nav class="lesson-links" aria-label="차시 선택"><a href="../color-mixing/">색의 혼합</a><a href="../color-properties/">색상·명도·채도</a><a href="../color-harmony/">색의 관계와 배색</a><a href="../visual-elements/">조형 요소</a><a href="./" aria-current="page">조형 원리</a></nav>
<header class="lesson-header"><h1>조형 원리 작업실</h1><button id="exportWork" class="text-button">그림 내려받기</button></header>
<p class="intro">도형을 놓고 옮겨 보세요. 크기와 색도 자유롭게 바꿀 수 있습니다.</p>
<section id="editor" class="studio" aria-label="구성 작업 공간"><div class="canvas-panel"><div class="tools" role="group" aria-label="도형 편집"><button data-add="circle">원 추가</button><button data-add="square">사각형 추가</button><button data-add="triangle">삼각형 추가</button><span class="tool-break"></span><button id="undo">되돌리기</button><button id="redo">다시 적용</button></div><div id="boards" class="boards"><figure id="referenceBoard" hidden><figcaption>기준 구성</figcaption><svg id="referenceCanvas" viewBox="0 0 600 400" role="img" aria-label="기준 구성"></svg></figure><figure><figcaption id="currentCaption" hidden>현재 구성</figcaption><svg id="canvas" viewBox="0 0 600 400" role="group" aria-label="도형 구성. 도형을 선택한 뒤 방향키로 이동할 수 있습니다." tabindex="0"></svg></figure></div><div class="compare-tools"><button id="pinReference">현재 구성을 기준으로</button><label><input id="compareToggle" type="checkbox" disabled>기준과 비교</label><button id="saveComposition">구성 저장</button></div><div class="canvas-footer"><p>도형을 끌어 옮기거나 방향키로 움직이세요.</p><span id="objectCount"></span></div><p id="editStatus" role="status"></p></div>
<aside class="inspector" aria-label="선택한 도형 편집"><h2 id="selectionTitle">도형 선택</h2><p id="emptySelection">화면에서 도형을 선택하세요.</p><div id="selectionControls" hidden>
<label for="positionX">가로 위치 <output id="positionXValue"></output></label><input id="positionX" type="range" min="0" max="600">
<label for="positionY">세로 위치 <output id="positionYValue"></output></label><input id="positionY" type="range" min="0" max="400">
<label for="objectSize">크기 <output id="objectSizeValue"></output></label><input id="objectSize" type="range" min="24" max="160">
<h3>색</h3><div id="colors" class="colors" role="group" aria-label="도형 색"></div><div class="object-actions"><button id="duplicate">복제</button><button id="remove">삭제</button><button id="bringFront">맨 앞으로</button><button id="sendBack">맨 뒤로</button></div></div><button id="clearCanvas" class="text-button">모두 비우기</button></aside></section>
<section class="records-section" aria-labelledby="recordsTitle"><div class="section-heading"><h2 id="recordsTitle">저장한 구성</h2><span id="storageStatus" role="status"></span></div><p id="recordStatus" role="status"></p><div id="records"></div></section>
<noscript>작업실을 사용하려면 자바스크립트를 켜 주세요.</noscript></main></body></html>
