<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e141f">
    <title>청음</title>
    <meta name="description" content="음정·화음·음계·화음 진행과 리듬을 듣고, 읽고, 연주하는 청음 훈련">
    <link rel="preload" href="assets/piano/C4.ogg" as="fetch" type="audio/ogg" crossorigin>
    <link rel="stylesheet" href="styles.css?v=20261020-wheel-audio">
    <script src="piano-engine.js?v=20261006-immediate-tap" defer></script>
    <script src="notation.js?v=20261006-vector-notation" defer></script>
    <script src="keyboard.js?v=20261011-no-fixed-solfege" defer></script>
    <script src="wheel.js?v=20261020-wheel-audio" defer></script>
    <script src="wheel-practice.js?v=20261020-wheel-audio" defer></script>
    <script src="course.js?v=20261020-wheel-audio" defer></script>
    <script src="/assets/site-storage.js?v=20261006-1" defer></script>
    <script src="app.js?v=20261020-wheel-audio" defer></script>
</head>
<body class="ear-training-room" data-sfx-clicks="none">
    <a class="page-back" href="../../../" aria-label="메인으로 돌아가기">←</a>

    <main class="shell">
        <section id="menuScreen" class="screen">
            <h1 class="visually-hidden">청음</h1>
            <nav id="courseList" aria-label="청음 학습 메뉴"></nav>
        </section>

        <section id="wheelScreen" class="screen" hidden>
            <div class="screen-header">
                <h1 id="wheelTitle" class="screen-title"></h1>
            </div>
            <div id="wheelBoard" class="wheel-board"></div>
            <div class="wheel-lesson-panel">
                <div id="wheelBody" class="lesson-body"></div>
                <div class="wheel-controls">
                    <button id="wheelPrev" class="quiet-button" type="button" aria-label="반시계로 한 자리">◀ ♭ 쪽</button>
                    <button id="wheelFlat" class="quiet-button" type="button">F♯ ↔ G♭</button>
                    <button id="wheelNext" class="quiet-button" type="button" aria-label="시계로 한 자리">♯ 쪽 ▶</button>
                </div>
                <div class="field">
                    <span class="field-label">이 조의 화음 · 눌러서 듣기</span>
                    <div id="wheelChords" class="wheel-chords"></div>
                </div>
                <button id="wheelCadence" class="quiet-button" type="button">I – IV – V – I 들어 보기</button>
                <div class="wheel-lesson-actions">
                    <button id="wheelPractice" class="primary-button" type="button">문제 풀기</button>
                    <button id="wheelLessonNext" class="quiet-button" type="button">다음 차시</button>
                </div>
            </div>
        </section>

        <section id="wheelPracticeScreen" class="screen" hidden>
            <div class="screen-header">
                <h1 id="wheelPracticeTitle" class="screen-title"></h1>
            </div>
            <div id="wheelQuestionPanel" class="wheel-question-panel">
                <div class="drill-bar">
                    <span id="wheelPracticeProgress" class="score" aria-live="polite"></span>
                    <button id="wheelPracticeStop" class="quiet-button" type="button">그만하기</button>
                </div>
                <h2 id="wheelQuestion" class="wheel-question" tabindex="-1"></h2>
                <div id="wheelChoices" class="choices" role="group" aria-labelledby="wheelQuestion"></div>
                <p id="wheelFeedback" class="wheel-feedback" aria-live="polite"></p>
                <button id="wheelQuestionNext" class="primary-button" type="button" hidden>다음 문제</button>
                <details id="wheelHint" class="wheel-hint">
                    <summary>원판 힌트</summary>
                    <div id="wheelHintBoard" class="wheel-board"></div>
                </details>
            </div>
            <div id="wheelPracticeResult" class="wheel-question-panel" hidden>
                <p id="wheelPracticeScore" class="wheel-practice-score" aria-live="polite"></p>
                <p id="wheelHintCount" class="field-label"></p>
                <ul id="wheelReview" class="wheel-review"></ul>
                <div class="result-actions">
                    <button id="wheelPracticeAgain" class="primary-button" type="button">한 번 더</button>
                    <button id="wheelPracticeBack" class="quiet-button" type="button">차시 목록</button>
                </div>
            </div>
        </section>

        <section id="courseScreen" class="screen" hidden>
            <div class="screen-header">
                <h1 id="courseTitle" class="screen-title"></h1>
            </div>
            <div id="lessonList" class="lesson-list"></div>
        </section>

        <section id="lessonScreen" class="screen" hidden>
            <div class="screen-header">
                <h1 id="lessonTitle" class="screen-title"></h1>
            </div>
            <div id="lessonBody" class="lesson-body"></div>
            <div id="lessonExamples" class="examples"></div>
            <span id="lessonKeysLabel" class="field-label" hidden></span>
            <div id="lessonKeys" class="free-keys"></div>

            <div class="lesson-actions">
                <button id="lessonNext" class="primary-button" type="button">다음 차시</button>
            </div>
        </section>

        <section id="drillScreen" class="screen" hidden>
            <header class="drill-bar">
                <span id="scoreText" class="score"></span>
                <button id="stopButton" class="quiet-button" type="button">그만하기</button>
            </header>

            <p id="askText" class="ask"></p>
            <div id="staff" class="staff-wrap"></div>

            <div class="play-row">
                <button id="replayButton" class="replay-button" type="button">♪ 다시 듣기</button>
                <button id="skipButton" class="skip-button" type="button" aria-label="넘기고 정답 보기" title="넘기고 정답 보기">▶❙</button>
            </div>

            <div id="helpRow" class="help-row" hidden>
                <button id="arpButton" class="quiet-button" type="button" hidden>한 음씩 펼쳐 듣기</button>
                <button id="melodicButton" class="quiet-button" type="button" hidden>한 음씩 듣기</button>
                <button id="keyButton" class="quiet-button" type="button" hidden>조 확인</button>
            </div>

            <div id="choices" class="choices" role="group" aria-label="정답 고르기"></div>

            <div id="slotWrap" class="slot-wrap" hidden>
                <div id="slotRow" class="slot-row"></div>
                <div id="numeralRows" class="numeral-rows" role="group" aria-label="로마숫자 고르기"></div>
            </div>

            <div id="pairWrap" class="pair-wrap" hidden>
                <div id="qualityRow" class="choices" role="group" aria-label="성질 고르기"></div>
                <div id="numberRow" class="choices" role="group" aria-label="도수 고르기"></div>
            </div>

            <div id="keyboardWrap" class="keyboard-wrap">
                <div id="pianoKeys"></div>
                <p id="typedCount" class="typed-count"></p>
            </div>

            <p id="feedback" class="feedback" aria-live="polite"></p>
            <button id="nextButton" class="primary-button" type="button" hidden>다음 문제</button>
        </section>

        <section id="resultScreen" class="screen" hidden>
            <h1 id="resultScore" class="screen-title"></h1>
            <div id="resultTable" class="result-table"></div>
            <div class="result-actions">
                <button id="againButton" class="primary-button" type="button">한 번 더</button>
                <button id="toMenuButton" class="quiet-button" type="button">다른 훈련</button>
            </div>
        </section>
    </main>
</body>
</html>
