<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="클래식, 국악, 팝, 재즈의 역사와 감상곡을 만나는 음악 감상">
  <title>음악 감상</title>
  <link rel="stylesheet" href="styles.css?v=20261007-ui-font">
  <link rel="stylesheet" href="headerless.css?v=20260902-1">
</head>
<body class="music-room-home">
  <a class="page-back" href="../../../" aria-label="메인으로 돌아가기">←</a>
  <main class="home-stage">
    <nav class="genre-grid" aria-label="음악 장르 선택">
      <!-- 1. 클래식 : 그랜드 피아노 / 바이올린 -->
      <a href="genres/classical/" class="genre-card card-classical" aria-label="클래식 음악 감상실">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-icon-wrap" aria-hidden="true">
          <svg class="genre-icon" viewBox="0 0 48 48" fill="none">
            <!-- 그랜드 피아노 본체와 열린 뚜껑 -->
            <path d="M8 26 C8 24.5 9 23.5 10.5 23.5 L37.5 23.5 C39 23.5 40 24.5 40 26 L40 33 C40 34.5 39 35.5 37.5 35.5 L10.5 35.5 C9 35.5 8 34.5 8 33 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/>
            <path d="M10 23.5 L34 10.5 C36 9.5 39 10.5 39 12.5 L38 23.5" fill="currentColor" fill-opacity="0.45" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <line x1="33" y1="12" x2="31" y2="23.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <!-- 건반 영역 -->
            <rect x="12" y="27" width="24" height="6" rx="1" fill="#ffffff" stroke="currentColor" stroke-width="1.4"/>
            <line x1="16" y1="27" x2="16" y2="33" stroke="#0f172a" stroke-width="1"/>
            <line x1="20" y1="27" x2="20" y2="33" stroke="#0f172a" stroke-width="1"/>
            <line x1="24" y1="27" x2="24" y2="33" stroke="#0f172a" stroke-width="1"/>
            <line x1="28" y1="27" x2="28" y2="33" stroke="#0f172a" stroke-width="1"/>
            <line x1="32" y1="27" x2="32" y2="33" stroke="#0f172a" stroke-width="1"/>
            <!-- 다리 & 페달 -->
            <line x1="12" y1="35.5" x2="12" y2="40.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="36" y1="35.5" x2="36" y2="40.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M22 35.5 L22 38.5 M26 35.5 L26 38.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="genre-en">Classical Music</span>
          <strong class="genre-ko">클래식</strong>
        </div>
      </a>

      <!-- 2. 국악 : 장구 (전통 북과 채) -->
      <a href="genres/korean/" class="genre-card card-korean" aria-label="국악 감상실">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-icon-wrap" aria-hidden="true">
          <svg class="genre-icon" viewBox="0 0 48 48" fill="none">
            <!-- 좌우 가죽 북편 -->
            <ellipse cx="11" cy="24" rx="3.5" ry="11" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/>
            <ellipse cx="37" cy="24" rx="3.5" ry="11" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2"/>
            <!-- 모래시계형 울림통 -->
            <path d="M11 16 C17 17 21 21 24 21 C27 21 31 17 37 16 L37 32 C31 31 27 27 24 27 C21 27 17 31 11 32 Z" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <line x1="24" y1="21" x2="24" y2="27" stroke="currentColor" stroke-width="2.5"/>
            <!-- 조임줄 (축선) -->
            <path d="M14 15 L34 24 L14 33 M14 24 L34 15 M14 24 L34 33" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
            <!-- 궁채(말렛) & 열채(대나무) -->
            <line x1="6" y1="38" x2="14" y2="28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="5" cy="39" r="2.2" fill="currentColor"/>
            <line x1="42" y1="10" x2="34" y2="21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="genre-en">Korean Traditional Music</span>
          <strong class="genre-ko">국악</strong>
        </div>
      </a>

      <!-- 3. 팝 : 빈티지 스튜디오 마이크 & 비트 -->
      <a href="genres/pop/" class="genre-card card-pop" aria-label="팝 음악 감상실">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-icon-wrap" aria-hidden="true">
          <svg class="genre-icon" viewBox="0 0 48 48" fill="none">
            <!-- 마이크 캡슐 그릴 -->
            <rect x="17" y="7" width="14" height="20" rx="7" fill="currentColor" fill-opacity="0.32" stroke="currentColor" stroke-width="2"/>
            <line x1="17" y1="17" x2="31" y2="17" stroke="currentColor" stroke-width="2"/>
            <line x1="24" y1="7" x2="24" y2="27" stroke="currentColor" stroke-width="1.8"/>
            <line x1="20.5" y1="9" x2="20.5" y2="25" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
            <line x1="27.5" y1="9" x2="27.5" y2="25" stroke="currentColor" stroke-width="1.2" opacity="0.75"/>
            <!-- U자형 거치대 & 스탠드 -->
            <path d="M12 20 C12 27 17 32 24 32 C31 32 36 27 36 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="24" y1="32" x2="24" y2="39" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M16 40 L32 40" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <!-- 사운드 웨이브 -->
            <path d="M8 17 C6.5 19 6.5 22 8 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M40 17 C41.5 19 41.5 22 40 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="genre-en">Popular Music</span>
          <strong class="genre-ko">팝</strong>
        </div>
      </a>

      <!-- 4. 재즈 : 색소폰 & 소울 음표 -->
      <a href="genres/jazz/" class="genre-card card-jazz" aria-label="재즈 감상실">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="card-icon-wrap" aria-hidden="true">
          <svg class="genre-icon" viewBox="0 0 48 48" fill="none">
            <!-- 마우스피스 & 넥 & 관체 -->
            <path d="M14 10 L19 10 C21 10 22 11 22 13 L22 30 C22 36 27 39 33 36 C37 33 38 28 38 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <!-- 색소폰 벨 (나팔) -->
            <path d="M34 23 C34 17 41 15 43 22 C43 27 37 27 34 23 Z" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <!-- 키 버튼들 -->
            <circle cx="22" cy="17" r="1.6" fill="currentColor"/>
            <circle cx="22" cy="21" r="1.6" fill="currentColor"/>
            <circle cx="22" cy="25" r="1.6" fill="currentColor"/>
            <line x1="19" y1="15" x2="19" y2="27" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <!-- 재즈 음표 -->
            <circle cx="12" cy="31" r="2.2" fill="currentColor"/>
            <line x1="14.2" y1="31" x2="14.2" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M14.2 23 C17 21 18 24 19 25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-body">
          <span class="genre-en">Jazz</span>
          <strong class="genre-ko">재즈</strong>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
