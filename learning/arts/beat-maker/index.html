<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#141a24" />
    <title>음악 만들기</title>
    <link rel="icon" href="/assets/icons/favicon.webp" />
    <link rel="stylesheet" href="styles.css?v=20261118-share" />
    <script src="../../literacy-numeracy/math-tools/assets/math.js?v=20261108-2" defer></script>
    <script src="../../literacy-numeracy/math-tools/assets/ui.js?v=20261118-share" defer></script>
    <script src="/assets/site-storage.js?v=20261006-1" defer></script>
    <script src="../instrument-room/korean-percussion-data.js" defer></script>
    <script src="catalog.js?v=20261118-share" defer></script>
    <script src="core.js?v=20261118-share" defer></script>
    <script src="engine.js?v=20261118-share" defer></script>
    <script src="app.js?v=20261118-share" defer></script>
    <script src="../shared/board-share.js?v=20261118-song" defer></script>
    <script src="/assets/sound/music-control.js?v=20261117-movable-gear" data-settings-help="tool-help" defer></script>
  </head>
  <body data-sfx-clicks="none" data-sfx-feedback="none">
    <h1 class="sr-only">음악 만들기</h1>
    <div class="controls" role="toolbar" aria-label="곡 설정">
      <button id="play" class="primary" aria-pressed="false" aria-keyshortcuts="Space"><span id="play-text">▶ 재생</span><kbd class="key-hint" aria-hidden="true">Space</kbd></button
      ><button id="rewind" class="icon" aria-label="처음부터">⏮</button
      ><button id="loop" class="icon" aria-pressed="false" aria-label="반복 구간" title="반복 구간(마디 번호를 끌어 정해요)">🔁</button
      ><button id="metronome" class="icon" aria-pressed="false" aria-label="메트로놈" title="메트로놈">♩</button>
      <label class="field">빠르기 <input id="bpm" type="number" min="40" max="200" /></label>
      <label class="field">스윙 <input id="swing" type="number" min="0" max="100" step="5" />%</label>
      <label class="field">박자 <select id="meter"><option>4/4</option><option>3/4</option><option>6/8</option><option>12/8</option></select></label>
      <label class="field">마디 <select id="bars"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option><option>32</option></select></label>
      <label class="field">조 <select id="key"></select><select id="scale"><option value="major">장조</option><option value="minor">단조</option></select></label>
      <div class="history">
        <button id="undo" class="icon" aria-label="되돌리기">↶</button
        ><button id="redo" class="icon" aria-label="다시 하기">↷</button
        ><button id="reset" class="icon" aria-label="곡 전부 지우기" title="곡 전부 지우기">🗑</button>
      </div>
      <input id="song-title" class="song-title" type="text" maxlength="20" placeholder="곡 제목" autocomplete="off" aria-label="곡 제목" />
      <select id="song" aria-label="저장한 곡"></select
      ><button id="visit-keep" hidden>📥 내 곡에 담기</button>
      <button id="shareBtn">📤 게시판</button
      ><button id="export" class="primary-soft">MP3 내려받기</button>
    </div>
    <main class="studio">
      <section class="tracks" aria-label="트랙">
        <div id="tracks"></div>
        <button id="add-track" class="add">＋ 트랙</button>
      </section>
      <section class="editor" aria-label="편집">
        <div class="editor-head">
          <strong id="editor-title"></strong>
          <button id="select-mode" class="tool" aria-pressed="false" title="끌어서 음 고르기">⬚ 고르기</button>
          <span class="vel-tools" id="vel-tools" role="group" aria-label="음 세기">
            <button class="tool" data-vel="1" aria-pressed="false"><i>p</i> 여리게</button
            ><button class="tool" data-vel="2" aria-pressed="true"><i>mf</i> 조금 세게</button
            ><button class="tool" data-vel="3" aria-pressed="false"><i>f</i> 세게</button>
          </span>
          <span class="pick-tools" id="pick-tools" hidden>
            <button id="pick-up" class="icon" aria-label="고른 음 위로">▲</button
            ><button id="pick-down" class="icon" aria-label="고른 음 아래로">▼</button
            ><button id="pick-left" class="icon" aria-label="고른 음 왼쪽으로">◀</button
            ><button id="pick-right" class="icon" aria-label="고른 음 오른쪽으로">▶</button
            ><button id="pick-delete" class="icon" aria-label="고른 음 지우기">🗑</button>
          </span>
          <span class="zoom">
            <button id="zoom-out" class="icon" aria-label="작게 보기">🔍−</button
            ><button id="zoom-in" class="icon" aria-label="크게 보기">🔍＋</button>
          </span>
          <span class="octave" id="octave">
            <button id="octave-up" class="icon" aria-label="한 옥타브 위 보기">▲</button
            ><button id="octave-down" class="icon" aria-label="한 옥타브 아래 보기">▼</button>
          </span>
        </div>
        <div class="roll" id="roll">
          <div class="ruler-corner" aria-hidden="true"></div>
          <div class="ruler" id="ruler" aria-label="마디 번호(누르면 그 마디부터 재생)"></div>
          <div class="labels" id="labels"></div>
          <div class="grid-wrap">
            <svg id="grid" tabindex="0" aria-label="음 찍는 칸"></svg>
            <div class="playhead" id="playhead" hidden></div>
          </div>
        </div>
      </section>
    </main>
    <dialog id="shareDialog" class="share-dialog" aria-labelledby="shareTitle">
      <form id="shareForm" novalidate>
        <h2 id="shareTitle">게시판에 올리기</h2>
        <p id="shareWhat" class="share-note"></p>
        <label>방번호 <input id="shareCode" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="선생님이 알려 준 번호" /></label>
        <label id="shareColumnLabel" hidden>올릴 칸 <select id="shareColumn"></select></label>
        <p id="shareError" class="share-error" role="alert"></p>
        <p id="shareDone" class="share-done" hidden>올렸어요! <a id="shareBoardLink" target="_blank" rel="noopener">게시판 보기</a></p>
        <div class="share-actions">
          <button id="shareClose" type="button">닫기</button>
          <button id="shareSubmit" class="primary" type="submit">올리기</button>
        </div>
      </form>
    </dialog>
    <p id="notice" role="status" hidden></p>
    <span id="save-status" class="sr-only" role="status"></span>
    <template id="tool-help"><ul>
      <li>트랙을 눌러 고른 뒤 아래 칸에 음을 찍어요. 트랙은 5개까지예요.</li>
      <li>가락 악기: 빈칸을 누르고 옆으로 끌면 음이 길어져요. 음을 끌면 옮겨지고, 한 번 누르면 지워져요.</li>
      <li>드럼: 칸을 누르면 찍히고, 끌면 이어서 찍혀요. 찍힌 칸을 누르면 지워져요.</li>
      <li>조를 고르면 그 조에 없는 음 줄이 어둡게 보여요.</li>
      <li>M은 끄기, S는 그 트랙만 듣기예요.</li>
    </ul></template>
  </body>
</html>
