<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153026">
  <title>세계 미술 테마파크</title>
  <link rel="stylesheet" href="styles.css?v=20260918-cleanup-1">
  <script src="../../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
</head>
<body>
  <audio id="bgm" src="assets/sound/park-theme.ogg" loop preload="auto"></audio>
  <main id="app" aria-label="실물 크기 세계 미술 테마파크">
    <canvas id="park-canvas" aria-label="마우스와 키보드로 탐험하는 3D 야외 미술 공원"></canvas>

    <header class="topbar">
      <a class="brand" href="../museum/" aria-label="실내 미술관으로 돌아가기">
        <span class="brand-mark">A</span>
        <span><b>ARTSCAPE</b></span>
      </a>
    </header>

    <div class="topbar-actions">
      <button id="quiz-button" class="circle-button" type="button" aria-label="확인 문제">★</button>
    </div>

    <nav class="zone-tabs" id="zone-tabs" aria-label="전시 구역 바로 이동"></nav>
    <div class="class-presence" id="class-presence" aria-live="polite" hidden></div>

    <section class="measure-panel" id="measure-panel" hidden>
      <p id="measure-kicker"></p>
      <h2 id="measure-title"></h2>
      <dl id="measure-facts"></dl>
      <span id="measure-note"></span>
      <button id="detail-button" type="button">작품 이야기 보기</button>
    </section>

    <div class="crosshair" aria-hidden="true"><i></i><i></i></div>
    <div class="movement-hud">
      <span><kbd>WASD</kbd> 이동</span><span><kbd>Shift</kbd> 달리기</span>
      <span><kbd>드래그</kbd> 둘러보기</span>
    </div>
    <div class="minimap" aria-label="현재 구역">
      <i id="compass-arrow"></i>
      <span id="current-zone">중앙 광장</span>
    </div>

    <div class="touch-controls" aria-label="터치 이동 조작">
      <button data-key="KeyW" aria-label="앞으로">▲</button>
      <button data-key="KeyA" aria-label="왼쪽">◀</button>
      <button data-key="KeyS" aria-label="뒤로">▼</button>
      <button data-key="KeyD" aria-label="오른쪽">▶</button>
    </div>

    <div class="loading" id="loading" role="status">
      <div class="loading-orbit"><i></i><b>A</b></div>
      <p>공원을 준비하고 있어요</p>
    </div>

    <dialog class="detail-modal" id="detail-modal">
      <button class="modal-close" id="modal-close" type="button" aria-label="닫기">×</button>
      <div class="modal-image-wrap">
        <img id="modal-image" alt="">
      </div>
      <article>
        <p class="eyebrow" id="modal-kicker"></p>
        <h2 id="modal-title"></h2>
        <p class="modal-subtitle" id="modal-subtitle"></p>
        <dl class="facts" id="modal-facts"></dl>
        <section class="docent-card">
          <span>어린이 도슨트</span>
          <p id="modal-docent"></p>
          <div class="docent-details">
            <section><h3>꼭 알아둘 점</h3><p id="modal-caution"></p></section>
            <section><h3>관람 포인트</h3><p id="modal-look"></p></section>
          </div>
        </section>
        <details class="modal-legal" id="modal-legal">
          <summary>출처</summary>
          <p id="modal-rights"></p>
          <a id="modal-source" target="_blank" rel="noopener">원문 보기 ↗</a>
        </details>
      </article>
    </dialog>

    <dialog class="finale-modal" id="finale-modal" aria-labelledby="finale-title">
      <button class="modal-close" id="finale-close" type="button" aria-label="닫기">×</button>
      <div class="finale-ornament" aria-hidden="true"><span>A</span></div>
      <p class="eyebrow">LEARNING CHECK</p>
      <h2 id="finale-title">테마파크 확인 문제</h2>
      <div class="finale-status">
        <span id="finale-step">QUESTION 01 / 05</span>
        <i><b id="finale-progress"></b></i>
        <span id="finale-total">0 / 5</span>
      </div>
      <section class="finale-question" id="finale-question-wrap">
        <figure class="finale-artwork" id="finale-artwork" hidden>
          <img id="finale-artwork-image" alt="문제 작품">
        </figure>
        <p id="finale-question"></p>
        <div class="finale-options" id="finale-options"></div>
        <p class="finale-feedback" id="finale-feedback" aria-live="polite"></p>
        <button class="finale-next" id="finale-next" type="button" hidden>다음 관찰로</button>
      </section>
      <section class="finale-complete" id="finale-complete" hidden>
        <div class="curator-stamp" id="curator-stamp" aria-hidden="true"><span>CURATOR</span><b id="finale-stamp-number">01</b><small>OBSERVED</small></div>
        <p><strong id="finale-complete-title">관찰의 눈을 얻었어요</strong><span id="finale-complete-copy"></span></p>
        <button class="finale-next" id="finale-again" type="button">다시 풀어보기</button>
      </section>
    </dialog>
    <div class="vignette" aria-hidden="true"></div>
  </main>

  <script src="../museum/vendor/three.min.js"></script>
  <script src="../museum/vendor/GLTFLoader.js"></script>
  <script src="park.js?v=20260918-cleanup-1"></script>
</body>
</html>
