<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fef3e2">
<title>그림판</title>
<meta name="description" content="연필·크레파스·마카·수채화 브러시로 자유롭게 그리는 그림 도구">
<link rel="stylesheet" href="styles.css?v=3">
<script src="app.js?v=20261006-name" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="back-link" href="../../../" aria-label="메인 화면으로 돌아가기"><span aria-hidden="true">←</span> 메인</a>
    <div class="title-field">
      <input id="drawingTitle" type="text" maxlength="20" placeholder="그림 제목" autocomplete="off">
    </div>
    <div class="topbar-actions">
      <button id="undoBtn" class="icon-btn" type="button" title="되돌리기" disabled>↶</button>
      <button id="redoBtn" class="icon-btn" type="button" title="다시하기" disabled>↷</button>
      <button id="clearBtn" class="icon-btn" type="button" title="현재 레이어 지우기">🗑</button>
      <button id="saveBtn" class="primary-btn" type="button">저장</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="tool-rail left-rail">
      <section class="rail-card">
        <h2>브러시</h2>
        <div id="brushRail" class="brush-rail"></div>
      </section>

      <section class="rail-card">
        <h2>굵기 <span id="sizeValue" class="value-pill">8</span></h2>
        <input id="sizeSlider" type="range" min="1" max="40" value="8">

        <h2>투명도 <span id="opacityValue" class="value-pill">100</span></h2>
        <input id="opacitySlider" type="range" min="5" max="100" value="100">

        <h2>흩뿌림 <span id="scatterValue" class="value-pill">0</span></h2>
        <input id="scatterSlider" type="range" min="0" max="100" value="0">

        <h2>손떨림 보정 <span id="stabilizeValue" class="value-pill">1</span>
          <span class="info-wrap">
            <button type="button" class="info-icon" aria-label="손떨림 보정 설명 보기">?</button>
            <span class="info-tip" role="tooltip">숫자가 클수록 선이 더 부드럽게 그려져요</span>
          </span>
        </h2>
        <input id="stabilizeSlider" type="range" min="0" max="6" value="1">

        <label class="toggle-row">
          <input id="alphaLockToggle" type="checkbox">
          <span>칠한 곳 안에서만 칠하기</span>
          <span class="info-wrap">
            <button type="button" class="info-icon" aria-label="칠한 곳 안에서만 칠하기 설명 보기">?</button>
            <span class="info-tip" role="tooltip">켜면 이미 칠한 그림 밖으로 색이 삐져나가지 않아요</span>
          </span>
        </label>
      </section>
    </aside>

    <section class="canvas-stage">
      <div class="canvas-max" id="canvasMax">
        <div class="canvas-frame" id="canvasFrame">
          <canvas id="mainCanvas" width="1000" height="700" aria-label="그림 캔버스"></canvas>
          <div id="brushCursor" class="brush-cursor hidden" aria-hidden="true"></div>
          <div class="resize-handle handle-e" data-dir="e" title="가로 크기 조절" aria-hidden="true"></div>
          <div class="resize-handle handle-s" data-dir="s" title="세로 크기 조절" aria-hidden="true"></div>
          <div class="resize-handle handle-se" data-dir="se" title="크기 조절" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <aside class="tool-rail right-rail">
      <section class="rail-card">
        <h2>색상</h2>
        <div class="color-preview-row">
          <span id="activeColorPreview" class="active-color-preview"></span>
          <button id="eyedropperBtn" class="icon-btn" type="button" title="스포이드">💧</button>
        </div>
        <canvas id="colorWheel" width="150" height="150" class="color-wheel"></canvas>
        <div id="swatchGrid" class="swatch-grid"></div>
      </section>

      <section class="rail-card">
        <div class="rail-card-head">
          <h2>레이어</h2>
          <button id="addLayerBtn" class="icon-btn small" type="button" title="레이어 추가">＋</button>
        </div>
        <div id="layerPanel" class="layer-panel"></div>
      </section>
    </aside>
  </main>
</div>
</body>
</html>
