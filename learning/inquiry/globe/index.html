<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1522">
  <title>지구본</title>
  <link rel="stylesheet" href="vendor/maplibre-gl-6.10.0/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=20260919-14">
</head>
<body>
  <div id="globe" role="application" aria-label="지구본"></div>

  <div class="view-controls" role="group" aria-label="확대와 축소">
    <button type="button" id="zoomIn" aria-label="확대"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zoomOut" aria-label="축소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="resetView" aria-label="지구 전체 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5s1.3-6.1 3.9-8.5z"/></svg></button>
  </div>

  <nav class="layer-bar" id="layerBar" aria-label="지도에 보일 것"></nav>

  <aside class="info-panel" id="infoPanel" aria-label="설명" hidden>
    <button type="button" class="info-close" aria-label="설명 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <figure class="info-photo" hidden>
      <img alt="" decoding="async">
      <figcaption></figcaption>
    </figure>
    <div class="info-body">
      <p class="info-kind"></p>
      <h2 class="info-title"><img class="info-flag" alt="" hidden><span class="info-name"></span></h2>
      <p class="info-where"></p>
      <div class="info-text"></div>
      <section class="info-exam-box" hidden>
        <h3>시험 요점</h3>
        <ul class="info-exam"></ul>
      </section>
      <p class="info-credit" hidden></p>
    </div>
  </aside>

  <script src="data/globe-data.js?v=20260919-14"></script>
  <script type="module" src="app.js?v=20260919-14"></script>
</body>
</html>
