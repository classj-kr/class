<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c46">
  <title>지리</title>
  <link rel="stylesheet" href="../korea-map/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260906-2">
</head>
<body class="geography-page">
  <div class="app-shell">
    <nav class="theme-tabs" aria-label="세계지리 학습 주제">
      <button class="theme-tab is-active" type="button" data-theme="world" aria-pressed="true"><span>🌐</span> 대륙·대양</button>
      <button class="theme-tab" type="button" data-theme="coordinates" aria-pressed="false"><span>⊕</span> 위도·경도</button>
      <button class="theme-tab" type="button" data-theme="terrain" aria-pressed="false"><span>⛰️</span> 지형</button>
      <button class="theme-tab" type="button" data-theme="climate" aria-pressed="false"><span>🌦️</span> 기후</button>
      <button class="theme-tab" type="button" data-theme="population" aria-pressed="false"><span>🏙️</span> 인구·도시</button>
      <button class="theme-tab" type="button" data-theme="region" aria-pressed="false"><span>🧭</span> 지역</button>
      <button class="theme-tab" type="button" data-theme="religion" aria-pressed="false"><span>🕌</span> 종교·문화</button>
      <button class="theme-tab" type="button" data-theme="resources" aria-pressed="false"><span>🛢️</span> 자원·산업</button>
    </nav>

    <main class="study-layout">
      <div class="map-column">
        <section class="map-stage" aria-label="세계지리 주제 지도">
          <div id="map" role="application" aria-label="세계지리 학습 지도"></div>
          <a class="map-back" href="../../../" aria-label="학습 메뉴로 돌아가기">←</a>
          <button class="map-progress" id="progressButton" type="button" aria-label="학습 기록 보기"><strong id="progressScore">0 / 0</strong></button>
          <div class="map-key" id="mapKey" aria-live="polite"></div>
        </section>
        <div class="layer-dock" id="layerDock">
          <div class="layer-chips" id="layerChips" role="group" aria-label="지도 층 켜고 끄기"></div>
          <div class="layer-legends" id="layerLegends"></div>
        </div>
      </div>

      <aside class="study-panel">
        <section class="concept-card" aria-labelledby="conceptTitle">
          <h1 id="conceptTitle"></h1>
          <p id="conceptSummary"></p>
          <aside class="feature-focus" id="featureFocus" aria-live="polite" hidden>
            <button class="focus-close" id="focusClose" type="button" aria-label="닫고 세계 전체 보기">×</button>
            <span id="focusKicker"></span>
            <strong id="focusTitle"></strong>
            <div id="focusBody"></div>
          </aside>
          <div class="concept-points" id="conceptPoints"></div>
          <div class="feature-list" id="featureList" aria-label="지도 항목"></div>
          <button class="practice-button" id="startPractice" type="button">문제 풀기</button>
        </section>
      </aside>
    </main>
  </div>

  <dialog class="practice-dialog" id="practiceDialog" aria-labelledby="questionTitle">
    <div class="dialog-topbar">
      <div><strong id="questionProgress"></strong><span id="questionTopic">대륙·대양</span></div>
      <button id="closePractice" type="button" aria-label="문제 풀이 닫기">×</button>
    </div>
    <div class="progress-track" aria-hidden="true"><span id="questionProgressBar"></span></div>
    <section class="question-body">
      <div class="question-copy">
        <span class="difficulty-badge" id="questionDifficulty">기본</span>
        <h2 id="questionTitle"></h2>
        <div class="answer-options" id="answerOptions"></div>
      </div>
      <div class="question-map-wrap">
        <div id="questionMap" aria-label="문제 관련 위치 지도"></div>
        <div id="questionGraph" class="question-graph" hidden></div>
        <p id="questionMapCaption">답을 고르면 지도에 관련 위치가 표시돼요.</p>
      </div>
    </section>
    <section class="answer-feedback" id="answerFeedback" aria-live="polite" hidden>
      <strong id="feedbackTitle"></strong>
      <p id="feedbackExplanation"></p>
    </section>
    <div class="dialog-actions">
      <button class="secondary-button" id="showHint" type="button">단서 보기</button>
      <button class="primary-button" id="nextQuestion" type="button" disabled>다음 문제</button>
    </div>
  </dialog>

  <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-visual" id="resultVisual"></div>
    <h2 id="resultTitle">연습 완료</h2>
    <p id="resultSummary"></p>
    <div class="result-actions">
      <button class="secondary-button" id="reviewWrong" type="button">틀린 문제 복습</button>
      <button class="primary-button" id="finishPractice" type="button">지도 학습으로</button>
    </div>
  </dialog>

  <script src="../korea-map/vendor/leaflet/leaflet.js"></script>
  <script src="data/world-countries.js?v=20260904-2"></script>
  <script src="data/world-rivers.js?v=20260904-2"></script>
  <script src="data/plate-boundaries.js?v=20260904-2"></script>
  <script src="data/koppen-grid.js?v=20260904-2"></script>
  <script src="data/layers.js?v=20260904-2"></script>
  <script src="map-layers.js?v=20260904-2"></script>
  <script src="climate-graph.js?v=20260904-2"></script>
  <script src="data.js?v=20260918-quiz"></script>
  <script src="app.js?v=20260906-2"></script>
</body>
</html>
