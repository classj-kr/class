<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c46">
  <title>테마도감</title>
  <link rel="stylesheet" href="../../korean-museum/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../styles.css?v=20260904-5">
  <link rel="stylesheet" href="styles.css?v=20260917-1">
</head>
<body class="atlas-page">
  <div class="app-shell">
    <nav class="atlas-theme-strip" aria-label="테마도감 주제">
      <div class="theme-layer-controls" id="themeLayerControls" role="group" aria-label="테마 선택"></div>
    </nav>

    <main class="atlas-layout">
      <section class="map-stage atlas-map-stage" aria-label="세계 테마도감 지도">
        <div id="map" role="application" aria-label="선택한 테마의 세계지도"></div>
        <a class="map-back" href="../../../../" aria-label="학습 메뉴로 돌아가기">←</a>
        <strong class="atlas-map-status" id="themeItemCount" aria-live="polite">동물 18개</strong>
        <article class="theme-item-card atlas-item-card" id="themeItemCard" aria-live="polite" hidden>
          <button class="theme-item-close" id="closeThemeItem" type="button" aria-label="테마 설명 닫기">×</button>
          <div class="theme-item-icon" id="themeItemIcon" aria-hidden="true">🌍</div>
          <div class="theme-item-copy">
            <span id="themeItemCategory">테마</span>
            <h2 id="themeItemName"></h2>
            <strong id="themeItemPlace"></strong>
            <p id="themeItemDescription"></p>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="../../korean-museum/vendor/leaflet/leaflet.js"></script>
  <script src="../theme-items.js?v=20260903-3"></script>
  <script src="app.js?v=20260904-5"></script>
</body>
</html>
