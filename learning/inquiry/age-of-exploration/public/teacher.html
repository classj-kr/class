<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<section id="login" class="panel login"><h1>도착 경주 현황판</h1><p id="error" class="err">방을 여는 중입니다.</p><a class="backLink" href="/">사이트 첫 화면으로</a></section>

<section class="setup">
<div class="panel"><div class="roomInfo"><div class="roomHeading"><strong>방번호 <span id="roomLabel"></span></strong><span>접속 <b id="count">0</b>명</span></div><div class="roomState"><span>게임 날짜 <b id="classClock">1520년 1월 1일 00:00</b></span><span id="status" class="ok" role="status">서버 연결</span></div></div><h3 class="setupTitle">미션 설정</h3><p class="muted">학습 장소는 1~3곳, 출발 도시는 1~4곳을 지정합니다.</p><div id="studyRows"><div class="studyFilters"><label>자료 범위<select id="studyTier"><option value="recommended">교과·가치 추천</option><option value="explore">주제별 탐구</option><option value="all">전체 자료</option><option value="later">후대 문화</option></select></label><label>학교급<select id="studyLevel"><option value="all">전체 학교급</option><option value="elementary">초등</option><option value="middle">중학</option><option value="high">고등</option></select></label><label>주제<select id="studyTopic"><option value="all">전체 주제</option></select></label><label>종류<select id="studyKind"><option value="all">도시·발견물·명소</option><option value="city">도시</option><option value="discovery">발견물</option><option value="landmark">도시 명소</option></select></label></div><p class="muted">★는 문화·과학적 가치가 큰 장소입니다. 학교급을 고르면 분류된 발견물·명소를 보여 줍니다.</p><label>도시·발견물 찾기<input id="studySearch" type="search" placeholder="장소·나라 이름 검색"></label><label>학습 장소<select id="studyChoice"></select></label><div id="studyMatches" role="status"></div><div id="studyPreview" class="studyPreview" aria-live="polite"></div><button type="button" id="studyAdd">목록에 추가</button><b id="studyCount">0/3곳</b><ul id="studySelected"></ul><p class="muted">방문 순서는 자유입니다. 각 장소에서 설명을 읽고 세 문제를 연속으로 맞혀야 완료됩니다.</p></div><div id="startCities" class="startGrid"></div><button type="button" id="addStart" class="addStart">출발 도시 추가 · 최대 4곳</button><div class="setupActions"><button id="publish" class="publish">미션 준비 · 출발지 선택 시작</button><button id="startRace" class="startRace" disabled>전원 출발</button><button id="clear" class="danger">미션 종료</button></div><p id="missionError" class="err"></p></div>
<div id="activeMission" class="panel"><p class="muted">아직 미션이 없습니다.</p></div>
</section>
<section id="monitor" class="monitor">
<section class="panel mapPanel" aria-label="학생 위치 지도"><div class="mapWrap"><canvas id="worldMap" width="1000" height="500" aria-label="학생 전체 위치 세계지도"></canvas></div><div class="mapHeader"><button id="fullMonitor">TV 전체화면</button></div></section>
<section id="rankBoard" class="panel rankBoard"><div class="rankHeader"><h3>완주 순위 <small id="finishCount">0명</small></h3><div id="rankMission" class="missionTitle" hidden></div></div><div class="rankContent"><section class="finishSection" aria-label="완주자"><div id="rankList" class="rankList"><div class="empty">아직 없음</div></div></section><section class="waitingSection" hidden><h3 class="waitingTitle">진행 중 <small id="waitingCount">0명</small></h3><div id="waitingList"></div></section></div></section>
</section>
</div></main>
<script src="/learn/world-voyage/socket.io/socket.io.js"></script><script src="/learn/world-voyage/js/study-catalog.js?v=2026102101"></script><script>
'use strict';
const socket=io({path:'/learn/world-voyage/socket.io',transports:['polling']}),$=id=>document.getElementById(id);let players=[],activeMission=null,progress=[],catalog={places:[]},classSettings={paused:false,locked:false},teacherClockActive=false,clockRate=4,clockBaseMinutes=0,clockBaseReal=Date.now();
const WORLD_PIXEL_W=2500*16,WORLD_PIXEL_H=1250*16,worldImage=new Image(),mapCanvas=$('worldMap'),mapCtx=mapCanvas.getContext('2d');let worldImageReady=false;
worldImage.src='/learn/world-voyage/assets/maps/natural-earth-v58/overview.webp?v=59';worldImage.onload=()=>{worldImageReady=true;drawWorldMap()};
function ack(e,p={}){return new Promise(r=>socket.emit(e,p,r))}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatGameDate(m){const d=new Date(Date.UTC(1520,0,1)+Math.max(0,m||0)*60000);return `${d.getUTCFullYear()}년 ${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`}function teacherClockShouldRun(){return activeMission?.phase==='running'&&!classSettings.paused}function teacherMinutes(){return teacherClockShouldRun()?clockBaseMinutes+(Date.now()-clockBaseReal)/1000*clockRate*60:clockBaseMinutes}function resetClock(m){clockBaseMinutes=Math.max(0,Number(m)||0);clockBaseReal=Date.now();$('classClock').textContent=formatGameDate(m)}setInterval(()=>{if(!teacherClockActive)return;const m=teacherMinutes();$('classClock').textContent=formatGameDate(m);socket.emit('teacherClockSync',{gameMinutes:m})},500);
function opt(sel,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)}
function originalOrder(p){const n=Number(p.originalOrder);return Number.isFinite(n)?n:9999}
function appendOriginalCities(select,items,labelCategory=false){select.replaceChildren();let current='',group=null;for(const p of [...items].sort((a,b)=>originalOrder(a)-originalOrder(b))){const region=p.originalRegion||p.region||'원작 도시';if(region!==current){current=region;group=document.createElement('optgroup');group.label=region;select.append(group)}const o=document.createElement('option');o.value=p.id;o.textContent=labelCategory?`도시 · ${p.name}`:p.name;group.append(o)}}

let studySelection=[],startSelection=['lisbon'];
function renderStartCities(){
 const ports=catalog.places.filter(p=>p.isOriginalCity&&p.canEnterFromSea===true),list=$('startCities');list.replaceChildren();
 startSelection.forEach((value,index)=>{
  const row=document.createElement('div'),label=document.createElement('label'),select=document.createElement('select'),remove=document.createElement('button');
  row.className='startRow';select.id='start'+(index+1);label.append(document.createTextNode('출발 도시 '+(index+1)),select);
  appendOriginalCities(select,ports,false);const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='도시를 선택하세요';select.prepend(placeholder);select.value=value;
  select.onchange=()=>{startSelection[index]=select.value;};
  remove.type='button';remove.className='removeStart';remove.textContent='삭제';remove.setAttribute('aria-label','출발 도시 '+(index+1)+' 삭제');remove.disabled=startSelection.length===1;remove.onclick=()=>{startSelection.splice(index,1);renderStartCities();};
  row.append(label,remove);list.append(row);
 });
 $('addStart').disabled=startSelection.length>=4;
}
$('addStart').onclick=()=>{if(startSelection.length<4){startSelection.push('');renderStartCities();$('start'+startSelection.length).focus();}};
function studyChoices(){return VoyageStudyCatalog.choices(catalog);}
function renderStudyPreview(){
  const item=studyChoices().find(p=>p.key===$('studyChoice').value),box=$('studyPreview');box.replaceChildren();
  if(!item){box.textContent='조건에 맞는 장소가 없습니다. 다른 주제나 전체 자료를 선택하세요.';return;}
  const l=item.learning;
  if(!l){box.textContent='도시에 입장해 역사·교역·생활에 관한 설명을 읽습니다. 도시 설명은 학교급을 지정하지 않았습니다.';return;}
  const title=document.createElement('b');title.textContent=[l.label,l.valuable?'문화·과학 가치':'',l.topic,l.levelLabels.join('·')].filter(Boolean).join(' · ');
  const goal=document.createElement('p');goal.textContent='학습 목표 · '+l.objective;
  const standards=document.createElement('small');standards.textContent='연계 가능 성취기준 · '+l.standards.join(', ');
  box.append(title,goal,standards);
  if(l.tier==='later'){const note=document.createElement('p');note.textContent='1520년 이후의 문화입니다. 현장 발견 수에 포함하지 않습니다.';box.append(note);}
}
function renderStudyChoices(){
  if(!catalog)return;
  const query=$('studySearch').value.trim().toLocaleLowerCase(),select=$('studyChoice'),previous=select.value;
  select.replaceChildren();
  const matches=VoyageStudyCatalog.filter(studyChoices(),{tier:$('studyTier').value,level:$('studyLevel').value,topic:$('studyTopic').value,kind:$('studyKind').value,query});
  for(const item of matches.filter(p=>!studySelection.includes(p.key)))opt(select,item.key,(item.learning?.valuable?'★ ':'')+item.type+' · '+item.name+' · '+item.region);
  if([...select.options].some(o=>o.value===previous))select.value=previous;
  $('studyAdd').disabled=studySelection.length>=3||!select.value;
  $('studyCount').textContent=studySelection.length+'/3곳';
  $('studyMatches').textContent='선택 가능 '+select.options.length+'곳';renderStudyPreview();
  $('studySelected').replaceChildren();
  for(const key of studySelection){
    const item=studyChoices().find(p=>p.key===key),li=document.createElement('li'),remove=document.createElement('button');
    li.append(document.createTextNode(item.type+' · '+item.name+' '));remove.type='button';remove.textContent='삭제';remove.setAttribute('aria-label',item.name+' 삭제');remove.onclick=()=>{studySelection=studySelection.filter(k=>k!==key);renderStudyChoices();};li.append(remove);$('studySelected').append(li);
  }
}

async function loadCatalog(){const r=await fetch('/learn/world-voyage/api/mission-catalog?v=2026102101');catalog=await r.json();const topicSelect=$('studyTopic'),previous=topicSelect.value;topicSelect.replaceChildren();opt(topicSelect,'all','전체 주제');for(const topic of catalog.learningTopics||[])opt(topicSelect,topic,topic);if([...topicSelect.options].some(o=>o.value===previous))topicSelect.value=previous;renderStudyChoices();renderStartCities();}
function progressOf(name){return progress.find(p=>p.name===name)||{status:'assigned'}}
function medalText(rank){const n=Number(rank)||0;return n===1?'🥇':n===2?'🥈':n===3?'🥉':`${n}위`}function rankClass(rank){return Number(rank)===1?'gold':Number(rank)===2?'silver':Number(rank)===3?'bronze':''}
function playerVisual(player,pr=progressOf(player.name)){if(pr.status==='completed'){const rank=Number(pr.finishRank)||Number(player.finishRank)||0;return{color:rank===1?'#f4ca55':rank===2?'#d7e0e7':rank===3?'#c78455':'#9fe1b0',rank,completed:true}}if(!pr.selectedStartPlaceId)return{color:'#8a969b',rank:0};return{color:'#70bde2',rank:0,completed:false}}
let mapBounds={x:0,y:0,width:1000,height:500};
function mapXY(point){return{x:mapBounds.x+((Number(point?.x)||0)%WORLD_PIXEL_W+WORLD_PIXEL_W)%WORLD_PIXEL_W/WORLD_PIXEL_W*mapBounds.width,y:mapBounds.y+Math.max(0,Math.min(WORLD_PIXEL_H,Number(point?.y)||0))/WORLD_PIXEL_H*mapBounds.height}}
function rectOverlap(a,b){return!(a.x+a.w<b.x||b.x+b.w<a.x||a.y+a.h<b.y||b.y+b.h<a.y)}
function drawWorldMap(){if(!mapCtx||!mapCanvas.clientWidth||!mapCanvas.clientHeight)return;
 const width=mapCanvas.clientWidth,height=mapCanvas.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);
 if(mapCanvas.width!==Math.round(width*dpr)||mapCanvas.height!==Math.round(height*dpr)){mapCanvas.width=Math.round(width*dpr);mapCanvas.height=Math.round(height*dpr);}
 mapCtx.setTransform(dpr,0,0,dpr,0,0);mapCtx.clearRect(0,0,width,height);
 const imageWidth=Math.min(width,height*2),imageHeight=imageWidth/2;
 mapBounds={x:(width-imageWidth)/2,y:(height-imageHeight)/2,width:imageWidth,height:imageHeight};
 if(worldImageReady)mapCtx.drawImage(worldImage,mapBounds.x,mapBounds.y,imageWidth,imageHeight);
 const labelSize=document.fullscreenElement?16:12;
const occupied=[];const plotted=players.map(player=>({player,pr:progressOf(player.name)})).filter(item=>item.pr.status!=='completed').sort((a,b)=>a.player.name.localeCompare(b.player.name,'ko'));for(const item of plotted){const p=mapXY(item.player),v=playerVisual(item.player,item.pr);mapCtx.save();mapCtx.shadowColor='#000';mapCtx.shadowBlur=3;mapCtx.fillStyle=v.color;mapCtx.strokeStyle='#061219';mapCtx.lineWidth=2;mapCtx.beginPath();mapCtx.arc(p.x,p.y,5,0,Math.PI*2);mapCtx.fill();mapCtx.stroke();mapCtx.restore();const label=item.player.name,font=`bold ${labelSize}px "Malgun Gothic"`;mapCtx.font=font;const tw=mapCtx.measureText(label).width+8,th=labelSize+7;const positions=[{x:p.x-tw/2,y:p.y-25},{x:p.x+9,y:p.y-8},{x:p.x-tw-9,y:p.y-8},{x:p.x-tw/2,y:p.y+9}];let rect=positions.map(q=>({...q,w:tw,h:th})).find(r=>r.x>=1&&r.x+r.w<width-1&&r.y>=1&&r.y+r.h<height-1&&!occupied.some(o=>rectOverlap(r,o)))||{x:Math.max(1,Math.min(width-tw-1,p.x-tw/2)),y:Math.max(1,Math.min(height-th-1,p.y-25)),w:tw,h:th};occupied.push(rect);mapCtx.fillStyle='#061219d9';mapCtx.fillRect(rect.x,rect.y,rect.w,rect.h);mapCtx.strokeStyle=v.color;mapCtx.lineWidth=1;mapCtx.strokeRect(rect.x+.5,rect.y+.5,rect.w-1,rect.h-1);mapCtx.fillStyle='#fff';mapCtx.font=font;mapCtx.textAlign='center';mapCtx.textBaseline='middle';mapCtx.fillText(label,rect.x+rect.w/2,rect.y+rect.h/2+.5)}}
function renderMission(){const box=$('activeMission'),startBtn=$('startRace');if(!activeMission){box.innerHTML='<p class="muted">아직 미션이 없습니다.</p>';startBtn.disabled=true;startBtn.textContent='전원 출발';return}const selected=progress.filter(p=>p.selectedStartPlaceId).length,done=progress.filter(p=>p.status==='completed').length,running=activeMission.phase==='running',allReady=players.length>0&&selected===players.length;const starts=(activeMission.startOptions||[]).map((o,i)=>`<div class="countCard"><b>${i+1}. ${esc(o.startPlace.name)}</b><br>선택 ${progress.filter(p=>p.selectedStartPlaceId===o.startPlace.id).length}명</div>`).join('');box.innerHTML=`<div class="missionNow"><span>${running?'진행 중':'출발 준비 중'} · 도착지</span><strong>${esc(activeMission.targetPlace?.name||activeMission.title)}</strong></div><div class="counts">${starts}</div><p><b>출발지 선택</b> ${selected}/${players.length}명 · <b>완주</b> ${done}/${players.length}명</p>${!running&&players.length&&!allReady?'<p class="muted">모든 학생이 출발 도시를 선택하면 전원 출발 버튼이 활성화됩니다.</p>':''}`;startBtn.disabled=running||!allReady;startBtn.textContent=running?'출발 완료':allReady?'전원 출발':'선택 완료 대기'}
function renderRanking(){
 const done=progress.filter(p=>p.status==='completed'&&p.finishRank).sort((a,b)=>a.finishRank-b.finishRank||a.completedAt-b.completedAt);
 const waiting=players.map(player=>({player,pr:progressOf(player.name)})).filter(item=>item.pr.status!=='completed');
 const study=!!activeMission?.studyTargets,target=activeMission?.targetPlace?.name;
 $('rankMission').textContent=target||'';$('rankMission').hidden=!target||study;
 $('finishCount').textContent=done.length+'명';$('waitingCount').textContent=waiting.length+'명';
 $('rankList').innerHTML=done.length?done.map(p=>{
  const score=Number.isFinite(p.finalCorrectCount)?p.finalCorrectCount:0;
  return `<div class="rankRow ${rankClass(p.finishRank)}"><span class="rankNo" aria-label="${Number(p.finishRank)}위">${medalText(p.finishRank)}</span><b class="rankName">${esc(p.name)}</b>${study?'':`<span class="rankScore" aria-label="3문제 중 ${score}개 정답">${score}/3</span>`}</div>`;
 }).join(''):'<div class="empty">'+(players.length?'아직 없음':'참가 대기')+'</div>';
 $('waitingList').closest('.waitingSection').hidden=!waiting.length;
 $('waitingList').innerHTML=waiting.sort((a,b)=>a.player.name.localeCompare(b.player.name,'ko')).map(({player,pr})=>{
  let state='대기';
  if(activeMission){
   if(!pr.selectedStartPlaceId)state='출발지 선택';
   else if(activeMission.phase!=='running')state='출발 대기';
   else if(study){
    const completed=(pr.studyPlaces||[]).filter(p=>p.phase==='completed').length;
    state=((pr.studyPlaces||[]).some(p=>p.phase==='quiz')?'문제 풀이 ':'학습 ')+completed+'/'+activeMission.studyTargets.length;
   }else state=pr.finalQuizStatus==='answering'?'문제 풀이':'이동 중';
  }
  return `<div class="waiting"><b>${esc(player.name)}</b><span>${state}</span></div>`;
 }).join('');
}
function renderAll(){$('count').textContent=players.length;renderMission();renderRanking();drawWorldMap()}
const pageParams=new URLSearchParams(location.search);let hostRoom=/^\d{4}$/.test(pageParams.get('room')||'')?pageParams.get('room'):'';
const hostKey=c=>`uw3-host-${c}`;function readHostToken(c){try{return sessionStorage.getItem(hostKey(c))||''}catch{return ''}}function saveHostToken(c,t){try{sessionStorage.setItem(hostKey(c),t)}catch{}}
function openDash(r){$('login').classList.add('hidden');$('dash').classList.remove('hidden');$('roomLabel').textContent=r.roomCode;$('roomLabel').title='참가자에게 이 방번호를 알려 주세요';activeMission=r.mission;if(activeMission?.startOptions?.length){startSelection=activeMission.startOptions.map(o=>o.startPlace.id);if(catalog.places.length)renderStartCities();}progress=r.progress||[];classSettings={...classSettings,...(r.settings||{})};clockRate=Number(r.clockRateHoursPerSecond||30);resetClock(r.classGameMinutes||0);teacherClockActive=true;renderAll()}
function showLoginError(message){$('dash').classList.add('hidden');$('login').classList.remove('hidden');$('error').textContent=message}
async function enterHost(){
  if(hostRoom){const token=readHostToken(hostRoom);if(!token){showLoginError('이 방을 만든 화면에서만 현황판을 열 수 있습니다.');return}const r=await ack('teacherJoin',{roomCode:hostRoom,hostToken:token});if(!r?.ok){showLoginError(r?.error||'현황판을 열지 못했습니다.');return}openDash(r);return}
  if(pageParams.get('create')==='race'){const r=await ack('createRoom',{roomType:'race'});if(!r?.ok){showLoginError(r?.error||'방을 만들지 못했습니다.');return}hostRoom=r.roomCode;saveHostToken(hostRoom,r.hostToken);history.replaceState(null,'',`?room=${hostRoom}`);openDash(r);return}
  showLoginError('게임 첫 화면에서 "도착 경주"를 선택하고 방을 만들면 현황판이 열립니다.');
}
socket.on('connect',()=>{$('status').textContent='서버 연결';$('status').className='ok';enterHost()});socket.on('disconnect',()=>{teacherClockActive=false;$('status').textContent='재연결 중';$('status').className='err'});socket.on('teacherSnapshot',s=>{players=s.players||[];activeMission=s.mission||null;progress=s.progress||[];classSettings={...classSettings,...(s.settings||{})};resetClock(s.classGameMinutes);renderAll()});socket.on('teacherMissionChanged',d=>{activeMission=d?.mission||null;renderAll()});socket.on('teacherMissionProgress',d=>{const i=progress.findIndex(p=>p.name===d.name);if(i>=0)progress[i]={name:d.name,...d.progress};else progress.push({name:d.name,...d.progress});renderAll()});
$('studySearch').oninput=renderStudyChoices;
$('studyAdd').onclick=()=>{const key=$('studyChoice').value;if(key&&studySelection.length<3&&!studySelection.includes(key)){studySelection.push(key);renderStudyChoices();}};
$('publish').onclick=async()=>{
 if(!studySelection.length||studySelection.length>3){$('missionError').textContent='학습 장소를 1~3곳 추가하세요.';return;}
 const startPlaceIds=startSelection.filter(Boolean);
 if(!startPlaceIds.length){$('missionError').textContent='출발 도시를 한 곳 이상 선택하세요.';return;}
 if(new Set(startPlaceIds).size!==startPlaceIds.length){$('missionError').textContent='출발 도시는 서로 다르게 선택하세요.';return;}
 const payload={startPlaceIds,studyTargets:[...studySelection]};
 $('publish').disabled=true;
 try{const r=await ack('teacherPublishArrivalRace',payload);if(!r?.ok){$('missionError').textContent=r?.error||'배포 실패';return}
