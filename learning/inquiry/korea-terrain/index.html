<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dfeaf3">
  <title>지형도</title>
  <link rel="stylesheet" href="vendor/maplibre-gl-6.10.0/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=20260919-5">
</head>
<body>
  <div id="terrain" role="application" aria-label="한반도 지형도"></div>

  <div class="view-controls" role="group" aria-label="지도 조작">
    <button type="button" id="zoomIn" aria-label="확대"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zoomOut" aria-label="축소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="resetView" aria-label="한반도 전체 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></button>
    <button type="button" id="profileButton" aria-label="단면도 그리기" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l5-8 4 4 3-6 6 10"/><circle cx="3" cy="19" r="1.4"/><circle cx="21" cy="19" r="1.4"/></svg></button>
  </div>

  <aside class="info-card" id="infoCard" hidden aria-live="polite">
    <button type="button" class="card-close" id="infoClose" aria-label="설명 닫기">×</button>
    <strong id="infoTitle"></strong>
    <p id="infoText"></p>
  </aside>

  <section class="profile-panel" id="profilePanel" hidden aria-label="단면도">
    <button type="button" class="card-close" id="profileClose" aria-label="단면도 닫기">×</button>
    <p class="profile-hint" id="profileHint"></p>
    <svg id="profileChart" role="img" aria-label="두 점 사이의 높이 변화"></svg>
  </section>

  <div class="bottom-dock">
    <div class="view-card">
      <label class="slider"><span>기울기</span><input type="range" id="pitchInput" min="0" max="60" step="1" value="45"><output id="pitchOutput">45°</output></label>
      <label class="slider"><span>높이 과장</span><input type="range" id="exaggerationInput" min="1" max="4" step="0.5" value="2"><output id="exaggerationOutput">2배</output></label>
      <div class="legend" aria-label="높이별 색">
        <span class="legend-sea">바다</span>
        <span class="legend-bar" aria-hidden="true"></span>
        <span class="legend-ticks" aria-hidden="true"><span>0</span><span>200</span><span>500</span><span>1000</span><span>1500</span><span>2000m</span></span>
      </div>
    </div>
    <nav class="layer-bar" id="layerBar" aria-label="지도에 보일 것"></nav>
  </div>

  <script src="data/terrain-data.js?v=20260919-5"></script>
  <script type="module" src="app.js?v=20260919-5"></script>
</body>
</html>
