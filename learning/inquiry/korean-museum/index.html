<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유물·유적</title>
  <meta name="description" content="중·고등 한국사 시험 핵심 유물과 유적의 실제 위치, 사진, 핵심 개념을 익히는 인터랙티브 지도">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  
  <!-- App Styles -->
  <link rel="stylesheet" href="styles.css?v=20260901-2">
  
</head>
<body>
  <!-- Global App Header & Smart Filters -->
  <header class="app-header">
    <div class="header-main">
      <div class="brand">
        <a class="home-link" href="../../../" aria-label="메인 페이지로 돌아가기">← 메인으로</a>
      </div>
      
    </div>

    <!-- Smart Filter Controls -->
    <div id="filter-bar" class="filter-bar">
      <!-- Era Filters -->
      <div class="filter-group">
        <span class="filter-label">📅 시대 선택:</span>
        <button class="filter-btn active" data-filter-type="era" data-value="all">전체</button>
        <button class="filter-btn" data-filter-type="era" data-value="prehistoric">1. 선사·고조선</button>
        <button class="filter-btn" data-filter-type="era" data-value="three_kingdoms">2. 삼국 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="unified_silla">3. 통일신라·발해</button>
        <button class="filter-btn" data-filter-type="era" data-value="goryeo">4. 고려 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="joseon">5. 조선 시대</button>
        <button class="filter-btn" data-filter-type="era" data-value="modern">6. 근현대</button>
      </div>

      <!-- Five-question practice -->
      <div class="filter-group quiz-launcher-group" aria-label="한국사 5문제 퀴즈">
        <select id="quiz-scope-select" class="quiz-scope-select" aria-label="퀴즈 시대 선택">
          <option value="all">전 시대 무작위</option>
          <option value="prehistoric">선사·고조선</option>
          <option value="three_kingdoms">삼국 시대</option>
          <option value="unified_silla">통일신라·발해</option>
          <option value="goryeo">고려 시대</option>
          <option value="joseon">조선 시대</option>
          <option value="modern">근현대</option>
        </select>
        <select id="quiz-level-select" class="quiz-scope-select quiz-level-select" aria-label="퀴즈 유형 선택">
          <option value="mixed">개념+추론</option>
          <option value="basic">시대·흐름</option>
          <option value="inference">추론</option>
        </select>
        <button id="quiz-session-start" class="quiz-session-start" type="button">5문제 풀기</button>
      </div>

      <!-- Quick Relic Jump Select -->
      <div class="filter-group search-group">
        <select id="relic-quick-select" class="relic-select" aria-label="빠른 이동">
          <option value="">✨ 찾으시는 유물/비석 선택 (63종)</option>
        </select>
      </div>
    </div>

  </header>

  <!-- Main View Container -->
  <main class="main-content">
    <!-- Map Container -->
    <div id="map-container" class="map-container"></div>

  </main>

  <!-- Relic Docent & Quiz Modal -->
  <dialog id="art-modal" class="art-modal" aria-labelledby="modal-title">
    <article class="modal-card">
      <button id="modal-close" class="modal-close-btn" type="button" aria-label="유물 설명 닫기">✕</button>
      
      <div class="modal-grid">
        <!-- Relic Real Image Section -->
        <figure class="modal-media-col">
          <div class="image-frame">
            <img id="modal-image" src="" alt="유물 원작 사진" class="relic-real-img">
            <div id="modal-image-placeholder" class="image-placeholder" hidden>
              <span aria-hidden="true">🏛️</span>
              <strong>정확한 자료 사진을 확인하고 있습니다</strong>
              <small>잘못된 사진 대신 검증된 자료만 제공합니다.</small>
            </div>
          </div>
          <figcaption class="image-caption">
            <strong id="modal-media-title">광개토대왕릉비</strong>
          </figcaption>
        </figure>

        <!-- Details & Interactive Quiz Section -->
        <section class="modal-info-col">
          <div class="modal-header">
            <h2 id="modal-title" class="modal-title-text">광개토대왕릉비</h2>
            <p id="modal-subtitle" class="modal-subtitle-text">Gwanggaeto Stele</p>
          </div>

          <dl class="meta-box">
            <div class="meta-item">
              <dt><span aria-hidden="true">📍</span> 관련 장소</dt>
              <dd id="modal-location">중국 길림성 집안시</dd>
            </div>
            <div class="meta-item">
              <dt><span aria-hidden="true">🏛️</span> 현재 위치</dt>
              <dd id="modal-museum">고구려 금석문 유적</dd>
            </div>
          </dl>

          <div class="docent-content">
            <section class="learning-block">
              <p id="modal-docent" class="docent-text"></p>
              <p id="modal-context" class="context-text"></p>
            </section>
            <div class="exam-tip-card">
              <p id="modal-exam-tip" class="exam-tip-text"></p>
            </div>
          </div>
        </section>
      </div>
    </article>
  </dialog>

  <!-- Era / all-era random quiz -->
  <dialog id="quiz-session-modal" class="quiz-session-modal" aria-labelledby="quiz-session-title">
    <article class="quiz-session-card">
      <button id="quiz-session-close" class="modal-close-btn quiz-session-close" type="button"
        aria-label="5문제 퀴즈 닫기">✕</button>
      <header class="quiz-session-header">
        <p class="quiz-session-eyebrow">내신·수능·한능검 실전 퀴즈</p>
        <h2 id="quiz-session-title">전 시대 무작위 5문제</h2>
        <p id="quiz-session-progress" class="quiz-session-progress" aria-live="polite"></p>
        <div class="quiz-progress-track" aria-hidden="true">
          <span id="quiz-progress-fill"></span>
        </div>
      </header>
      <section class="quiz-session-body">
        <figure id="quiz-session-media" class="quiz-session-media" hidden>
          <img id="quiz-session-image" alt="문제에 제시된 유물·유적 자료">
        </figure>
        <p id="quiz-session-era" class="quiz-session-era"></p>
        <p id="quiz-session-question" class="quiz-session-question"></p>
        <div id="quiz-session-options" class="quiz-options-list"></div>
        <div id="quiz-session-feedback" class="quiz-result-card" hidden aria-live="polite"></div>
        <div class="quiz-session-actions">
          <button id="quiz-session-next" class="quiz-session-next" type="button" hidden>다음 문제</button>
          <button id="quiz-session-restart" class="quiz-session-restart" type="button" hidden>다시 5문제</button>
        </div>
      </section>
    </article>
  </dialog>

  <!-- App Logic Scripts -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="history-data.js?v=20260918-quiz"></script>
  <script src="treasure-map.js?v=20260918-quiz"></script>
</body>
</html>
