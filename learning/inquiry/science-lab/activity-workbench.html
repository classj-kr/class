<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3f6"><title>교육과정 활동별 탐구 · 과학실험실</title><link rel="stylesheet" href="activity-workbench.css?v=dfc64a404dbf"></head>
<body><main><a href="./">← 과학실험실</a><header><p class="eyebrow">2022 개정 과학과</p><h1>활동별 탐구</h1><p>교과서의 탐구 목적과 실험 조건을 확인하고, 관찰한 결과를 기록하세요.</p></header>
<section aria-label="활동 찾기"><div class="filters"><label>검색<input id="search" type="search" placeholder="활동 이름·과목·코드"></label><label>학교급·과목<select id="group"><option value="">전체</option></select></label><label>보기<select id="scope"><option value="all">모든 활동</option><option value="new">새 탐구 도구</option><option value="missing">대응 구현 확인 필요</option></select></label></div><p id="count" role="status"></p><details id="catalog" open><summary>활동 목록</summary><div id="activities"></div></details></section>
<article id="workbench" hidden><header><p id="activityCode" class="eyebrow"></p><h2 id="activityTitle" tabindex="-1"></h2><p id="activitySource"></p></header><div id="lab"></div><section class="record"><h3>탐구 기록</h3><label>가설·예상<textarea id="hypothesis" rows="2"></textarea></label><button type="button" id="record">현재 조건과 결과 기록</button><div id="records"></div><label>결론과 그 근거<textarea id="conclusion" rows="3"></textarea></label><div class="actions"><button type="button" id="save">이 브라우저에 저장</button><button type="button" id="download">기록 내려받기</button><button type="button" id="reset">이 활동 초기화</button></div><p role="status" id="notice"></p></section></article>
