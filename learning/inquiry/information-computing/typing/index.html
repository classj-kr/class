<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <title>타자</title>
  <link rel="stylesheet" href="style.css?v=20260904-merge-records">
  <link rel="stylesheet" href="guide.css?v=20260904-merge-records">
  <script src="typing-bgm.js" defer></script>
  <script src="../../../../assets/sound/music-control.js?v=20260910-click-cache-1" defer></script>
</head>
<body>
  <audio id="bgm" preload="auto"></audio>
  <nav class="topbar" aria-label="페이지 기능">
    <a class="home" href="../../../../" aria-label="포털 메인으로 돌아가기">←</a>
    <div class="top-actions"><button id="recordsButton" class="icon-button" type="button">내 기록</button></div>
  </nav>

  <main>
    <section id="typingHome" class="typing-home" aria-label="타자 연습 선택">
      <div class="practice-menu">
        <button type="button" class="mode-card mode-position" data-practice-mode="position" aria-label="자리 익히기">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-icon-wrap" aria-hidden="true">
            <svg class="mode-icon" viewBox="0 0 48 48" fill="none">
              <!-- 키캡 & 손가락 터치 -->
              <rect x="9" y="11" width="30" height="26" rx="6" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="2"/>
              <rect x="14" y="15" width="20" height="15" rx="3" fill="#ffffff" fill-opacity="0.15" stroke="currentColor" stroke-width="1.2"/>
              <text x="24" y="26.5" fill="currentColor" font-size="11" font-weight="900" text-anchor="middle" font-family="system-ui">F</text>
              <circle cx="24" cy="28.5" r="1" fill="currentColor"/>
              <path d="M24 5 L24 8 M17 6.5 L18.5 8.5 M31 6.5 L29.5 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="mode-en">Key Position</span>
            <strong class="mode-ko">자리 익히기</strong>
          </div>
        </button>

        <button type="button" class="mode-card mode-words" data-practice-mode="words" aria-label="단어 연습">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-icon-wrap" aria-hidden="true">
            <svg class="mode-icon" viewBox="0 0 48 48" fill="none">
              <!-- 단어 카드 블록 -->
              <rect x="10" y="10" width="28" height="28" rx="6" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="2"/>
              <text x="18" y="27" fill="currentColor" font-size="13" font-weight="900" text-anchor="middle" font-family="sans-serif">가</text>
              <text x="29.5" y="29" fill="currentColor" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui">A</text>
              <line x1="14" y1="32" x2="34" y2="32" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="mode-en">Word Drill</span>
            <strong class="mode-ko">단어 연습</strong>
          </div>
        </button>

        <button type="button" class="mode-card mode-sentences" data-practice-mode="sentences" aria-label="문장 연습">
          <div class="card-glow" aria-hidden="true"></div>
          <div class="card-icon-wrap" aria-hidden="true">
            <svg class="mode-icon" viewBox="0 0 48 48" fill="none">
              <!-- 문장 타이핑 스트림 -->
              <rect x="9" y="11" width="30" height="26" rx="6" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="2"/>
              <line x1="15" y1="18" x2="33" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="15" y1="24" x2="28" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="15" y1="30" x2="23" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="26" y1="28" x2="26" y2="32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="mode-en">Sentence Practice</span>
            <strong class="mode-ko">문장 연습</strong>
          </div>
        </button>
      </div>
    </section>

    <section id="recordsCard" class="records-card" aria-labelledby="recordsTitle" hidden>
      <div class="practice-heading"><h2 id="recordsTitle">내 기록</h2></div>
      <div id="recordsList" class="records-list"></div>
      <button id="resetRecordsButton" class="secondary reset-records" type="button">기록 초기화</button>
    </section>

    <section id="fingerGuide" class="finger-guide" aria-labelledby="guideTitle" hidden>
      <div class="guide-head"><h2 id="guideTitle">손가락 자리</h2><div class="segmented guide-language" aria-label="운지법 종류"><button class="active" type="button" data-guide-language="ko" aria-pressed="true">가 한글</button><button type="button" data-guide-language="en" aria-pressed="false">a 영어</button><button type="button" data-guide-language="symbols" aria-pressed="false">123 숫자·기호</button></div></div>
      <div id="guideStages" class="guide-stages" aria-label="자리 익히기 단계"></div>
      <div class="finger-stage">
        <div class="hands" aria-label="양손 손가락 안내 그림">
          <img class="hand-illustration" src="assets/touch-typing-hands.webp" alt="키보드 기본 자세를 위한 왼손과 오른손">
          <div class="hand left-hand"><span class="finger pinky" data-finger="lp"><i></i><b>새끼</b></span><span class="finger ring" data-finger="lr"><i></i><b>약지</b></span><span class="finger middle" data-finger="lm"><i></i><b>가운데</b></span><span class="finger index" data-finger="li"><i></i><b>검지</b></span><span class="finger thumb" data-finger="lt"><i></i><b>엄지</b></span><div class="palm">왼손</div></div>
          <div class="hand right-hand"><span class="finger thumb" data-finger="rt"><i></i><b>엄지</b></span><span class="finger index" data-finger="ri"><i></i><b>검지</b></span><span class="finger middle" data-finger="rm"><i></i><b>가운데</b></span><span class="finger ring" data-finger="rr"><i></i><b>약지</b></span><span class="finger pinky" data-finger="rp"><i></i><b>새끼</b></span><div class="palm">오른손</div></div>
        </div>
        <div class="finger-instruction" aria-live="polite"><span id="fingerBadge">왼손 검지</span><strong id="guideKey">ㄹ</strong><p id="guideMessage">노란색으로 표시된 손가락으로 <b>ㄹ</b> 키를 눌러 보세요.</p></div>
      </div>
      <div id="keyboard" class="keyboard" aria-label="키보드 운지법"></div>
      <div class="guide-progress"><span id="guideCount">0 / 12</span><div><i id="guideBar"></i></div></div>
      <div class="actions"><button id="guideNextButton" class="primary" type="button" hidden>다음 단계</button><button id="startWordsButton" class="secondary" type="button">낱말 연습으로 건너뛰기</button></div>
    </section>
    <section class="practice" aria-labelledby="practiceTitle" hidden>
      <div class="practice-heading"><h2 id="practiceTitle">단어 연습</h2></div>
      <div id="practiceFilters" class="practice-filters" aria-label="연습 범위"></div>
      <div class="mode-row">
        <div id="languageControls" class="segmented" aria-label="연습 언어">
          <button class="active" type="button" data-language="ko" aria-pressed="true">가 한글</button>
          <button type="button" data-language="en" aria-pressed="false">A 영어</button>
          <button type="button" data-language="symbols" aria-pressed="false">123 숫자·기호</button>
          <button type="button" data-language="avatars" aria-pressed="false">아바타</button>
        </div>
      </div>

      <div class="stats" aria-label="현재 연습 기록">
        <div><span>타수</span><strong id="speed">0</strong><small>타/분</small></div>
        <div><span>정확도</span><strong id="accuracy">100</strong><small>%</small></div>
        <div><span>연속 성공</span><strong id="streak">0</strong><small>개</small></div>
      </div>

      <div class="prompt-card">
        <p class="eyebrow"><span id="stepLabel">1 / 10</span><span id="bestLabel">최고 0타/분</span></p>
        <div class="prompt-stage"><img id="avatarPrompt" class="avatar-prompt" alt="" hidden><div class="prompt-copy"><div id="prompt" class="prompt" aria-label="따라 쓸 글자"></div><p id="promptLiteral" class="prompt-literal" hidden></p></div><button id="audioPromptButton" class="tts-button" type="button" aria-label="발음 다시 듣기" title="발음 다시 듣기" hidden>🔊</button></div>
        <label for="typingInput">위의 글자를 그대로 입력하세요</label>
        <textarea id="typingInput" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-describedby="feedback"></textarea>
        <p id="feedback" class="feedback" aria-live="polite">준비되면 바로 입력해 보세요!</p>
        <div class="progress"><span id="progressBar"></span></div>
      </div>

      <p class="keyboard-tip">글자를 모두 맞게 입력한 뒤 <kbd>Enter</kbd>를 누르면 다음 문제로 넘어가요.</p>
    </section>

    <section id="resultCard" class="result-card" hidden aria-live="polite">
      <div class="medal" aria-hidden="true">★</div>
      <p>연습 완료!</p>
      <h2 id="resultTitle">참 잘했어요!</h2>
      <div class="result-stats"><span>평균 타수 <b id="resultSpeed">0</b></span><span>정확도 <b id="resultAccuracy">100%</b></span></div>
      <button id="againButton" class="primary" type="button">한 번 더 연습하기</button>
    </section>
  </main>
  <script src="avatar-words.js"></script>
  <script src="../../../literacy-numeracy/proverbs/proverbs-data.js"></script>
  <script src="app.js?v=20260917-reading-words"></script>
</body>
</html>
