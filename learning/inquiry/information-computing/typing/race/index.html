<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>타자 RACE</title>
  <link rel="stylesheet" href="race.css?v=20261109-team-view">
</head>
<body data-screen="entry">
  <div class="sky" aria-hidden="true"><div class="stars"></div><div class="grid-floor"></div></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <nav class="topbar">
    <a class="back" href="../" aria-label="타자 연습으로">←</a>
    <span id="roomBadge" class="room-badge" hidden>방 <b id="roomBadgeCode"></b></span>
    <button id="leaveButton" class="chip-button" type="button" hidden>나가기</button>
  </nav>

  <main>
    <!-- 입장 -->
    <section id="entryScreen" class="screen entry">
      <h1 class="keycaps" aria-label="타자 RACE">
        <i aria-hidden="true">타</i><i aria-hidden="true">자</i><i aria-hidden="true">R</i><i aria-hidden="true">A</i><i aria-hidden="true">C</i><i aria-hidden="true">E</i>
      </h1>
      <div id="createPanel" class="panel create">
        <div class="settings" data-settings="create"></div>
        <label id="spectateRow" class="spectate" hidden><input id="spectateInput" type="checkbox"> 나는 참여하지 않고 관전하기</label>
        <button id="createButton" class="big-button pink" type="button">방 만들기</button>
        <p class="entry-note">친구 방은 메인 화면 <b>방번호</b>로 들어가요.</p>
      </div>
    </section>

    <!-- 대기실 -->
    <section id="lobbyScreen" class="screen lobby" hidden>
      <div class="lobby-head">
        <div class="code-card host-only"><span>방번호</span><strong id="lobbyCode">0000</strong></div>
        <div class="me-card student-only"><span id="myRacer" class="racer-big">🚀</span><strong id="myName"></strong><span id="myTeam" class="team-badge" hidden></span><p id="myLobbyHint">선생님이 출발을 누르면 달려요!</p></div>
        <div class="host-only lobby-settings">
          <div class="settings" data-settings="lobby"></div>
          <button id="startButton" class="big-button go start" type="button">🏁 출발!</button>
        </div>
      </div>
      <p class="lobby-count"><b id="racerCount">0</b>명 대기 중 <button id="shuffleButton" class="chip-button shuffle host-only" type="button" hidden>🎲 랜덤 배정</button></p>
      <ul id="lobbyRacers" class="lobby-racers"></ul>
      <div id="teamPanel" class="team-panel" hidden>
        <div id="teamColumns" class="team-columns"></div>
        <div id="benchZone" class="bench"><p>아직 팀 없음</p><ul id="benchList" class="lobby-racers"></ul></div>
        <p class="team-tip host-only">학생을 누르면 다음 팀으로 옮겨요.</p>
      </div>
    </section>

    <!-- 레이스 -->
    <section id="raceScreen" class="screen race" hidden>
      <div class="hud">
        <div class="hud-time"><span>남은 시간</span><strong id="timeLeft">0</strong></div>
        <div class="hud-score student-only"><span>점수</span><strong id="scoreNow">0</strong></div>
        <div class="hud-combo student-only"><span>콤보</span><strong id="comboNow">0</strong><em id="multiplierNow">x1.0</em></div>
        <div class="hud-rank student-only"><span>순위</span><strong id="rankNow">-</strong></div>
        <div class="hud-mode spectator-only"><span id="modeNow">한글 낱말</span><strong id="hostCode">0000</strong></div>
        <div class="time-bar"><i id="timeBar"></i></div>
      </div>

      <div id="teamBar" class="team-bar" hidden></div>
      <div id="track" class="track"></div>

      <div class="arena student-only">
        <div class="play">
          <div id="card" class="word-card"><div id="board" class="board" aria-live="off"></div></div>
          <div class="type-box"><textarea id="typeInput" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="위 글자 입력"></textarea><div id="typed" class="typed" aria-hidden="true"></div></div>
          <p id="chase" class="chase"></p>
        </div>
        <ol id="miniBoard" class="mini-board"></ol>
      </div>
    </section>

    <!-- 결과 -->
    <section id="resultScreen" class="screen results" hidden>
      <h2 class="result-title">🏆 결과 발표</h2>
      <p id="myResult" class="my-result student-only"></p>
      <div id="teamResult" class="team-result" hidden></div>
      <h3 id="soloTitle" class="solo-title" hidden>개인 순위</h3>
      <div id="podium" class="podium"></div>
      <table class="result-table">
        <thead><tr><th>순위</th><th>이름</th><th>점수</th><th>정확도</th><th>최고 콤보</th></tr></thead>
        <tbody id="resultRows"></tbody>
      </table>
      <div class="host-only result-actions">
        <button id="againButton" class="big-button go" type="button">🔁 한 판 더</button>
        <button id="settingsButton" class="big-button ghost" type="button">설정 바꾸기</button>
      </div>
    </section>
  </main>

  <div id="countdown" class="countdown" hidden><span id="countNum">3</span></div>
  <div id="finish" class="finish" hidden><span>끝!</span></div>
  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="/assets/site-storage.js?v=20261006-1"></script>
  <template id="settingsHelp">
    <p>방을 만들고 친구에게 방번호를 알려 주세요. 친구는 메인 화면에서 방번호로 들어올 수 있어요.</p>
    <p>판에 뜬 낱말 가운데 아무거나 골라 입력해요. 끝 글자까지 치는 순간 바로 들어가요.</p>
    <p>칸에 붙은 수가 지금 치면 받는 점수예요. 낱말 점수(친 타수)에 먼저 친 순서대로 1등 +5, 2등 +3, 3등 +1을 더해요.</p>
    <p>아무도 안 친 금빛 칸이 1등 기회, 은빛은 2등, 동빛은 3등 자리예요. 누가 친 낱말은 5초 뒤 새 낱말로 바뀌어요.</p>
    <p>틀리지 않고 연속으로 치면 콤보로 낱말 점수가 최대 2배가 돼요. 칸의 점수도 같이 올라가요.</p>
    <p>팀전은 모두가 모은 점수의 합계로 겨뤄요.</p>
  </template>
  <script src="/assets/sound/game-sfx.js?v=20261009-explosion-file"></script>
  <script src="/assets/sound/race-music.js?v=20261106-1"></script>
  <script src="/assets/sound/music-control.js?v=20261105-settings-panel" data-settings-help="settingsHelp"></script>
  <script src="race-core.js?v=20261109-team-view"></script>
  <script src="race.js?v=20261109-team-view"></script>
</body>
</html>
