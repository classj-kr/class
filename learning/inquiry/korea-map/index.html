<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c46">
  <title>국내 지도</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260920-17">
</head>
<body>
  <div class="app-shell">
    <nav class="theme-tabs" aria-label="국내 지도 주제">
      <button class="theme-tab" type="button" data-theme="territory" aria-pressed="false"><span>🗺️</span> 국토</button>
      <button class="theme-tab is-active" type="button" data-theme="terrain" aria-pressed="true"><span>⛰️</span> 지형</button>
      <button class="theme-tab" type="button" data-theme="climate" aria-pressed="false"><span>🌦️</span> 기후</button>
      <button class="theme-tab" type="button" data-theme="population" aria-pressed="false"><span>🏙️</span> 인구·도시</button>
      <button class="theme-tab" type="button" data-theme="industry" aria-pressed="false"><span>🏭</span> 산업</button>
      <button class="theme-tab" type="button" data-theme="transport" aria-pressed="false"><span>🚆</span> 교통</button>
      <button class="theme-tab" type="button" data-theme="region" aria-pressed="false"><span>🧭</span> 행정구역</button>
      <button class="theme-tab" type="button" data-theme="heritage" aria-pressed="false"><span>🏛️</span> 유물·유적</button>
      <button class="theme-tab" type="button" data-theme="travel" aria-pressed="false"><span>🎡</span> 체험·관광</button>
    </nav>

    <main class="study-layout">
      <section class="map-stage" aria-label="국내 지도 주제 지도">
        <div id="map" role="application" aria-label="국내 지도"></div>
        <button class="map-progress" id="progressButton" type="button" aria-label="학습 기록 보기"><span>누적</span><strong id="progressScore">0 / 0</strong></button>
        <button class="map-toggle" id="labelToggle" type="button" aria-pressed="false">지역명</button>
        <button class="map-tool" id="profileButton" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l5-8 4 4 3-6 6 10"/><circle cx="3" cy="19" r="1.4"/><circle cx="21" cy="19" r="1.4"/></svg>단면도
        </button>
        <div class="map-key" id="mapKey" aria-live="polite"></div>
        <button class="map-credit" id="creditButton" type="button" aria-label="지도 자료 출처" aria-expanded="false" aria-controls="creditText">i</button>
        <p class="map-credit-text" id="creditText" hidden>지도 자료: Copernicus DEM(© DLR, © Airbus, EU·ESA) · Mapzen · © OpenStreetMap 기여자 · Natural Earth · geoBoundaries</p>
        <section class="profile-panel" id="profilePanel" hidden aria-label="단면도">
          <button type="button" class="profile-close" id="profileClose" aria-label="단면도 닫기">×</button>
          <p class="profile-hint" id="profileHint"></p>
          <svg id="profileChart" role="img" aria-label="두 점 사이의 높이 변화"></svg>
        </section>
      </section>

      <aside class="study-panel">
        <section class="concept-card" aria-labelledby="conceptTitle">
          <h1 id="conceptTitle"></h1>
          <aside class="feature-focus" id="featureFocus" aria-live="polite" hidden>
            <button class="focus-close" id="focusClose" type="button" aria-label="닫고 전국 보기">×</button>
            <span id="focusKicker"></span>
            <strong id="focusTitle"></strong>
            <div id="focusBody"></div>
          </aside>
          <div class="concept-points" id="conceptPoints"></div>
          <div id="themeExtra"></div>
          <details class="feature-guide" id="featureGuide">
            <summary><span>필수 지점</span><strong id="featureCount"></strong></summary>
            <div class="feature-list" id="featureList" aria-label="지도 필수 지점"></div>
          </details>
          <details class="principle-guide" id="principleGuide">
            <summary><span>핵심 원리</span><strong id="principleCount"></strong></summary>
            <div class="principle-list" id="principleList" aria-label="주제별 핵심 원리"></div>
          </details>
        </section>

        <section class="practice-launch" aria-label="문제 풀기">
          <button class="primary-button" id="startPractice" type="button">지형 문제 풀기</button>
          <button class="secondary-button" id="startMixed" type="button">전 주제 섞어 풀기</button>
        </section>
      </aside>
    </main>
  </div>

  <dialog class="practice-dialog" id="practiceDialog" aria-labelledby="questionTitle">
    <div class="dialog-topbar">
      <div>
        <strong id="questionProgress">1 / 1</strong>
        <span id="questionTopic">지형</span>
      </div>
      <button type="button" id="closePractice" aria-label="문제 풀이 닫기">×</button>
    </div>
    <div class="progress-track" aria-hidden="true"><span id="questionProgressBar"></span></div>
    <section class="question-body">
      <div class="question-copy">
        <span class="difficulty-badge" id="questionDifficulty">기본</span>
        <h2 id="questionTitle"></h2>
        <div id="questionStimulus"></div>
        <div class="answer-options" id="answerOptions"></div>
      </div>
      <div class="question-map-wrap">
        <div id="questionMap" aria-label="문제 관련 위치 지도"></div>
        <div id="questionGraph" class="question-graph" hidden></div>
        <div class="question-map-caption" id="questionMapCaption"></div>
      </div>
    </section>
    <section class="answer-feedback" id="answerFeedback" aria-live="polite" hidden>
      <strong id="feedbackTitle"></strong>
      <p id="feedbackExplanation"></p>
    </section>
    <div class="dialog-actions">
      <button class="secondary-button" id="showHint" type="button">단서 보기</button>
      <button class="primary-button" id="nextQuestion" type="button" disabled>다음 문제</button>
    </div>
  </dialog>

  <dialog class="relic-dialog" id="relicDialog" aria-labelledby="relicTitle">
    <button type="button" class="relic-close" id="relicClose" aria-label="유물 설명 닫기">×</button>
    <figure class="relic-photo"><img id="relicImage" alt=""></figure>
    <section class="relic-body">
      <span class="relic-era" id="relicEra"></span>
      <h2 id="relicTitle"></h2>
      <p class="relic-title-en" id="relicTitleEn"></p>
      <dl class="relic-meta">
        <div><dt>관련 장소</dt><dd id="relicLocation"></dd></div>
        <div><dt>지금 있는 곳</dt><dd id="relicMuseum"></dd></div>
      </dl>
      <p id="relicDocent"></p>
      <p id="relicContext"></p>
      <p class="relic-tip" id="relicTip"></p>
    </section>
  </dialog>

  <dialog class="place-dialog" id="placeDialog" aria-labelledby="placeName">
    <button type="button" class="relic-close" id="placeClose" aria-label="장소 설명 닫기">×</button>
    <section class="place-side">
      <figure class="place-photo">
        <img id="placePhoto" alt="" hidden>
        <span class="place-photo-fallback" id="placePhotoFallback" aria-hidden="true"></span>
        <figcaption id="placeCredit"></figcaption>
      </figure>
      <div class="place-route">
        <p class="route-ends"><span class="route-dot is-school"></span>우리 학교 <span class="route-arrow" aria-hidden="true">→</span> <span class="route-dot is-place"></span>이곳</p>
        <p class="route-status" id="routeStatus"></p>
        <div id="placeRouteMap" aria-label="우리 학교에서 이곳까지 자동차 길"></div>
      </div>
    </section>
    <section class="place-body">
      <p class="place-region"><span id="placeEmoji" aria-hidden="true"></span> <span id="placeRegion"></span></p>
      <h2 id="placeName"></h2>
      <div class="place-badges" id="placeCategories"></div>
      <a class="place-site" id="placeSite" href="#" target="_blank" rel="noopener noreferrer">공식 누리집 ↗</a>
      <div class="place-facts" id="placeFacts"></div>
      <h3>이곳에서는 무엇을 배울까요?</h3>
      <p id="placeDescription"></p>
      <h3>관찰 미션</h3>
      <p class="place-mission" id="placeMission"></p>
    </section>
  </dialog>

  <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-visual" id="resultVisual">0/0</div>
    <h2 id="resultTitle">연습 완료</h2>
    <p id="resultSummary"></p>
    <div class="result-breakdown" id="resultBreakdown"></div>
    <div class="result-actions">
      <button class="secondary-button" id="reviewWrong" type="button">틀린 문제 복습</button>
      <button class="primary-button" id="finishPractice" type="button">지도 학습으로</button>
    </div>
  </dialog>

  <dialog class="record-dialog" id="recordDialog" aria-labelledby="recordTitle">
    <div class="dialog-topbar">
      <div><strong id="recordTitle">나의 학습 기록</strong></div>
      <button type="button" id="closeRecord" aria-label="기록 닫기">×</button>
    </div>
    <div class="record-body">
      <p class="record-summary" id="recordSummary"></p>
      <table class="record-table" id="recordTable">
        <thead><tr><th scope="col">주제</th><th scope="col">푼 문제</th><th scope="col">맞힌 문제</th><th scope="col">정답률</th></tr></thead>
        <tbody id="recordRows"></tbody>
      </table>
    </div>
    <div class="dialog-actions">
      <button class="secondary-button" id="resetRecord" type="button">기록 지우기</button>
      <button class="primary-button" id="retryWrong" type="button">틀렸던 문제 다시 풀기</button>
    </div>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/terrain-data.js?v=20260920-17"></script>
  <script src="data/borders.js?v=20260920-17"></script>
  <script src="data/relief-tiles.js?v=20260920-17"></script>
  <script src="data/transport-lines.js?v=20260920-17"></script>
  <script src="data/regions.js?v=20260920-17"></script>
  <script src="data/geo-data.js?v=20260920-17"></script>
  <script src="data/questions.js?v=20260920-17"></script>
  <script src="data/principles.js?v=20260920-17"></script>
  <script src="data/heritage-data.js?v=20260920-17"></script>
  <script src="heritage.js?v=20260920-17"></script>
  <script src="data/travel-data.js?v=20260920-17"></script>
  <script src="travel.js?v=20260920-17"></script>
  <script src="climate-graph.js?v=20260906-1"></script>
  <script src="app.js?v=20260920-17"></script>
</body>
</html>
