<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123c46">
  <title>한국지리</title>
  <link rel="stylesheet" href="../korean-museum/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20260918-core">
</head>
<body>
  <div class="app-shell">
    <nav class="theme-tabs" aria-label="한국지리 학습 주제">
      <button class="theme-tab" type="button" data-theme="territory" aria-pressed="false"><span>🗺️</span> 국토</button>
      <button class="theme-tab is-active" type="button" data-theme="terrain" aria-pressed="true"><span>⛰️</span> 지형</button>
      <button class="theme-tab" type="button" data-theme="climate" aria-pressed="false"><span>🌦️</span> 기후</button>
      <button class="theme-tab" type="button" data-theme="population" aria-pressed="false"><span>🏙️</span> 인구·도시</button>
      <button class="theme-tab" type="button" data-theme="industry" aria-pressed="false"><span>🏭</span> 산업·교통</button>
      <button class="theme-tab" type="button" data-theme="region" aria-pressed="false"><span>🧭</span> 권역</button>
    </nav>

    <main class="study-layout">
      <section class="map-stage" aria-label="한국지리 주제 지도">
        <div id="map" role="application" aria-label="한국지리 학습 지도"></div>
        <a class="map-back" href="../../../" aria-label="학습 메뉴로 돌아가기">←</a>
        <button class="map-progress" id="progressButton" type="button" aria-label="학습 기록 보기"><span>누적</span><strong id="progressScore">0 / 0</strong></button>
        <button class="map-toggle" id="labelToggle" type="button" aria-pressed="false">세부 정보 보기</button>
        <div class="map-key" id="mapKey" aria-live="polite"></div>
      </section>

      <aside class="study-panel">
        <section class="concept-card" aria-labelledby="conceptTitle">
          <div class="section-kicker" id="conceptKicker"></div>
          <h1 id="conceptTitle"></h1>
          <p id="conceptSummary"></p>
          <aside class="feature-focus" id="featureFocus" aria-live="polite" hidden>
            <button class="focus-close" id="focusClose" type="button" aria-label="닫고 전국 보기">×</button>
            <span id="focusKicker"></span>
            <strong id="focusTitle"></strong>
            <div id="focusBody"></div>
          </aside>
          <div class="concept-points" id="conceptPoints"></div>
          <details class="feature-guide" id="featureGuide">
            <summary><span>필수 지점</span><strong id="featureCount"></strong></summary>
            <div class="feature-list" id="featureList" aria-label="지도 필수 지점"></div>
          </details>
          <details class="principle-guide" id="principleGuide">
            <summary><span>핵심 원리</span><strong id="principleCount"></strong></summary>
            <div class="principle-list" id="principleList" aria-label="주제별 핵심 원리"></div>
          </details>
          <details class="source-guide">
            <summary>출제 기준·자료 출처</summary>
            <p>교육과정과 평가원 출제 방향을 기준으로 시험 필수 내용을 구성했습니다. 문제 수는 학습 범위에 따라 달라집니다.</p>
            <ul>
              <li><a href="https://csatcdn.kice.re.kr/resources/pdf/guideline.pdf" target="_blank" rel="noopener noreferrer">한국교육과정평가원 수능 출제 지침</a></li>
              <li><a href="https://ncic.go.kr/board/B0024.cs?act=read&amp;bwrId=2015&amp;m=10&amp;pageIndex=6&amp;pageUnit=15" target="_blank" rel="noopener noreferrer">국가교육과정정보센터 사회과 교육과정</a></li>
              <li><a href="https://data.kma.go.kr/normals/info1.do" target="_blank" rel="noopener noreferrer">기상청 1991~2020 기후평년값</a></li>
            </ul>
          </details>
        </section>

        <section class="practice-launch" aria-label="문제 풀기">
          <button class="primary-button" id="startPractice" type="button">지형 문제 풀기</button>
          <button class="secondary-button" id="startMixed" type="button">전 주제 섞어 풀기</button>
        </section>
      </aside>
    </main>
  </div>

  <dialog class="practice-dialog" id="practiceDialog" aria-labelledby="questionTitle">
    <div class="dialog-topbar">
      <div>
        <strong id="questionProgress">1 / 1</strong>
        <span id="questionTopic">지형</span>
      </div>
      <button type="button" id="closePractice" aria-label="문제 풀이 닫기">×</button>
    </div>
    <div class="progress-track" aria-hidden="true"><span id="questionProgressBar"></span></div>
    <section class="question-body">
      <div class="question-copy">
        <span class="difficulty-badge" id="questionDifficulty">기본</span>
        <h2 id="questionTitle"></h2>
        <div id="questionStimulus"></div>
        <div class="answer-options" id="answerOptions"></div>
      </div>
      <div class="question-map-wrap">
        <div id="questionMap" aria-label="문제 관련 위치 지도"></div>
        <div id="questionGraph" class="question-graph" hidden></div>
        <div class="question-map-caption" id="questionMapCaption">단서 보기를 누르면 글 단서가 나옵니다.</div>
      </div>
    </section>
    <section class="answer-feedback" id="answerFeedback" aria-live="polite" hidden>
      <strong id="feedbackTitle"></strong>
      <p id="feedbackExplanation"></p>
    </section>
    <div class="dialog-actions">
      <button class="secondary-button" id="showHint" type="button">단서 보기</button>
      <button class="primary-button" id="nextQuestion" type="button" disabled>다음 문제</button>
    </div>
  </dialog>

  <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle">
    <div class="result-visual" id="resultVisual">0/0</div>
    <h2 id="resultTitle">연습 완료</h2>
    <p id="resultSummary"></p>
    <div class="result-breakdown" id="resultBreakdown"></div>
    <div class="result-actions">
      <button class="secondary-button" id="reviewWrong" type="button">틀린 문제 복습</button>
      <button class="primary-button" id="finishPractice" type="button">지도 학습으로</button>
    </div>
  </dialog>

  <dialog class="record-dialog" id="recordDialog" aria-labelledby="recordTitle">
    <div class="dialog-topbar">
      <div><strong id="recordTitle">나의 학습 기록</strong></div>
      <button type="button" id="closeRecord" aria-label="기록 닫기">×</button>
    </div>
    <div class="record-body">
      <p class="record-summary" id="recordSummary"></p>
      <table class="record-table" id="recordTable">
        <thead><tr><th scope="col">주제</th><th scope="col">푼 문제</th><th scope="col">맞힌 문제</th><th scope="col">정답률</th></tr></thead>
        <tbody id="recordRows"></tbody>
      </table>
    </div>
    <div class="dialog-actions">
      <button class="secondary-button" id="resetRecord" type="button">기록 지우기</button>
      <button class="primary-button" id="retryWrong" type="button">틀렸던 문제 다시 풀기</button>
    </div>
  </dialog>

  <script src="../korean-museum/vendor/leaflet/leaflet.js"></script>
  <script src="data.js?v=20260918-core"></script>
  <script src="questions.js?v=20260918-quiz"></script>
  <script src="principles.js?v=20260918-core"></script>
  <script src="climate-graph.js?v=20260906-1"></script>
  <script src="app.js?v=20260918-core"></script>
</body>
</html>
